"}, {"id": 50, "situation": "You close the speaking course by reflecting on what communication has meant to you", "mood": "warm and thoughtful", "task": "Share what you've understood about language and connection", "starter": "What I've come to believe is that speaking well isn't really about impressing people — it's about making contact. The times I've felt most connected to someone were never because of clever words, but because of…", "grammar": ["speaking well isn't really about… it's about", "the times I've felt most connected were never because of"], "vocabulary": "contact, connection, ordinary, honest, presence, language, purpose, meaning"}, {"id": 51, "situation": "You explain what you think is genuinely hard about listening", "mood": "insightful", "task": "Go beyond the obvious 'put your phone down' advice", "starter": "Real listening is harder than it looks, because most of the time when someone else is speaking, part of my mind is already preparing… The moment I catch myself doing that is…", "grammar": ["most of the time when… part of my mind", "the moment I catch myself doing that"], "vocabulary": "active, distraction, prepare, response, presence, interrupt, absorb, wait"}, {"id": 52, "situation": "You describe how you handle criticism differently now than you used to", "mood": "self-aware", "task": "Show the growth with specific contrast", "starter": "My instinct used to be to defend myself immediately. Now I try to let the criticism land first, before deciding whether it's… The shift happened when…", "grammar": ["my instinct used to be to", "let it land before deciding whether it's"], "vocabulary": "defensive, feedback, ego, react, pause, discern, grow, separate"}, {"id": 53, "situation": "You talk about a habit you've built that has genuinely changed your life", "mood": "practical and honest", "task": "Be specific about what it is and why it works", "starter": "The thing about this habit is that it seemed almost trivially small when I started. But over time I've noticed that…", "grammar": ["it seemed almost trivially small when I started", "over time I've noticed that"], "vocabulary": "compound, consistent, small, ritual, identity, trigger, reward, incremental"}, {"id": 54, "situation": "You describe what you wish you'd known about relationships in your twenties", "mood": "mature", "task": "Share specific insights you've gained with age", "starter": "I think I spent a lot of my twenties trying to make incompatible people compatible through sheer effort. What I know now is that the work in a relationship should feel like…", "grammar": ["trying to make incompatible people compatible", "the work in a relationship should feel like"], "vocabulary": "compatible, effort, compatibility, energy, give, early, pattern, red flag"}, {"id": 55, "situation": "You talk about how you make decisions when the right answer isn't clear", "mood": "thoughtful", "task": "Describe your real process for navigating ambiguity", "starter": "When there's no obviously right answer, I've learnt to pay attention to a different kind of signal. Not logic exactly, but something more like… what I try to do is…", "grammar": ["when there's no obviously right answer", "not logic exactly, but something more like"], "vocabulary": "ambiguity, intuition, signal, tolerate, uncertainty, reverse decision, alignment"}, {"id": 56, "situation": "You explain why you think apologies matter so much", "mood": "warm", "task": "Go beyond the simple 'say sorry' and explore what makes one real", "starter": "An apology that doesn't acknowledge the specific harm doesn't really land. What I've found matters most is not the words themselves but…", "grammar": ["an apology that doesn't acknowledge", "what matters most is not the words themselves but"], "vocabulary": "acknowledge, impact, genuine, hollow, repair, understand, specific, receive"}, {"id": 57, "situation": "You describe what it's like to be fluent in a language that isn't your first", "mood": "personal", "task": "Reflect on the strange experience of full fluency in a second language", "starter": "There are days when I function entirely in this language and forget to notice. And then something happens — a joke I don't quite catch, a phrase that…", "grammar": ["there are days when I forget to notice", "a joke I don't quite catch"], "vocabulary": "fluency, belong, native, catch, nuance, accent, moment, mother tongue"}, {"id": 58, "situation": "You discuss whether you think first impressions are reliable", "mood": "sceptical but balanced", "task": "Explore when they are and aren't trustworthy", "starter": "I think first impressions are very fast and sometimes accurate, but the problem is we rarely update them even when… The danger is treating a data point as a conclusion.", "grammar": ["we rarely update them even when", "treating a data point as a conclusion"], "vocabulary": "bias, heuristic, update, snap, reliable, revision, thin-slice, confirm"}, {"id": 59, "situation": "You explain what you've learnt about boundaries from getting them wrong", "mood": "reflective", "task": "Be honest about a time you failed to set or hold one", "starter": "For a long time I thought saying yes to everything was a form of generosity. What I eventually understood was that it was closer to… and it came from a belief that…", "grammar": ["I thought saying yes to everything was", "it was closer to + noun and it came from"], "vocabulary": "resentment, people-pleasing, fear, generosity, self-respect, pattern, recognise"}, {"id": 60, "situation": "You talk about how you stay curious as you get older", "mood": "enthusiastic", "task": "Describe specific strategies and what you've noticed", "starter": "What I've noticed is that curiosity tends to narrow unless you actively fight it. I deliberately expose myself to… and I've made a rule never to say that I'm not interested in something without…", "grammar": ["curiosity tends to narrow unless", "I've made a rule never to say"], "vocabulary": "wonder, exposure, deliberate, narrow, breadth, question, interest, habit"}, {"id": 61, "situation": "You describe the experience of reading a book that changed how you saw something", "mood": "literary", "task": "Be specific about what shifted", "starter": "I remember reading it and thinking: I have been looking at this wrong for years. The idea that stayed with me was… and since then I've noticed it everywhere.", "grammar": ["I remember reading it and thinking", "the idea that stayed with me was"], "vocabulary": "reframe, shift, illuminate, encounter, lens, apply, notice, paradigm"}, {"id": 62, "situation": "You explain what makes some friendships feel effortless and others exhausting", "mood": "observant", "task": "Analyse the difference with honesty", "starter": "I don't think it's about how much you have in common. The effortless ones are the ones where… and where you don't have to… The exhausting ones often involve a kind of…", "grammar": ["I don't think it's about how much", "the exhausting ones often involve a kind of"], "vocabulary": "ease, performance, acceptance, drain, reciprocal, effort, chemistry, history"}, {"id": 63, "situation": "You talk about what you've noticed about how stress physically manifests in you", "mood": "self-aware", "task": "Describe your body's stress signals and what you've done about them", "starter": "I used to ignore what my body was telling me until the signals became impossible to dismiss. What I've learnt is that for me, stress shows up first as…", "grammar": ["I used to ignore what my body was telling me", "stress shows up first as"], "vocabulary": "somatic, signal, tense, notice, jaw, sleep, breathe, physical, awareness"}, {"id": 64, "situation": "You describe what real support looks like to you when you're struggling", "mood": "honest", "task": "Distinguish between what actually helps and what doesn't", "starter": "The most unhelpful thing people do when I'm struggling is offer solutions before I've finished speaking. What actually helps is when someone…", "grammar": ["the most unhelpful thing is to offer solutions before", "what actually helps is when"], "vocabulary": "witness, fix, listen, presence, advice, space, need, unasked"}, {"id": 65, "situation": "You discuss whether optimism is a choice or a personality trait", "mood": "curious", "task": "Explore the debate with nuance", "starter": "I've gone back and forth on this. My current view is that it's somewhere in between — there are people for whom it comes more naturally, but there's also a daily practice of…", "grammar": ["I've gone back and forth on this", "there's also a daily practice of"], "vocabulary": "temperament, practice, reframe, disposition, default, cultivate, choice, outlook"}, {"id": 66, "situation": "You explain what you've noticed about how people react when their authority is questioned", "mood": "observant", "task": "Describe the patterns you've seen", "starter": "What's interesting is that people who are genuinely secure in their expertise tend to welcome challenge. It's the people who are less sure of themselves who…", "grammar": ["people who are genuinely secure tend to", "it's the people who are less sure who"], "vocabulary": "authority, secure, challenge, defensive, expertise, status, hierarchy, reaction"}, {"id": 67, "situation": "You describe a period in your life when everything felt uncertain and how you got through it", "mood": "honest", "task": "Narrate the experience with emotional honesty", "starter": "The thing that kept me going wasn't a plan — I didn't have one. It was more of a… and the understanding that… Looking back now, I can see that…", "grammar": ["the thing that kept me going wasn't a plan", "looking back now I can see that"], "vocabulary": "uncertainty, anchor, day by day, survive, emerge, insight, endure, through"}, {"id": 68, "situation": "You talk about what you find genuinely restorative — not just relaxing", "mood": "reflective", "task": "Distinguish between passive rest and real restoration", "starter": "I used to confuse relaxing with restoring, but they're not the same. Watching TV can switch my brain off, but what actually replenishes me is… because it involves…", "grammar": ["I used to confuse… with… but they're not the same", "what actually replenishes me is"], "vocabulary": "restore, replenish, passive, active, creative, nature, switch off, energy"}, {"id": 69, "situation": "You explain how your sense of humour has developed and what it says about you", "mood": "playful but self-aware", "task": "Reflect on your comedic sensibility as a window into personality", "starter": "What I find funny has definitely changed. When I was younger it was mostly about… Now what makes me genuinely laugh is… I think that says something about…", "grammar": ["what I find funny has definitely changed", "what makes me genuinely laugh is"], "vocabulary": "absurd, self-deprecating, timing, dark, wit, observational, shift, taste"}, {"id": 70, "situation": "You talk about what you would say to yourself right before a big moment", "mood": "personal and direct", "task": "Craft the specific advice for your most vulnerable self", "starter": "Not the generic advice — the specific thing this version of me needs to hear. Which is probably not 'you've got this' but something more like…", "grammar": ["not the generic advice", "which is probably not… but something more like"], "vocabulary": "specific, vulnerable, moment, fear, honest, inner voice, preparation, truth"}, {"id": 71, "situation": "You describe the difference between being passionate about something and being obsessed", "mood": "careful", "task": "Explore where passion becomes problematic", "starter": "The difference for me is in what happens when things don't go well. Passion survives failure and adjusts. Obsession tends to… and it starts to crowd out…", "grammar": ["the difference for me is in what happens when", "obsession tends to… and it starts to crowd out"], "vocabulary": "passion, obsession, flexible, rigid, identity, all-consuming, creative, balance"}, {"id": 72, "situation": "You talk about what it means to take creative risks", "mood": "brave", "task": "Describe the feeling and what makes it worth it", "starter": "The creative risks that have mattered most weren't the ones that paid off — they were the ones where I was genuinely unsure how it would be received. The feeling of…", "grammar": ["the creative risks that have mattered most weren't", "the ones where I was genuinely unsure"], "vocabulary": "exposure, stakes, uncertain, brave, vulnerable, attempt, regardless, create"}, {"id": 73, "situation": "You discuss how you've changed your relationship with your phone", "mood": "honest", "task": "Talk about what you noticed and what you changed", "starter": "I started paying attention to when I picked it up and found that most of the time it wasn't because I needed something — it was because… The change I made was…", "grammar": ["most of the time it wasn't because I needed something", "the change I made was"], "vocabulary": "compulsive, scroll, reflex, attention, intentional, boundary, notice, reclaim"}, {"id": 74, "situation": "You explain what you think it means to be emotionally mature", "mood": "insightful", "task": "Go beyond the clichés and give your real definition", "starter": "Emotional maturity isn't about never feeling things intensely — I think that's a misunderstanding. To me it's more about the gap between feeling something and…", "grammar": ["it isn't about never feeling things intensely", "it's more about the gap between feeling something and"], "vocabulary": "regulate, respond, react, impulse, pause, maturity, integrate, aware"}, {"id": 75, "situation": "You describe what you're still working on in yourself", "mood": "humble", "task": "Be genuinely honest, not performatively humble", "starter": "I'm aware that I still… more than I'd like. And I know it comes from… The difference between now and five years ago is not that it's gone, but that…", "grammar": ["I'm aware that I still… more than I'd like", "the difference between now and five years ago is not that it's gone but"], "vocabulary": "growth, pattern, self-awareness, still, work in progress, notice, honest, gap"}, {"id": 76, "situation": "You explain why you value slowness in a fast world", "mood": "reflective", "task": "Articulate the case for deceleration with personal examples", "starter": "Speed has become its own value — being busy is now a status symbol. What I've been trying to reclaim is the experience of doing one thing at a time, and I've noticed that…", "grammar": ["being busy is now a status symbol", "the experience of doing one thing at a time"], "vocabulary": "decelerate, presence, mono-task, speed, stillness, reclaim, resist, slow"}, {"id": 77, "situation": "You talk about how you approach feedback on things you've made", "mood": "vulnerable", "task": "Describe your real emotional process", "starter": "My first reaction to criticism of work I care about is almost always defensive — even when I know it's useful. The practice I've developed is to wait… before I decide how to…", "grammar": ["my first reaction is almost always defensive even when", "the practice I've developed is to wait"], "vocabulary": "defensive, receive, separate, creator, work, useful, wait, process, discern"}, {"id": 78, "situation": "You describe what you've learnt about patience from something that took a long time", "mood": "personal", "task": "Be specific and honest about the process", "starter": "I spent two years working on something before it came together. In that time I learnt that patience isn't passive — it's actively choosing to…", "grammar": ["I learnt that patience isn't passive — it's actively", "it's actively choosing to"], "vocabulary": "patience, active, trust, process, doubt, persist, long-term, resist urgency"}, {"id": 79, "situation": "You explain why you think the stories we tell about ourselves matter so much", "mood": "psychological", "task": "Explore how personal narrative shapes behaviour", "starter": "The story I tell about who I am affects what I try, what I avoid, and what I think I deserve. When I changed the story from… to… I started making completely different choices.", "grammar": ["the story I tell about who I am affects", "when I changed the story from… to…"], "vocabulary": "narrative, self-concept, identity, limit, possibility, author, rewrite, believe"}, {"id": 80, "situation": "You describe what it means to you to live with integrity", "mood": "personal", "task": "Give your own definition through examples rather than abstraction", "starter": "Integrity for me is less about grand gestures and more about the small moments when nobody would notice if I cut corners — and whether I do or I don't. The test is usually…", "grammar": ["less about grand gestures and more about", "the test is usually"], "vocabulary": "consistency, private, public, align, corner, notice, value, small"}, {"id": 81, "situation": "You discuss why you think silence in conversation has become rare", "mood": "observant", "task": "Reflect on what we've lost in a culture of constant talking", "starter": "I've been in very few conversations recently where both people were comfortable letting a silence sit. Most of the time someone fills it within about three seconds, and I think that's because…", "grammar": ["where both people were comfortable letting silence sit", "I think that's because"], "vocabulary": "silence, fill, tolerate, fear, discomfort, space, breathe, reflection"}, {"id": 82, "situation": "You explain what you think is the most underrated quality in a person", "mood": "personal", "task": "Choose something non-obvious and make the case", "starter": "People talk a lot about ambition and intelligence. But the quality I actually find most rare and valuable in a person is… and I'll tell you why I've come to think that.", "grammar": ["people talk a lot about… but the quality I find", "I'll tell you why I've come to think that"], "vocabulary": "underrated, rare, consistency, follow-through, quiet, integrity, presence"}, {"id": 83, "situation": "You describe how travel has complicated rather than simplified your worldview", "mood": "honest", "task": "Go beyond the 'travel broadens the mind' cliché", "starter": "Every time I travel somewhere new I come back with more questions than answers. Rather than confirming what I thought I knew, I found that… and that what I thought was universal was actually…", "grammar": ["every time I travel I come back with more questions", "what I thought was universal was actually"], "vocabulary": "complicate, assumption, relative, question, nuance, universal, particular, disrupt"}, {"id": 84, "situation": "You talk about a relationship that taught you something about yourself you didn't expect", "mood": "reflective", "task": "Be honest about what got mirrored back", "starter": "The strangest thing about close relationships is how clearly they mirror you. This person showed me that I have a tendency to… which I hadn't been willing to see before because…", "grammar": ["the strangest thing about close relationships is how clearly", "I hadn't been willing to see before because"], "vocabulary": "mirror, pattern, reveal, projection, willingness, proximity, truth, uncomfortable"}, {"id": 85, "situation": "You explain why you've become more protective of your attention", "mood": "committed", "task": "Describe what changed and what you now prioritise", "starter": "I realised that attention is the one genuinely non-renewable resource I have. Once I saw it that way, I started thinking differently about what I… and stopped feeling guilty about…", "grammar": ["attention is the one genuinely non-renewable resource", "I started thinking differently about what I"], "vocabulary": "attention, non-renewable, guard, selective, distraction, invest, reclaim, quality"}, {"id": 86, "situation": "You describe what you've noticed about how people talk about their problems", "mood": "empathetic", "task": "Distinguish between different things people actually need", "starter": "Some people come to you wanting to be heard. Others actually want solutions. The mistake is offering the wrong one. What I try to do is first figure out which…", "grammar": ["some people want to be heard, others want solutions", "the mistake is offering the wrong one"], "vocabulary": "need, listen, solve, distinguish, ask, hear, offer, mismatch"}, {"id": 87, "situation": "You talk about why you think pretending to be fine when you're not is so common", "mood": "sociological", "task": "Explore the social norms that make honesty hard", "starter": "There's an unwritten rule in most social settings that says you should manage other people's comfort before your own authenticity. When someone asks how you are, the honest answer…", "grammar": ["an unwritten rule that says you should manage", "when someone asks how you are, the honest answer"], "vocabulary": "social norms, performance, protect, comfort, authentic, reveal, mask, automatic"}, {"id": 88, "situation": "You explain how your relationship with failure has changed", "mood": "resilient", "task": "Show the evolution honestly", "starter": "Failure used to feel final to me — like a verdict on who I was. Now I experience it more like data. Not pleasant data, but data that helps me understand what…", "grammar": ["failure used to feel final — like a verdict on", "I experience it more like data"], "vocabulary": "verdict, data, temporary, identity, growth, attach, interpret, learn"}, {"id": 89, "situation": "You describe a value you hold that most people around you don't share", "mood": "brave", "task": "Talk about what it's like to hold a minority view", "starter": "It can feel isolating to care a lot about something that people in your immediate world don't take seriously. The experience is less about conflict and more about…", "grammar": ["it can feel isolating to care about something", "less about conflict and more about"], "vocabulary": "minority, value, isolating, visible, compromise, articulate, rare, invisible"}, {"id": 90, "situation": "You explain what you've noticed about the difference between confidence and arrogance", "mood": "observant", "task": "Draw the line with specific examples", "starter": "Genuinely confident people tend to be curious about what they don't know. Arrogance tends to dress itself up as confidence, but the giveaway is usually when someone…", "grammar": ["genuinely confident people tend to be curious", "the giveaway is usually when someone"], "vocabulary": "genuine, curious, secure, arrogance, defensive, knowledge, limit, signal"}, {"id": 91, "situation": "You describe what makes you feel most alive", "mood": "personal and open", "task": "Be honest and specific about the experiences", "starter": "Not in the vague inspirational sense — I mean the specific, sensory moments where time seems to… and there's no background noise in my head. For me, that's usually when…", "grammar": ["not in the vague inspirational sense", "the specific sensory moments where time seems to"], "vocabulary": "alive, present, flow, absorb, sensory, particular, moment, background noise"}, {"id": 92, "situation": "You talk about the relationship between memory and identity", "mood": "reflective", "task": "Explore how what we remember shapes who we are", "starter": "The version of my past I carry around with me isn't objective. It's a story with a narrator, and that narrator has… What that means is that changing who I am partly involves…", "grammar": ["the version of my past isn't objective — it's a story", "changing who I am partly involves"], "vocabulary": "selective, narrator, construct, edit, identity, shape, remember, reframe"}, {"id": 93, "situation": "You explain what you've learnt about giving advice", "mood": "wise", "task": "Talk about when to give it and when not to", "starter": "The mistake I used to make was giving advice when what the person actually needed was… I've started asking before I assume. And I've noticed that most of the time…", "grammar": ["the mistake I used to make was giving advice when", "I've started asking before I assume"], "vocabulary": "unsolicited, assume, need, impose, direction, listen, want, offering"}, {"id": 94, "situation": "You describe what it means to be loyal — and when it becomes a problem", "mood": "nuanced", "task": "Explore the complexity of loyalty with honesty", "starter": "I used to think loyalty was simply a virtue. What I've come to understand is that loyalty without limits can become… and that there's a version of it that's less about the other person and more about…", "grammar": ["I used to think loyalty was simply a virtue", "a version of it that's less about the other person"], "vocabulary": "loyalty, limit, blind, identity, group, choose, uncomfortable, integrity"}, {"id": 95, "situation": "You talk about how you deal with envy — honestly", "mood": "brave", "task": "Admit to the experience and describe how you manage it", "starter": "I'd be lying if I said I never felt it. What I've learnt is that envy, as uncomfortable as it is, can be informative — it often points towards something I want but haven't admitted to myself that…", "grammar": ["I'd be lying if I said I never felt it", "it often points towards something I want but haven't admitted"], "vocabulary": "envy, signal, want, admit, information, transform, comparison, aspiration"}, {"id": 96, "situation": "You explain what you think it means to be present in a relationship", "mood": "thoughtful", "task": "Go beyond 'put your phone down' to the deeper quality", "starter": "Physical presence is the easy part. The harder kind is being emotionally present — actually available rather than… I notice the difference most when…", "grammar": ["physical presence is the easy part", "actually available rather than"], "vocabulary": "available, distracted, attuned, half-present, elsewhere, notice, quality, attention"}, {"id": 97, "situation": "You describe what it's like to feel misunderstood and what you do with that feeling", "mood": "honest", "task": "Explore both the pain and the response", "starter": "The feeling of being misunderstood is particularly specific — it's not just frustration, it's a kind of loneliness. What I've learnt to do is separate… from… and ask myself whether…", "grammar": ["it's not just frustration — it's a kind of loneliness", "separate… from… and ask myself whether"], "vocabulary": "misunderstood, separate, clear, reaction, isolate, communicate, check, loneliness"}, {"id": 98, "situation": "You talk about what the concept of home means to you now versus before", "mood": "reflective", "task": "Show how your understanding has evolved", "starter": "My idea of home used to be completely tied to a specific place. What's shifted is that now I locate it more in… than in any geography. The change happened when…", "grammar": ["my idea of home used to be tied to", "I locate it more in… than in"], "vocabulary": "locate, geography, people, feeling, portable, anchor, belong, created"}, {"id": 99, "situation": "You explain why you think disagreement is undervalued", "mood": "counterintuitive", "task": "Argue for the importance of productive conflict", "starter": "We've got very good at performing agreement — nodding along even when we think differently. What we've lost is the kind of disagreement that actually moves ideas forward. That only happens when…", "grammar": ["performing agreement — nodding along even when", "the kind of disagreement that actually moves ideas forward"], "vocabulary": "productive, conflict, perform, surface, challenge, sharpen, genuine, move"}, {"id": 100, "situation": "You close the course by describing one thing language has taught you about people", "mood": "warm and philosophical", "task": "End with something personal and genuine", "starter": "Learning to communicate in another language taught me something I didn't expect: that the way we say things shapes what we're able to think. And what that tells me about people is…", "grammar": ["the way we say things shapes what we're able to think", "what that tells me about people is"], "vocabulary": "language, shape, thought, access, human, connection, limitation, possibility"}],
  },
  es: {
    A1: [{"id": 1, "situation": "Estás en una cafetería por primera vez", "mood": "tímido y amable", "task": "Pide un café y una tostada", "starter": "Hola, ¿me pone un/una… por favor?", "grammar": ["presente de indicativo", "artículos indefinidos (un/una)"], "vocabulary": "café, té, agua, tostada, zumo, por favor, gracias, cuánto"}, {"id": 2, "situation": "Conoces a un nuevo compañero de clase", "mood": "curioso y abierto", "task": "Preséntate y pregunta su nombre", "starter": "Hola, me llamo… ¿Y tú?", "grammar": ["llamarse (reflexivo)", "preguntas con ¿cómo?"], "vocabulary": "nombre, apellido, encantado/a, mucho gusto, ¿de dónde eres?"}, {"id": 3, "situation": "Estás en el supermercado y no encuentras la leche", "mood": "un poco confundido", "task": "Pregunta a un empleado dónde está", "starter": "Perdona, ¿dónde está la…?", "grammar": ["estar para ubicación", "artículos definidos (el/la/los/las)"], "vocabulary": "leche, pan, fruta, sección, pasillo, allí, aquí, izquierda, derecha"}, {"id": 4, "situation": "Llegas tarde a clase", "mood": "nervioso y apresurado", "task": "Pide disculpas al profesor y explica por qué", "starter": "Lo siento, llego tarde porque…", "grammar": ["porque + razón", "presente de indicativo (llegar)"], "vocabulary": "tarde, autobús, perdón, disculpa, tráfico, problema"}, {"id": 5, "situation": "Miras una foto familiar en tu móvil", "mood": "cariñoso y nostálgico", "task": "Describe a los miembros de tu familia", "starter": "Esta es mi… Se llama… y tiene… años.", "grammar": ["tener (edad)", "ser + adjetivo"], "vocabulary": "madre, padre, hermano, hermana, abuelo, abuela, joven, mayor, simpático"}, {"id": 6, "situation": "Es lunes y tu compañero te pregunta qué haces cada día", "mood": "relajado", "task": "Describe tu rutina diaria", "starter": "Todos los días me levanto a las… y luego…", "grammar": ["verbos reflexivos (levantarse, ducharse)", "adverbios de frecuencia"], "vocabulary": "levantarse, desayunar, trabajar, estudiar, comer, dormir, siempre, nunca"}, {"id": 7, "situation": "Estás en la parada del autobús y no sabes el horario", "mood": "un poco estresado", "task": "Pregunta a alguien qué autobús va al centro", "starter": "Perdone, ¿sabe qué autobús va a…?", "grammar": ["ir a + lugar", "preguntas con ¿qué? y ¿cuándo?"], "vocabulary": "autobús, metro, parada, billete, hora, esperar, centro, estación"}, {"id": 8, "situation": "Es el cumpleaños de tu amigo y quieres comprarle un regalo", "mood": "emocionado", "task": "Describe qué quieres comprar y por qué", "starter": "Quiero comprar… porque le gusta mucho…", "grammar": ["querer + infinitivo", "porque"], "vocabulary": "regalo, tienda, libro, música, perfume, caro, barato, bonito"}, {"id": 9, "situation": "Hace un día soleado y precioso", "mood": "alegre y animado", "task": "Comenta el tiempo con un vecino", "starter": "¡Qué día tan bonito! Hoy hace…", "grammar": ["hacer + tiempo meteorológico", "qué + adjetivo (exclamación)"], "vocabulary": "sol, calor, frío, viento, lluvia, nublado, temperatura, grados"}, {"id": 10, "situation": "Estás en clase y no entiendes una palabra", "mood": "concentrado pero confundido", "task": "Pide al profesor que repita o explique", "starter": "Perdona, ¿puedes repetir…? No entiendo…", "grammar": ["poder + infinitivo", "preguntas de aclaración"], "vocabulary": "repetir, entender, significar, escribir, palabra, más despacio, explicar"}, {"id": 11, "situation": "Estás en una tienda de ropa buscando una camiseta", "mood": "indeciso", "task": "Pregunta por tallas y colores disponibles", "starter": "Busco una camiseta en talla… ¿Tienen en color…?", "grammar": ["buscar", "tener (disponibilidad)"], "vocabulary": "camiseta, pantalón, talla, color, rojo, azul, verde, probador, precio"}, {"id": 12, "situation": "Hoy es tu cumpleaños", "mood": "feliz y emocionado", "task": "Habla de cómo quieres celebrarlo", "starter": "Hoy es mi cumpleaños. Quiero…", "grammar": ["querer + infinitivo", "hoy + presente"], "vocabulary": "cumpleaños, tarta, velas, fiesta, amigos, regalo, celebrar, pasarlo bien"}, {"id": 13, "situation": "Llegas a la recepción de un hotel", "mood": "cansado pero educado", "task": "Haz el check-in y pide la llave de tu habitación", "starter": "Buenas tardes, tengo una reserva a nombre de…", "grammar": ["tener + sustantivo", "a nombre de"], "vocabulary": "reserva, habitación, llave, planta, noche, desayuno, individual, doble"}, {"id": 14, "situation": "Te encuentras mal y tienes fiebre", "mood": "triste y cansado", "task": "Explica a un amigo cómo te sientes", "starter": "No me encuentro bien. Me duele… y tengo…", "grammar": ["doler (me duele / me duelen)", "tener + enfermedad"], "vocabulary": "fiebre, dolor de cabeza, garganta, médico, pastilla, descansar, cansado"}, {"id": 15, "situation": "Ves un perro muy bonito en el parque", "mood": "entusiasmado", "task": "Describe al animal al dueño", "starter": "¡Qué perro tan bonito! Es… y tiene…", "grammar": ["ser + adjetivo", "tener + parte del cuerpo"], "vocabulary": "perro, gato, grande, pequeño, negro, blanco, pelo, cola, orejas, ojos"}, {"id": 16, "situation": "Planeas un picnic con amigos para el fin de semana", "mood": "animado y organizado", "task": "Di qué comida y bebida quieres llevar", "starter": "Podemos llevar… y también necesitamos…", "grammar": ["poder + infinitivo", "necesitar + sustantivo"], "vocabulary": "bocadillo, fruta, agua, zumo, manta, parque, soleado, hambre, sed"}, {"id": 17, "situation": "Estás en la biblioteca buscando un libro de español", "mood": "concentrado", "task": "Pide ayuda al bibliotecario", "starter": "Hola, ¿tienen algún libro sobre…?", "grammar": ["tener (¿tienen?)", "sobre + tema"], "vocabulary": "libro, estante, préstamo, carnet, devolver, semana, buscar, tema"}, {"id": 18, "situation": "Ves el menú de un restaurante y eliges qué comer", "mood": "hambriento y curioso", "task": "Pide tu plato al camarero", "starter": "De primero quiero… y de segundo…", "grammar": ["querer + sustantivo", "de primero/segundo/postre"], "vocabulary": "menú, plato, primero, segundo, postre, bebida, agua, vino, cuenta"}, {"id": 19, "situation": "Vas a Correos a enviar una postal a tu familia", "mood": "tranquilo", "task": "Pide un sello y explica adónde va la postal", "starter": "Quiero enviar esta postal a… ¿Cuánto cuesta el sello?", "grammar": ["querer + infinitivo", "a + país/ciudad"], "vocabulary": "postal, sello, carta, sobre, dirección, enviar, correos, precio"}, {"id": 20, "situation": "Un amigo nuevo te pregunta dónde vives", "mood": "amigable", "task": "Describe dónde está tu casa", "starter": "Vivo en… Mi casa está cerca de… y al lado de…", "grammar": ["estar + preposición de lugar", "vivir en"], "vocabulary": "cerca, lejos, al lado, enfrente, detrás, calle, barrio, piso, casa"}, {"id": 21, "situation": "Te vas a la cama y repasas el día", "mood": "relajado y un poco cansado", "task": "Cuenta qué hiciste hoy", "starter": "Hoy fui a… y luego comí… Por la tarde…", "grammar": ["pretérito indefinido (fui, comí, vi)", "hoy + pasado"], "vocabulary": "fui, comí, trabajé, estudié, vi, dormí, hablé, compré, descansé"}, {"id": 22, "situation": "Estás en el aeropuerto esperando tu vuelo", "mood": "emocionado y nervioso", "task": "Di adónde vas y cuánto tiempo te quedas", "starter": "Voy a… durante… días. Es mi primera vez en…", "grammar": ["ir a + lugar", "durante + tiempo"], "vocabulary": "vuelo, pasaporte, maleta, puerta, embarque, vacaciones, viaje, hotel"}, {"id": 23, "situation": "Tu vecino te saluda por la mañana", "mood": "amigable y simpático", "task": "Saluda y pregunta cómo está", "starter": "¡Buenos días! ¿Cómo estás?", "grammar": ["estar (estado)", "saludos y despedidas"], "vocabulary": "buenos días, buenas tardes, buenas noches, bien, mal, regular, hasta luego"}, {"id": 24, "situation": "Estás en un polideportivo y quieres apuntarte a una clase", "mood": "motivado", "task": "Pregunta qué clases hay y a qué hora", "starter": "Hola, ¿qué clases tienen? ¿A qué hora es…?", "grammar": ["tener (¿qué tienen?)", "a qué hora + es/son"], "vocabulary": "clase, yoga, natación, fútbol, horario, lunes, precio, apuntarse"}, {"id": 25, "situation": "Ves la televisión por la noche con un amigo", "mood": "relajado y entretenido", "task": "Habla de tu programa favorito", "starter": "Mi programa favorito es… porque es muy…", "grammar": ["ser + adjetivo", "porque"], "vocabulary": "serie, película, documental, canal, gracioso, aburrido, interesante, ver"}, {"id": 26, "situation": "Estás en una farmacia con dolor de cabeza", "mood": "incómodo", "task": "Pide un medicamento al farmacéutico", "starter": "Tengo dolor de… ¿Tiene algo para…?", "grammar": ["tener + dolor", "¿tiene algo para…?"], "vocabulary": "aspirina, pastilla, jarabe, receta, dolor, cabeza, estómago, alergia"}, {"id": 27, "situation": "Tu profesor te pregunta cuál es tu asignatura favorita", "mood": "reflexivo", "task": "Di qué asignatura te gusta más y por qué", "starter": "Mi asignatura favorita es… porque me parece…", "grammar": ["parecer + adjetivo", "porque"], "vocabulary": "matemáticas, historia, inglés, ciencias, arte, fácil, difícil, interesante"}, {"id": 28, "situation": "Estás eligiendo entre dos pizzas diferentes", "mood": "indeciso y hambriento", "task": "Compara las dos opciones y elige una", "starter": "Esta pizza tiene… pero aquella tiene… Prefiero…", "grammar": ["tener + ingredientes", "prefiero + sustantivo"], "vocabulary": "pizza, queso, tomate, jamón, aceitunas, grande, pequeña, precio, elegir"}, {"id": 29, "situation": "Hablas con un amigo sobre tus colores favoritos", "mood": "divertido y espontáneo", "task": "Di qué colores te gustan y cuáles no", "starter": "Me gusta mucho el… pero no me gusta el…", "grammar": ["gustar + artículo + color", "pero para contraste"], "vocabulary": "rojo, azul, verde, amarillo, blanco, negro, rosa, morado, favorito"}, {"id": 30, "situation": "Estás en clase de español y el profesor pregunta qué haces los fines de semana", "mood": "animado", "task": "Describe tus actividades del fin de semana", "starter": "Los fines de semana me gusta… y a veces…", "grammar": ["gustar + infinitivo", "a veces / los fines de semana"], "vocabulary": "salir, quedar, ver, escuchar, cocinar, leer, pasear, amigos, familia"}, {"id": 31, "situation": "Ves una foto de una ciudad y alguien te pregunta si te gusta", "mood": "curioso", "task": "Describe lo que ves en la foto", "starter": "En la foto hay… Veo… Es una ciudad muy…", "grammar": ["hay + sustantivo", "ver + sustantivo"], "vocabulary": "edificio, calle, parque, gente, grande, bonita, moderna, antigua, llena"}, {"id": 32, "situation": "Estás en casa y tienes hambre pero poca comida", "mood": "creativo y hambriento", "task": "Di qué hay en tu nevera y qué puedes hacer", "starter": "En mi nevera hay… Puedo hacer…", "grammar": ["haber (hay)", "poder + infinitivo"], "vocabulary": "huevos, queso, leche, verdura, pasta, arroz, nevera, cocinar, ingredientes"}, {"id": 33, "situation": "Tu amigo te pregunta cómo es tu habitación", "mood": "descriptivo", "task": "Describe los muebles y objetos de tu habitación", "starter": "En mi habitación hay… La cama está…", "grammar": ["hay + muebles", "estar + preposición"], "vocabulary": "cama, mesa, silla, armario, ventana, lámpara, grande, pequeño, ordenado"}, {"id": 34, "situation": "Estás perdido/a en una ciudad nueva", "mood": "un poco asustado pero tranquilo", "task": "Pide direcciones a alguien en la calle", "starter": "Perdona, ¿sabes cómo llegar a…?", "grammar": ["saber + infinitivo", "¿cómo llegar a?"], "vocabulary": "izquierda, derecha, recto, calle, semáforo, plaza, metro, cerca, lejos"}, {"id": 35, "situation": "Es el primer día en un trabajo nuevo", "mood": "nervioso pero positivo", "task": "Preséntate a tus nuevos compañeros", "starter": "Hola a todos, me llamo… y soy nuevo/nueva aquí. Trabajo en…", "grammar": ["llamarse", "ser + profesión"], "vocabulary": "trabajo, oficina, compañero, jefe, despacho, ordenador, reunión, malmente en el desayuno", "mood": "natural", "task": "Describe tu desayuno habitual", "starter": "Normalmente desayuno… A veces también tomo… No me gusta…", "grammar": ["desayunar + sustantivo", "normalmente / a veces"], "vocabulary": "café, tostada, zumo, cereales, fruta, leche, yogur, pan, mantequilla"}, {"id": 96, "situation": "Estás en el aeropuerto y tu vuelo tiene retraso", "mood": "impaciente y resignado", "task": "Pregunta en información sobre el retraso", "starter": "Perdone, ¿sabe cuánto tiempo de retraso tiene el vuelo a…?", "grammar": ["¿cuánto tiempo de retraso?", "tener + retraso"], "vocabulary": "vuelo, retraso, hora, información, esperar, puerta, embarque, motivo"}, {"id": 97, "situation": "Tu amigo te pregunta si te gusta tu ciudad o preferirías vivir en otra", "mood": "reflexivo y comparativo", "task": "Da tu opinión sobre tu ciudad", "starter": "Me gusta mi ciudad porque… pero creo que preferiría vivir en… porque…", "grammar": ["me gusta porque", "preferiría + infinitivo"], "vocabulary": "ciudad, grande, tranquila, cara, barata, transporte, naturaleza, gente"}, {"id": 98, "situation": "Estás en una clase y el profesor pide que describas el tiempo que hace hoy", "mood": "observador", "task": "Describe el tiempo que hace hoy en detalle", "starter": "Hoy hace… El cielo está… La temperatura es de unos… grados.", "grammar": ["hacer + tiempo", "estar + adjetivo (cielo)"], "vocabulary": "sol, nubes, lluvia, viento, frío, calor, grados, cielo, despejado, nublado"}, {"id": 99, "situation": "Tu amigo quiere saber qué tipo de libros lees", "mood": "literario", "task": "Habla de los géneros que te gustan", "starter": "Me gustan mucho los libros de… Ahora estoy leyendo… Es sobre…", "grammar": ["gustar + sustantivo plural", "estar + gerundio (ahora)"], "vocabulary": "novela, historia, ciencia ficción, misterio, autobiografía, personaje, trama"}, {"id": 100, "situation": "Es tu último día en un curso de español", "mood": "nostálgico y agradecido", "task": "Despídete de los compañeros y del profesor", "starter": "Ha sido un placer estudiar con vosotros. Espero que… ¡Hasta pronto!", "grammar": ["ha sido (presente perfecto básico)", "espero que + subjuntivo simple"], "vocabulary": "placer, agradecer, aprender, recordar, amigo, suerte, contacto, despedida"}],
    A2: [{"id": 1, "situation": "Planeas un viaje de fin de semana con un amigo", "mood": "entusiasta y organizador", "task": "Sugiere actividades y lugares para visitar", "starter": "Podríamos ir a… o también podríamos… ¿Qué te parece si…?", "grammar": ["poder (condicional: podríamos)", "¿qué te parece si + presente?"], "vocabulary": "visitar, museo, excursión, alojamiento, presupuesto, transporte, ruta, reservar"}, {"id": 2, "situation": "Acabas de volver de tus primeras vacaciones en el extranjero", "mood": "nostálgico y feliz", "task": "Cuéntale a un amigo lo que hiciste", "starter": "Fue increíble. El primer día fuimos a… y después visitamos… Lo que más me gustó fue…", "grammar": ["pretérito indefinido (fuimos, visitamos, gustó)", "lo que más + verbo"], "vocabulary": "viaje, paisaje, gastronomía, cultura, excursión, recuerdo, impresionante, experiencia"}, {"id": 3, "situation": "Tienes una entrevista de trabajo para un puesto de camarero", "mood": "nervioso pero preparado", "task": "Habla de tu experiencia y habilidades", "starter": "He trabajado como… durante… He tenido que… y me considero una persona…", "grammar": ["pretérito perfecto (he trabajado)", "considerarse + adjetivo"], "vocabulary": "experiencia, responsable, puntual, trabajo en equipo, atención al cliente, organizado"}, {"id": 4, "situation": "Comparas dos apartamentos para alquilar", "mood": "analítico y práctico", "task": "Describe las diferencias entre los dos", "starter": "El primero es más… pero el segundo tiene… Aunque cuesta más, prefiero…", "grammar": ["comparativos (más/menos + adjetivo)", "aunque para contraste"], "vocabulary": "alquiler, habitación, luminoso, céntrico, transporte, amueblado, precio, condición"}, {"id": 5, "situation": "Un turista te pide que le expliques cómo llegar al museo", "mood": "amable y servicial", "task": "Da instrucciones detalladas", "starter": "Sigue todo recto hasta… Luego gira a la… y después de… verás…", "grammar": ["imperativo (sigue, gira, cruza)", "preposiciones de movimiento"], "vocabulary": "recto, izquierda, derecha, cruzar, semáforo, esquina, a pie, minutos, señal"}, {"id": 6, "situation": "Estás en una cena con amigos españoles y habláis de comida", "mood": "sociable y curioso", "task": "Habla de tus preferencias y pregunta por las suyas", "starter": "Yo prefiero la comida… a la… porque me parece más… ¿Vosotros qué preferís?", "grammar": ["preferir + sustantivo/infinitivo", "¿vosotros qué + verbo?"], "vocabulary": "picante, dulce, salado, vegetariano, plato típico, sabor, ingrediente, receta"}, {"id": 7, "situation": "Has llegado a una ciudad nueva y buscas piso", "mood": "curioso y algo ansioso", "task": "Describe diferencias con tu ciudad anterior", "starter": "Esta ciudad es mucho más… que donde vivía antes. La gente aquí…", "grammar": ["comparativos", "imperfecto (vivía) para contraste con presente"], "vocabulary": "ruidoso, tranquilo, caro, barato, transporte, barrio, ambiente, acostumbrarse"}, {"id": 8, "situation": "Es el cumpleaños de tu mejor amigo y tú brindas", "mood": "emotivo y alegre", "task": "Di unas palabras de felicitación", "starter": "Quiero decir unas palabras para… Eres una persona muy… y espero que este año…", "grammar": ["querer + infinitivo", "espero que + subjuntivo simple"], "vocabulary": "amistad, especial, recuerdo, desear, suerte, futuro, feliz, celebrar, brindar"}, {"id": 9, "situation": "Llamas a un hotel para reservar una habitación", "mood": "formal y organizado", "task": "Confirma disponibilidad, precio e instalaciones", "starter": "Buenos días, quisiera reservar una habitación doble para… noches, del… al…", "grammar": ["quisiera + infinitivo (formal)", "del… al… (fechas)"], "vocabulary": "disponible, doble, individual, desayuno incluido, cancelar, confirmar, tarifa, fecha"}, {"id": 10, "situation": "Te encuentras con un amigo del colegio después de años", "mood": "sorprendido y nostálgico", "task": "Ponte al día con sus noticias", "starter": "¡No me lo puedo creer! ¿Cuánto tiempo! ¿Qué has hecho estos años? ¿Sigues…?", "grammar": ["pretérito perfecto (¿qué has hecho?)", "seguir + gerundio"], "vocabulary": "casado, mudarse, trabajo, hijos, estudios, cambiar, recordar, antes, ahora"}, {"id": 11, "situation": "Estás viendo un partido de fútbol con amigos", "mood": "emocionado y apasionado", "task": "Describe lo que está pasando en el campo", "starter": "¡El jugador está corriendo hacia la portería! Acaba de marcar…", "grammar": ["presente continuo (está + gerundio)", "acabar de + infinitivo"], "vocabulary": "gol, portería, árbitro, falta, penalti, jugador, equipo, marcar, perder, ganar"}, {"id": 12, "situation": "Tu amigo está triste y no sabe qué hacer con un problema", "mood": "empático y constructivo", "task": "Escucha y da consejos", "starter": "Entiendo cómo te sientes. En tu lugar yo… También podrías…", "grammar": ["en tu lugar yo + condicional", "también podrías + infinitivo"], "vocabulary": "consejo, solución, hablar, pensar, opciones, tranquilo, importante, decidir"}, {"id": 13, "situation": "Has leído una noticia interesante y se la cuentas a un amigo", "mood": "informado y curioso", "task": "Resume la noticia y comenta tu opinión", "starter": "He leído que… Según el artículo… Me parece que esto es…", "grammar": ["pretérito perfecto (he leído)", "según + fuente"], "vocabulary": "noticia, periódico, gobierno, anunciar, evento, importante, opinión, comentar"}, {"id": 14, "situation": "Estás en el médico con un dolor de espalda que llevas días teniendo", "mood": "preocupado", "task": "Describe los síntomas con detalle", "starter": "Llevo tres días con dolor de… Me duele más cuando… y se alivia cuando…", "grammar": ["llevar + tiempo + gerundio", "me duele cuando + presente"], "vocabulary": "espalda, muscular, inflamación, analgésico, reposo, empeorar, mejorar, síntoma"}, {"id": 15, "situation": "Sigues una receta de cocina española y explicas los pasos a un amigo", "mood": "concentrado y didáctico", "task": "Explica los pasos de la receta en orden", "starter": "Primero hay que… Después se añade… Una vez que esté listo…", "grammar": ["hay que + infinitivo", "se + verbo (impersonal)", "secuenciadores"], "vocabulary": "picar, sofreír, añadir, mezclar, hervir, probar, sal, aceite, temperatura"}, {"id": 16, "situation": "Estás en una tienda y quieres devolver una chaqueta defectuosa", "mood": "firme pero educado", "task": "Explica el problema y pide solución", "starter": "Compré esta chaqueta hace… pero tiene un defecto en… ¿Es posible que me la cambien?", "grammar": ["pretérito indefinido (compré)", "hace + tiempo", "¿es posible que + subjuntivo?"], "vocabulary": "defecto, costura, cremallera, cambio, reembolso, recibo, garantía, calidad"}, {"id": 17, "situation": "Tu compañero de piso te pregunta por qué llegaste tarde anoche", "mood": "cansado pero animado", "task": "Cuenta lo que pasó y por qué tardaste tanto", "starter": "Es que quedé con… y al final… Cuando llegué a casa ya era…", "grammar": ["pretérito indefinido narrativo", "cuando + indefinido"], "vocabulary": "quedar, cenar, transporte, última hora, perder el autobús, tarde, explicar"}, {"id": 18, "situation": "Estás en una agencia de viajes preguntando por un destino", "mood": "ilusionado", "task": "Pide información sobre el mejor momento para viajar y qué hacer allí", "starter": "Estoy pensando en ir a… ¿Cuándo es la mejor época? ¿Qué se puede hacer allí?", "grammar": ["¿cuándo es la mejor época?", "se puede + infinitivo"], "vocabulary": "temporada, turista, clima, actividades, visitar, cultura, vuelo, alojamiento"}, {"id": 19, "situation": "Buscas piso para alquilar y llamas al propietario", "mood": "interesado y cauteloso", "task": "Pregunta sobre condiciones del alquiler", "starter": "Llamo por el piso que vi en internet. ¿La fianza incluye…? ¿Está permitido…?", "grammar": ["¿está permitido + infinitivo?", "incluir"], "vocabulary": "fianza, mensualidad, suministros, mascotas, garaje, comunidad, contrato, reformar"}, {"id": 20, "situation": "Estás en una reunión de trabajo y presentas una idea sencilla", "mood": "seguro y profesional", "task": "Presenta tu propuesta y explica sus ventajas", "starter": "Me gustaría proponer… Creo que podría beneficiar a… porque…", "grammar": ["me gustaría + infinitivo", "podría + infinitivo (condicional)"], "vocabulary": "propuesta, beneficio, ahorro, cliente, objetivo, resultado, equipo, implementar"}, {"id": 21, "situation": "Hablas con un amigo sobre un evento histórico que estudiaste", "mood": "interesado e informativo", "task": "Explica causas y consecuencias del evento", "starter": "Este evento ocurrió porque… Como resultado… Tuvo un impacto importante en…", "grammar": ["pretérito indefinido", "como resultado / a causa de"], "vocabulary": "guerra, revolución, consecuencia, importante, fecha, siglo, historia, cambiar"}, {"id": 22, "situation": "Fuiste testigo de un pequeño accidente en la calle", "mood": "algo alterado", "task": "Cuéntale a alguien lo que viste", "starter": "Estaba andando cuando de repente… El coche iba muy rápido y…", "grammar": ["imperfecto + indefinido (estaba andando / vino)", "de repente"], "vocabulary": "accidente, coche, semáforo, herido, ambulancia, policía, testigo, velocidad"}, {"id": 23, "situation": "Debatís en clase sobre el uso de las redes sociales entre jóvenes", "mood": "reflexivo y argumentativo", "task": "Da tu opinión con argumentos a favor y en contra", "starter": "Por un lado, las redes sociales permiten… Sin embargo, también pueden…", "grammar": ["por un lado… sin embargo", "poder + infinitivo"], "vocabulary": "adicción, comunicación, privacidad, influencer, tiempo, jóvenes, beneficio, riesgo"}, {"id": 24, "situation": "Recomiendas un libro que te ha encantado a un amigo", "mood": "entusiasta", "task": "Describe de qué trata y por qué merece la pena leerlo", "starter": "Te recomiendo… Es una novela de… que trata sobre… Lo que más me gustó fue…", "grammar": ["recomendar", "tratar sobre + sustantivo", "lo que más me gustó fue"], "vocabulary": "protagonista, trama, final, emocionante, personaje, autor, género, página"}, {"id": 25, "situation": "Estás de intercambio cultural en un país hispanohablante", "mood": "abierto y reflexivo", "task": "Habla de lo que más te ha sorprendido culturalmente", "starter": "Lo que más me ha sorprendido es que aquí la gente… También me resultó curioso que…", "grammar": ["pretérito perfecto (me ha sorprendido)", "me resultó + adjetivo"], "vocabulary": "costumbre, horario, comida, familia, saludo, diferencia, adaptarse, curioso"}, {"id": 26, "situation": "Estás en la universidad y te preguntan sobre tu carrera", "mood": "reflexivo y motivado", "task": "Habla de por qué elegiste esa carrera y qué quieres hacer", "starter": "Elegí… porque siempre me ha interesado… En el futuro me gustaría…", "grammar": ["pretérito indefinido (elegí)", "me gustaría + infinitivo"], "vocabulary": "carrera, asignatura, futuro, profesión, interés, vocación, trabajo, especialidad"}, {"id": 27, "situation": "Tu amigo necesita consejo sobre una decisión importante", "mood": "reflexivo y empático", "task": "Ayúdale a pensar en pros y contras", "starter": "Entiendo tu situación. Por un lado… Por otro lado… Si fuera tú…", "grammar": ["si fuera yo (condicional)", "por un lado… por otro lado"], "vocabulary": "decisión, ventaja, inconveniente, consecuencia, pensar, elegir, futuro, opciones"}, {"id": 28, "situation": "Participas en un debate de radio sobre el medio ambiente", "mood": "comprometido y apasionado", "task": "Defiende tu postura con argumentos", "starter": "Creo firmemente que… Los datos muestran que… Por eso considero que…", "grammar": ["creer firmemente que", "los datos muestran que"], "vocabulary": "contaminación, reciclaje, energía, renovable, responsabilidad, futuro, planeta, ciudadano"}, {"id": 29, "situation": "Describes a una persona famosa que admiras", "mood": "admirativo y reflexivo", "task": "Explica sus cualidades e influencia en ti", "starter": "La persona qu ero después me di cuenta de que…", "grammar": ["antes + imperfecto", "me di cuenta de que"], "vocabulary": "perspectiva, reflexión, madurar, valores, cambiar, impacto, crecimiento"}, {"id": 6, "situation": "Participas en una reunión de trabajo para resolver un problema urgente", "mood": "profesional y resolutivo", "task": "Propón soluciones concretas", "starter": "Dado que el problema es urgente, propongo que… En primer lugar habría que… A continuación…", "grammar": ["dado que + indicativo", "habría que + infinitivo"], "vocabulary": "urgente, prioridad, asignar, plazo, solución, equipo, recurso, implementar"}, {"id": 7, "situation": "Explicas el sistema político de tu país a un extranjero", "mood": "informativo y claro", "task": "Describe la estructura política básica", "starter": "En mi país existe un sistema… El poder está dividido en… y cada… años se celebran…", "grammar": ["existir + sistema", "cada + tiempo + se celebran"], "vocabulary": "democracia, parlamento, elecciones, gobierno, oposición, partido, votación"}, {"id": 8, "situation": "Hablas sobre la importancia de la salud mental", "mood": "empático y concienciado", "task": "Argumenta por qué se debería hablar más de ello", "starter": "Creo que la salud mental es tan importante como la física, sin embargo… Es fundamental que la sociedad…", "grammar": ["tan… como (comparación igual)", "es fundamental que + subjuntivo"], "vocabulary": "estigma, bienestar, terapia, estrés, normalizar, apoyo, prevención"}, {"id": 9, "situation": "Describes un momento difícil que superaste", "mood": "valiente y reflexivo", "task": "Narra el reto y cómo lo afrontaste", "starter": "Fue una de las épocas más difíciles de mi vida. En aquel momento… Lo que me ayudó fue… y poco a poco…", "grammar": ["fue una de las más + superlativo", "poco a poco + indefinido"], "vocabulary": "superar, dificultad, apoyo, resistencia, aprendizaje, fuerza, tiempo"}, {"id": 10, "situation": "Discutes con un amigo si es mejor vivir en el campo o la ciud
