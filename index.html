't warn you about", "the hardest adjustment isn't the practical stuff but the"], "vocabulary": "adjust, identity, loneliness, practical, integration, expectation, realism, prepare"}, {"id": 19, "situation": "You're explaining why you think people underestimate the difficulty of changing habits", "mood": "insightful", "task": "Go beyond 'just try harder' and explain the real obstacles", "starter": "We talk about habit change as if it's primarily a willpower problem, but that misdiagnoses it. The real obstacle is usually structural — it's about the environment you're in, the…", "grammar": ["we talk about… as if it's primarily a… problem, but that misdiagnoses it", "the real obstacle is usually structural"], "vocabulary": "willpower, environment, cue, identity, structure, default, system, friction"}, {"id": 20, "situation": "You're at a dinner and someone asks what you actually think about social media for kids", "mood": "direct and evidence-aware", "task": "Give a clear view with reasoning, not just vibes", "starter": "I think there's a meaningful difference between what the data actually says and the panic narrative around it. What the research suggests is more nuanced: the effect really depends on…", "grammar": ["there's a meaningful difference between what the data says and the panic narrative", "the effect really depends on"], "vocabulary": "screen time, evidence, nuance, panic, developmental, age-appropriate, moderation"}, {"id": 21, "situation": "You're discussing with a friend whether you should confront someone who's been treating you badly", "mood": "measured", "task": "Walk through the thinking, not just give a yes or no", "starter": "The question for me isn't whether to say something — it's whether saying it will actually change anything. If I think the person is capable of hearing it and adjusting, then…", "grammar": ["the question isn't whether to… it's whether", "if I think the person is capable of"], "vocabulary": "confront, outcome, capable, worth it, impact, prepare, expectation, energy"}, {"id": 22, "situation": "You're explaining why you think the 40-hour workweek is outdated", "mood": "critical", "task": "Make a specific argument, not a vague complaint", "starter": "The 40-hour week was designed for a specific type of work that most of us no longer do. What's changed is that most knowledge work isn't limited by hours but by… and forcing people to…", "grammar": ["was designed for a specific type of work that most of us no longer do", "most knowledge work isn't limited by hours but by"], "vocabulary": "productivity, knowledge work, output, presence, flexibility, output-based, redesign"}, {"id": 23, "situation": "You're talking about whether having children is a choice people make freely or whether society pressures them", "mood": "reflective", "task": "Explore the social forces at play without telling people what to choose", "starter": "What I've noticed is how much of the conversation around having children is framed as natural or inevitable, when actually there are very specific social and economic pressures that…", "grammar": ["how much of the conversation is framed as natural or inevitable", "there are very specific social and economic pressures that"], "vocabulary": "choice, pressure, social norm, expectation, autonomy, framing, default, narrative"}, {"id": 24, "situation": "You're explaining to a friend why you've started setting stricter limits on your phone use", "mood": "self-aware", "task": "Describe what you noticed and what actually changed when you set limits", "starter": "I was sceptical of the whole 'digital detox' narrative at first. What changed my mind wasn't some philosophical argument but noticing that after a few hours on the phone I was consistently…", "grammar": ["I was sceptical of… at first", "noticing that after a few hours I was consistently"], "vocabulary": "screen time, attention, experiment, notice, sceptical, limit, reset, mood"}, {"id": 25, "situation": "You're discussing with a colleague whether feedback in your workplace is actually useful", "mood": "honest", "task": "Analyse what makes feedback work and what makes it useless", "starter": "The feedback culture we have sounds good in theory — open, frequent, honest. But in practice what I've found is that most of it is either too vague to act on or delivered in a way that…", "grammar": ["sounds good in theory — but in practice what I've found", "too vague to act on or delivered in a way that"], "vocabulary": "feedback, actionable, vague, psychological safety, trust, culture, effective, specific"}, {"id": 26, "situation": "You're talking to your parents about a decision they strongly disagree with", "mood": "respectful but resolute", "task": "Hold your position while genuinely acknowledging their concern", "starter": "I do hear you, and I know this isn't what you'd choose for me. But I've thought about it carefully and this is the direction that feels right for my life, even if it means…", "grammar": ["I do hear you, and I know this isn't what you'd choose", "even if it means"], "vocabulary": "autonomy, respect, disagree, acknowledge, resolute, choice, relationship, understand"}, {"id": 27, "situation": "You're explaining the difference between being busy and being productive", "mood": "perceptive", "task": "Make the distinction concrete with examples", "starter": "Busyness and productivity can look identical from the outside, but they feel completely different from the inside. What gives it away is usually whether the effort is moving you towards… or just…", "grammar": ["busyness and productivity can look identical from the outside", "what gives it away is usually whether"], "vocabulary": "output, meaningful, motion, progress, efficient, direction, task, priority"}, {"id": 28, "situation": "You're discussing with a friend whether your country handles immigration well", "mood": "balanced", "task": "Acknowledge the complexity without resorting to extremes", "starter": "Immigration is one of those topics where both the far left and far right seem to agree on one thing: that the nuance doesn't matter. What actually gets lost in both narratives is…", "grammar": ["both extremes seem to agree that nuance doesn't matter", "what actually gets lost in both narratives is"], "vocabulary": "policy, integration, economy, narrative, nuance, complexity, community, balance"}, {"id": 29, "situation": "You're explaining why you think the way we talk about mental health still has a way to go", "mood": "thoughtful", "task": "Go beyond the awareness-raising clichés", "starter": "We've got much better at saying it's okay to struggle, but saying it and creating the actual conditions for people to get help are very different things. What's still missing is…", "grammar": ["saying it and creating the actual conditions are very different things", "what's still missing is"], "vocabulary": "access, stigma, structural, normalise, gap, real support, system, beyond awareness"}, {"id": 30, "situation": "You're debating with a friend whether you'd rather have a high salary doing something you dislike or a lower salary doing something meaningful", "mood": "honest", "task": "Don't give the 'right' answer — give your real one", "starter": "I'd be lying if I said money was irrelevant. What I've actually found is that there's a threshold below which the meaningful work stops being meaningful because…", "grammar": ["I'd be lying if I said money was irrelevant", "there's a threshold below which"], "vocabulary": "threshold, meaningful, compensation, stress, trade-off, sustain, financial floor, values"}, {"id": 31, "situation": "You're explaining to a new employee why company culture matters more than the job description", "mood": "experienced", "task": "Give concrete examples of how culture shapes the day-to-day", "starter": "A job description tells you what you'll be doing. The culture tells you what it will actually feel like to do it. The things that culture affects most — but nobody mentions in the interview — are…", "grammar": ["a job description tells you what you'll be doing, the culture tells you what it will feel like", "the things that culture affects most but nobody mentions"], "vocabulary": "culture, day-to-day, unwritten rules, norms, wellbeing, fit, environment, unsaid"}, {"id": 32, "situation": "You're discussing whether people should stay in a city they've outgrown", "mood": "reflective", "task": "Explore both the pull of the familiar and the pull of change", "starter": "There's a difference between staying somewhere because it's genuinely the best place for you and staying because leaving requires a decision that feels too big. What I'd ask is whether you're staying towards something or just…", "grammar": ["there's a difference between staying because it's the best place and staying because leaving feels too big", "whether you're staying towards something or just"], "vocabulary": "outgrown, familiar, inertia, comfort, leaving, courage, identity, move"}, {"id": 33, "situation": "You're talking about what you wish you'd understood about money in your twenties", "mood": "mature", "task": "Share specific insights, not generic advice", "starter": "The thing nobody told me — or maybe they did and I didn't listen — is that the gap between earning and spending matters more than either number in isolation. I spent years earning…", "grammar": ["the thing nobody told me — or maybe they did and I didn't listen", "the gap between earning and spending matters more than either number"], "vocabulary": "gap, saving rate, lifestyle inflation, compound, habit, earning, spending, advice"}, {"id": 34, "situation": "You're explaining why you think apologies have become formulaic and meaningless", "mood": "critical", "task": "Diagnose the problem and describe what a real apology looks like", "starter": "We've learned to produce the correct sounds — 'I'm sorry, I take full responsibility' — without any of the actual content of an apology. What those words are missing is…", "grammar": ["we've learned to produce the correct sounds without any of the actual content", "what those words are missing is"], "vocabulary": "formulaic, performative, hollow, specific, impact, accountability, genuine, repair"}, {"id": 35, "situation": "You're discussing with a friend whether it's possible to stay close to people you've grown apart from", "mood": "honest", "task": "Explore the tension between loyalty and drift", "starter": "What I've realised is that some friendships are for a specific chapter of your life, and trying to maintain them past that chapter requires both people to pretend to still be the versions of themselves that…", "grammar": ["some friendships are for a specific chapter of your life", "both people would have to pretend to still be"], "vocabulary": "drift, chapter, effort, mutual, distance, outgrown, nostalgia, let go"}, {"id": 36, "situation": "You're explaining why you changed your view on a political or social topic", "mood": "humble", "task": "Describe the process of updating your belief honestly", "starter": "What shifted my view wasn't one conversation or article — it was a slow accumulation of experiences that made my previous position feel increasingly… The moment I knew I needed to rethink it was when…", "grammar": ["what shifted my view wasn't one conversation — it was a slow accumulation", "the moment I knew I needed to rethink was when"], "vocabulary": "update, belief, experience, rethink, previous, honest, accumulation, shift"}, {"id": 37, "situation": "You're talking about the difference between a good manager and a great one", "mood": "experienced", "task": "Go beyond the surface qualities and identify what actually makes the difference", "starter": "Most managers can give feedback and run meetings. What separates the really good ones is something harder to name — it's something about how they make you feel about your own…", "grammar": ["most managers can… what separates the really good ones is", "something about how they make you feel about your own"], "vocabulary": "trust, develop, potential, safe, feedback quality, seen, accountable, autonomy"}, {"id": 38, "situation": "You're debating whether travelling frequently for work is worth the lifestyle cost", "mood": "balanced", "task": "Present the real trade-offs from personal experience", "starter": "There's a version of constant business travel that sounds glamorous and a version that actually erodes your… I've experienced both and what I can tell you is that past a certain frequency it starts to…", "grammar": ["there's a version that sounds glamorous and a version that actually erodes", "past a certain frequency it starts to"], "vocabulary": "lifestyle, erode, frequency, fatigue, compensation, threshold, trade-off, routine"}, {"id": 39, "situation": "You're explaining why some teams perform brilliantly and others don't despite similar talent", "mood": "analytical", "task": "Identify the less obvious factors that make the difference", "starter": "Talent is necessary but nowhere near sufficient. What I've noticed in the highest-performing teams I've been part of is that the difference comes down to… and specifically whether people feel free to…", "grammar": ["talent is necessary but nowhere near sufficient", "whether people feel free to"], "vocabulary": "psychological safety, trust, dynamic, communicate, capable, function, perform, complement"}, {"id": 40, "situation": "You're discussing with a partner whether to take a financial risk on something important to you", "mood": "honest", "task": "Talk through the fear and the reasoning rather than just the numbers", "starter": "I want to be honest about two things: the first is that this scares me more than I've let on. The second is that I think not doing it might scare me more in five years when…", "grammar": ["I want to be honest about two things", "not doing it might scare me more in five years when"], "vocabulary": "risk, fear, opportunity cost, regret, calculated, honest, threshold, commit"}, {"id": 41, "situation": "You're explaining why you think people stay in unhealthy friendships as long as they do", "mood": "psychological", "task": "Explore the real mechanisms, not just 'people are afraid of confrontation'", "starter": "What keeps people in unhealthy friendships usually isn't fear of confrontation — it's a combination of… and the fact that the friendship is only bad in a way that's hard to describe to someone outside it.", "grammar": ["usually isn't fear of confrontation — it's a combination of", "only bad in a way that's hard to describe to someone outside it"], "vocabulary": "sunk cost, normalise, invisible, articulate, pattern, history, exit, gradual"}, {"id": 42, "situation": "You're talking about whether you've found it harder or easier to make friends as an adult", "mood": "honest", "task": "Be specific about what changed and why", "starter": "Making friends as a child felt almost automatic because… As an adult the conditions that created that have mostly disappeared. What you're left with is a situation where…", "grammar": ["making friends as a child felt automatic because", "the conditions that created that have mostly disappeared"], "vocabulary": "deliberate, shared context, transition, effort, adult, proximity, organic, intentional"}, {"id": 43, "situation": "You're explaining why you've become more careful about who you take advice from", "mood": "discerning", "task": "Distinguish between useful and unhelpful advice-givers", "starter": "I've started paying attention not just to what people say but to whether their life actually reflects the things they're recommending. The most confident advice-givers are often the ones who…", "grammar": ["paying attention not just to what people say but to whether", "the most confident advice-givers are often the ones who"], "vocabulary": "credibility, context, relevant, apply, qualified, track record, discern, source"}, {"id": 44, "situation": "You're discussing whether your generation was sold a lie about what adult life would look like", "mood": "reflective", "task": "Be honest about the gap between expectation and reality", "starter": "What I was led to believe — mostly by osmosis rather than any explicit promise — was that if you followed the steps in the right order you'd end up with… What nobody mentioned was that…", "grammar": ["led to believe mostly by osmosis rather than any explicit promise", "what nobody mentioned was that"], "vocabulary": "expectation, reality, gap, narrative, generation, promise, path, disillusion"}, {"id": 45, "situation": "You're talking about the role luck has played in your professional success", "mood": "honest", "task": "Be genuinely honest rather than falsely modest or arrogant", "starter": "I think the honest answer is somewhere between 'I worked hard' and 'I just got lucky'. What I can say is that some of my biggest breaks came from circumstances I had no control over, specifically…", "grammar": ["the honest answer is somewhere between", "some of my biggest breaks came from circumstances I had no control over"], "vocabulary": "luck, circumstance, privilege, timing, effort, acknowledge, humble, attribute"}, {"id": 46, "situation": "You're explaining your approach to managing disagreement in a team", "mood": "professional", "task": "Describe what you've learned from doing it badly and then better", "starter": "The approach I have now came mostly from watching what happens when you avoid it. The cost of unresolved disagreement in a team isn't visible immediately — it shows up later as…", "grammar": ["the approach I have now came mostly from watching what happens when you avoid it", "the cost of unresolved disagreement shows up later as"], "vocabulary": "conflict, avoid, address, cost, trust, resolution, healthy, dysfunction"}, {"id": 47, "situation": "You're discussing whether it's possible to truly disconnect from work in the modern world", "mood": "candid", "task": "Share what's actually worked and what hasn't", "starter": "I've tried every version of this: no email after 6pm, phone-free weekends, the whole thing. The honest conclusion I've reached is that disconnection is less about rules and more about…", "grammar": ["I've tried every version of this", "disconnection is less about rules and more about"], "vocabulary": "boundary, available, expectation, culture, culture shift, genuine, switch off, permission"}, {"id": 48, "situation": "You're explaining why you value directness in communication more than politeness", "mood": "convinced", "task": "Make the case without dismissing the need for tact", "starter": "There's a version of politeness that's actually a form of avoidance — you're protecting yourself from the discomfort of saying a hard thing while the other person carries the cost of not knowing it.", "grammar": ["a version of politeness that's actually a form of avoidance", "the other person carries the cost of not knowing it"], "vocabulary": "direct, tact, honest, cost, avoidance, feedback, clear, uncomfortable"}, {"id": 49, "situation": "You're talking about a decision you made that seemed wrong at the time but turned out to be right", "mood": "reflective", "task": "Explore what you understood later that you didn't see at the time", "starter": "At the time it felt like I was giving something up. What I couldn't see then was that I was also making room for… The way I think about it now is…", "grammar": ["at the time it felt like I was giving something up", "what I couldn't see then was that"], "vocabulary": "decision, clarity, hindsight, trust, process, room for, perspective, outcome"}, {"id": 50, "situation": "You close a discussion about communication and language learning", "mood": "warm", "task": "Share what's surprised you most about the process of learning to express yourself in a new language", "starter": "What I didn't expect was that the language itself would change what I'm able to think about — not just in that language, but sometimes even in my own. The most unexpected thing has been…", "grammar": ["what I didn't expect was that the language itself would change", "not just in that language but sometimes even in my own"], "vocabulary": "unexpected, access, nuance, expression, think, expand, fluency, voice"}, {"id": 51, "situation": "You're explaining to a friend why you find it hard to ask for what you need", "mood": "self-aware", "task": "Go beyond 'I'm not good at asking' and identify the real reason", "starter": "It's not that I don't know what I need — I usually do. The block is something more specific: a worry that asking will be seen as… or that the answer will be no and then I'll have to deal with…", "grammar": ["it's not that I don't know what I need", "the block is something more specific"], "vocabulary": "block, articulate, fear, vulnerable, need, ask, rejection, communicate"}, {"id": 52, "situation": "You're discussing with a friend whether your current lifestyle is sustainable", "mood": "honest", "task": "Assess your own habits with real honesty rather than defensiveness", "starter": "If I'm being honest with myself — and this is hard to say out loud — I think I've built a life that works on the surface but quietly costs me more than I've admitted. Specifically…", "grammar": ["if I'm being honest with myself — and this is hard to say", "quietly costs me more than I've admitted"], "vocabulary": "sustainable, surface, honest, cost, admit, pattern, long-term, adjust"}, {"id": 53, "situation": "You're explaining to your team why a last-minute change to the plan is necessary", "mood": "calm and clear", "task": "Communicate the change, the reason, and what you need from them", "starter": "I know the timing is bad and I want to acknowledge that directly. Here's what's changed and why it matters: … What I need from each of you in the next 48 hours is…", "grammar": ["I want to acknowledge that directly", "what I need from each of you in the next"], "vocabulary": "last-minute, acknowledge, adapt, clarity, reason, brief, disruption, support"}, {"id": 54, "situation": "You're talking about whether people are too quick to cut others out of their lives", "mood": "nuanced", "task": "Explore when it's justified and when it's avoidance", "starter": "There's a version of cutting people off that's healthy — it's a genuine protection of your energy. And then there's a version that's more about conflict avoidance dressed up as self-care. The difference is usually whether…", "grammar": ["there's a version that's healthy and a version that's avoidance", "the difference is usually whether"], "vocabulary": "boundary, avoidance, self-care, justify, distance, conflict, discern, healthy"}, {"id": 55, "situation": "You're explaining why you think the job application process is broken", "mood": "frustrated but constructive", "task": "Describe specific problems and what you think would actually work better", "starter": "What the current process optimises for isn't actually the best candidate — it optimises for the candidate who's best at applying for jobs, which is an entirely separate skill from…", "grammar": ["what the process optimises for isn't the best candidate", "an entirely separate skill from"], "vocabulary": "process, optimise, signal, filter, bias, reform, evaluate, skill"}, {"id": 56, "situation": "You're talking about how your relationship with your own body has changed over the years", "mood": "honest", "task": "Reflect on the journey without performing either negativity or positivity", "starter": "My relationship with my body has been complicated, and I think the most honest thing I can say is that it's still in process. What's shifted most is not how it looks but…", "grammar": ["my relationship with my body has been complicated", "what's shifted most is not how it looks but"], "vocabulary": "body image, shift, process, complicated, relationship, accept, change, narrative"}, {"id": 57, "situation": "You're debating with a friend whether it's better to specialise deeply or stay generalist", "mood": "thoughtful", "task": "Make a genuine argument for one side while acknowledging the other", "starter": "I think the conventional wisdom is changing on this. For most of the 20th century specialisation was the safe bet, but what I'm seeing now is that the people who seem most resilient are the ones who…", "grammar": ["the conventional wisdom is changing on this", "the people who seem most resilient are the ones who"], "vocabulary": "generalist, specialist, T-shaped, adaptable, niche, versatile, skill, context"}, {"id": 58, "situation": "You're explaining why you've stopped trying to convince people who aren't ready to change", "mood": "wise", "task": "Describe what you've learnt about when persuasion works and when it doesn't", "starter": "What I've found is that persuasion is almost never about the quality of the argument. People change their minds when they're ready, not when you're most eloquent. The trigger is usually…", "grammar": ["persuasion is almost never about the quality of the argument", "people change their minds when they're ready, not when you're"], "vocabulary": "persuasion, readiness, trigger, argument, rhetoric, timing, change, open"}, {"id": 59, "situation": "You're talking about whether complaining is ever useful or just draining", "mood": "balanced", "task": "Make the case for the right kind of venting while being honest about the useless kind", "starter": "There's venting that processes something so you can move on, and there's venting that just reinforces the story you're already telling yourself. The question I ask now is whether talking about it is moving me… or keeping me…", "grammar": ["there's venting that processes and venting that reinforces", "whether talking about it is moving me or keeping me"], "vocabulary": "vent, process, reinforce, productive, move on, stuck, cathartic, pattern"}, {"id": 60, "situation": "You're explaining what you've learnt from working with people who are very different from you", "mood": "open-minded", "task": "Share a specific thing that genuinely changed how you work or think", "starter": "The thing that shifts most when you work closely with people who think differently isn't your output — it's your assumptions. I used to approach… in a particular way because I thought it was just… when actually…", "grammar": ["what shifts most isn't your output — it's your assumptions", "I thought it was just… when actually"], "vocabulary": "assumption, perspective, diverse, collaboration, approach, enrich, challenge, adapt"}, {"id": 61, "situation": "You're discussing whether it matters that your work be meaningful or whether good pay is enough", "mood": "honest", "task": "Give your real position, not the one that sounds virtuous", "starter": "I've tested this question in both directions and what I can say is that good pay matters a lot more than people admit when they're comfortable, and meaning matters a lot more than money when you're… The honest conclusion is…", "grammar": ["good pay matters more than people admit when comfortable", "meaning matters more than money when you're"], "vocabulary": "meaning, threshold, sustain, honest, virtue signal, compensate, comfortable, real"}, {"id": 62, "situation": "You're explaining why a conversation you had recently stuck with you", "mood": "reflective", "task": "Describe the conversation and what made it different from ordinary ones", "starter": "It was one of those rare conversations where I noticed I was thinking out loud rather than performing. The other person did something that made that possible — specifically they…", "grammar": ["I noticed I was thinking out loud rather than performing", "the other person did something that made that possible"], "vocabulary": "rare, thinking out loud, perform, genuine, space, trust, invite, resonant"}, {"id": 63, "situation": "You're debating whether cities or companies should be responsible for addressing loneliness", "mood": "civic", "task": "Argue that structural solutions matter even if personal action is also needed", "starter": "I don't think framing this as individual responsibility vs. structural solutions is useful — it's clearly both. But we've already tried the individual framing for a long time and… what we haven't tried at scale is…", "grammar": ["framing it as individual vs. structural isn't useful — it's clearly both", "we've already tried one and what we haven't tried is"], "vocabulary": "loneliness, structural, individual, scale, community, policy, public space, epidemic"}, {"id": 64, "situation": "You're talking about how you deal with a gap between who you think you are and how you actually behave", "mood": "honest", "task": "Acknowledge the gap without being either defensive or self-flagellating", "starter": "This is uncomfortable territory because it requires noticing that I'm not always as… as I like to think I am. What I've found useful isn't to try to close the gap through willpower but to…", "grammar": ["this requires noticing that I'm not always as… as I like to think", "not to try to close the gap through willpower but to"], "vocabulary": "gap, self-image, behaviour, notice, honest, uncomfortable, adjust, consistent"}, {"id": 65, "situation": "You're explaining to a friend why you said no to something they really wanted you to do", "mood": "gentle but clear", "task": "Hold the boundary while preserving the relationship", "starter": "I want to be honest with you about why rather than just giving you an excuse, because you deserve the real answer. The truth is that this particular thing…", "grammar": ["I want to be honest with you about why rather than giving an excuse", "the truth is that this particular thing"], "vocabulary": "honest, excuse, boundary, deserve, explain, preserve, no, relationship"}, {"id": 66, "situation": "You're discussing whether people who haven't struggled can really help people who have", "mood": "thoughtful", "task": "Explore the role of experience in empathy and support", "starter": "My instinct is that lived experience isn't essential but proximity is. What matters more than whether you've been through it is whether you can… without making it about yourself.", "grammar": ["lived experience isn't essential but proximity is", "what matters more than whether you've been through it is whether"], "vocabulary": "lived experience, proximity, empathy, understand, support, relevant, perspective, authentic"}, {"id": 67, "situation": "You're explaining to a new colleague what they won't find in the employee handbook", "mood": "honest and helpful", "task": "Describe the unwritten rules that actually matter", "starter": "The manual will tell you when to show up and how to submit expenses. What it won't tell you is that… and that the fastest way to lose credibility here is to…", "grammar": ["the manual will tell you… what it won't tell you is", "the fastest way to lose credibility here is to"], "vocabulary": "unwritten, handbook, culture, credibility, norm, navigate, observe, unspoken"}, {"id": 68, "situation": "You're talking about what makes some people easy to trust and others not", "mood": "observant", "task": "Go beyond 'they keep their word' to the subtler signals", "starter": "Trustworthiness shows up in a lot of small moments before the big ones. The things I actually watch for are whether someone… when they think no one's looking, and whether they…", "grammar": ["trustworthiness shows up in small moments before the big ones", "the things I actually watch for are whether"], "vocabulary": "signal, consistent, small moments, integrity, observe, reliable, character, pattern"}, {"id": 69, "situation": "You're discussing whether it's possible to maintain work friendships when you're the boss", "mood": "experienced", "task": "Explore the real tension between authority and genuine connection", "starter": "The honest answer is yes, but it takes a certain kind of effort that most people underestimate. The friendship has to adjust — it can't be the same as before — because now one of you has to…", "grammar": ["yes, but it takes a kind of effort most people underestimate", "the friendship has to adjust because now one of you has to"], "vocabulary": "authority, dynamic, adjust, trust, professional, genuine, power, friendship"}, {"id": 70, "situation": "You're explaining to a friend how you've learnt to deal with negative feedback", "mood": "resilient", "task": "Describe the emotional and practical process", "starter": "My first reaction is almost always a little defensive, even when I know the feedback is useful. What I've learnt to do is to treat that reaction as information rather than a guide — it tells me…", "grammar": ["my first reaction is almost always a little defensive even when I know", "treat that reaction as information rather than a guide"], "vocabulary": "defensive, process, useful, separate, information, guide, feedback, receiver"}, {"id": 71, "situation": "You're debating whether companies have a genuine responsibility to their employees' wellbeing", "mood": "ethical", "task": "Argue that it's both the right thing and the smart thing", "starter": "The cynical argument is that companies care about wellbeing only because unhappy people are less productive. I think that's true but undersells it. A company that only cares about wellbeing instrumentally tends to…", "grammar": ["the cynical argument is true but undersells it", "a company that cares about wellbeing only instrumentally tends to"], "vocabulary": "wellbeing, genuine, instrumental, culture, responsibility, cynical, sustainable, reciprocal"}, {"id": 72, "situation": "You're explaining why you think self-awareness is more valuable than confidence", "mood": "perceptive", "task": "Make the case for knowing your limits over appearing limitless", "starter": "Confidence without self-awareness is just noise with good packaging. What I've found in practice is that the people I most want to work with are not the ones who project the most certainty but the ones who…", "grammar": ["confidence without self-awareness is just noise with good packaging", "the people I most want to work with are not the ones who project certainty"], "vocabulary": "self-awareness, confidence, limit, certainty, aware, calibrate, trustworthy, project"}, {"id": 73, "situation": "You're talking about what bores you and what that tells you about yourself", "mood": "self-aware", "task": "Be honest about what you have no patience for and what that reveals", "starter": "What I have very little tolerance for is… and I used to feel vaguely guilty about that until I realised that intolerance of certain things is actually a signal about what you value, specifically…", "grammar": ["I used to feel vaguely guilty about that until I realised", "intolerance of certain things is actually a signal about what you value"], "vocabulary": "intolerance, signal, value, reveal, impatient, meaning, attention, genuine"}, {"id": 74, "situation": "You're explaining why you've become more cautious about giving unsolicited advice", "mood": "reflective", "task": "Describe what you've learned from times you gave advice that wasn't wanted", "starter": "The thing I've noticed is that when people tell you about a problem, they're not always asking you to solve it. Sometimes they just need to… and by jumping straight to solutions I was actually preventing them from…", "grammar": ["when people tell you about a problem they're not always asking you to solve it", "by jumping straight to solutions I was actually preventing them from"], "vocabulary": "unsolicited, solve, listen, process, advice, premature, witness, space"}, {"id": 75, "situation": "You're discussing what's changed about how you approach conflict since you were younger", "mood": "mature", "task": "Show the contrast honestly without being preachy", "starter": "When I was younger my approach to conflict was basically to either… or… Neither of which ever actually resolved anything. What I've moved towards now is something harder but more useful.", "grammar": ["my approach to conflict was basically to either… or…", "what I've moved towards now is something harder but more useful"], "vocabulary": "conflict, avoid, escalate, mature, approach, resolve, useful, evolve"}, {"id": 76, "situation": "You're talking about the difference between being kind and being nice", "mood": "perceptive", "task": "Make the distinction feel real with examples", "starter": "Niceness is about making the interaction comfortable. Kindness is about what's actually good for the person. They overlap a lot, but there are moments where they diverge sharply — for example when…", "grammar": ["niceness is about making the interaction comfortable", "moments where they diverge sharply"], "vocabulary": "kind, nice, comfortable, honest, diverge, surface, genuine, care"}, {"id": 77, "situation": "You're explaining why you think some people never seem to learn from experience", "mood": "honest", "task": "Diagnose the real obstacle rather than just saying 'they're stubborn'", "starter": "What I've observed is that the obstacle usually isn't stubbornness — it's a kind of narrative protection. People build a story about why things happened that keeps them from being the one who…", "grammar": ["the obstacle usually isn't stubbornness — it's narrative protection", "a story that keeps them from being the one who"], "vocabulary": "narrative, protect, accountability, story, ego, defensive, pattern, learn"}, {"id": 78, "situation": "You're discussing with a partner how you want to handle money differently going forward", "mood": "direct and collaborative", "task": "Have the real conversation rather than the polite one", "starter": "I've been wanting to have this conversation properly for a while and I'd rather have it honestly than keep dancing around it. What I've noticed in our spending is… and what I think we'd both benefit from is…", "grammar": ["I'd rather have it honestly than keep dancing around it", "what I think we'd both benefit from is"], "vocabulary": "finances, honest, pattern, spending, align, values, plan, together"}, {"id": 79, "situation": "You're explaining why you find certain types of networking events exhausting", "mood": "candid", "task": "Go beyond 'I'm an introvert' and describe the specific dynamic", "starter": "The thing that drains me isn't meeting new people — I actually enjoy that. What exhausts me is the specific dynamic at networking events where everyone is simultaneously performing…", "grammar": ["the thing that drains me isn't meeting new people", "the specific dynamic where everyone is simultaneously performing"], "vocabulary": "performative, transactional, genuine, exhaust, dynamic, connection, authentic, mask"}, {"id": 80, "situation": "You're talking about a professional skill you've developed that you're genuinely proud of", "mood": "proud without boasting", "task": "Describe the skill and what it took to build it", "starter": "It took me a long time to develop… and I say that not to sound modest but because understanding why it took so long is actually the most interesting part. The main obstacle was…", "grammar": ["I say that not to sound modest but because", "the main obstacle was"], "vocabulary": "develop, skill, obstacle, long, persist, craft, proud, build"}, {"id": 81, "situation": "You're closing a course discussion about what effective communication really means", "mood": "reflective", "task": "End with a genuine personal insight rather than a summary", "starter": "What I keep coming back to is that communication isn't really about language — it's about the relationship between what you mean and what the other person hears. And the gap between those two things is where almost everything interesting happens.", "grammar": ["communication isn't really about language — it's about the relationship between", "the gap between those two things is where almost everything interesting happens"], "vocabulary": "gap, meaning, hear, relationship, language, understanding, interesting, bridge"}, {"id": 82, "situation": "You're talking about what you've noticed about how you behave differently in different groups", "mood": "self-aware", "task": "Explore code-switching and authenticity honestly", "starter": "I've noticed I'm genuinely different depending on who I'm with — not fake in any of those contexts, but drawing on different parts of myself. What I've started to ask is whether there's one version that feels most…", "grammar": ["genuinely different depending on who I'm with", "whether there's one version that feels most"], "vocabulary": "code-switch, authentic, context, version, adapt, genuine, self, group"}, {"id": 83, "situation": "You're discussing whether career success is mostly talent, mostly hard work, or mostly luck", "mood": "honest", "task": "Give your real assessment with specific reasoning", "starter": "My honest answer is that the weighting changes at different stages. Early on it's mostly… then later it starts to matter more whether… and the thing that most people won't admit out loud is that luck…", "grammar": ["the weighting changes at different stages", "the thing that most people won't admit out loud is that"], "vocabulary": "talent, effort, luck, stage, honest, weighting, admit, privilege"}, {"id": 84, "situation": "You're explaining how you make decisions under pressure", "mood": "practical", "task": "Describe your actual process when time is short and stakes are high", "starter": "When I'm under real pressure, I've noticed my decision-making changes in a predictable way — I lean more heavily on… and I'm more likely to… What I've learned to counteract that tendency is…", "grammar": ["my decision-making changes in a predictable way", "what I've learned to counteract that tendency is"], "vocabulary": "pressure, process, tendency, counteract, heuristic, default, reliable, stakes"}, {"id": 85, "situation": "You're talking about what kind of criticism you find genuinely useful", "mood": "discerning", "task": "Go beyond 'feedback should be specific' to what actually works for you", "starter": "I've had lots of feedback in my life and most of it has been useless — not because it was wrong, but because of the way it was delivered or the moment it was given. What's actually landed is feedback that…", "grammar": ["most of it has been useless not because it was wrong but because", "feedback that's actually landed is feedback that"], "vocabulary": "useful, delivery, timing, specific, land, actionable, context, useful"}, {"id": 86, "situation": "You're debating whether being too self-aware can actually hold you back", "mood": "balanced", "task": "Make a case for the limits of introspection", "starter": "There's a version of self-awareness that becomes paralysing — you understand yourself so well that you can predict exactly how you'll fail and so you… The people I know who take the most risks tend to be the ones who are…", "grammar": ["a version of self-awareness that becomes paralysing", "the people who take the most risks tend to be"], "vocabulary": "introspection, paralysis, risk, overthink, analyse, action, confidence, knowing"}, {"id": 87, "situation": "You're explaining why you think most meetings could be emails", "mood": "direct", "task": "Argue the case for asynchronous communication with specific examples", "starter": "The average meeting is solving the wrong problem. The problem it's solving is coordination. The problem it's creating is… and what I think would serve most of those conversations much better is…", "grammar": ["the average meeting is solving the wrong problem", "what would serve those conversations much better is"], "vocabulary": "asynchronous, synchronous, coordination, interrupt, agenda, default, communicate"}, {"id": 88, "situation": "You're talking about how your relationship with failure has affected your willingness to try new things", "mood": "reflective", "task": "Be specific about the correlation between past failure and present risk-taking", "starter": "I've noticed a pattern in myself: the failures that made me more willing to try new things are the ones where… whereas the ones that made me more cautious were the ones where I felt…", "grammar": ["the failures that made me more willing are the ones where", "the ones that made me more cautious were where I felt"], "vocabulary": "pattern, cautious, willing, risk, failure, shame, learning, subsequent"}, {"id": 89, "situation": "You're discussing with a friend whether honesty always serves relationships or sometimes damages them", "mood": "nuanced", "task": "Explore when honesty is helpful and when it's more about the speaker than the listener", "starter": "There's a version of honesty that's genuinely in service of the relationship — you tell someone a hard thing because you want good things for them. And then there's a version that's more about…", "grammar": ["there's a version in service of the relationship and a version that's more about", "you tell someone a hard thing because you want good things for them"], "vocabulary": "radical honesty, compassion, timing, kind, brutal, serve, relationship, motive"}, {"id": 90, "situation": "You're explaining what's changed about the way you communicate since working remotely", "mood": "observant", "task": "Be specific about what you've had to consciously develop", "starter": "The biggest shift has been realising how much of communication I used to outsource to being physically present. When that went away I had to become much more deliberate about… and much more explicit about…", "grammar": ["how much of communication I used to outsource to being physically present", "I had to become much more deliberate about"], "vocabulary": "deliberate, explicit, asynchronous, tone, presence, written, compensate, remote"}, {"id": 91, "situation": "You're talking about a professional relationship that was difficult and what you learnt from it", "mood": "honest", "task": "Go beyond 'it was a difficult personality' and diagnose what actually happened", "starter": "I've had a few working relationships that didn't work, and the most useful thing I've ever done with that is to ask not what was wrong with them but what I contributed. In this case…", "grammar": ["the most useful thing is to ask not what was wrong with them but what I contributed", "in this case"], "vocabulary": "dynamics, contributed, honest, reflect, pattern, complement, diagnose, relationship"}, {"id": 92, "situation": "You're discussing whether gratitude is something you practice or something you feel", "mood": "personal", "task": "Share your genuine relationship with gratitude — whatever it is", "starter": "I'm a bit ambivalent about the way gratitude gets talked about, mostly because it can easily become… But when I strip away the performance of it there's something real there, which is…", "grammar": ["I'm a bit ambivalent about the way gratitude gets talked about", "when I strip away the performance there's something real"], "vocabulary": "gratitude, performance, genuine, practice, ambivalent, authentic, feel, cultivate"}, {"id": 93, "situation": "You're explaining why you've changed how you give advice to friends", "mood": "evolved", "task": "Describe what you do differently now and why", "starter": "My old approach was to give the answer I thought was right as clearly as possible. What I've moved to is something more like asking questions until the person gets to the answer themselves, because what I've realised is…", "grammar": ["my old approach was to give the answer as clearly as possible", "what I've realised is"], "vocabulary": "approach, question, answer, guide, impose, arrive, understand, realise"}, {"id": 94, "situation": "You're talking about the relationship between patience and ambition", "mood": "philosophical but grounded", "task": "Explore how you hold both without sacrificing one for the other", "starter": "For a long time I thought patience and ambition were in tension with each other — that you had to choose. What I've come to think is that the tension is real but it's productive if you're clear about…", "grammar": ["I thought patience and ambition were in tension — that you had to choose", "the tension is real but it's productive if you're clear about"], "vocabulary": "tension, productive, ambition, patience, balance, timeline, urgent, direction"}, {"id": 95, "situation": "You're discussing what you'd need to feel ready to take a major leap in your career", "mood": "honest", "task": "Identify what's actually holding you back versus what would genuinely prepare you", "starter": "There's a version of 'not feeling ready' that is actually legitimate preparation, and a version that's fear in disguise. What I'm still working out is which one applies to me right now, because when I'm honest…", "grammar": ["a version of not feeling ready that's legitimate and a version that's fear in disguise", "when I'm honest"], "vocabulary": "ready, legitimate, fear, disguise, preparation, leap, honest, clarity"}, {"id": 96, "situation": "You're talking about what you've learnt about saying no to good opportunities", "mood": "mature", "task": "Explain why saying no to good things is actually harder than saying no to bad ones", "starter": "Saying no to bad opportunities is easy. The hard ones are the genuinely good opportunities that just aren't right for this particular moment. The reason they're hard is that you have to trust that…", "grammar": ["saying no to bad opportunities is easy", "you have to trust that"], "vocabulary": "opportunity cost, timing, priority, trust, scarcity, abundance, focus, right time"}, {"id": 97, "situation": "You're explaining how you've navigated a significant professional setback", "mood": "resilient", "task": "Tell the story without either dramatising or minimising it", "starter": "The setback changed what I thought my professional identity was. And that was genuinely difficult for a while — not because of the practical consequences but because… What helped me through it was not…", "grammar": ["it changed what I thought my professional identity was", "what helped me through it was not"], "vocabulary": "identity, setback, practical, narrative, reframe, difficult, process, rebuild"}, {"id": 98, "situation": "You're discussing whether your values have changed as you've gotten older or stayed the same", "mood": "reflective", "task": "Be specific and honest — some values shift, some don't", "starter": "What's surprised me most is that the core hasn't changed as much as I expected — the things that felt important at twenty still feel important now. What has shifted is… and what I've quietly let go of is…", "grammar": ["the core hasn't changed as much as I expected", "what has shifted is… and what I've quietly let go of is"], "vocabulary": "core, peripheral, shift, evolve, let go, quietly, priority, values"}, {"id": 99, "situation": "You're talking about what you wish your organisation did differently to support its people", "mood": "direct", "task": "Be constructive but honest about what's actually missing", "starter": "The things that would make the most difference aren't the expensive ones. What I notice people actually need more of is… and what the organisation could stop doing that would help is…", "grammar": ["the things that would make the most difference aren't expensive", "what the organisation could stop doing that would help is"], "vocabulary": "support, culture, expensive, simple, stop, start, notice, people"}, {"id": 100, "situation": "You close with a reflection on what this experience of speaking about real topics has taught you", "mood": "warm and genuine", "task": "End with something you've actually noticed about yourself through the conversations", "starter": "What's stayed with me from these conversations isn't any single topic — it's the realisation that speaking a language well means being willing to say something that matters, not just something that's grammatically correct.", "grammar": ["what's stayed with me isn't any single topic", "speaking a language well means being willing to say something that matters"], "vocabulary": "realisation, matters, willing, honest, express, beyond grammar, voice, connect"}],
    C1: [{"id": 1, "situation": "You're discussing how social media has changed the way people form relationships", "mood": "reflective", "task": "Analyse both the gains and losses in human connection", "starter": "What strikes me most is that we now have more connections than ever, yet many people report feeling more isolated. I think the reason is…", "grammar": ["what strikes me most is that", "yet + contrasting clause"], "vocabulary": "shallow, meaningful, curated, authentic, parasocial, disconnect, validation"}, {"id": 2, "situation": "You explain to a friend why you decided to change careers mid-life", "mood": "honest and self-aware", "task": "Describe the decision process and what you learnt about yourself", "starter": "It wasn't one single moment but a gradual realisation that… The hardest part was letting go of… what I've discovered about myself is…", "grammar": ["it wasn't… but a gradual", "the hardest part was + gerund"], "vocabulary": "identity, redefine, risk, security, purpose, courage, fulfilment"}, {"id": 3, "situation": "You're in a group discussion about whether cities are making us lonelier", "mood": "thoughtful", "task": "Make a nuanced argument that goes beyond the obvious", "starter": "Urban density actually creates the paradox of… You're surrounded by people and yet… I'd argue the real issue isn't the city itself, but…", "grammar": ["creates the paradox of", "I'd argue the real issue isn't… but"], "vocabulary": "anonymity, community, belonging, density, proximity, disconnect, third place"}, {"id": 4, "situation": "You describe how your relationship with your parents has evolved as you've become an adult", "mood": "intimate", "task": "Reflect on the shifting dynamic with honesty", "starter": "What's changed most is that I've started to see them as… rather than just… There are things I understand now that I couldn't have at twenty.", "grammar": ["I've started to see them as… rather than", "there are things I understand now that"], "vocabulary": "dynamic, role reversal, perspective, expectations, gratitude, complexity, adult"}, {"id": 5, "situation": "You discuss how advertising shapes our desires without us realising", "mood": "critical", "task": "Explain the mechanisms and give personal examples", "starter": "The most effective ads don't tell you to buy something — they make you feel that without it, you're somehow… I've noticed this in myself when…", "grammar": ["don't… they make you feel that", "I've noticed this in myself when"], "vocabulary": "aspirational, subliminal, identity, insecurity, brand, desire, manufacture"}, {"id": 6, "situation": "You talk about why people stay in jobs they hate", "mood": "psychological", "task": "Explore the mix of fear, comfort and identity", "starter": "It's rarely just about money. People stay because… and because their sense of who they are has become entangled with… The real cost is…", "grammar": ["it's rarely just about", "their sense of who they are has become entangled with"], "vocabulary": "sunk cost, identity, inertia, comfort zone, self-worth, trapped, courage"}, {"id": 7, "situation": "You explain why you think remote work has changed people's relationship with time", "mood": "observant", "task": "Describe the psychological shift in how we experience the workday", "starter": "Without the physical commute as a ritual boundary, work and life start to bleed into each other. I've found that I… and that the absence of…", "grammar": ["without + noun phrase as a boundary", "start to bleed into each other"], "vocabulary": "boundary, ritual, structure, presence, burnout, flexibility, discipline"}, {"id": 8, "situation": "You're asked whether you think people are fundamentally good or not", "mood": "philosophical but grounded", "task": "Give your view based on observation not theory", "starter": "I used to think it was a simple question, but the more I observe people, the more I think it depends on… what I do believe is that most people…", "grammar": ["the more I observe, the more I think", "what I do believe is that"], "vocabulary": "context, circumstances, empathy, self-interest, conditioning, environment, nature"}, {"id": 9, "situation": "You describe the pressure you feel to constantly be productive", "mood": "honest", "task": "Talk about hustle culture and its effect on you personally", "starter": "There's this constant background noise in my head that if I'm resting, I should be doing something. I think it comes from… and the result is…", "grammar": ["if I'm resting, I should be", "I think it comes from + noun phrase"], "vocabulary": "hustle culture, guilt, productivity, rest, worth, output, enough, burnout"}, {"id": 10, "situation": "You explain why you think empathy is harder than it sounds", "mood": "insightful", "task": "Go beyond the cliché and describe what gets in the way", "starter": "We talk about empathy as if it's just a decision, but in practice… The moments I've found it hardest are when… because then my own…", "grammar": ["as if it's just a decision", "the moments I've found it hardest are when"], "vocabulary": "projection, discomfort, bias, judgment, listen, effort, assumption, bridge"}, {"id": 11, "situation": "You discuss whether your hometown shaped who you are", "mood": "nostalgic and analytical", "task": "Explore the invisible influence of where you grew up", "starter": "I didn't realise how much it shaped me until I left. The values I took for granted, like… I now see were very specific to where I grew up.", "grammar": ["I didn't realise how much until I", "the values I took for granted, like…"], "vocabulary": "upbringing, shaped, invisible, norm, culture, departure, rediscover, roots"}, {"id": 12, "situation": "You're in a conversation about whether honesty is always the right choice", "mood": "nuanced", "task": "Give examples where the answer isn't simple", "starter": "I think absolute honesty is a kind of privilege — you can afford it when the stakes are low. But when… then the question becomes not whether to be honest, but…", "grammar": ["a kind of privilege", "the question becomes not whether to… but"], "vocabulary": "radical honesty, kindness, timing, context, compassion, white lie, consequence"}, {"id": 13, "situation": "You describe what it felt like to fail at something you cared deeply about", "mood": "vulnerable", "task": "Be specific and reflect on what it taught you", "starter": "The strange thing about that failure was that it didn't just hurt my pride — it made me question… And the process of rebuilding after was…", "grammar": ["it didn't just… it made me question", "the process of rebuilding after was"], "vocabulary": "identity, resilience, rethink, setback, perspective, pride, fragile, growth"}, {"id": 14, "situation": "You explain how the language you use shapes how you think", "mood": "curious", "task": "Give concrete examples from your own experience", "starter": "I've noticed that some thoughts are easier to have in one language than another. In English I find it easier to… whereas in my mother tongue…", "grammar": ["I've noticed that", "whereas in + language"], "vocabulary": "cognition, frame, untranslatable, expression, nuance, worldview, precision"}, {"id": 15, "situation": "You discuss why trust is so difficult to rebuild once broken", "mood": "reflective", "task": "Explore the psychology of trust and betrayal", "starter": "Once you've seen that someone is capable of a certain thing, you can't unsee it. You might forgive, but forgiveness and trust are not the same thing.", "grammar": ["once you've seen… you can't unsee", "forgiveness and trust are not the same thing"], "vocabulary": "betrayal, vulnerability, repair, suspicion, vigilance, wound, conditional"}, {"id": 16, "situation": "You talk about the difference between being alone and being lonely", "mood": "introspective", "task": "Make the distinction with personal examples", "starter": "Solitude can be deeply nourishing — it's chosen and purposeful. Loneliness feels like hunger: it's the ache of wanting connection and not having it.", "grammar": ["solitude can be deeply nourishing", "the ache of wanting connection and not having it"], "vocabulary": "solitude, loneliness, chosen, involuntary, self-sufficient, need, presence"}, {"id": 17, "situation": "You explain why you think boredom has become underrated", "mood": "counterintuitive", "task": "Argue that boredom has value most people miss", "starter": "We've engineered boredom almost entirely out of our lives and I think we've lost something important. When I was a child… it was in those idle moments that…", "grammar": ["we've engineered… out of our lives", "it was in those idle moments that"], "vocabulary": "creativity, daydream, idle, stimulation, restless, space, innovation, attention"}, {"id": 18, "situation": "You describe how grief changes you in ways you didn't expect", "mood": "honest", "task": "Talk about the unexpected dimensions of losing someone", "starter": "Everyone tells you it gets easier with time, and in some ways it does. But what nobody mentions is that… I've found myself…", "grammar": ["in some ways it does, but", "nobody mentions that"], "vocabulary": "absence, carry, reshape, unexpected, grief, process, presence, integrate"}, {"id": 19, "situation": "You explain what you think makes a truly good conversation", "mood": "enthusiastic", "task": "Go beyond the obvious and describe the conditions needed", "starter": "The best conversations I've had always have one thing in common: nobody is performing. Both people are actually thinking out loud, and…", "grammar": ["one thing in common: nobody is performing", "actually thinking out loud"], "vocabulary": "presence, curiosity, vulnerability, reciprocal, listening, tangent, surprise, genuine"}, {"id": 20, "situation": "You talk about why people find it hard to change their minds", "mood": "psychological", "task": "Explore the cognitive and emotional reasons behind stubbornness", "starter": "Changing your mind requires admitting that you were wrong — and for most people that doesn't just feel intellectually uncomfortable, it feels like a kind of…", "grammar": ["changing your mind requires + gerund", "it doesn't just feel… it feels like a kind of"], "vocabulary": "identity, ego, cognitive dissonance, vulnerability, commitment, narrative, defensive"}, {"id": 21, "situation": "You discuss what you've learnt about yourself from travelling", "mood": "reflective", "task": "Be specific about the self-discoveries", "starter": "What travel strips away are all the familiar structures you rely on to know who you are. Without your usual context, you discover that you…", "grammar": ["what travel strips away are", "without your usual context"], "vocabulary": "context, identity, discomfort, resourceful, assumptions, perspective, strip"}, {"id": 22, "situation": "You describe how your definition of success has shifted over time", "mood": "mature", "task": "Show the evolution of what you value", "starter": "When I was younger, success meant… Now I realise that was mostly about what other people could see. What I actually care about now is…", "grammar": ["when I was younger, success meant", "what I actually care about now is"], "vocabulary": "redefine, external, internal, validation, meaning, enough, fulfilment, shift"}, {"id": 23, "situation": "You explain what it means to feel culturally in-between two worlds", "mood": "personal", "task": "Describe the experience of belonging to two cultures", "starter": "There's a strange freedom in being between two cultures — you see each one from the outside. But the price is that you sometimes feel you don't fully belong to…", "grammar": ["a strange freedom in being between", "the price is that you sometimes feel"], "vocabulary": "belonging, hybrid, third culture, outsider, insider, code-switch, identity"}, {"id": 24, "situation": "You discuss whether social comparison is ever useful", "mood": "analytical", "task": "Distinguish between inspiring and toxic comparison", "starter": "Not all comparison is the same. There's a kind of comparison that motivates — where the other person's success makes you feel like yours is possible. But then there's the kind that…", "grammar": ["not all comparison is the same", "there's a kind that… but then there's the kind that"], "vocabulary": "benchmark, aspiration, envy, spiral, motivate, social media, upward comparison"}, {"id": 25, "situation": "You explain why you think silence is one of the most underused communication tools", "mood": "confident", "task": "Describe how you've learnt to use silence intentionally", "starter": "Most people rush to fill silence because it feels like failure. But I've learnt that in a difficult conversation, a pause can do more than any word, because…", "grammar": ["most people rush to fill silence because", "a pause can do more than any word because"], "vocabulary": "intentional, discomfort, weight, pause, presence, reflective, expectation"}, {"id": 26, "situation": "You describe a moment when you completely misjudged someone", "mood": "humble", "task": "Narrate the story and what it taught you", "starter": "I had formed a very clear opinion of them based on almost nothing — just first impressions and assumptions. When I finally got to know them properly, I realised…", "grammar": ["I had formed a very clear opinion based on", "when I finally got to know them properly"], "vocabulary": "assumption, judgment, first impression, bias, complexity, reconsider, humility"}, {"id": 27, "situation": "You talk about the role of ritual in everyday life", "mood": "reflective", "task": "Explain why rituals matter more than we realise", "starter": "I used to dismiss rituals as superstition or habit. Now I think they serve a deeper purpose: they create anchors in the day, moments that signal to your brain that…", "grammar": ["I used to dismiss… as", "they create anchors in the day"], "vocabulary": "anchor, transition, meaning, stability, ceremony, ordinary, mark, intention"}, {"id": 28, "situation": "You explain how you deal with uncertainty about the future", "mood": "honest", "task": "Share your personal strategies and what you've accepted", "starter": "I used to spend enormous energy trying to control what I couldn't. What's helped is learning to distinguish between… what I can influence and what…", "grammar": ["trying to control what I couldn't", "distinguishing between what I can influence and what"], "vocabulary": "uncertainty, control, anxiety, tolerance, present, acceptance, plan, adapt"}, {"id": 29, "situation": "You discuss how childhood experiences shape adult fears", "mood": "insightful", "task": "Connect something from your own past to a present behaviour", "starter": "I've traced a lot of my instinctive reactions back to very specific moments in childhood. For example, my tendency to… I think comes from the time when…", "grammar": ["I've traced a lot of my… back to", "my tendency to… I think comes from"], "vocabulary": "formative, pattern, trigger, trace, instinct, wound, narrative, unconscious"}, {"id": 30, "situation": "You explain what you've learnt from a long friendship", "mood": "warm", "task": "Reflect on what makes a friendship last", "starter": "Long friendships teach you things that short ones can't. You see each other across many different versions of yourselves, and what you discover is…", "grammar": ["long friendships teach you things that short ones can't", "across many different versions of yourselves"], "vocabulary": "witness, evolve, acceptance, forgiveness, shared, history, repair, continuity"}, {"id": 31, "situation": "You talk about the gap between who you are online and who you are in real life", "mood": "honest", "task": "Explore the performance of identity on social media", "starter": "I've become aware of the version of myself I present online — it's not false exactly, but it's curated. The question I keep asking is whether the gap between…", "grammar": ["it's not false exactly, but it's curated", "the question I keep asking is whether"], "vocabulary": "curate, authentic, performance, filter, identity, digital, gap, presentation"}, {"id": 32, "situation": "You discuss why people struggle to ask for help", "mood": "psychological", "task": "Explore the pride, fear and cultural factors involved", "starter": "Asking for help is harder than it sounds because it requires admitting a kind of vulnerability that most of us have been trained to hide. The barrier isn't…", "grammar": ["it requires admitting a kind of vulnerability", "the barrier isn't + noun"], "vocabulary": "vulnerability, pride, independence, strength, shame, culture, burden, reciprocal"}, {"id": 33, "situation": "You describe what it means to have a sense of home that isn't tied to a place", "mood": "personal", "task": "Talk about what home feels like for you", "starter": "Home for me stopped being a specific address a long time ago. What I look for now is a combination of… and a feeling that…", "grammar": ["home for me stopped being", "what I look for now is a combination of"], "vocabulary": "belonging, atmosphere, safety, familiarity, people, anchor, portable, created"}, {"id": 34, "situation": "You explain why humour is one of the most complex forms of intelligence", "mood": "enthusiastic", "task": "Give examples and explore what makes something genuinely funny", "starter": "What makes humour so fascinating is that it requires you to hold two contradictory ideas at once. The funniest moments are when… and when you realise that…", "grammar": ["it requires you to hold two contradictory ideas", "the funniest moments are when"], "vocabulary": "wit, timing, subvert, expectation, absurd, shared, context, intelligence"}, {"id": 35, "situation": "You talk about the ethics of sharing personal stories of people you know", "mood": "thoughtful", "task": "Explore where the line is between storytelling and betrayal", "starter": "Every story involves other people, and those people didn't necessarily consent to being characters in your narrative. I think about this when…", "grammar": ["those people didn't necessarily consent to", "I think about this when"], "vocabulary": "consent, narrative, privacy, ownership, memoir, characterise, permission, trust"}, {"id": 36, "situation": "You describe what happens to your identity when you speak a different language", "mood": "curious", "task": "Reflect on how you shift depending on the language", "starter": "I've noticed that I'm slightly different person in each language I speak. Not fake in either, but… In my second language I tend to be…", "grammar": ["I'm a slightly different person in each language", "in my second language I tend to be"], "vocabulary": "code-switch, register, personality, fluency, self-expression, inhabit, freedom"}, {"id": 37, "situation": "You discuss what makes creative work feel meaningful", "mood": "passionate", "task": "Explore the conditions that make creativity fulfilling", "starter": "The work that's meant the most to me has always had something in common: it scared me a little. Not the fear of failure but the fear of… which is somehow more exposing.", "grammar": ["the work that's meant the most to me has always", "not the fear of failure but the fear of"], "vocabulary": "meaningful, risk, expression, vulnerability, craft, voice, process, stakes"}, {"id": 38, "situation": "You explain why you think the way we talk about mental health still has a long way to go", "mood": "committed", "task": "Go beyond awareness and explore what's still missing", "starter": "We've gotten much better at talking about mental health in general terms. But there's a difference between saying 'it's okay not to be okay' and actually… which is where I think…", "grammar": ["there's a difference between… and actually", "which is where I think"], "vocabulary": "normalise, access, nuance, stigma, structural, performative, real, conversation"}, {"id": 39, "situation": "You talk about what it means to take responsibility for something you've done", "mood": "mature", "task": "Explore the difference between guilt and genuine accountability", "starter": "Genuine accountability isn't just saying sorry — it's actually understanding the impact of what you did, even when you didn't intend it. The hardest part is…", "grammar": ["genuine accountability isn't just saying sorry — it's", "even when you didn't intend it"], "vocabulary": "impact, intention, repair, consequence, ownership, guilt, shame, change"}, {"id": 40, "situation": "You describe how you've changed your opinion on a topic you felt strongly about", "mood": "humble", "task": "Narrate the process of changing your mind", "starter": "What changed my mind wasn't an argument — it was a relationship. Getting to know someone who… made me realise that my previous position was based on…", "grammar": ["what changed my mind wasn't… it was", "made me realise that my previous position was based on"], "vocabulary": "shift, update, perspective, exposure, narrative, prior belief, evolve"}, {"id": 41, "situation": "You explain what you think is the hardest part of being truly honest with yourself", "mood": "introspective", "task": "Go deeper than the obvious answer", "starter": "The hardest thing isn't admitting the big obvious failures — it's the small comfortable stories we tell ourselves. The ones like… where you say you couldn't when really…", "grammar": ["the hardest thing isn't… it's the small", "where you say you couldn't when really"], "vocabulary": "self-deception, rationalise, comfortable narrative, blind spot, honest, pattern, see"}, {"id": 42, "situation": "You discuss whether technology is making us better or worse at dealing with discomfort", "mood": "critical", "task": "Argue a position with specific examples", "starter": "Every time I feel slightly bored or uncomfortable, there's a device in my hand that can make it stop. What worries me is that we're losing the capacity to…", "grammar": ["every time I feel… there's", "what worries me is that we're losing the capacity to"], "vocabulary": "tolerance, friction, discomfort, avoidance, attention, resilience, scroll, instant"}, {"id": 43, "situation": "You describe a moment when someone's kindness completely changed your day", "mood": "warm", "task": "Narrate the story and reflect on what it showed you", "starter": "It was such a small thing — they probably didn't even think about it. But the effect it had on me was disproportionate, because at that point in my day I was…", "grammar": ["it was such a small thing that", "the effect it had was disproportionate because"], "vocabulary": "kindness, ripple, notice, stranger, proportionate, impact, remind, connection"}, {"id": 44, "situation": "You talk about how ageing changes your relationship with time", "mood": "philosophical but personal", "task": "Reflect on how time feels different at different stages of life", "starter": "When I was younger, time felt infinite — something to fill. Now there's a strange sharpening of attention. I notice things I used to rush past, and I've stopped…", "grammar": ["time felt infinite — something to fill", "a strange sharpening of attention"], "vocabulary": "finite, prioritise, slow, notice, rush, savour, urgency, perspective"}, {"id": 45, "situation": "You explain what it takes to have a difficult conversation well", "mood": "practical", "task": "Describe the conditions and approach needed", "starter": "A difficult conversation goes wrong when either person comes in wanting to win rather than to understand. What I've learnt is to first… and not to go in until…", "grammar": ["wanting to win rather than to understand", "not to go in until"], "vocabulary": "intention, outcome, listen, defensiveness, timing, prepare, honest, resolution"}, {"id": 46, "situation": "You discuss whether our childhood selves would recognise who we've become", "mood": "imaginative", "task": "Reflect honestly on continuity and change", "starter": "There are parts of me my eight-year-old self would absolutely recognise — the curiosity, the particular things I find funny. But there are other parts that would confuse…", "grammar": ["there are parts that would absolutely recognise", "but there are other parts that would"], "vocabulary": "continuity, core, drift, become, recognise, values, wonder, compromise"}, {"id": 47, "situation": "You describe the moment you realised you'd been wrong about something for years", "mood": "honest", "task": "Narrate the discovery and the feeling that followed", "starter": "The strange thing about realising you've been wrong for years isn't the wrongness itself — it's the retroactive rewriting of everything you thought you knew. Suddenly all the times I…", "grammar": ["the strange thing about realising is not… it's", "the retroactive rewriting of everything you thought you knew"], "vocabulary": "rethink, update, retroactive, disorientation, humility, adjust, narrative"}, {"id": 48, "situation": "You talk about what it means to belong to a generation", "mood": "sociological but personal", "task": "Explore shared generational experience with nuance", "starter": "I'm suspicious of generational labels, but there are things that genuinely shaped people born around the same time as me — not in the same way for everyone, but…", "grammar": ["I'm suspicious of… but there are things that genuinely", "not in the same way for everyone, but"], "vocabulary": "generational, collective, formative, zeitgeist, cohort, shared, shaped, nuance"}, {"id": 49, "situation": "You explain how you navigate the gap between your values and your actions", "mood": "honest", "task": "Describe a real tension you live with", "starter": "I believe strongly in… but I don't always act as if I do. I think that gap exists because… and because changing behaviour is harder than changing beliefs.", "grammar": ["I believe strongly in… but I don't always", "changing behaviour is harder than changing beliefs"], "vocabulary": "value, act, gap, intention, habit, hypocrisy, friction, consistent
