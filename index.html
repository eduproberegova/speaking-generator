elp, ask, questions"}, {"id": 100, "situation": "A friend seems upset", "mood": "caring", "task": "Ask what's wrong and offer help", "starter": "What's wrong? Are you OK? I can help if you'd like.", "grammar": ["what's wrong?", "I can help if"], "vocabulary": "problem, sad, worried, help, talk, listen, friend"}],
    A2: [{"id": 1, "situation": "You're planning a weekend trip with a friend", "mood": "excited", "task": "Suggest activities and places to visit", "starter": "We could go to… or visit… What do you think?", "grammar": ["we could + verb (conditional)", "what do you think?"], "vocabulary": "trip, destination, sightseeing, accommodation, budget, transport, book"}, {"id": 2, "situation": "You've just come back from your first holiday abroad", "mood": "nostalgic and happy", "task": "Tell a friend what you did", "starter": "It was amazing! On the first day we went to… and then we visited…", "grammar": ["past simple narrative", "it was + adjective"], "vocabulary": "holiday, sight, beach, mountain, experience, unforgettable, memory"}, {"id": 3, "situation": "You have a job interview for a waiter position", "mood": "nervous but prepared", "task": "Talk about your experience and skills", "starter": "I've worked as a… for… and I'm punctual and reliable.", "grammar": ["present perfect for experience", "I'm + adjective"], "vocabulary": "experience, reliable, punctual, teamwork, customer service, flexible"}, {"id": 4, "situation": "You're comparing two flats to rent", "mood": "analytical", "task": "Describe the differences between them", "starter": "The first one is bigger but the second is more central. Although it's more expensive, I prefer…", "grammar": ["comparatives", "although + concession"], "vocabulary": "rent, location, size, furnished, floor, central, quiet, cheaper"}, {"id": 5, "situation": "A tourist asks you for directions", "mood": "helpful", "task": "Give detailed directions", "starter": "Go straight on, then turn left at the traffic lights and…", "grammar": ["imperatives for directions", "prepositions of direction"], "vocabulary": "straight on, traffic lights, turn, left, right, junction, minutes, on foot"}, {"id": 6, "situation": "You're at dinner with English friends talking about food", "mood": "sociable", "task": "Explain your food preferences and ask about theirs", "starter": "I love… especially when it's… What about you?", "grammar": ["I love + noun", "especially when it's + adjective"], "vocabulary": "taste, spicy, mild, vegetarian, dish, flavour, side dish, speciality"}, {"id": 7, "situation": "You've just moved to a new city and compare it with your old one", "mood": "reflective", "task": "Describe differences between the two cities", "starter": "Here everything is much quieter than in… Before I had… nearby, but now…", "grammar": ["comparatives", "before + past / now + present"], "vocabulary": "quiet, loud, central, traffic, neighbourhood, get used to, miss"}, {"id": 8, "situation": "You're at a birthday dinner and give a short speech", "mood": "warm and emotional", "task": "Congratulate and express your wishes", "starter": "I'd like to say a few words. You're a wonderful person and I wish you…", "grammar": ["I'd like to say", "I wish you + noun"], "vocabulary": "wish, friendship, wonderful, celebrate, happiness, future, toast, cheers"}, {"id": 9, "situation": "You phone a hotel to make a reservation", "mood": "formal", "task": "Confirm availability, price and facilities", "starter": "Good morning, I'd like to book a double room for… nights, from… to…", "grammar": ["I'd like to book", "from… to… for dates"], "vocabulary": "room, available, nights, breakfast, check-in, rate, confirm, cancel"}, {"id": 10, "situation": "You run into an old school friend", "mood": "surprised and nostalgic", "task": "Catch up on news", "starter": "I can't believe it! How long has it been? What have you been up to?", "grammar": ["present perfect for recent past", "have you been + gerund?"], "vocabulary": "married, move, job, children, studies, change, remember, before"}, {"id": 11, "situation": "You're watching a football match with friends", "mood": "excited", "task": "Comment on the game in real time", "starter": "He's running towards the goal! He's just scored!", "grammar": ["present continuous for ongoing action", "just + present perfect"], "vocabulary": "goal, goalkeeper, referee, foul, penalty, team, score, lose, win"}, {"id": 12, "situation": "Your friend has a problem and you want to help", "mood": "empathetic", "task": "Listen and suggest solutions", "starter": "I understand how you feel. If I were you, I would… You could also…", "grammar": ["if I were you + conditional", "you could also + verb"], "vocabulary": "problem, solution, talk, think, calm, decision, options"}, {"id": 13, "situation": "You've read an interesting news story and tell your friend", "mood": "informed", "task": "Summarise the news and share your opinion", "starter": "I just read that… According to the article… I think that's…", "grammar": ["present perfect: I've just read", "according to + source"], "vocabulary": "news, article, event, opinion, important, surprising, comment"}, {"id": 14, "situation": "You're at the doctor with lower back pain", "mood": "worried", "task": "Describe your symptoms in detail", "starter": "I've had lower back pain for three days. It's worse when I… At night…", "grammar": ["for + time period (duration)", "it's worse when + clause"], "vocabulary": "back, muscle, inflammation, painkiller, rest, physiotherapy, symptom"}, {"id": 15, "situation": "You follow a recipe and explain the steps to a friend", "mood": "focused", "task": "Explain the steps in order", "starter": "First you need to… Then add… Once it's ready…", "grammar": ["sequencers: first, then, once", "you need to + verb"], "vocabulary": "chop, fry, add, mix, boil, taste, salt, oil, temperature, serve"}, {"id": 16, "situation": "You want to return a faulty jacket to a shop", "mood": "firm but polite", "task": "Explain the problem and request an exchange", "starter": "I bought this jacket… ago but there's a fault with… Is it possible to exchange it?", "grammar": ["I bought + time ago (past simple)", "is it possible to + verb?"], "vocabulary": "fault, seam, zip, exchange, refund, receipt, quality, defective"}, {"id": 17, "situation": "Your flatmate asks why you came home so late", "mood": "relaxed and storytelling", "task": "Explain what happened", "starter": "The thing is, I had arranged to meet… and in the end… When I got home it was already…", "grammar": ["past simple narrative", "when I got home (past simple)"], "vocabulary": "arrange, meet, end up, late, explain, traffic, unexpected"}, {"id": 18, "situation": "You're at a travel agency asking about destinations", "mood": "excited", "task": "Ask about best time to visit and activities", "starter": "I'm thinking of going to… When's the best time? What can you do there?", "grammar": ["I'm thinking of going to + place", "when's the best time?"], "vocabulary": "season, climate, activities, culture, accommodation, direct flight"}, {"id": 19, "situation": "You're looking for a flat and phone the landlord", "mood": "curious but cautious", "task": "Ask about rental terms", "starter": "I'm calling about the flat I saw online. Is the deposit included…? Are pets allowed?", "grammar": ["I'm calling about + noun", "are pets allowed?"], "vocabulary": "deposit, monthly rent, bills, pets, notice period, contract, renovated"}, {"id": 20, "situation": "You chair a work meeting with an idea to present", "mood": "professional", "task": "Present your idea and invite discussion", "starter": "I'd like to share an idea with you today. The idea is to… What do you think?", "grammar": ["I'd like to share + noun", "what do you think?"], "vocabulary": "idea, advantage, cost, implement, feedback, deadline, goal"}, {"id": 21, "situation": "You discuss a historical event in class", "mood": "interested", "task": "Explain causes and consequences", "starter": "This event happened because… As a result… It had an important influence on…", "grammar": ["past simple for history", "as a result of"], "vocabulary": "war, revolution, consequence, cause, century, history, influence"}, {"id": 22, "situation": "You witnessed a small accident in the street", "mood": "slightly shaken", "task": "Tell someone what you saw", "starter": "I was walking down the street when suddenly… The car was going really fast and…", "grammar": ["past continuous + past simple", "when suddenly"], "vocabulary": "accident, car, traffic light, injured, ambulance, police, witness, speed"}, {"id": 23, "situation": "You're in a class debate about social media", "mood": "reflective", "task": "Express your opinion on pros and cons", "starter": "On one hand, social media lets you… On the other hand, it can also be…", "grammar": ["on one hand… on the other hand", "can + verb"], "vocabulary": "addiction, communication, privacy, influencer, time, youth, benefit, risk"}, {"id": 24, "situation": "You recommend a friend a book you loved", "mood": "enthusiastic", "task": "Describe the book and explain why it's worth reading", "starter": "I'd really recommend… It's a novel about… and the thing I liked most was…", "grammar": ["I'd really recommend + noun", "the thing I liked most was"], "vocabulary": "protagonist, plot, ending, gripping, character, author, genre, page"}, {"id": 25, "situation": "You're on a cultural exchange and describe what surprised you", "mood": "open and reflective", "task": "Say what surprised you most about the culture", "starter": "What surprised me most was that people here… I also found it interesting that…", "grammar": ["what surprised me most was + clause", "I found it + adjective + that"], "vocabulary": "culture, surprise, tradition, habits, difference, adapt, interesting"}, {"id": 26, "situation": "You talk about your university choice", "mood": "reflective", "task": "Explain why you chose your degree and what you want to do after", "starter": "I chose… because I've always been interested in… After university I'd like to…", "grammar": ["I chose because I've always + past perfect", "I'd like to + verb"], "vocabulary": "degree, subject, future, career, interest, passion, university"}, {"id": 27, "situation": "A friend is facing a difficult decision and needs advice", "mood": "empathetic", "task": "Help them think through pros and cons", "starter": "I understand your situation. On one hand… But then again… What would you do if…?", "grammar": ["on one hand… but then again", "what would you do if + past simple?"], "vocabulary": "decision, advantage, disadvantage, consequence, think, choose, future"}, {"id": 28, "situation": "You take part in a radio debate about the environment", "mood": "committed", "task": "Argue for stronger environmental protection", "starter": "I'm firmly convinced that… Studies show that… That's why I think we should…", "grammar": ["I'm firmly convinced that", "studies show that"], "vocabulary": "environment, climate change, recycling, renewable, responsibility, future"}, {"id": 29, "situation": "You describe a famous person you admire", "mood": "admiring", "task": "Explain their qualities and their influence on you", "starter": "The person I admire most is… because… They have inspired me to…", "grammar": ["the person I admire most is", "they have inspired me to + verb"], "vocabulary": "talent, role model, influence, achievement, quality, inspiration"}, {"id": 30, "situation": "You explain a process at work to a new employee", "mood": "patient and clear", "task": "Describe the steps of the process clearly", "starter": "The first step is… Once that's done… It's important that…", "grammar": ["the first step is + verb", "it's important that + clause"], "vocabulary": "step, tool, check, confirm, send, save, inform, process"}, {"id": 31, "situation": "A friend asks what you'd do if you won the lottery", "mood": "dreamy", "task": "Talk about your hypothetical plans", "starter": "If I won the lottery, first I'd… Then I'd… and I'd probably also…", "grammar": ["if I won (second conditional)", "I'd probably + verb"], "vocabulary": "travel, house, invest, donate, family, freedom, dream, world"}, {"id": 32, "situation": "You explain why you arrived late to an important meeting", "mood": "slightly embarrassed", "task": "Apologise and describe what happened", "starter": "I'm really sorry I'm late. What happened was that I had… and then… When I tried to let you know…", "grammar": ["I'm sorry + gerund", "when I tried to (past simple)"], "vocabulary": "late, let know, accident, traffic, meeting, apologise, explanation"}, {"id": 33, "situation": "You talk to your family about an important life change", "mood": "thoughtful and resolved", "task": "Announce your decision and give your reasons", "starter": "I want to share something important with you. I've decided to… because I truly believe that…", "grammar": ["I've decided to + verb", "I truly believe that + clause"], "vocabulary": "change, decision, reasons, support, future, fear, excitement"}, {"id": 34, "situation": "You're at a conference and ask a speaker a question", "mood": "curious and serious", "task": "Formulate a clear and relevant question", "starter": "Thank you for your talk. I have a question about… Do you think that…?", "grammar": ["I have a question about + noun", "do you think that + clause?"], "vocabulary": "speaker, question, topic, research, data, opinion, perspective"}, {"id": 35, "situation": "You recommend a film for your group's movie night", "mood": "enthusiastic", "task": "Present the film with convincing arguments", "starter": "I recommend… It's a film about… that I'm sure you'll all love because…", "grammar": ["I recommend + noun", "I'm sure you'll love + noun because"], "vocabulary": "film, genre, director, storyline, effects, gripping, award"}, {"id": 36, "situation": "You're at the town hall to complain about a problem in your area", "mood": "firm and civic", "task": "Describe the problem and ask for a solution", "starter": "I'm here to make a complaint about… This problem has been going on for… months and…", "grammar": ["I'm here to make a complaint about", "has been going on for + time"], "vocabulary": "complaint, problem, solution, neighbour, noise, rubbish, service"}, {"id": 37, "situation": "You describe the experience of learning a language as an adult", "mood": "honest and motivating", "task": "Share challenges, progress and strategies", "starter": "At first I found it really hard to… but over time I've learnt to… What helped me most was…", "grammar": ["at first + past simple", "over time I've learnt to"], "vocabulary": "pronunciation, grammar, block, confidence, practice, immersion"}, {"id": 38, "situation": "You mediate between two people in a conflict", "mood": "diplomatic", "task": "Try to find common ground between opposing views", "starter": "I understand both sides. On one hand… but it's also true that… Couldn't we…?", "grammar": ["couldn't we + verb (suggestion)", "it's also true that"], "vocabulary": "conflict, agreement, compromise, solution, neighbour, respect"}, {"id": 39, "situation": "You describe your job to someone who knows nothing about it", "mood": "informative", "task": "Explain what your job involves", "starter": "Basically, my job involves… Every day I have to… and on top of that…", "grammar": ["my job involves + gerund", "I have to + verb"], "vocabulary": "responsibility, tasks, team, client, result, timetable, office"}, {"id": 40, "situation": "Your friend wants to know what you did for Christmas", "mood": "warm and festive", "task": "Say how you spent the holidays", "starter": "This year Christmas was… We got together… and on Christmas Day we did…", "grammar": ["past simple for Christmas period", "on + day + we did"], "vocabulary": "family, gathering, dinner, tradition, gift, carol, celebrate, festive"}, {"id": 41, "situation": "You talk about the importance of sport in life", "mood": "convinced", "task": "Defend the benefits of sport with examples", "starter": "Sport is essential because… What's more, playing it regularly helps to… In my case…", "grammar": ["sport is essential because", "what's more + additional argument"], "vocabulary": "health, wellbeing, discipline, team, concentration, stress, routine"}, {"id": 42, "situation": "You phone the emergency services to report an accident", "mood": "urgent and clear", "task": "Give clear, precise information", "starter": "I'm calling because there's been an accident in… There are… people injured. We need…", "grammar": ["there's been an accident (present perfect)", "we need + noun"], "vocabulary": "emergency, accident, injured, address, ambulance, police, conscious"}, {"id": 43, "situation": "You describe a long train journey you made", "mood": "storytelling and descriptive", "task": "Tell what happened during the trip", "starter": "When I got on the train, I noticed that… During the journey… When I arrived…", "grammar": ["when I + past simple", "during the journey + past simple"], "vocabulary": "train, compartment, delay, fellow traveller, chat, arrival, station"}, {"id": 44, "situation": "You're asked to talk about a hobby you've had for a long time", "mood": "passionate", "task": "Explain what the hobby is and why you love it", "starter": "I've been doing it for… years. What I love about it most is… and apart from that…", "grammar": ["I've been doing for + time (present perfect continuous)", "what I love most is"], "vocabulary": "passion, technique, progress, community, dedicate, time, benefit"}, {"id": 45, "situation": "You're at a flatshare interview", "mood": "pleasant and honest", "task": "Introduce yourself and talk about your living habits", "starter": "My name's… and I'm looking for a flat because… I'm a tidy person and at home I tend to…", "grammar": ["I tend to + verb", "I'm a + adjective + person"], "vocabulary": "tidy, quiet, respectful, timetable, cleaning, share, rules, contract"}, {"id": 46, "situation": "A friend asks what you'd change about your city", "mood": "critical but constructive", "task": "Point out problems and suggest improvements", "starter": "I think what's missing most in my city is… If I could, I'd… I'd also change…", "grammar": ["if I could + conditional", "what's missing most is"], "vocabulary": "transport, green spaces, culture, cleanliness, safety, improve"}, {"id": 47, "situation": "You talk about your plans for the next few years", "mood": "hopeful and reflective", "task": "Describe your short and long-term goals", "starter": "In the short term I want to… and in the next few years I'd like to… To do that I'm going to…", "grammar": ["in the short/long term", "I'm going to + verb (future plan)"], "vocabulary": "goal, study, work, family, travel, save, progress, deadline"}, {"id": 48, "situation": "You're volunteering with an NGO and explain your experience", "mood": "committed", "task": "Say what your volunteer work involves", "starter": "I've been volunteering with… for a year and it's one of the most rewarding experiences of my life. What I've gained most is…", "grammar": ["I've been volunteering for + time", "what I've gained most is"], "vocabulary": "volunteer, NGO, help, community, impact, solidarity, commitment"}, {"id": 49, "situation": "Someone asks if you'd rather live in the country or the city", "mood": "reflective and comparative", "task": "Compare both options and give your preference", "starter": "Although the city has lots of advantages like… I prefer the countryside because… That said…", "grammar": ["although + present tense", "that said + concession"], "vocabulary": "advantage, disadvantage, peace, services, nature, pollution, community"}, {"id": 50, "situation": "You describe a tech innovation you find interesting", "mood": "curious and informed", "task": "Explain what it is and what it's used for", "starter": "Recently I read about… It's basically… and it can be used to… What struck me most was…", "grammar": ["it's basically + noun", "what struck me most was"], "vocabulary": "technology, app, innovation, solution, future, impact, user"}, {"id": 51, "situation": "You explain what you'd do if you could live anywhere in the world", "mood": "dreamy", "task": "Choose a place and justify your choice", "starter": "If I could live anywhere, I'd choose… because… I'd also love to…", "grammar": ["if I could + conditional", "I'd also love to + verb"], "vocabulary": "culture, language, climate, food, quality of life, opportunities"}, {"id": 52, "situation": "You explain a phone app to your grandmother step by step", "mood": "patient and clear", "task": "Give clear simple instructions step by step", "starter": "It's really easy, Gran. First you tap here… Then wait for… and after that…", "grammar": ["imperatives for instructions", "wait for + noun"], "vocabulary": "screen, app, icon, tap, download, password, account, menu"}, {"id": 53, "situation": "You describe your ideal neighbourhood", "mood": "creative and reflective", "task": "Talk about what the perfect neighbourhood would be like for you", "starter": "My ideal neighbourhood would have… It would be near… and there'd also be… The most important thing would be…", "grammar": ["would have + noun", "the most important thing would be"], "vocabulary": "park, transport, shops, community, safety, quiet, neighbours"}, {"id": 54, "situation": "You talk about a Spanish custom that strikes you", "mood": "curious and respectful", "task": "Describe it and compare it with your own country", "starter": "Something that really surprised me was… In my country, though… I think this is because…", "grammar": ["something that surprised me was", "in my country, though + contrast"], "vocabulary": "custom, siesta, tapas, timetable, family, gathering, tradition, difference"}, {"id": 55, "situation": "A friend asks what you'd do if you suddenly lost your job", "mood": "reflective but calm", "task": "Explain the steps you'd take", "starter": "If I lost my job, first I'd… Then I'd look for… and I'd also take the opportunity to…", "grammar": ["if I lost my job (second conditional)", "I'd take the opportunity to"], "vocabulary": "unemployment, look for, training, opportunity, update, contacts, reinvent"}, {"id": 56, "situation": "You talk with a colleague about improving teamwork", "mood": "constructive and collaborative", "task": "Suggest ideas to improve the team dynamic", "starter": "I think we could improve if we… One idea would be… It would also be useful if…", "grammar": ["we could improve if + past simple", "it would also be useful if + clause"], "vocabulary": "communication, trust, meeting, goal, role, responsibility, feedback"}, {"id": 57, "situation": "A friend asks if you're an organised person", "mood": "honest and reflective", "task": "Describe your organisational habits", "starter": "Well, it depends. At work I'm quite… but at home sometimes I… What I always do is…", "grammar": ["it depends (hedging)", "what I always do is + verb"], "vocabulary": "organise, plan, list, time, chaos, diary, priority, routine"}, {"id": 58, "situation": "You describe what you'd do on a perfect weekend", "mood": "dreamy and relaxed", "task": "Plan your ideal weekend", "starter": "My perfect weekend would start with… In the afternoon I'd go to… and in the evening…", "grammar": ["would + verb (conditional for ideal)", "in the morning/afternoon/evening"], "vocabulary": "relax, trip, restaurant, friends, culture, nature, cinema, read"}, {"id": 59, "situation": "You talk about the advantages and disadvantages of working from home", "mood": "balanced", "task": "Give a fair opinion based on personal experience", "starter": "In my experience, working from home has advantages like… However, it also has downsides like… What I miss most is…", "grammar": ["in my experience", "what I miss most is"], "vocabulary": "working from home, productivity, focus, loneliness, flexibility, meeting"}, {"id": 60, "situation": "Someone asks you to explain a news story you've read", "mood": "informative", "task": "Summarise the news and give your opinion", "starter": "I read that… According to the article… What surprised me most was… I think this is important because…", "grammar": ["according to + source", "what surprised me most was"], "vocabulary": "news, article, event, source, opinion, impact, information"}, {"id": 61, "situation": "A friend wants to know what type of person you are", "mood": "reflective and honest", "task": "Describe your personality with concrete examples", "starter": "I think I'm quite a… person. For example, when there's a problem, I tend to… Although sometimes…", "grammar": ["I think I'm quite + adjective", "I tend to + verb"], "vocabulary": "introverted, extroverted, empathetic, creative, hardworking, impatient"}, {"id": 62, "situation": "You talk about what success means to you", "mood": "reflective and philosophical", "task": "Define success in your own terms", "starter": "For me, success isn't just measured in terms of… but also in… What matters to me is feeling…", "grammar": ["success isn't just… but also", "what matters to me is + gerund"], "vocabulary": "purpose, satisfaction, recognition, balance, impact, growth, values"}, {"id": 63, "situation": "You have to talk about a social problem in class", "mood": "serious and committed", "task": "Present the problem and suggest solutions", "starter": "The problem I want to talk about is… It affects… and the main causes are… One possible solution would be…", "grammar": ["the problem I want to talk about is", "one possible solution would be"], "vocabulary": "problem, cause, effect, solution, society, citizen, government"}, {"id": 64, "situation": "A friend asks if you believe in love at first sight", "mood": "romantic or sceptical", "task": "Give your opinion with arguments", "starter": "I think… because… That said, I understand that for some people… In my case…", "grammar": ["I think + clause", "that said + concession"], "vocabulary": "love, attraction, time, know, relationship, compatibility, romantic, realistic"}, {"id": 65, "situation": "You describe the last time you got lost somewhere new", "mood": "amusing and storytelling", "task": "Tell the story with detail", "starter": "Once I got lost in… I was looking for… when I suddenly realised…", "grammar": ["once + past simple (narrative)", "when I suddenly realised + past simple"], "vocabulary": "get lost, map, ask, confused, direction, find, finally, anecdote"}, {"id": 66, "situation": "You talk about the importance of learning languages", "mood": "convinced and motivating", "task": "Argue the benefits of speaking several languages", "starter": "I believe learning languages is essential nowadays because… What's more, it opens doors to… In my case…", "grammar": ["I believe + clause", "it opens doors to + noun"], "vocabulary": "opportunity, work, culture, communication, travel, mind, flexibility"}, {"id": 67, "situation": "You describe your experience of trying a new food", "mood": "adventurous and descriptive", "task": "Say how trying that food was", "starter": "The other day I tried… for the first time. At first I thought it was… but then…", "grammar": ["at first I thought + clause", "the other day I tried + noun"], "vocabulary": "taste, texture, spicy, strange, delicious, try, dare, experience"}, {"id": 68, "situation": "A friend asks what advice you'd give to your younger self", "mood": "reflective and mature", "task": "Give advice to your younger version", "starter": "I'd tell myself to… I'd also advise not to worry so much about… and above all not to…", "grammar": ["I'd tell myself to + verb", "above all not to + verb"], "vocabulary": "advice, mistake, learn, opportunity, fear, regret, time, priority"}, {"id": 69, "situation": "You're in a shop to personalise a gift", "mood": "creative and attentive", "task": "Explain what you want and how you'd like it personalised", "starter": "I'd like a gift for… I'd like it to have… on it. Is it possible to add…?", "grammar": ["I'd like + noun to have + noun on it", "is it possible to + verb?"], "vocabulary": "personalise, message, colour, design, name, date, wrap, special"}, {"id": 70, "situation": "You talk about the music you enjoy and why", "mood": "musical and expressive", "task": "Talk about your taste in music and share a recommendation", "starter": "I absolutely love… especially when… I'd really recommend you listen to…", "grammar": ["I absolutely love + noun", "I'd really recommend + gerund"], "vocabulary": "rhythm, lyrics, melody, artist, concert, feeling, style, favourite album"}, {"id": 71, "situation": "You describe what you'd do if you had a completely free day", "mood": "relaxed and free", "task": "Talk about what you'd do with no obligations", "starter": "If I had a totally free day, first I'd… Then… and in the afternoon I'd probably…", "grammar": ["if I had + second conditional", "I'd probably + verb"], "vocabulary": "rest, walk, read, cook, friends, cinema, nature, freedom"}, {"id": 72, "situation": "You talk about which values are most important in life", "mood": "philosophical and sincere", "task": "Say what your main values are and why", "starter": "For me, the most important values are… because… Without them, I think…", "grammar": ["the most important values are + plural", "without them I think + clause"], "vocabulary": "honesty, respect, family, loyalty, effort, empathy, freedom"}, {"id": 73, "situation": "A friend wants to know if you regret leaving something behind", "mood": "reflective and mature", "task": "Talk about something you gave up and whether you'd change it", "starter": "I gave up… a few years ago because… Sometimes I think I could have… but I also believe that…", "grammar": ["I gave up + gerund (past simple)", "I could have + past participle"], "vocabulary": "give up, regret, decision, opportunity, different, consequence, learn"}, {"id": 74, "situation": "You talk about different aesthetics for your living room", "mood": "creative", "task": "Help a friend decide on a style for their living room", "starter": "For a mid-century modern feel, you'd want clean lines and organic shapes. A classic piece would be… For lighting…", "grammar": ["you'd want + noun (conditional advice)", "a classic piece would be"], "vocabulary": "style, furniture, colour palette, modern, vintage, minimalist, cosy, lighting"}, {"id": 75, "situation": "You close a course with a final reflection", "mood": "grateful and motivated", "task": "Talk about what you've learnt and your next steps", "starter": "During this course I've learnt so much about… What I found hardest was… Now I feel ready to…", "grammar": ["I've learnt (present perfect)", "now I feel ready to + verb"], "vocabulary": "progress, confidence, improve, continue, next level, goal, motivation"}, {"id": 76, "situation": "You describe your favourite music artist", "mood": "enthusiastic", "task": "Talk about why you love their music and recommend them", "starter": "I'm absolutely obsessed with… Their music is… and what I love most is… You should definitely listen to…", "grammar": ["I'm obsessed with + noun", "you should definitely + verb"], "vocabulary": "artist, album, lyrics, rhythm, genre, concert, inspiration, melody"}, {"id": 77, "situation": "You explain your morning routine to a language partner", "mood": "natural", "task": "Describe what you do every morning", "starter": "I always get up at… and the first thing I do is… After that I…", "grammar": ["present simple for routines", "the first thing I do is"], "vocabulary": "alarm, shower, breakfast, commute, coffee, routine, habit, then"}, {"id": 78, "situation": "You talk about a book that changed your life", "mood": "emotional and thoughtful", "task": "Describe the book and its impact on you", "starter": "This book made me see everything differently. It's about… and the main message is… After reading it I…", "grammar": ["this book made me + verb", "after + gerund + past simple"], "vocabulary": "message, character, theme, perspective, insight, moving, profound"}, {"id": 79, "situation": "You discuss your work-life balance with a friend", "mood": "honest", "task": "Say how you manage your time between work and personal life", "starter": "I try to keep a good balance but sometimes work takes over. I've started to… and that's helped me…", "grammar": ["I try to + verb", "I've started to + verb (recent change)"], "vocabulary": "balance, boundaries, switch off, overtime, priority, wellbeing, burnout"}, {"id": 80, "situation": "You describe your hometown to a pen pal", "mood": "warm and descriptive", "task": "Paint a vivid picture of where you're from", "starter": "My hometown is a really… place. What I love most about it is… Although it's not famous for…", "grammar": ["what I love most about it is", "although + concession"], "vocabulary": "hometown, landmark, community, atmosphere, vibe, proud, miss"}, {"id": 81, "situation": "You talk about a tradition from your culture", "mood": "proud and informative", "task": "Explain the tradition and its significance", "starter": "One tradition I really value is… It usually takes place… and the idea behind it is…", "grammar": ["the idea behind it is + noun", "it usually takes place + when"], "vocabulary": "tradition, celebration, ritual, meaning, heritage, community, annual"}, {"id": 82, "situation": "You explain why you're learning English", "mood": "motivated", "task": "Give your reasons for learning the language", "starter": "I'm learning English because… It's also really useful for… and personally I want to…", "grammar": ["I'm learning English because", "it's also useful for + gerund"], "vocabulary": "communicate, travel, career, opportunity, challenge, confidence, improve"}, {"id": 83, "situation": "A friend asks about your biggest achievement", "mood": "proud and reflective", "task": "Talk about something you're really proud of", "starter": "My biggest achievement so far is probably… It took me… and I had to… but it was totally worth it.", "grammar": ["my biggest achievement so far is", "it was totally worth it"], "vocabulary": "achievement, effort, persistence, proud, overcome, goal, reward"}, {"id": 84, "situation": "You discuss healthy eating habits with a classmate", "mood": "balanced", "task": "Share your approach to food and nutrition", "starter": "I try to eat healthily most of the time. I usually… and I try to avoid… although sometimes…", "grammar": ["I try to + verb", "I try to avoid + gerund"], "vocabulary": "balanced diet, nutrients, portion, meal prep, junk food, moderation"}, {"id": 85, "situation": "You talk about a film that disappointed you", "mood": "honest and critical", "task": "Explain your disappointment and what you expected", "starter": "I was really looking forward to… but honestly it was a bit of a letdown. I expected… and instead…", "grammar": ["I was looking forward to + gerund", "instead + clause"], "vocabulary": "disappointment, expectations, plot, acting, overrated, letdown"}, {"id": 86, "situation": "You describe your ideal holiday", "mood": "dreamy", "task": "Talk about your perfect trip", "starter": "My ideal holiday would be… I'd spend my days… and in the evenings I'd…", "grammar": ["my ideal holiday would be", "I'd spend my days + gerund"], "vocabulary": "destination, explore, relax, culture, adventure, off the beaten track"}, {"id": 87, "situation": "You give a friend advice on learning a new skill", "mood": "practical and encouraging", "task": "Share tips for learning something new efficiently", "starter": "The most important thing when learning a new skill is to… Also, I'd suggest… and try not to…", "grammar": ["the most important thing is to + verb", "I'd suggest + gerund"], "vocabulary": "consistent, practice, mistakes, feedback, patience, progress, goal"}, {"id": 88, "situation": "You talk about a time you were really nervous", "mood": "storytelling", "task": "Describe the situation and how you coped", "starter": "I remember being incredibly nervous when… My heart was racing and I kept thinking… In the end I…", "grammar": ["I remember + gerund", "in the end + past simple"], "vocabulary": "nervous, heart racing, adrenaline, cope, breathe, overcome, relief"}, {"id": 89, "situation": "You describe the best meal you've ever had", "mood": "enthusiastic and sensory", "task": "Paint a vivid picture of that meal", "starter": "The best meal I've ever had was… The flavours were… and the atmosphere was… I still think about it now.", "grammar": ["the best… I've ever had (superlative + present perfect)", "I still + present simple"], "vocabulary": "flavour, texture, aroma, atmosphere, unforgettable, indulgent, savour"}, {"id": 90, "situation": "A friend asks how you deal with stress", "mood": "practical", "task": "Share your stress-management strategies", "starter": "When I'm feeling stressed, the first thing I do is… I also find that… really helps, and I try to avoid…", "grammar": ["when I'm feeling stressed (temporal clause)", "I find that + clause"], "vocabulary": "stress, breathe, prioritise, exercise, perspective, boundaries, switch off"}, {"id": 91, "situation": "You explain a misunderstanding you had", "mood": "honest and self-aware", "task": "Describe the misunderstanding and what caused it", "starter": "There was a bit of a misunderstanding between us. What happened was… I think the problem was that… In the end…", "grammar": ["what happened was + clause", "the problem was that"], "vocabulary": "misunderstanding, communication, assume, clarify, apologise, resolve"}, {"id": 92, "situation": "You talk about the pros and cons of city life", "mood": "balanced", "task": "Give a fair view of living in a city", "starter": "City life has its advantages, like… but there are definitely downsides too, such as… Personally I think the key is…", "grammar": ["city life has its advantages like", "there are downsides too such as"], "vocabulary": "convenience, culture, cost, pollution, community, anonymity, pace"}, {"id": 93, "situation": "You describe a difficult conversation you had", "mood": "vulnerable but reflective", "task": "Talk about the conversation and what you learnt from it", "starter": "I had a really difficult conversation with… about… It was hard because… but afterwards I felt…", "grammar": ["it was hard because", "afterwards I felt + adjective"], "vocabulary": "difficult, honest, vulnerable, outcome, perspective, resolve, brave"}, {"id": 94, "situation": "You talk about your relationship with social media", "mood": "balanced", "task": "Describe how you use social media and how it affects you", "starter": "I use social media mainly for… but I've noticed it can sometimes make me feel… So I've tried to…", "grammar": ["I've noticed it can + verb", "so I've tried to + verb"], "vocabulary": "platform, screen time, comparison, mindful, disconnect, curate, influence"}, {"id": 95, "situation": "You describe your dream job in detail", "mood": "imaginative", "task": "Paint a vivid picture of your ideal career", "starter": "In my dream job I'd be… I'd spend my days… and the most rewarding part would be…", "grammar": ["I'd spend my days + gerund", "the most rewarding part would be"], "vocabulary": "fulfilling, purpose, autonomy, impact, passion, creativity, balance"}, {"id": 96, "situation": "You give advice to someone moving to a new city", "mood": "helpful and warm", "task": "Share practical and emotional advice", "starter": "The first thing I'd say is… It's completely normal to feel… and one thing that really helped me was…", "grammar": ["the first thing I'd say is", "it's completely normal to + verb"], "vocabulary": "adjust, homesick, community, explore, routine, patience, settle in"}, {"id": 97, "situation": "You talk about a mistake you made and what you learnt", "mood": "humble and reflective", "task": "Describe the mistake and the lesson", "starter": "Looking back, I realise I made a mistake when… At the time I thought… but I now know that…", "grammar": ["looking back + clause", "at the time I thought"], "vocabulary": "mistake, lesson, reflection, growth, regret, accept, move on"}, {"id": 98, "situation": "You describe a skill you're working on improving", "mood": "motivated", "task": "Talk about a skill and your progress", "starter": "I've been working on improving my… for a while now. I've noticed that… and the next step for me is…", "grammar": ["I've been working on + gerund (present perfect continuous)", "the next step for me is"], "vocabulary": "skill, practice, consistency, progress, challenge, milestone, feedback"}, {"id": 99, "situation": "You talk about what home means to you", "mood": "emotional and thoughtful", "task": "Describe your concept of home", "starter": "For me, home isn't necessarily a place. It's more of a feeling of… I feel most at home when…", "grammar": ["home isn't necessarily + noun", "I feel most at home when"], "vocabulary": "belonging, comfort, familiar, safety, people, warmth, roots"}, {"id": 100, "situation": "You close a language course with a heartfelt reflection", "mood": "grateful", "task": "Share what you've gained and your plans", "starter": "This course has been so much more than I expected. I've grown not just linguistically but also… My next step is…", "grammar": ["so much more than + clause", "I've grown not just… but also"], "vocabulary": "growth, confidence, connections, challenge, inspiring, chapter, continue"}],
    B1: [{"id": 1, "situation": "You debate climate change in class", "mood": "concerned and engaged", "task": "Express your opinion with solid arguments", "starter": "In my opinion, climate change is the greatest challenge of our time because… What's more, the scientific data shows that…", "grammar": ["in my opinion + indicative", "what's more for addition"], "vocabulary": "emissions, renewable, consequence, policy, responsibility, agreement, measure"}, {"id": 2, "situation": "You present a research project to your group", "mood": "confident", "task": "Explain the methodology and results", "starter": "The aim of this project was to investigate… To do this, we used… The results showed that…", "grammar": ["the aim was to + verb", "the results showed that"], "vocabulary": "methodology, sample, result, hypothesis, conclusion, variable, analysis"}, {"id": 3, "situation": "You mediate between two friends having a conflict", "mood": "empathetic and neutral", "task": "Suggest a fair solution for both sides", "starter": "I understand both your points of view. On one hand… On the other hand… Wouldn't it be possible for…?", "grammar": ["I understand both your points of view", "wouldn't it be possible for + clause?"], "vocabulary": "conflict, perspective, compromise, listen, solution, agreement, respect"}, {"id": 4, "situation": "You talk about social inequality in your country", "mood": "critical and committed", "task": "Analyse causes and suggest measures", "starter": "Social inequality in my country is mainly due to the fact that… This is reflected in… To solve it, it would be necessary to…", "grammar": ["mainly due to the fact that", "it would be necessary to + verb"], "vocabulary": "inequality, gap, education, opportunity, system, policy, redistribution"}, {"id": 5, "situation": "You describe an experience that changed your perspective", "mood": "reflective and mature", "task": "Narrate the experience and explain its impact", "starter": "It was an experience that changed me profoundly. Before it, I used to think that… but afterwards I realised that…", "grammar": ["before + used to + verb", "afterwards I realised that"], "vocabulary": "perspective, reflection, grow, values, change, impact, turning point"}, {"id": 6, "situation": "You take part in a work meeting to solve an urgent problem", "mood": "professional", "task": "Suggest concrete solutions and assign tasks", "starter": "Given that the problem is urgent, I propose that… First of all, we'd need to… Following that…", "grammar": ["given that + indicative", "first of all we'd need to"], "vocabulary": "urgent, priority, assign, deadline, solution, team, resources, implement"}, {"id": 7, "situation": "You explain your country's political system to a foreigner", "mood": "informative and clear", "task": "Describe the basic political structure", "starter": "In my country there's a… system. Power is divided into… and every… years there's an election.", "grammar": ["there's a + system", "every + time + election"], "vocabulary": "democracy, parliament, election, government, opposition, party, vote"}, {"id": 8, "situation": "You talk about the importance of mental health", "mood": "empathetic and aware", "task": "Argue why we should talk about it more", "starter": "I believe that mental health is just as important as physical health, yet… It's absolutely essential that society…", "grammar": ["just as important as (comparison of equality)", "it's essential that + subjunctive"], "vocabulary": "stigma, wellbeing, therapy, stress, normalise, support, prevention"}, {"id": 9, "situation": "You describe a difficult time you got through", "mood": "brave and reflective", "task": "Narrate the challenge and how you faced it", "starter": "It was one of the hardest periods of my life. At that point I felt… What helped me was… and little by little…", "grammar": ["it was one of the hardest + superlative", "little by little + past simple"], "vocabulary": "overcome, difficulty, support, resilience, learning, strength, time"}, {"id": 10, "situation": "You argue with a friend about whether city or countryside life is better", "mood": "argumentative but friendly", "task": "Defend your position with concrete examples", "starter": "While I understand your point, I still think that… Life in… offers advantages that… simply can't match.", "grammar": ["while I understand your point", "offers advantages that"], "vocabulary": "quality of life, services, nature, pollution, community, pace of life"}, {"id": 11, "situation": "You present the pros and cons of social media in class", "mood": "balanced", "task": "Give an objective, nuanced view", "starter": "Social media has undeniable benefits such as… However, it also presents serious risks like…", "grammar": ["undeniable", "however for contrast"], "vocabulary": "addiction, information, influencer, community, wellbeing, impact, risk"}, {"id": 12, "situation": "You speak to a psychologist about your current worries", "mood": "open and vulnerable", "task": "Describe how you feel honestly", "starter": "Lately I've been feeling… and I'm not entirely sure why. There are moments when… What worries me most is…", "grammar": ["lately I've been feeling (present perfect continuous)", "what worries me most is"], "vocabulary": "anxiety, pressure, expectations, uncertainty, cope, support, understand"}, {"id": 13, "situation": "You explain to your boss why you deserve a promotion", "mood": "confident and professional", "task": "Argue with specific achievements and data", "starter": "Over the last two years I've proved my commitment to… I've achieved… and on top of that I've developed…", "grammar": ["present perfect for achievements", "on top of that for addition"], "vocabulary": "achievement, performance, commitment, skill, responsibility, growth"}, {"id": 14, "situation": "You talk about the influence of the media", "mood": "critical and reflective", "task": "Analyse how media shapes public opinion", "starter": "The media has enormous power because… However, it doesn't always offer an unbiased view of…", "grammar": ["has enormous power", "doesn't always for partial negation"], "vocabulary": "manipulation, objectivity, source, audience, information, bias, influence"}, {"id": 15, "situation": "You describe your hometown for a radio programme", "mood": "nostalgic and descriptive", "task": "Paint a vivid picture of your home town", "starter": "My hometown is the kind of place that… What I love most about it is… Although I sometimes miss it, I know that…", "grammar": ["the kind of place that + relative clause", "although + concession"], "vocabulary": "architecture, community, tradition, landscape, atmosphere, history, identity"}, {"id": 16, "situation": "You debate whether university is still worth it", "mood": "reflective and critical", "task": "Argue whether university is still necessary today", "starter": "University is still valuable because… However, we have to admit that… Perhaps the ideal would be…", "grammar": ["university is still + adjective because", "perhaps the ideal would be"], "vocabulary": "degree, job market, debt, training, experience, alternative, future"}, {"id": 17, "situation": "You talk about a film that made you think deeply", "mood": "reflective and intellectual", "task": "Describe the theme and its effect on you", "starter": "This film tackles the theme of… What struck me most was that… After watching it, I started questioning…", "grammar": ["tackles the theme of", "after watching it, I started + gerund"], "vocabulary": "theme, protagonist, message, metaphor, questioning, reflection, director"}, {"id": 18, "situation": "You describe how globalisation affects local cultures", "mood": "informed and balanced", "task": "Analyse both benefits and threats", "starter": "Globalisation has facilitated cultural exchange; however, it also threatens… It's important to find a balance between…", "grammar": ["has facilitated (present perfect)", "it's important to + verb"], "vocabulary": "identity, homogenisation, exchange, language, tradition, threat, balance"}, {"id": 19, "situation": "You propose an improvement project for your neighbourhood", "mood": "civic and creative", "task": "Present your idea and convince your neighbours", "starter": "I've been thinking about a project that could benefit everyone in the area. It would involve… The benefits would be…", "grammar": ["I've been thinking about + gerund", "the benefits would be"], "vocabulary": "community, green space, participation, funding, proposal, improvement"}, {"id": 20, "situation": "You speak to your family about your future plans", "mood": "intimate and honest", "task": "Explain your plans and manage expectations", "starter": "I know this might not be what you expected, but I've decided to… because I genuinely believe that…", "grammar": ["I've decided to + verb", "I genuinely believe that"], "vocabulary": "expectations, decision, support, path, future, understanding, values"}, {"id": 21, "situation": "You explain what a failure taught you", "mood": "mature and reflective", "task": "Turn a failure into a life lesson", "starter": "That experience was a complete failure. At the time I felt… But over time I learnt that…", "grammar": ["at the time I felt + adjective", "over time I learnt that"], "vocabulary": "failure, lesson, resilience, learning, overcoming, perspective, mistake"}, {"id": 22, "situation": "You describe the advantages of being bilingual", "mood": "enthusiastic and informed", "task": "Argue with examples and data", "starter": "Being bilingual offers advantages that go far beyond communication. Cognitively… and professionally…", "grammar": ["go far beyond + noun", "cognitively speaking"], "vocabulary": "cognitive, flexibility, opportunity, culture, communication, identity, advantage"}, {"id": 23, "situation": "You talk about volunteering and its social impact", "mood": "committed and warm", "task": "Describe your experience as a volunteer", "starter": "I've been volunteering with… for a year and it's been one of the most enriching experiences of my life. What it's given me most is…", "grammar": ["I've been volunteering for + time", "what it's given me most is"], "vocabulary": "volunteering, impact, community, solidarity, commitment, satisfaction, difference"}, {"id": 24, "situation": "You analyse the causes and consequences of emigration", "mood": "empathetic and analytical", "task": "Explain the motives and their effects on people", "starter": "Emigration is a complex phenomenon driven by various factors such as… Its consequences are both positive and…", "grammar": ["driven by + noun", "both positive and + adjective"], "vocabulary": "emigration, opportunity, uprooting, integration, economy, family, identity"}, {"id": 25, "situation": "You describe an injustice you witnessed", "mood": "indignant but reflective", "task": "Narrate what happened and how you reacted", "starter": "I witnessed something that deeply unsettled me. What happened was… In that moment I decided to… because I felt it was my responsibility.", "grammar": ["I decided to + verb", "in that moment I decided because"], "vocabulary": "injustice, witness, responsibility, act, report, reaction, courage"}, {"id": 26, "situation": "You talk about how AI will change work", "mood": "visionary and critical", "task": "Analyse the changes and their implications", "starter": "AI is already transforming sectors like… In the short term, it's likely that… Nevertheless, we need to consider…", "grammar": ["it's likely that + future", "nevertheless for contrast"], "vocabulary": "automation, employment, skills, adaptation, ethics, future, impact"}, {"id": 27, "situation": "You give a friend financial advice", "mood": "practical and empathetic", "task": "Give basic, practical financial tips", "starter": "The first thing I'd recommend is… It's also important that you avoid… and get into the habit of…", "grammar": ["the first thing I'd recommend is", "it's important that you + verb"], "vocabulary": "savings, budget, debt, investment, spending, planning, goal"}, {"id": 28, "situation": "You describe the effects of a sedentary lifestyle", "mood": "informed and concerned", "task": "Explain the risks and suggest solutions", "starter": "A sedentary lifestyle has become one of the main health problems. Its effects range from… to… The key lies in…", "grammar": ["has become one of the main + noun", "range from… to"], "vocabulary": "sedentary, obesity, cardiovascular, posture, habit, activity, prevention"}, {"id": 29, "situation": "You talk about the importance of protecting the environment", "mood": "passionate and committed", "task": "Suggest concrete actions everyone can take", "starter": "Although the problem seems overwhelming, each of us can contribute. For example, we can… and it's also fundamental that…", "grammar": ["although the problem seems", "each of us can + verb"], "vocabulary": "recycle, footprint, energy, consumption, biodiversity, responsibility, action"}, {"id": 30, "situation": "You describe a workplace conflict you resolved", "mood": "professional and diplomatic", "task": "Narrate how you managed the situation", "starter": "In my last job a conflict came up between… What I did was… and we finally reached an agreement through…", "grammar": ["what I did was + verb", "we finally reached an agreement"], "vocabulary": "conflict, mediation, professional, communication, agreement, management"}, {"id": 31, "situation": "You talk about the role of the family in today's society", "mood": "reflective and sociological", "task": "Analyse how the concept of family has changed", "starter": "The concept of family has evolved significantly. Today there are… whereas before… What remains the same is…", "grammar": ["has evolved (present perfect)", "whereas for contrast"], "vocabulary": "family, structure, values, roles, change, diversity, support, tradition"}, {"id": 32, "situation": "You explain why critical thinking matters", "mood": "intellectual and convinced", "task": "Argue with everyday examples", "starter": "Critical thinking allows us to… Without it, we'd be far more susceptible to… A clear example is when…", "grammar": ["allows us to + verb", "without it we'd be + comparative"], "vocabulary": "critical, argument, evidence, disinformation, analysis, questioning, logic"}, {"id": 33, "situation": "You talk about what professional success means to you", "mood": "reflective and personal", "task": "Define success in your own terms", "starter": "For me, professional success isn't measured purely in terms of… but also in… What matters to me is feeling…", "grammar": ["not purely in terms of… but also", "what matters to me is + gerund"], "vocabulary": "purpose, satisfaction, recognition, balance, impact, growth, values"}, {"id": 34, "situation": "You describe the challenges of learning a language as an adult", "mood": "honest and motivating", "task": "Share personal challenges and strategies", "starter": "Learning a language as an adult comes with its own challenges. What I find hardest is… but I've found that… helps a lot.", "grammar": ["comes with its own challenges", "I've found that + clause helps"], "vocabulary": "pronunciation, grammar, block, confidence, practice, immersion, consistency"}, {"id": 35, "situation": "You analyse the impact of mass tourism", "mood": "critical and balanced", "task": "Describe positive and negative effects", "starter": "Mass tourism generates significant economic benefits, but it also causes serious problems like… We need to push for a…", "grammar": ["generates benefits but also causes", "we need to push for"], "vocabulary": "overcrowding, heritage, economy, sustainable, residents, alternative"}, {"id": 36, "situation": "You talk about a difficult decision you had to make", "mood": "reflective and honest", "task": "Explain the dilemma and how you decided", "starter": "I had to choose between… and… In the end I went with… because…", "grammar": ["I had to choose between… and", "in the end I went with ething that surprises visitors is"], "vocabulary": "culture, tradition, food, pub, humour, timetable, queuing, understatement"}, {"id": 46, "situation": "You talk about the pros and cons of living with a partner", "mood": "balanced and mature", "task": "Analyse both sides without romanticising", "starter": "Living with a partner has clear advantages like… but it also involves challenges like… What it requires most is…", "grammar": ["has clear advantages like", "involves challenges like"], "vocabulary": "commitment, space, communication, routine, independence, support"}, {"id": 47, "situation": "You describe a moment of success that filled you with pride", "mood": "proud and emotional", "task": "Narrate what happened and how you felt", "starter": "It was the first time I'd ever… and I'd achieved it after… The feeling I had was… and in that moment I understood that…", "grammar": ["it was the first time I'd ever + past perfect", "in that moment I understood that"], "vocabulary": "effort, achievement, recognition, pride, perseverance, reward, merit"}, {"id": 48, "situation": "You talk about the role of education in reducing poverty", "mood": "analytical and hopeful", "task": "Argue why education is key", "starter": "Education is one of the most powerful tools for breaking the cycle of poverty. When someone gains access to… they can…", "grammar": ["one of the most powerful tools", "when someone gains access to"], "vocabulary": "cycle, opportunity, gap, access, equality, knowledge, transformation"}, {"id": 49, "situation": "You explain how a family member influenced your values", "mood": "intimate and reflective", "task": "Describe the influence and give concrete examples", "starter": "The person in my family who has most influenced my values is… They taught me that… and through their example I learnt to…", "grammar": ["who has most influenced", "they taught me that"], "vocabulary": "value, example, teaching, role model, learn, family, attitude, legacy"}, {"id": 50, "situ he other"], "vocabulary": "communication, immediacy, depth, distance, misunderstanding, relationship"}, {"id": 63, "situation": "You talk about animal welfare", "mood": "ethical and empathetic", "task": "Argue why animals deserve protection", "starter": "Animals are sentient beings and therefore deserve… It's unacceptable that in the 21st century we still see… I firmly believe that…", "grammar": ["are sentient beings", "it's unacceptable that + clause"], "vocabulary": "welfare, rights, cruelty, exploitation, legislation, protection, awareness"}, {"id": 64, "situation": "You explain how to deal with a panic attack", "mood": "empathetic and clear", "task": "Give clear, reassuring instructions", "starter": "The most important thing is not to panic. First, try to… Then focus on… and remember that…", "grammar": ["the most important thing is to + verb", "remember that + clause"], "vocabulary": "panic, breathing, technique, grounding, calm, symptom, safety"}, {"id": 65, "situation": "You debate whether competition is healthy", "mood": "reflective and balanced", "task": "Give arguments on both sides", "starter": "Competition can be a source of motivation when… However, it becomes harmful if… The balance lies in…", "grammar": ["can be + noun when + clause", "the balance lies in + gerund"], "vocabulary": "motivation, stress, outcome, process, cooperation, comparison, self-esteem"}, {"id": 66, "situation": "You describe the importance of art in society", "mood": "cultural and passionate", "task": "Argue why art is necessary", "starter": "Art is so much more than entertainment. It fulfils vital functions like… and helps us… Without art, society would…", "grammar": ["fulfils vital functions", "without art, society would + verb"], "vocabulary": "expression, critique, identity, emotion, reflection, beauty, social function"}, {"id": 67, "situation": "You talk about the effects of working night shifts", "mood": "informed and empathetic", "task": "Explain the risks and how to manage d + past simple"], "vocabulary": "proud, milestone, perseverance, achievement, disbelief, recognition, deserve, journey"}, {"id": 88, "situation": "You explain why you think sport is good for mental health", "mood": "convinced", "task": "Argue the psychological benefits of sport with examples", "starter": "Beyond the physical benefits, sport plays a crucial role in our mental wellbeing. Personally, when I exercise I notice that… and research supports…", "grammar": ["beyond + noun (concessive addition)", "when I + present simple (temporal)"], "vocabulary": "mental health, endorphins, routine, discipline, release, focus, self-esteem, social"}, {"id": 89, "situation": "You talk about your relationship with failure", "mood": "mature and honest", "task": "Reflect on how you handle and learn from failure", "starter": "My relationship with failure has changed a lot over the years. When I was younger I used to take it very personally, but now I try to see it as…", "grammar": ["used to + verb (past) vs now I try to (present contrast)", "see it as + noun"], "vocabulary": "failure, growth mindset, setback, resilience, lesson, perfectionism, adapt, progress"}, {"id": 90, "situation": "You explain the concept of privilege to a sceptical friend", "mood": "patient and evidence-based", "task": "Explain the concept clearly without being preachy", "starter": "I know the word sounds loaded, but stay with me. Privilege doesn't mean your life has been easy — it means that certain aspects of your identity…", "grammar": ["privilege doesn't mean… it means + clause", "certain aspects of"], "vocabulary": "privilege, identity, advantage, systemic, awareness, intersect, empathy, context"}, {"id": 91, "situation": "You give a short speech at a leaving party", "mood": "warm and grateful", "task": "Express gratitude and share a memorable moment", "starter": "I was asked to say a few words, which is both an honour and absolutely terrifying. What I will say is that working with… has been…", "grammar": ["I was asked to + verb (passive report)", "what I will say is that"], "vocabulary": "gratitude, colleague, memory, contribution, farewell, chapter, admire, wish"}, {"id": 92, "situation": "You describe a technology that worries you", "mood": "concerned but balanced", "task": "Explain the technology and your concerns", "starter": "The technology that concerns me most right now is… My main worry is that… although I do acknowledge that it could also be used for good if…", "grammar": ["concerns me most (superlative)", "I do acknowledge (emphatic do)"], "vocabulary": "concern, surveillance, misuse, regulation, transparency, algorithm, safeguard, bias"}, {"id": 93, "situation": "You talk about finding a balance between ambition and contentment", "mood": "philosophical", "task": "Reflect on whether you need to keep striving or can be satisfied", "starter": "There's a real tension between wanting more and being at peace with where you are. I think the key is to… without losing sight of…", "grammar": ["there's a tension between + gerund", "without + gerund (negative condition)"], "vocabulary": "ambition, contentment, enough, striving, gratitude, purpose, pressure, fulfilment"}, {"id": 94, "situation": "You describe an inspiring person you read about", "mood": "admiring", "task": "Talk about this person's story and what makes them inspiring", "starter": "I recently read about… and their story genuinely moved me. What struck me most was how they… despite… and the way they…", "grammar": ["what struck me most was how + past simple", "despite + gerund"], "vocabulary": "inspire, perseverance, overcome, role model, impact, admire, legacy, determination"}, {"id": 95, "situation": "You explain what you value most in a workplace", "mood": "reflective and professional", "task": "Describe what makes a workplace genuinely good for you", "starter": "When it comes to what I value in a job, salary is important but it's not the only thing. What matters most to me is… and I also really need…", "grammar": ["when it comes to + gerund", "what matters most to me is"], "vocabulary": "culture, autonomy, recognition, growth, team, flexibility, purpose, communication"}, {"id": 96, "situation": "You talk about the ethics of eating meat", "mood": "reflective and open", "task": "Explore the ethical, environmental and cultural dimensions", "starter": "The question of whether to eat meat is one of those topics where you can't give a simple answer. There are ethical considerations like… as well as environmental ones…", "grammar": ["one of those topics where + relative", "as well as + noun for addition"], "vocabulary": "ethics, environment, culture, protein, alternative, welfare, footprint, choice"}, {"id": 97, "situation": "You describe what you'd do with a year off", "mood": "dreamy and thoughtful", "task": "Explain how you'd spend a sabbatical year meaningfully", "starter": "If I had a year off, I wouldn't just sit still. I'd start by… and then probably spend a few months… The thing I'd most want to achieve is…", "grammar": ["I wouldn't just + verb (conditional)", "the thing I'd most want to achieve is"], "vocabulary": "sabbatical, volunteer, travel, learn, reflect, recharge, skill, intention, meaningful"}, {"id": 98, "situation": "You talk about how you handle disagreements with close friends", "mood": "honest and mature", "task": "Describe your approach to conflict in close relationships", "starter": "I think how you handle disagreements says a lot about a friendship. My approach is usually to… and I try hard not to… even when I feel strongly about something.", "grammar": ["how you handle + noun (indirect question)", "I try hard not to + verb"], "vocabulary": "disagreement, communicate, boundaries, perspective, let go, tension, trust, repair"}, {"id": 99, "situation": "You describe the kind of content you create or consume online", "mood": "self-aware", "task": "Reflect on your digital consumption or creation habits", "starter": "I think about my online habits more and more. Mostly I tend to consume… but I've also started creating… because I found that…", "grammar": ["I tend to + verb (habitual)", "I've started + gerund (recent change)"], "vocabulary": "content, algorithm, passive, active, creator, scroll, curate, intention, audience"}, {"id": 100, "situation": "You close the course with a message to your future self", "mood": "hopeful and personal", "task": "Write a spoken message to yourself one year from now", "starter": "If I could speak to myself a year from now, I'd want to say… I hope by then I'll have… and I'd remind myself not to forget that…", "grammar": ["if I could speak to myself (second conditional)", "I hope by then I'll have + past participle"], "vocabulary": "future, grow, remember, commit, progress, forgive, courage, intention, moment"}],
    B2: [{"id": 1, "situation": "You're debating with a colleague whether open-plan offices actually improve productivity", "mood": "sceptical", "task": "Argue your position with specific examples and evidence", "starter": "I'd push back on the assumption that open-plan offices encourage collaboration. In my experience the opposite tends to be true, because…", "grammar": ["I'd push back on the assumption that", "the opposite tends to be true because"], "vocabulary": "productivity, distraction, collaboration, myth, layout, focus, interruption, evidence"}, {"id": 2, "situation": "You're explaining to a friend why you left a well-paid job", "mood": "honest and reflective", "task": "Go beyond 'I was unhappy' and articulate what actually drove the decision", "starter": "It wasn't a single moment that made me quit — it was a gradual realisation that however much they paid me, I was…", "grammar": ["it wasn't a single moment that made me", "however much they paid me, I was"], "vocabulary": "trade-off, ceiling, autonomy, purpose, compensation, sacrifice, turning point"}, {"id": 3, "situation": "You're in a job interview being asked about a time you failed", "mood": "composed", "task": "Turn the failure into evidence of self-awareness and growth", "starter": "The failure I'm most comfortable talking about is… because it taught me something I actually use now, which is…", "grammar": ["the failure I'm most comfortable talking about", "it taught me something I actually use now"], "vocabulary": "transparent, accountability, learn, outcome, context, recover, demonstrate"}, {"id": 4, "situation": "You're discussing with a friend whether it's better to rent or buy a home", "mood": "analytical", "task": "Present a nuanced case that acknowledges both sides", "starter": "The conventional wisdom is that buying is always better in the long run, but that ignores a few important variables like… and the opportunity cost of…", "grammar": ["the conventional wisdom is that… but that ignores", "the opportunity cost of"], "vocabulary": "equity, flexibility, mortgage, commitment, market, opportunity cost, long-term"}, {"id": 5, "situation": "You're at a dinner party and someone makes a claim you disagree with", "mood": "calm but direct", "task": "Disagree politely but firmly without backing down", "starter": "That's an interesting perspective, but I'd actually challenge the assumption that… The evidence tends to suggest the opposite, especially when you consider…", "grammar": ["I'd actually challenge the assumption that", "especially when you consider"], "vocabulary": "challenge, evidence, perspective, diplomatically, pushback, nuance, distinguish"}, {"id": 6, "situation": "You're telling a close friend about a relationship that ended and why", "mood": "honest", "task": "Explain the real dynamics, not just the surface story", "starter": "What I've come to understand is that it wasn't really about… — that was just the visible part. The deeper issue was that we had fundamentally different…", "grammar": ["it wasn't really about… that was just the visible part", "fundamentally different + noun"], "vocabulary": "incompatible, dynamic, underlying, pattern, honest, realise, evolve, values"}, {"id": 7, "situation": "You're explaining to your team why a project didn't go as planned", "mood": "professional and accountable", "task": "Give a clear analysis without making excuses", "starter": "I want to be honest about what went wrong here. There were three factors I didn't adequately account for: the first was… the second… and looking back, the most preventable was…", "grammar": ["I want to be honest about what went wrong", "looking back, the most preventable was"], "vocabulary": "accountable, factor, preventable, anticipate, honest, lesson, going forward"}, {"id": 8, "situation": "You're having a conversation about whether working from home long-term is good for you", "mood": "reflective", "task": "Give a personal and nuanced assessment", "starter": "Initially I assumed remote work would be ideal for me. What I've actually found is more complicated — I've gained… but I've genuinely lost…", "grammar": ["initially I assumed… what I've actually found", "I've gained… but I've genuinely lost"], "vocabulary": "initial, assumption, trade-off, boundary, isolation, gain, lose, wellbeing"}, {"id": 9, "situation": "You're advising a younger sibling whether to go to university or not", "mood": "thoughtful", "task": "Give real advice that goes beyond the clichés", "starter": "The honest answer is that it depends entirely on what you're hoping university gives you. If it's about… then it absolutely makes sense. If it's about… then I'd push back.", "grammar": ["it depends entirely on what you're hoping", "I'd push back on the idea that"], "vocabulary": "degree, value, alternative, credential, network, skill, assumption, choice"}, {"id": 10, "situation": "You're discussing with a friend whether social media does more harm than good", "mood": "balanced but with a clear view", "task": "Stake out a position and defend it", "starter": "I've thought about this a lot and I've landed on the view that the harm is real but unevenly distributed. The people most affected are… whereas for most adults it's more a question of…", "grammar": ["I've landed on the view that", "the people most affected are… whereas for most"], "vocabulary": "algorithm, curated, vulnerable, unevenly, usage, harm, nuance, distributed"}, {"id": 11, "situation": "You're explaining to your boss why you need a pay rise", "mood": "professional and prepared", "task": "Make a structured, evidence-based case", "starter": "I'd like to make the case for a salary review. Over the past year I've taken on… and delivered… and I've done some research that shows my current rate is below the market average for…", "grammar": ["I'd like to make the case for", "I've done some research that shows"], "vocabulary": "market rate, benchmark, contribution, scope, negotiate, justify, review, evidence"}, {"id": 12, "situation": "You're talking to a friend about a habit you've been trying to break for years", "mood": "candid", "task": "Explain what makes it so persistent and what you've tried", "starter": "What makes this habit so stubborn isn't that I don't know it's a problem — I know exactly what it does to me. The issue is that it serves a function I haven't fully replaced, which is…", "grammar": ["it isn't that I don't know it's a problem", "it serves a function I haven't fully replaced"], "vocabulary": "stubborn, persistent, trigger, function, replace, aware, cycle, substitute"}, {"id": 13, "situation": "You're discussing whether your city is well-designed for its residents", "mood": "critical but constructive", "task": "Identify specific problems and suggest realistic improvements", "starter": "What strikes me most is the gap between how the city imagines itself and how it actually functions day to day. Take… for example — the design clearly prioritised… over the actual needs of…", "grammar": ["the gap between how the city imagines itself and how it actually functions", "the design clearly prioritised… over"], "vocabulary": "urban, resident, infrastructure, design, prioritise, practical, gap, improvement"}, {"id": 14, "situation": "You're debating with a friend whether it's ever justified to lie to protect someone", "mood": "ethical but grounded", "task": "Explore the tension with real examples rather than abstract principles", "starter": "My instinct is that honesty is almost always better, but I can think of specific situations where I wouldn't apply that rule — for instance when… because the cost of honesty there is…", "grammar": ["my instinct is that… but I can think of", "the cost of honesty there is"], "vocabulary": "justified, harm, protect, intention, context, principle, consequence, situational"}, {"id": 15, "situation": "You're explaining to your partner why you need more personal space in the relationship", "mood": "vulnerable but clear", "task": "Communicate the need without making it sound like rejection", "starter": "This isn't about wanting less of you — it's about wanting more of myself. When I don't have time to…, I notice that I become… and that's not fair to either of us.", "grammar": ["this isn't about… it's about", "when I don't have time to, I notice that"], "vocabulary": "space, recharge, autonomy, boundary, need, communicate, resentment, balance"}, {"id": 16, "situation": "You're talking about whether ambition is a virtue or a trap", "mood": "reflective", "task": "Present both sides and share where you've landed", "starter": "I used to see ambition as straightforwardly positive, but the more I've observed it — in myself and others — the more I think there are two very different versions of it…", "grammar": ["I used to see ambition as… but the more I've observed", "two very different versions of it"], "vocabulary": "driven, obsessive, purpose, comparison, cost, healthy, destructive, reflect"}, {"id": 17, "situation": "You're discussing with a colleague whether your company has a toxic culture", "mood": "measured", "task": "Diagnose the issue without turning it into a complaint session", "starter": "I think the challenge isn't any one person — it's the system we've built up over time. The specific things I've noticed are… and what they have in common is that they all reward…", "grammar": ["the challenge isn't any one person — it's the system", "what they have in common is that they all reward"], "vocabulary": "culture, systemic, symptom, norm, reward, pattern, toxic, dysfunction"}, {"id": 18, "situation": "You're talking to a friend who's considering a big move abroad", "mood": "supportive but realistic", "task": "Share both the excitement and the things they should actually prepare for", "starter": "The things people don't warn you about are much more interesting than the obvious ones. I'd say the hardest adjustment for most people isn't the practical stuff but the…", "grammar": ["the things people don
