<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakFlow — Speaking Situation Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #21212b;
    --border: #2e2e3e;
    --accent: #7c6fef;
    --accent2: #e05a8a;
    --text: #e8e8f0;
    --muted: #8888aa;
    --tag-bg: #252535;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
  
  /* LOCK SCREEN */
  #lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:24px}
  #lock h1{font-family:'Syne',sans-serif;font-size:2.8rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  #lock p{color:var(--muted);font-size:1.05rem}
  #lock-form{display:flex;gap:10px;margin-top:8px}
  #pw-input{background:var(--surface);border:1.5px solid var(--border);color:var(--text);padding:12px 18px;border-radius:10px;font-size:1rem;font-family:'DM Sans',sans-serif;outline:none;width:220px;transition:border-color .2s}
  #pw-input:focus{border-color:var(--accent)}
  #pw-btn{background:var(--accent);border:none;color:#fff;padding:12px 22px;border-radius:10px;font-size:1rem;cursor:pointer;font-family:'Syne',sans-serif;font-weight:600;transition:opacity .2s}
  #pw-btn:hover{opacity:.85}
  #lock-err{color:var(--accent2);font-size:.9rem;min-height:20px}

  /* APP */
  #app{display:none;min-height:100vh;padding:24px 20px 60px}
  
  /* HEADER */
  header{max-width:900px;margin:0 auto 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
  .logo{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .tagline{color:var(--muted);font-size:.85rem;font-weight:300}
  .counter-badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:.8rem;color:var(--muted)}
  
  /* CONTROLS */
  .controls{max-width:900px;margin:0 auto 28px;display:flex;gap:10px;flex-wrap:wrap}
  .btn-group{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:5px;flex-wrap:wrap}
  .tog{background:transparent;border:none;color:var(--muted);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.9rem;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .2s}
  .tog.active{background:var(--accent);color:#fff}
  .tog:hover:not(.active){background:var(--surface2);color:var(--text)}

  /* DRAW BUTTON */
  .draw-wrap{max-width:900px;margin:0 auto 32px;text-align:center}
  #draw-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:16px 48px;border-radius:14px;font-size:1.1rem;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;letter-spacing:.02em;transition:transform .15s,opacity .2s;box-shadow:0 4px 24px rgba(124,111,239,.35)}
  #draw-btn:hover{transform:translateY(-2px);opacity:.92}
  #draw-btn:active{transform:scale(.97)}
  .shortcut{color:var(--muted);font-size:.78rem;margin-top:8px}

  /* CARD */
  .card-wrap{max-width:900px;margin:0 auto}
  #card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 40px;animation:slideIn .35s ease;display:none}
  @keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .card-meta{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .badge-lang{background:var(--accent);color:#fff;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:600;font-family:'Syne',sans-serif}
  .badge-level{background:var(--tag-bg);color:var(--muted);padding:4px 10px;border-radius:20px;font-size:.78rem}
  .badge-mood{background:var(--tag-bg);color:var(--accent2);padding:4px 10px;border-radius:20px;font-size:.78rem;font-style:italic}
  .card-id{margin-left:auto;color:var(--border);font-size:.75rem}

  .situation{font-family:'Syne',sans-serif;font-size:1.55rem;font-weight:700;line-height:1.35;margin-bottom:10px;color:var(--text)}
  .task{color:var(--muted);font-size:.95rem;font-style:italic;margin-bottom:24px;line-height:1.5}

  .starter-label{font-size:.72rem;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
  .starter{background:var(--surface2);border-left:3px solid var(--accent);padding:16px 20px;border-radius:0 10px 10px 0;font-size:1rem;line-height:1.6;color:var(--text);margin-bottom:24px;font-style:italic}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:0}
  @media(max-width:580px){.grid2{grid-template-columns:1fr}}
  .info-block{background:var(--tag-bg);border-radius:12px;padding:16px 18px}
  .info-label{font-size:.7rem;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
  .grammar-items{display:flex;flex-direction:column;gap:6px}
  .grammar-item{font-size:.88rem;color:var(--text);padding:5px 10px;background:var(--surface);border-radius:6px;border:1px solid var(--border)}
  .vocab{font-size:.88rem;color:var(--text);line-height:1.6}
  
  /* HISTORY */
  .hist-wrap{max-width:900px;margin:28px auto 0}
  .hist-label{font-size:.72rem;font-weight:600;letter-spacing:.08em;color:var(--border);text-transform:uppercase;margin-bottom:10px}
  .hist-strip{display:flex;gap:8px;flex-wrap:wrap}
  .hist-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:.82rem;color:var(--muted);cursor:pointer;transition:all .2s;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hist-item:hover{border-color:var(--accent);color:var(--text)}
  
  /* EMPTY STATE */
  .empty{max-width:900px;margin:40px auto;text-align:center;color:var(--muted)}
  .empty .big{font-size:3rem;margin-bottom:12px}
  .empty p{font-size:1rem}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <h1>SpeakFlow</h1>
  <p>Speaking Situation Generator · EN · ES · DE</p>
  <div id="lock-form">
    <input type="password" id="pw-input" placeholder="Enter password" autocomplete="off">
    <button id="pw-btn">Enter</button>
  </div>
  <p id="lock-err"></p>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div>
      <div class="logo">SpeakFlow</div>
      <div class="tagline">Speaking Situation Generator</div>
    </div>
    <div class="counter-badge" id="counter-badge">0 / 100</div>
  </header>

  <div class="controls">
    <div class="btn-group" id="lang-group">
      <button class="tog active" data-lang="en">🇬🇧 English</button>
      <button class="tog" data-lang="es">🇪🇸 Español</button>
      <button class="tog" data-lang="de">🇩🇪 Deutsch</button>
    </div>
    <div class="btn-group" id="level-group">
      <button class="tog active" data-level="A1">A1</button>
      <button class="tog" data-level="A2">A2</button>
      <button class="tog" data-level="B1">B1</button>
      <button class="tog" data-level="B2">B2</button>
      <button class="tog" data-level="C1">C1</button>
    </div>
  </div>

  <div class="draw-wrap">
    <button id="draw-btn">🎲 Draw a Situation</button>
    <div class="shortcut">or press <strong>Space</strong></div>
  </div>

  <div class="card-wrap">
    <div id="card">
      <div class="card-meta">
        <span class="badge-lang" id="c-lang"></span>
        <span class="badge-level" id="c-level"></span>
        <span class="badge-mood" id="c-mood"></span>
        <span class="card-id" id="c-id"></span>
      </div>
      <div class="situation" id="c-situation"></div>
      <div class="task" id="c-task"></div>
      <div class="starter-label">Starter phrase</div>
      <div class="starter" id="c-starter"></div>
      <div class="grid2">
        <div class="info-block">
          <div class="info-label">Grammar focus</div>
          <div class="grammar-items" id="c-grammar"></div>
        </div>
        <div class="info-block">
          <div class="info-label">Vocabulary</div>
          <div class="vocab" id="c-vocab"></div>
        </div>
      </div>
    </div>
    <div class="empty" id="empty-state" style="display:none">
      <div class="big">🎯</div>
      <p>Select a language and level, then draw a card!</p>
    </div>
  </div>

  <div class="hist-wrap" id="hist-wrap" style="display:none">
    <div class="hist-label">Recent cards</div>
    <div class="hist-strip" id="hist-strip"></div>
  </div>
</div>

<script>
const SITUATIONS = {
  en: {
    A1: [{"id": 1, "situation": "You meet someone new at a language class", "mood": "friendly", "task": "Say hello and tell them your name and where you're from", "starter": "Hi! My name is… I'm from… Nice to meet you!", "grammar": ["my name is / I'm", "nice to meet you"], "vocabulary": "hello, hi, name, from, country, nice to meet you, pleased"}, {"id": 2, "situation": "You order a coffee in a café", "mood": "relaxed", "task": "Ask for a coffee and pay", "starter": "Can I have a coffee, please? How much is it?", "grammar": ["can I have + noun", "how much is it?"], "vocabulary": "coffee, tea, juice, water, please, thank you, how much, pay"}, {"id": 3, "situation": "You introduce your family to a friend", "mood": "warm", "task": "Describe your family members", "starter": "This is my mum. She's… years old. And this is my brother. He's…", "grammar": ["this is my + family member", "he/she is + age"], "vocabulary": "mum, dad, brother, sister, family, young, old, years old"}, {"id": 4, "situation": "Someone asks how you are", "mood": "casual", "task": "Reply and ask how they are too", "starter": "I'm fine, thanks! And you?", "grammar": ["I'm + adjective", "and you?"], "vocabulary": "fine, good, great, tired, okay, not bad, thanks"}, {"id": 5, "situation": "You're in a supermarket and can't find the milk", "mood": "a bit lost", "task": "Ask a member of staff for help", "starter": "Excuse me, where is the milk, please?", "grammar": ["where is + noun?", "excuse me for politeness"], "vocabulary": "milk, bread, eggs, aisle, left, right, thank you, excuse me"}, {"id": 6, "situation": "You tell someone what you do for work", "mood": "simple and clear", "task": "Say your job and where you work", "starter": "I'm a… I work in a… in…", "grammar": ["I'm a + job", "I work in + place"], "vocabulary": "teacher, nurse, student, office, hospital, school, work"}, {"id": 7, "situation": "Someone asks where you live", "mood": "friendly", "task": "Describe where you live simply", "starter": "I live in… It's a small/big city. I live in a flat/house.", "grammar": ["I live in + place", "it's a + adjective + noun"], "vocabulary": "flat, house, city, town, street, near, centre, suburb"}, {"id": 8, "situation": "You are late to class", "mood": "nervous", "task": "Apologise to the teacher", "starter": "Sorry I'm late! The bus was late.", "grammar": ["sorry I'm late", "the bus was + adjective"], "vocabulary": "sorry, late, bus, problem, excuse me, delay, traffic"}, {"id": 9, "situation": "You ask for directions to the train station", "mood": "lost but calm", "task": "Ask someone how to get there", "starter": "Excuse me, how do I get to the train station?", "grammar": ["how do I get to + place", "excuse me"], "vocabulary": "station, bus stop, straight, left, right, far, near, minutes"}, {"id": 10, "situation": "It's your birthday today", "mood": "happy", "task": "Tell a friend it's your birthday and how old you are", "starter": "Today is my birthday! I'm… years old today!", "grammar": ["today is my birthday", "I'm + age + today"], "vocabulary": "birthday, today, years old, celebrate, cake, party, gift, happy"}, {"id": 11, "situation": "You describe your home to a new friend", "mood": "curious and warm", "task": "Talk about your room or flat simply", "starter": "My flat has two bedrooms. The kitchen is small. I like my room because…", "grammar": ["my flat has + noun", "the kitchen is + adjective"], "vocabulary": "bedroom, kitchen, bathroom, living room, big, small, nice, flat, house"}, {"id": 12, "situation": "You buy a train ticket", "mood": "practical", "task": "Ask for one ticket and pay", "starter": "One ticket to… please. How much is it?", "grammar": ["one ticket to + place", "how much is it?"], "vocabulary": "ticket, single, return, price, platform, station, please"}, {"id": 13, "situation": "You describe the weather today", "mood": "observant", "task": "Say what the weather is like", "starter": "Today it's sunny and warm. It's about 20 degrees.", "grammar": ["today it's + adjective", "it's about + number + degrees"], "vocabulary": "sunny, cloudy, rainy, cold, warm, hot, degrees, weather"}, {"id": 14, "situation": "Someone asks what you eat for breakfast", "mood": "natural", "task": "Describe your usual breakfast", "starter": "I usually have toast and coffee for breakfast. Sometimes I have…", "grammar": ["I usually have + food", "sometimes I have"], "vocabulary": "toast, coffee, tea, cereal, fruit, eggs, breakfast, usually, sometimes"}, {"id": 15, "situation": "You call a friend to arrange to meet", "mood": "friendly", "task": "Suggest a time and place to meet", "starter": "Do you want to meet on Saturday at 3 o'clock? At the café near the park?", "grammar": ["do you want to meet + day", "at + time + at + place"], "vocabulary": "meet, Saturday, o'clock, café, park, near, sounds good, sure"}, {"id": 16, "situation": "You talk about your pet to a classmate", "mood": "enthusiastic", "task": "Describe your pet", "starter": "I have a dog. His name is… He's very friendly and he loves…", "grammar": ["I have a + animal", "his/her name is"], "vocabulary": "dog, cat, rabbit, fish, name, friendly, funny, small, big"}, {"id": 17, "situation": "You ask what time it is", "mood": "polite", "task": "Ask someone for the time and thank them", "starter": "Excuse me, what time is it, please? Thank you!", "grammar": ["what time is it?", "excuse me / thank you"], "vocabulary": "time, o'clock, half past, quarter to, excuse me, thank you"}, {"id": 18, "situation": "You're in a clothes shop looking for a jacket", "mood": "practical", "task": "Ask if they have your size", "starter": "Do you have this jacket in a medium? And in blue?", "grammar": ["do you have + noun + in + size/colour", "and in + colour"], "vocabulary": "jacket, size, small, medium, large, colour, blue, black, try on"}, {"id": 19, "situation": "Someone asks about your favourite food", "mood": "happy", "task": "Name your favourite dish and say why you like it", "starter": "My favourite food is… because it's really… I love it!", "grammar": ["my favourite food is", "because it's + adjective"], "vocabulary": "favourite, pizza, pasta, rice, love, delicious, tasty, sweet, spicy"}, {"id": 20, "situation": "You say goodbye at the end of class", "mood": "warm", "task": "Say goodbye to your classmates and teacher", "starter": "Goodbye everyone! See you next week! Have a nice day!", "grammar": ["goodbye / see you", "have a nice + noun"], "vocabulary": "goodbye, see you, next week, bye, take care, nice day, later"}, {"id": 21, "situation": "You describe a typical day", "mood": "simple", "task": "Talk about what you do every day", "starter": "I wake up at 7. Then I have breakfast and go to work. In the evening I…", "grammar": ["I wake up at + time", "then I + verb"], "vocabulary": "wake up, breakfast, work, lunch, dinner, evening, sleep, then"}, {"id": 22, "situation": "Someone asks if you have any brothers or sisters", "mood": "relaxed", "task": "Talk about your siblings or say you're an only child", "starter": "I have one brother. He's 25. He lives in… / I'm an only child.", "grammar": ["I have + number + brother/sister", "he/she lives in"], "vocabulary": "brother, sister, only child, younger, older, lives in, age"}, {"id": 23, "situation": "You're at the doctor with a cold", "mood": "tired", "task": "Describe your symptoms", "starter": "I have a cold. I have a sore throat and a headache. I feel very tired.", "grammar": ["I have a + symptom", "I feel + adjective"], "vocabulary": "cold, headache, sore throat, fever, tired, doctor, medicine, rest"}, {"id": 24, "situation": "You describe your best friend", "mood": "affectionate", "task": "Say what they look like and what they're like", "starter": "My best friend is called… She's tall with brown hair. She's very funny and kind.", "grammar": ["my best friend is called", "she/he is + adjective"], "vocabulary": "tall, short, hair, funny, kind, friendly, best friend, called"}, {"id": 25, "situation": "You ask about opening hours in a shop", "mood": "practical", "task": "Ask when the shop opens and closes", "starter": "What time do you open? And when do you close?", "grammar": ["what time do you open/close?", "and when do you"], "vocabulary": "open, close, time, morning, afternoon, evening, hours, weekday, weekend"}, {"id": 26, "situation": "You're at a restaurant and order your meal", "mood": "hungry", "task": "Order a starter and a main course", "starter": "For starter I'd like the soup, please. And for the main course, I'll have the chicken.", "grammar": ["for starter I'd like", "for the main course I'll have"], "vocabulary": "starter, main course, soup, chicken, fish, please, bill, water"}, {"id": 27, "situation": "You talk about what sport you do", "mood": "active", "task": "Say which sport you play and how often", "starter": "I play football twice a week. I also go swimming on Sundays.", "grammar": ["I play + sport + frequency", "I also go + activity"], "vocabulary": "football, swimming, tennis, gym, twice a week, on Sundays, sport, active"}, {"id": 28, "situation": "A neighbour says good morning to you", "mood": "cheerful", "task": "Greet them and say something about the weather", "starter": "Good morning! Yes, it's a lovely day, isn't it?", "grammar": ["good morning/afternoon/evening", "it's a lovely + noun"], "vocabulary": "good morning, neighbour, lovely, day, weather, hello, fine"}, {"id": 29, "situation": "You talk about your favourite film", "mood": "enthusiastic", "task": "Name the film and say what type it is", "starter": "My favourite film is… It's a comedy. It's really funny. I love it.", "grammar": ["my favourite film is", "it's a + genre"], "vocabulary": "film, comedy, drama, action, funny, sad, scary, favourite, cinema"}, {"id": 30, "situation": "You ask for help in a pharmacy", "mood": "unwell", "task": "Describe what you need", "starter": "I have a headache. Do you have anything for it?", "grammar": ["I have a + problem", "do you have anything for"], "vocabulary": "pharmacy, headache, painkiller, tablet, please, need, help"}, {"id": 31, "situation": "You tell someone your phone number", "mood": "helpful", "task": "Give your phone number clearly", "starter": "My number is zero seven… You can call me any time.", "grammar": ["my number is", "you can call me"], "vocabulary": "phone, number, call, text, mobile, any time, here you go"}, {"id": 32, "situation": "Someone asks if you can cook", "mood": "honest", "task": "Say what you can and can't cook", "starter": "I can make pasta and omelettes but I can't bake. I'm not a great cook!", "grammar": ["I can make + food", "I can't + verb"], "vocabulary": "cook, pasta, omelette, bake, easy, difficult, great, not bad"}, {"id": 33, "situation": "You're at the airport and your flight is called", "mood": "excited", "task": "Say what's happening", "starter": "My flight is boarding now! I have to go. Bye!", "grammar": ["my flight is boarding", "I have to go"], "vocabulary": "flight, boarding, gate, passport, suitcase, bye, go, excited"}, {"id": 34, "situation": "You talk about your home town", "mood": "nostalgic", "task": "Say where it is and one thing you like about it", "starter": "I'm from… It's a small town in the south. I love the beach there.", "grammar": ["I'm from + place", "it's a + adjective + noun + in"], "vocabulary": "town, city, north, south, beach, mountains, small, big, love"}, {"id": 35, "situation": "Someone asks what you do at weekends", "mood": "casual", "task": "Describe what you usually do", "starter": "At the weekend I like to relax. I watch films and go for walks. Sometimes I meet friends.", "grammar": ["at the weekend I like to", "sometimes I + verb"], "vocabulary": "weekend, relax, walk, film, friends, meet, rest, go out"}, {"id": 36, "situation": "You need to change euros at a bank", "mood": "practical", "task": "Ask to exchange money", "starter": "I'd like to change 100 euros into pounds, please.", "grammar": ["I'd like to change + amount", "into + currency"], "vocabulary": "euros, pounds, change, bank, rate, cash, exchange, please"}, {"id": 37, "situation": "You talk about a book you're reading", "mood": "curious", "task": "Say what the book is about", "starter": "I'm reading a novel. It's about a woman who… I really like it.", "grammar": ["I'm reading a + type of book", "it's about + noun"], "vocabulary": "novel, story, read, like, interesting, exciting, character, about"}, {"id": 38, "situation": "Someone asks your age", "mood": "friendly", "task": "Say how old you are", "starter": "I'm 32 years old. My birthday is in June.", "grammar": ["I'm + age + years old", "my birthday is in + month"], "vocabulary": "years old, birthday, month, January, June, December, age"}, {"id": 39, "situation": "You ask someone to repeat something", "mood": "polite", "task": "Ask them to say it again more slowly", "starter": "Sorry, could you repeat that please? A bit more slowly?", "grammar": ["could you repeat that?", "a bit more slowly"], "vocabulary": "repeat, slowly, sorry, understand, again, pardon, please"}, {"id": 40, "situation": "You say what languages you speak", "mood": "proud", "task": "Say which languages you speak and your level", "starter": "I speak English and a little German. My Spanish is not very good yet.", "grammar": ["I speak + language", "a little / not very good yet"], "vocabulary": "English, Spanish, German, French, speak, understand, a little, learn"}, {"id": 41, "situation": "You describe your daily routine at work", "mood": "matter-of-fact", "task": "Talk about what you do at work each day", "starter": "I start work at 9. I check my emails first. Then I have meetings. I finish at 5.", "grammar": ["I start work at + time", "then I + verb"], "vocabulary": "start, finish, emails, meetings, lunch, break, office, team"}, {"id": 42, "situation": "You're in a café and the waiter gets your order wrong", "mood": "politely surprised", "task": "Explain the mistake", "starter": "Excuse me, I ordered a tea, not f you like living in the city", "mood": "honest", "task": "Say what you like or don't like", "starter": "I love the city because there's always something to do. But it's a bit noisy sometimes.", "grammar": ["I love the city because", "but it's a bit + adjective"], "vocabulary": "city, noisy, busy, convenient, shops, parks, transport, love, like"}, {"id": 49, "situation": "You leave a voicemail for a friend", "mood": "friendly", "task": "Leave a short message", "starter": "Hi, it's… Give me a call when you can. Talk soon! Bye!", "grammar": ["hi, it's + name", "give me a call when you can"], "vocabulary": "voicemail, message, call, ring, later, talk, bye, soon"}, {"id": 50, "situation": "You talk about what you had for dinner last night", "mood": "natural", "task": "Describe what you ate", "starter": "Last night I had pasta with tomato sauce. It was delicious! I made it myself.", "grammar": ["last night I had + food", "it was + adjective"], "vocabulary": "last night, dinner, pasta, salad, chicken, delicious, tasty, made"}, {"id": 51, "situation": "It's the last day of a language course", "mood": "grateful", "task": "Say goodbye and thank the teacher", "starter": "Thank you so much for everything! I learnt a lot. I'll miss this class!", "grammar": ["thank you so much for", "I learnt a lot"], "vocabulary": "thank you, goodbye, class, learn, miss, lovely, great, course"}, {"id": 52, "situation": "You're late to English class and apologise", "mood": "nervous", "task": "Apologise to the teacher and explain why", "starter": "Sorry I'm late. The bus was delayed.", "grammar": ["sorry I'm late", "the bus was + adjective"], "vocabulary": "sorry, late, bus, traffic, excuse me, delayed"}, {"id": 53, "situation": "You show a friend a family photo", "mood": "warm", "task": "Describe your family members", "starter": "This is my mum. Her name is… and she is… years old.", "grammar": ["this is my + family member", "she/he is + age"], "vocabulary": "mum, dad, brother, sister, grandfather, grandmother, young, old"}, {"id": 54, "situation": "A classmate asks about your daily routine", "mood": "relaxed", "task": "Describe what you do every day", "starter": "Every day I wake up at… and then I have breakfast.", "grammar": ["every day I + verb", "and then for sequence"], "vocabulary": "wake up, breakfast, go to work, study, sleep, always"}, {"id": 55, "situation": "You're at a bus stop and don't know the timetable", "mood": "stressed", "task": "Ask which bus goes to the city centre", "starter": "Excuse me, which bus goes to the city centre?", "grammar": ["which bus goes to", "excuse me for politeness"], "vocabulary": "bus, stop, ticket, time, when, centre, wait"}, {"id": 56, "situation": "It's your friend's birthday", "mood": "excited", "task": "Congratulate them", "starter": "Happy birthday! I got you a…", "grammar": ["happy birthday", "I got you a + noun"], "vocabulary": "birthday, gift, cake, present, party, celebrate"}, {"id": 57, "situation": "It is a beautiful sunny day", "mood": "cheerful", "task": "Comment on the weather", "starter": "What a beautiful day! It's really warm and sunny.", "grammar": ["what a + adjective + noun", "it's + adjective"], "vocabulary": "sun, warm, cold, rain, cloudy, weather, lovely"}, {"id": 58, "situation": "You don't understand a word in class", "mood": "confused", "task": "Ask the teacher to repeat", "starter": "Sorry, could you repeat that? I don't understand.", "grammar": ["could you repeat that?", "I don't understand"], "vocabulary": "repeat, understand, slower, explain, sorry, word"}, {"id": 59, "situation": "You're in a clothes shop", "mood": "undecided", "task": "Ask about sizes and colours", "starter": "Do you have this in a size… and in blue?", "grammar": ["do you have + noun", "in + colour / size"], "vocabulary": "T-shirt, size, colour, fitting room, price, buy"}, {"id": 60, "situation": "Today is your birthday", "mood": "happy", "task": "Talk about how you want to celebrate", "starter": "Today is my birthday! I want to celebrate with my friends.", "grammar": ["today is my birthday", "I want to + verb"], "vocabulary": "birthday, party, friends, gift, celebrate, enjoy"}, {"id": 61, "situation": "You arrive at a hotel", "mood": "tired", "task": "Check in and ask for your key", "starter": "Good evening, I have a reservation under the name…", "grammar": ["I have a reservation", "under the name + name"], "vocabulary": "reservation, room, key, floor, breakfast, night"}, {"id": 62, "situation": "You are not feeling well", "mood": "sad", "task": "Tell a friend how you feel", "starter": "I don't feel well. I have a fever and a headache.", "grammar": ["I don't feel well", "I have a + symptom"], "vocabulary": "fever, headache, doctor, tablet, rest, tired, cold"}, {"id": 63, "situation": "You see a cute dog in the park", "mood": "enthusiastic", "task": "Describe the dog to the owner", "starter": "What a cute dog! He is black and has brown eyes.", "grammar": ["what a + adjective + noun", "he/she is + adjective"], "vocabulary": "dog, big, small, cute, black, fur, ears, tail"}, {"id": 64, "situation": "You are planning a picnic", "mood": "excited", "task": "Say what food you want to bring", "starter": "I'll bring sandwiches and water. What will you bring?", "grammar": ["I'll bring + noun", "what will you bring?"], "vocabulary": "sandwich, fruit, water, juice, blanket, park, hungry"}, {"id": 65, "situation": "You are in the library", "mood": "focused", "task": "Ask the librarian for help", "starter": "Excuse me, do you have any books about…?", "grammar": ["do you have + noun about", "excuse me"], "vocabulary": "book, shelf, borrow, library card, return, week, search"}, {"id": 66, "situation": "You are ordering in a restaurant", "mood": "hungry", "task": "Order your meal", "starter": "For starter I'd like… and for the main course I'll have…", "grammar": ["for starter I'd like", "I'll have + dish"], "vocabulary": "starter, main course, dessert, bill, menu, delicious"}, {"id": 67, "situation": "You want to send a postcard", "mood": "relaxed", "task": "Ask for a stamp", "starter": "I'd like to send this postcard to… How much is a stamp?", "grammar": ["I'd like to + verb", "how much is + noun?"], "vocabulary": "postcard, stamp, letter, send, post office, price"}, {"id": 68, "situation": "A friend asks where you live", "mood": "friendly", "task": "Describe your home", "starter": "I live in… My house is near… and next to…", "grammar": ["I live in + place", "near / next to"], "vocabulary": "flat, house, street, neighbourhood, near, opposite"}, {"id": 69, "situation": "You talk about what you did today", "mood": "relaxed", "task": "Describe your day", "starter": "Today I went to the supermarket and then I ate pasta.", "grammar": ["today I went to / I ate", "and then for sequence"], "vocabulary": "went, ate, worked, watched, slept, bought"}, {"id": 70, "situation": "You are at the airport", "mood": "excited", "task": "Say where you're going", "starter": "I'm flying to… for… days. It's my first time.", "grammar": ["I'm flying to + place", "for + number + days"], "vocabulary": "flight, passport, suitcase, gate, boarding, holiday"}, {"id": 71, "situation": "Your neighbour greets you", "mood": "friendly", "task": "Greet them and ask how they are", "starter": "Good morning! How are you?", "grammar": ["good morning / afternoon", "how are you?"], "vocabulary": "good morning, fine, not bad, thank you, see you later"}, {"id": 72, "situation": "You are at a sports centre", "mood": "motivated", "task": "Ask what classes are available", "starter": "Hello, what classes do you have? What time does it start?", "grammar": ["what classes do you have", "what time does + noun + start?"], "vocabulary": "class, yoga, swimming, timetable, price, sign up"}, {"id": 73, "situation": "You watch TV in the evening", "mood": "relaxed", "task": "Talk about your favourite show", "starter": "My favourite show is… because it's really…", "grammar": ["my favourite + noun", "because it's + tuation": "You're at home and hungry", "mood": "creative", "task": "Say what's in the fridge", "starter": "In the fridge I have… I can make…", "grammar": ["in the fridge I have", "I can make + dish"], "vocabulary": "eggs, cheese, milk, vegetables, pasta, fridge, cook"}, {"id": 81, "situation": "A friend asks how your bedroom is", "mood": "descriptive", "task": "Describe the furniture", "starter": "In my bedroom there is/are… The bed is…", "grammar": ["there is / there are", "the bed is + preposition"], "vocabulary": "bed, desk, chair, wardrobe, window, lamp, tidy"}, {"id": 82, "situation": "You are lost in a new city", "mood": "scared but calm", "task": "Ask for directions", "starter": "Excuse me, how do I get to…?", "grammar": ["how do I get to + place", "excuse me"], "vocabulary": "left, right, straight on, traffic lights, square, near"}, {"id": 83, "situation": "It's your first day at a new job", "mood": "nervous", "task": "Introduce yourself to colleagues", "starter": "Hi everyone, I'm new here. My name is… I work in…", "grammar": ["I'm new here", "I work in the + department"], "vocabulary": "work, office, colleague, desk, computer, meeting"}, {"id": 84, "situation": "You are at the doctor", "mood": "tired", "task": "Describe your symptoms", "starter": "I have a cold and a cough for… days.", "grammar": ["I have a + symptom", "for + number + days"], "vocabulary": "cold, cough, throat, fever, days, medicine, rest"}, {"id": 85, "situation": "Someone asks how many languages you speak", "mood": "proud", "task": "Say which languages you speak", "starter": "I speak… a little and… better. I'm learning…", "grammar": ["I speak + language", "a little / well"], "vocabulary": "English, Spanish, German, French, learn, level"}, {"id": 86, "situation": "You're buying fruit at the market", "mood": "friendly", "task": "Ask the price", "starter": "How much are the apples? I'd like… kilos, please.", "grammar": ["how much are?", "I'd like + quantity"], "vocabulary": "apple, orange,
