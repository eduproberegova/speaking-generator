del todo — simplemente cambia de forma. Lo que sí cambia es cómo te relacionas con él. Ahora cuando aparece, lo que hago es…", "grammar": ["el miedo al fracaso nunca desaparece del todo", "lo que sí cambia es cómo te relacionas con él"], "vocabulary": "miedo, fracaso, gestionar, proyecto, relación, práctica, claridad"}, {"id": 85, "situation": "Describes qué tipo de contenido consumes y cómo eso te afecta", "mood": "reflexivo", "task": "Reflexiona sobre tus hábitos de consumo digital", "starter": "Me he vuelto más consciente de lo que dejo entrar. He notado que cuando consumo mucho de… me siento… mientras que cuando paso tiempo con… noto que…", "grammar": ["me he vuelto más consciente de lo que dejo entrar", "mientras que cuando paso tiempo con"], "vocabulary": "consumo, consciente, dieta mediática, afectar, plataforma, selección, calidad"}, {"id": 86, "situation": "Explicas cómo defines la madurez emocional para ti", "mood": "perspicaz", "task": "Ve más allá de los clichés y da tu definición real", "starter": "La madurez emocional no es no sentir las cosas con intensidad — creo que eso es un malentendido. Para mí es más sobre la distancia entre sentir algo y…", "grammar": ["no es no sentir con intensidad — creo que", "es más sobre la distancia entre sentir algo y"], "vocabulary": "regular, responder, reaccionar, impulso, pausa, madurez, integrar, consciente"}, {"id": 87, "situation": "Hablas sobre cómo ha evolucionado tu relación con el dinero", "mood": "honesto", "task": "Muestra la evolución de tu actitud hacia el dinero", "starter": "Cuando era más joven el dinero significaba… Ahora lo veo más como una herramienta que como un objetivo en sí mismo. Lo que cambió fue que…", "grammar": ["cuando era más joven el dinero significaba", "lo veo más como una herramienta que como un objetivo"], "vocabulary": "herramienta, objetivo, seguridad, libertad, actitud, suficiente, valores"}, {"id": 88, "situation": "Describes una conversación que te cambió", "mood": "narrativo", "task": "Narra la historia con detalle emocional", "starter": "No fue una conversación larga ni fue en un momento especialmente importante. Pero algo que esa persona dijo llegó en el momento exacto en que yo necesitaba escucharlo, y…", "grammar": ["llegó en el momento exacto en que yo necesitaba escucharlo", "algo que esa persona dijo"], "vocabulary": "timing, impacto, casual, transformador, palabras, momento, escuchar"}, {"id": 89, "situation": "Explicas qué has aprendido sobre cómo recibir un cumplido", "mood": "autoconsciencia", "task": "Reflexiona sobre por qué cuesta tanto aceptar el reconocimiento", "starter": "Me di cuenta hace un tiempo de que cuando alguien me hacía un cumplido, mi respuesta automática era… en lugar de simplemente… Y empecé a preguntarme de dónde venía esa incomodidad.", "grammar": ["mi respuesta automática era… en lugar de simplemente", "empecé a preguntarme de dónde venía esa incomodidad"], "vocabulary": "reconocimiento, incomodidad, recibir, gratitud, mérito, deflectar, autoconsciencia"}, {"id": 90, "situation": "Describes cómo piensas sobre el tiempo y cómo ha cambiado eso con la edad", "mood": "filosófico pero personal", "task": "Reflexiona sobre cómo el tiempo se siente diferente en distintas etapas", "starter": "Cuando era joven el tiempo parecía infinito. Ahora hay una extraña agudeza en cómo percibo las cosas. Noto detalles que antes pasaba por alto y he dejado de…", "grammar": ["el tiempo parecía infinito", "hay una extraña agudeza en cómo percibo las cosas"], "vocabulary": "finito, priorizar, lento, notar, pasar, saborear, urgencia, perspectiva"}, {"id": 91, "situation": "Explicas por qué crees que la rendición de cuentas es diferente del arrepentimiento", "mood": "maduro", "task": "Haz la distinción con ejemplos", "starter": "La verdadera rendición de cuentas no es solo sentirse mal — es entender el impacto de lo que hiciste, incluso si no fue tu intención. La parte más difícil es…", "grammar": ["la verdadera rendición de cuentas no es solo sentirse mal", "incluso si no fue tu intención"], "vocabulary": "impacto, intención, reparar, consecuencia, propiedad, culpa, vergüenza, cambiar"}, {"id": 92, "situation": "Hablas sobre cómo has cambiado la forma en que ves las primeras impresiones", "mood": "escéptico pero equilibrado", "task": "Explora cuándo son confiables y cuándo no", "starter": "Creo que las primeras impresiones son rápidas y a veces acertadas, pero el problema es que rara vez las actualizamos aunque… El peligro está en tratar un dato como una conclusión.", "grammar": ["rara vez las actualizamos aunque", "el peligro está en tratar un dato como una conclusión"], "vocabulary": "sesgo, heurística, actualizar, instinto, fiable, revisión, confirmar"}, {"id": 93, "situation": "Describes lo que más valoras en una conversación y por qué", "mood": "entusiasta", "task": "Articula las condiciones que hacen una conversación verdaderamente buena", "starter": "Lo que hace que una conversación sea realmente buena para mí no es el tema sino… y la sensación de que ninguno de los dos está actuando. Cuando eso ocurre…", "grammar": ["no es el tema sino", "la sensación de que ninguno de los dos está actuando"], "vocabulary": "presencia, curiosidad, vulnerabilidad, recíproco, escuchar, sorpresa, genuino"}, {"id": 94, "situation": "Hablas de cómo has aprendido a distinguir entre lo urgente y lo importante", "mood": "práctico", "task": "Da ejemplos concretos de cómo aplicas esta distinción", "starter": "Pasé mucho tiempo siendo muy reactivo — respondiendo a lo que parecía urgente en lugar de lo que era… Lo que me ayudó fue darme cuenta de que urgente y importante son categorías distintas.", "grammar": ["respondiendo a lo que parecía urgente en lugar de lo que era", "urgente e importante son categorías distintas"], "vocabulary": "urgente, importante, reactivo, proactivo, prioridad, claridad, foco"}, {"id": 95, "situation": "Describes cómo has aprendido a manejar las expectativas en las relaciones", "mood": "reflexivo", "task": "Habla sobre lo que funciona y lo que no en la gestión de expectativas", "starter": "Lo que más problemas me ha causado en las relaciones no son los desacuerdos abiertos sino las expectativas no expresadas. He aprendido que la única solución es…", "grammar": ["no son los desacuerdos abiertos sino las expectativas no expresadas", "la única solución es"], "vocabulary": "expectativa, no expresada, comunicar, decepción, acuerdo, claridad, asumir"}, {"id": 96, "situation": "Explicas qué defines como una vida bien vivida", "mood": "personal", "task": "Ve más allá de los clichés y sé concreto", "starter": "Una vida bien vivida para mí no significa… aunque durante mucho tiempo pensé que sí. Lo que ha cambiado es…", "grammar": ["no significa… aunque durante mucho tiempo pensé que sí", "lo que ha cambiado es"], "vocabulary": "sentido, valor, suficiente, auténtico, relaciones, experiencias, crecimiento"}, {"id": 97, "situation": "Hablas sobre por qué el aburrimiento productivo es algo que proteges activamente", "mood": "reflexivo", "task": "Explica por qué el aburrimiento tiene valor que la gente pasa por alto", "starter": "Hemos eliminado casi completamente el aburrimiento de nuestras vidas y creo que hemos perdido algo importante. Para mí, los momentos más creativos suelen venir después de…", "grammar": ["hemos eliminado casi completamente el aburrimiento", "los momentos más creativos suelen venir después de"], "vocabulary": "aburrimiento, creatividad, inactividad, espacio, proteger, activamente, valor"}, {"id": 98, "situation": "Describes cómo cambió tu relación con la crítica tras una experiencia concreta", "mood": "autoconsciencia", "task": "Narra el momento que cambió cómo recibes el feedback", "starter": "Hubo un momento concreto en que me di cuenta de que mi defensividad automática estaba costándome cosas importantes. Lo que cambió fue que empecé a preguntarme antes de responder si…", "grammar": ["mi defensividad automática estaba costándome cosas importantes", "empecé a preguntarme antes de responder si"], "vocabulary": "defensividad, coste, automático, responder, preguntar, feedback, perspectiva"}, {"id": 99, "situation": "Hablas sobre cómo se siente pertenecer a una cultura que no es la de tu nacimiento", "mood": "personal", "task": "Reflexiona sobre la complejidad de la identidad cultural", "starter": "Hay una libertad extraña en estar entre dos culturas — ves cada una desde fuera. Pero el precio es que a veces sientes que no perteneces del todo a…", "grammar": ["hay una libertad extraña en estar entre dos culturas", "el precio es que a veces sientes que no perteneces"], "vocabulary": "pertenencia, híbrido, tercera cultura, foráneo, interior, cambiar de registro, identidad"}, {"id": 100, "situation": "Describes qué te ha enseñado mantener un compromiso a largo plazo", "mood": "maduro", "task": "Reflexiona sobre lo que aprendes de perseverar cuando es difícil", "starter": "Lo más revelador sobre los compromisos a largo plazo no es el principio — es lo que pasa cuando el entusiasmo inicial se acaba y tienes que elegir activamente si seguir porque…", "grammar": ["lo más revelador no es el principio — es lo que pasa cuando", "tienes que elegir activamente si seguir porque"], "vocabulary": "compromiso, largo plazo, entusiasmo, perseverancia, elección, razón, disciplina"}],
  },
  de: {
    A1: [{"id": 1, "situation": "Du bist zum ersten Mal in einem deutschen Café", "mood": "schüchtern und freundlich", "task": "Bestell einen Kaffee und ein Stück Kuchen", "starter": "Entschuldigung, ich hätte gern einen… und ein Stück…, bitte.", "grammar": ["ich hätte gern + Akkusativ", "bitte für Höflichkeit"], "vocabulary": "Kaffee, Tee, Kuchen, Wasser, Saft, bitte, danke, wie viel"}, {"id": 2, "situation": "Du lernst einen neuen Klassenkameraden kennen", "mood": "neugierig und offen", "task": "Stell dich vor und frage nach dem Namen", "starter": "Hallo, ich heiße… Wie heißt du?", "grammar": ["heißen (Präsens)", "wie + Adjektiv als Frage"], "vocabulary": "Name, heißen, woher, kommen, nett, schön, freut mich"}, {"id": 3, "situation": "Du bist im Supermarkt und findest die Milch nicht", "mood": "etwas verwirrt", "task": "Frage einen Mitarbeiter nach dem Regal", "starter": "Entschuldigung, wo ist die Milch, bitte?", "grammar": ["wo + sein (Präsens)", "Artikel: die/der/das"], "vocabulary": "Milch, Brot, Regal, links, rechts, geradeaus, danke"}, {"id": 4, "situation": "Du kommst zu spät zum Deutschkurs", "mood": "nervös und eilig", "task": "Entschuldige dich beim Lehrer", "starter": "Entschuldigung, ich komme zu spät. Der Bus hatte Verspätung.", "grammar": ["zu spät kommen", "haben + Substantiv"], "vocabulary": "Entschuldigung, spät, Bus, Verspätung, Problem, sorry"}, {"id": 5, "situation": "Du zeigst einem Freund ein Familienfoto", "mood": "herzlich und nostalgisch", "task": "Beschreibe deine Familienmitglieder", "starter": "Das ist meine Mutter. Sie heißt… und ist… Jahre alt.", "grammar": ["das ist + Nominativ", "sein + Adjektiv"], "vocabulary": "Mutter, Vater, Bruder, Schwester, alt, jung, groß, klein"}, {"id": 6, "situation": "Es ist Montag und jemand fragt nach deiner Routine", "mood": "entspannt", "task": "Beschreibe deinen typischen Tag", "starter": "Ich stehe um… Uhr auf. Dann frühstücke ich und gehe zur Arbeit.", "grammar": ["trennbare Verben: aufstehen", "dann + Verb"], "vocabulary": "aufstehen, frühstücken, arbeiten, schlafen, immer, manchmal"}, {"id": 7, "situation": "Du wartest an der Bushaltestelle und weißt nicht, welcher Bus fährt", "mood": "etwas gestresst", "task": "Frage nach dem richtigen Bus", "starter": "Entschuldigung, welcher Bus fährt zum Zentrum?", "grammar": ["welcher + Substantiv", "fahren (Präsens)"], "vocabulary": "Bus, Zug, Haltestelle, Fahrschein, Uhrzeit, wann, wohin"}, {"id": 8, "situation": "Es ist der Geburtstag deines Freundes", "mood": "fröhlich", "task": "Gratuliere und beschreibe, was du schenkst", "starter": "Herzlichen Glückwunsch zum Geburtstag! Ich habe dir… gekauft.", "grammar": ["Herzlichen Glückwunsch", "kaufen im Perfekt"], "vocabulary": "Geburtstag, Geschenk, Blumen, Buch, Musik, Party, Torte"}, {"id": 9, "situation": "Es ist ein sonniger Tag", "mood": "gut gelaunt", "task": "Kommentiere das Wetter mit einem Nachbarn", "starter": "Was für ein schönes Wetter heute! Es ist warm und die Sonne scheint.", "grammar": ["Was für ein + Adjektiv!", "scheinen, Präsens"], "vocabulary": "Sonne, warm, kalt, Regen, Wind, Grad, Wetter, schön"}, {"id": 10, "situation": "Du verstehst ein Wort nicht", "mood": "konzentriert aber verwirrt", "task": "Bitte den Lehrer, es zu wiederholen", "starter": "Entschuldigung, können Sie das bitte wiederholen? Ich verstehe das Wort nicht.", "grammar": ["können + Infinitiv", "bitte für Höflichkeit"], "vocabulary": "wiederholen, verstehen, bedeuten, langsam, erklären, Wort"}, {"id": 11, "situation": "Du suchst ein T-Shirt im Geschäft", "mood": "unschlüssig", "task": "Frage nach Größen und Farben", "starter": "Haben Sie das T-Shirt in Größe… und in Blau?", "grammar": ["haben Sie + Akkusativ", "in + Farbe/Größe"], "vocabulary": "T-Shirt, Hose, Größe, Farbe, rot, blau, Umkleidekabine, Preis"}, {"id": 12, "situation": "Es ist dein Geburtstag", "mood": "glücklich", "task": "Erzähl, wie du feiern möchtest", "starter": "Heute ist mein Geburtstag! Ich möchte mit meinen Freunden feiern.", "grammar": ["ich möchte + Infinitiv", "heute + Präsens"], "vocabulary": "Geburtstag, feiern, Freunde, Torte, Kerzen, Geschenke, toll"}, {"id": 13, "situation": "Du checkst in einem Hotel ein", "mood": "müde aber höflich", "task": "Melde dich an der Rezeption an", "starter": "Guten Abend, ich habe eine Reservierung auf den Namen…", "grammar": ["ich habe eine Reservierung", "auf den Namen + Name"], "vocabulary": "Reservierung, Zimmer, Schlüssel, Etage, Frühstück, Nacht, Doppelzimmer"}, {"id": 14, "situation": "Du bist krank und hast Fieber", "mood": "müde und unwohl", "task": "Erkläre einem Freund, wie du dich fühlst", "starter": "Mir geht es nicht gut. Ich habe Fieber und Kopfschmerzen.", "grammar": ["mir geht es nicht gut", "haben + Krankheit"], "vocabulary": "Fieber, Kopfschmerzen, Halsschmerzen, Arzt, Tablette, ruhen"}, {"id": 15, "situation": "Du siehst einen schönen Hund im Park", "mood": "begeistert", "task": "Beschreibe das Tier dem Besitzer", "starter": "Was für ein süßer Hund! Er ist schwarz und hat braune Augen.", "grammar": ["Was für ein + Adjektiv!", "sein + Adjektiv"], "vocabulary": "Hund, Katze, groß, klein, süß, schwarz, Fell, Ohren, Augen"}, {"id": 16, "situation": "Du planst ein Picknick mit Freunden", "mood": "aufgeregt und organisiert", "task": "Sag, was du mitbringen möchtest", "starter": "Ich bringe Sandwichs und Wasser mit. Was bringst du?", "grammar": ["mitbringen", "Was + bringst du?"], "vocabulary": "Sandwich, Obst, Wasser, Saft, Decke, Park, Sonne, Hunger"}, {"id": 17, "situation": "Du bist in der Bibliothek und suchst ein Buch", "mood": "konzentriert", "task": "Bitte den Bibliothekar um Hilfe", "starter": "Entschuldigung, haben Sie Bücher über…?", "grammar": ["haben Sie + Akkusativ", "über + Thema"], "vocabulary": "Buch, Regal, ausleihen, Ausweis, Woche, zurückgeben, Thema"}, {"id": 18, "situation": "Du bist im Restaurant und wählst vom Menü", "mood": "hungrig und neugierig", "task": "Bestell dein Gericht beim Kellner", "starter": "Als Vorspeise möchte ich… und als Hauptgericht hätte ich gern…", "grammar": ["als Vorspeise/Hauptgericht", "ich möchte / hätte gern"], "vocabulary": "Vorspeise, Hauptgericht, Nachspeise, Getränk, Rechnung, lecker"}, {"id": 19, "situation": "Du willst eine Postkarte abschicken", "mood": "entspannt", "task": "Frag nach Briefmarken und Preisen", "starter": "Ich möchte diese Postkarte nach… schicken. Was kostet eine Briefmarke?", "grammar": ["ich möchte + Infinitiv", "was kostet?"], "vocabulary": "Postkarte, Briefmarke, Brief, Adresse, schicken, Post, Preis"}, {"id": 20, "situation": "Ein neuer Freund fragt, wo du wohnst", "mood": "freundlich", "task": "Beschreibe, wo dein Haus liegt", "starter": "Ich wohne in… Mein Haus ist in der Nähe von… und neben…", "grammar": ["ich wohne in", "in der Nähe von / neben"], "vocabulary": "Wohnung, Haus, Straße, Viertel, nah, weit, neben, gegenüber"}, {"id": 21, "situation": "Du legst dich schlafen und denkst an den Tag", "mood": "entspannt und müde", "task": "Erzähl, was du heute gemacht hast", "starter": "Heute bin ich in den Supermarkt gegangen und habe… gegessen.", "grammar": ["Perfekt: sein + Partizip / haben + Partizip", "heute + Vergangenheit"], "vocabulary": "gegangen, gegessen, getrunken, gearbeitet, geschlafen, gesehen, heute"}, {"id": 22, "situation": "Du bist am Flughafen und wartest auf deinen Flug", "mood": "aufgeregt und nervös", "task": "Sag, wohin du fliegst und wie lange du bleibst", "starter": "Ich fliege nach… für… Tage. Es ist meine erste Reise dorthin.", "grammar": ["fliegen nach", "für + Zeitraum"], "vocabulary": "Flug, Pass, Koffer, Gate, Urlaub, Reise, Hotel, Wochen"}, {"id": 23, "situation": "Dein Nachbar grüßt dich morgens", "mood": "freundlich", "task": "Grüße ihn und frag, wie es ihm geht", "starter": "Guten Morgen! Wie geht es Ihnen?", "grammar": ["Guten Morgen / Tag / Abend", "Wie geht es Ihnen/dir?"], "vocabulary": "Guten Morgen, gut, schlecht, so lala, danke, tschüss, bis später"}, {"id": 24, "situation": "Du bist in einem Sportzentrum und möchtest einen Kurs besuchen", "mood": "motiviert", "task": "Frag nach Kursen und Zeiten", "starter": "Hallo, welche Kurse haben Sie? Wann beginnt…?", "grammar": ["welche Kurse haben Sie", "wann + beginnen"], "vocabulary": "Kurs, Yoga, Schwimmen, Fußball, Montag, Uhrzeit, Preis, anmelden"}, {"id": 25, "situation": "Du schaust abends Fernsehen", "mood": "entspannt", "task": "Erzähl von deiner Lieblingssendung", "starter": "Meine Lieblingssendung ist… weil sie sehr… ist.", "grammar": ["weil + Verb am Satzende", "sein + Adjektiv"], "vocabulary": "Serie, Film, Dokumentation, Kanal, lustig, langweilig, interessant"}, {"id": 26, "situation": "Du bist in der Apotheke mit Kopfschmerzen", "mood": "unwohl", "task": "Bitte um ein Medikament", "starter": "Ich habe Kopfschmerzen. Haben Sie etwas dagegen?", "grammar": ["Ich habe + Schmerzen", "haben Sie etwas dagegen?"], "vocabulary": "Aspirin, Tablette, Rezept, Schmerzen, Magen, Allergie, empfehlen"}, {"id": 27, "situation": "Dein Lehrer fragt nach deinem Lieblingsfach", "mood": "nachdenklich", "task": "Nenne dein Lieblingsfach und erkläre warum", "starter": "Mein Lieblingsfach ist…, weil es… ist.", "grammar": ["Lieblingsfach sein", "weil + Verb am Satzende"], "vocabulary": "Mathe, Geschichte, Englisch, Sport, Kunst, leicht, schwer, interessant"}, {"id": 28, "situation": "Du wählst zwischen zwei Pizzen", "mood": "unschlüssig und hungrig", "task": "Vergleiche sie und wähle eine", "starter": "Diese Pizza hat Käse und Schinken, aber jene hat… Ich nehme…", "grammar": ["diese… aber jene", "ich nehme + Akkusativ"], "vocabulary": "Pizza, Käse, Schinken, Pilze, groß, klein, Preis, bestellen"}, {"id": 29, "situation": "Du redest mit einem Freund über Lieblingsfarben", "mood": "locker und spontan", "task": "Sag, welche Farben du magst und welche nicht", "starter": "Ich mag Blau sehr gern, aber ich mag Gelb nicht so gern.", "grammar": ["ich mag + Akkusativ", "nicht so gern"], "vocabulary": "Rot, Blau, Grün, Gelb, Weiß, Schwarz, Lieblingsfarbe, mögen"}, {"id": 30, "situation": "Du bist im Deutschkurs und der Lehrer fragt nach deinen Hobbys", "mood": "aufgeregt", "task": "Beschreibe, was du in deiner Freizeit machst", "starter": "Am Wochenende spiele ich… und manchmal gehe ich auch…", "grammar": ["am Wochenende + Verb", "manchmal + Verb"], "vocabulary": "spielen, lesen, kochen, spazieren, Musik, Freunde, Familie"}, {"id": 31, "situation": "Du siehst ein Foto einer Stadt", "mood": "neugierig", "task": "Beschreibe, was du siehst", "starter": "Auf dem Foto sehe ich… Es gibt… Die Stadt ist sehr…", "grammar": ["es gibt + Akkusativ", "die Stadt ist + Adjektiv"], "vocabulary": "Gebäude, Straße, Park, Menschen, groß, schön, modern, alt"}, {"id": 32, "situation": "Du bist zu Hause und hast Hunger, aber wenig im Kühlschrank", "mood": "kreativ und hungrig", "task": "Sag, was du hast und was du machen kannst", "starter": "Im Kühlschrank habe ich… Ich kann damit… kochen.", "grammar": ["im Kühlschrank haben", "ich kann + Infinitiv"], "vocabulary": "Eier, Käse, Milch, Gemüse, Nudeln, Reis, kochen, Zutaten"}, {"id": 33, "situation": "Ein Freund fragt dich, wie dein Zimmer ist", "mood": "beschreibend", "task": "Beschreibe dein Zimmer", "starter": "In meinem Zimmer gibt es… Das Bett steht…", "grammar": ["es gibt + Akkusativ", "stehen + Ort"], "vocabulary": "Bett, Tisch, Stuhl, Schrank, Fenster, Lampe, groß, ordentlich"}, {"id": 34, "situation": "Du bist in einer neuen Stadt und hast dich verlaufen", "mood": "etwas ängstlich aber ruhig", "task": "Bitte jemanden um Hilfe", "starter": "Entschuldigung, wie komme ich zum…?", "grammar": ["wie komme ich zu", "Wegbeschreibung"], "vocabulary": "links, rechts, geradeaus, Ampel, Platz, U-Bahn, nah, weit"}, {"id": 35, "situation": "Es ist dein erster Arbeitstag", "mood": "nervös aber positiv", "task": "Stell dich den neuen Kollegen vor", "starter": "Hallo an alle, ich bin neu hier. Ich heiße… und arbeite in der Abteilung…", "grammar": ["ich bin neu hier", "ich arbeite in der Abteilung"], "vocabulary": "Arbeit, Büro, Kollege, Chef, Schreibtisch, Computer, Besprechung"}, {"id": 36, "situation": "Du bist beim Arzt mit einem Schnupfen", "mood": "müde und krank", "task": "Beschreibe deine Symptome", "starter": "Guten Tag, Doktor. Ich habe einen Schnupfen und Husten seit… Tagen.", "grammar": ["seit + Zeitraum + Dativ", "ich habe + Symptom"], "vocabulary": "Schnupfen, Husten, Hals, Fieber, Tage, Medikament, Ruhe, Krankenhaus"}, {"id": 37, "situation": "Jemand fragt dich, wie viele Sprachen du sprichst", "mood": "stolz", "task": "Sag, welche Sprachen du sprichst und wie gut", "starter": "Ich spreche… gut und… ein bisschen. Ich lerne gerade…", "grammar": ["sprechen + Sprache", "ich lerne gerade"], "vocabulary": "Deutsch, Englisch, Spanisch, gut, bisschen, lernen, Niveau"}, {"id": 38, "situation": "Du kaufst Obst auf dem Markt", "mood": "freundlich und praktisch", "task": "Frag nach dem Preis und der Menge", "starter": "Was kostet ein Kilo Äpfel? Ich nehme bitte… Kilo.", "grammar": ["was kostet + Substantiv", "ich nehme… Kilo"], "vocabulary": "Apfel, Orange, Banane, Kilo, Preis, teuer, günstig, frisch, Markt"}, {"id": 39, "situation": "Ein Freund fragt dich nach deinen Hobbys", "mood": "entspannt und aufgeschlossen", "task": "Beschreibe deine Freizeitaktivitäten", "starter": "In meiner Freizeit lese ich gern und gehe manchmal ins Kino.", "grammar": ["in meiner Freizeit + Verb", "gern / manchmal"], "vocabulary": "lesen, Musik hören, kochen, Sport, Kino, reisen, Freunde treffen"}, {"id": 40, "situation": "Du bist in einem Kochkurs und der Koch fragt, was du kochen kannst", "mood": "leicht verlegen", "task": "Sag, was du kochst und was nicht", "starter": "Ich kann… kochen, aber ich kann noch nicht… machen.", "grammar": ["ich kann + Infinitiv", "noch nicht + Infinitiv"], "vocabulary": "kochen, Tortilla, Pasta, Salat, einfach, schwer, Rezept, Zutaten"}, {"id": 41, "situation": "Dein Freund zeigt dir sein neues Ha ur beträgt etwa… Grad.", "grammar": ["es ist + Adjektiv", "die Temperatur beträgt"], "vocabulary": "Sonne, Wolken, Regen, Wind, Grad, Himmel, bewölkt, klar, kalt, warm"}, {"id": 100, "situation": "Es ist dein letzter Tag im Deutschkurs", "mood": "nostalgisch und dankbar", "task": "Verabschiede dich von allen", "starter": "Es hat mir sehr viel Spaß gemacht! Ich habe viel gelernt und hoffe, wir bleiben in Kontakt.", "grammar": ["es hat mir Spaß gemacht", "ich hoffe, wir bleiben in Kontakt"], "vocabulary": "Abschied, Kontakt, lernen, Freundschaft, wiedersehen, viel Glück, danke"}],

tion, Wert, Gemeinschaft, Fest, Essen, Musik, Identität"}, {"id": 95, "situation": "Du erzählst von einem unerwarteten Erlebnis", "mood": "überrascht", "task": "Erzähl von etwas Unerwartetem das dir passiert ist", "starter": "Ich hätte nie gedacht, dass… Aber dann passierte es tatsächlich: Als ich…", "grammar": ["ich hätte nie gedacht, dass", "als + Präteritum (narrativ)"], "vocabulary": "unerwartet, Überraschung, Zufall, Begegnung, unglaublich, Moment, Erinnerung"}, {"id": 96, "situation": "Du beschreibst eine neue Gewohnheit die du adoptiert hast", "mood": "motiviert", "task": "Erkläre eine neue positive Gewohnheit", "starter": "Seit ein paar Monaten mache ich jeden Morgen… Es hat mir geholfen, weil…", "grammar": ["seit + Zeitangabe + Dativ", "es hat mir geholfen, weil"], "vocabulary": "Morgenroutine, meditieren, Sport, Tagebuch, gesünder, Energie, Fokus"}, {"id": 97, "situation": "Du sprichst über das Thema Heimweh", "mood": "nachdenklich", "task": "Beschreibe was du aus der Heimat am meisten vermisst", "starter": "Was ich am meisten vermisse, wenn ich weg bin, ist… Besonders das Essen und…", "grammar": ["was ich am meisten vermisse, ist", "besonders + Substantiv"], "vocabulary": "Heimweh, Heimat, vermissen, Familie, Essen, Sprache, vertraut, Geborgenheit"}, {"id": 98, "situation": "Du erklärst jemandem ein deutsches Wort das keine Übersetzung hat", "mood": "amüsiert", "task": "Erkläre ein deutsches Konzept", "starter": "Kennst du das Wort… ? Es gibt keine direkte Übersetzung, aber es bedeutet in etwa…", "grammar": ["kennst du das Wort?", "es bedeutet in etwa + Paraphrase"], "vocabulary": "Gemütlichkeit, Weltschmerz, Schadenfreude, Bedeutung, Konzept, Wort, erklären"}, {"id": 99, "situation": "Du redest über einen Freund der umgezogen ist", "mood": "einfühlsam", "task": "Sprich darüber wie es dem Freund geht und wie ihr Kontakt haltet", "starter": "Mein Freund ist vor… Monaten nach… gezogen. Wir halten uns per… in Kontakt.", "grammar": ["vor + Zeitangabe + Dativ" mar": ["bleibt + Adjektiv", "obwohl + Verb am Satzende"], "vocabulary": "Konzentration, Wortschatz, Empathie, Vorstellungskraft, Gewohnheit"}, {"id": 70, "situation": "Du reagierst auf eine Ungerechtigkeit", "mood": "empört", "task": "Erzähle das Ereignis und dein Handeln", "starter": "Als ich sah was gerade passierte, konnte ich nicht untätig bleiben. Ich entschied… weil ich dachte, dass…", "grammar": ["konnte nicht + Infinitiv", "entschied ich + zu"], "vocabulary": "Ungerechtigkeit, Reaktion, Mut, Konsequenz, Zeugnis"}, {"id": 71, "situation": "Du sprichst über deine Lernmotivation", "mood": "motiviert", "task": "Erkläre innere und äußere Motivationsquellen", "starter": "Was mich am meisten motiviert weiterzulernen ist… Außerdem weiß ich, dass Wissen mir ermöglicht… Wenn ich Fortschritte spüre…", "grammar": ["was mich am meisten motiviert ist", "wenn ich Fortschritte spüre"], "vocabulary": "Motivation, Neugier, Fortschritt, Wissen, Zufriedenheit"}, {"id": 72, "situation": "Du erklärst den Unterschied zwischen Information und Wissen", "mood": "didaktisch", "task": "Entwickle das Konzept mit Beispielen", "starter": "Wir leben im Informationszeitalter, aber das bedeutet nicht, dass wir mehr Wissen haben. Information ist… während Wissen…", "grammar": ["bedeutet nicht, dass + Konjunktiv", "während für Kontrast"], "vocabulary": "Daten, Verständnis, Analyse, Synthese, digital"}, {"id": 73, "situation": "Du sprichst über Kapitalismuskritik", "mood": "analytisch", "task": "Analysiere Stärken und Schwächen", "starter": "Der Kapitalismus hat unleugbare Leistungen, erzeugt aber auch tiefe Ungleichheiten. Eine seiner Hauptkritiken ist, dass…", "grammar": ["hat unleugbare Leistungen aber erzeugt", "eine seiner Hauptkritiken ist, dass"], "vocabulary": "Ungleichheit, Markt, Ausbeutung, Konsumismus, Alternative"}, {"id": 74, "situation": "Du beschreibst einen schwerwiegenden Fehler", "mood": "mutig", "task": "Erzähle und reflektiere", "starter": "Ich machte einen Fehler der mir da üren"], "vocabulary": "Emotion, Empathie, Verwaltung, Wohlbefinden, Schule"}, {"id": 94, "situation": "Du schließt einen Kurs mit einer Reflexion ab", "mood": "dankbar", "task": "Sprich über Gelerntes und nächste Schritte", "starter": "In diesem Kurs habe ich viel gelernt. Was mich am meisten überrascht hat war… Ich freue mich darauf, jetzt…", "grammar": ["Perfekt: habe gelernt", "ich freue mich darauf, zu"], "vocabulary": "Fortschritt, Selbstvertrauen, verbessern, weitermachen, Motivation"}, {"id": 95, "situation": "Du sprichst über die Rolle der Philosophie im Alltag", "mood": "zugänglich", "task": "Argumentiere warum jeder philosophieren sollte", "starter": "Philosophie ist kein akademischer Luxus: Sie ist das Werkzeug das uns erlaubt zu hinterfragen, was wir als selbstverständlich annehmen.", "grammar": ["kein… sondern das Werkzeug", "was wir als selbstverständlich annehmen"], "vocabulary": "Philosophie, Reflexion, alltäglich, Annahme, hinterfragen"}, {"id": 96, "situation": "Du diskutierst ob Wettbewerb in der Schule gesund ist", "mood": "pädagogisch", "task": "Analysiere Vor- und Nachteile", "starter": "Einerseits kann schulischer Wettbewerb motivieren. Andererseits kann er auch zu Angst und Vergleich führen. Das Gleichgewicht liegt in…", "grammar": ["einerseits… andererseits", "das Gleichgewicht liegt in"], "vocabulary": "Wettbewerb, Motivation, Angst, Vergleich, Zusammenarbeit"}, {"id": 97, "situation": "Du beschreibst eine Begegnung mit einer fremden Kultur", "mood": "offen", "task": "Erzähle von dem was dich überrascht hat", "starter": "Als ich zum ersten Mal in… war, überraschte mich sehr, dass die Menschen dort… Im Gegensatz zu meiner Heimat…", "grammar": ["als + Präteritum (narrativ)", "im Gegensatz zu"], "vocabulary": "Kultur, Überraschung, Gewohnheit, Unterschied, anpassen"}, {"id": 98, "situation": "Du argumentierst für mehr Grünflächen in der Stadt", "mood": "bürgerlich", "task": "Präsentiere deine Argumente", "starter": "Städtische Grünflächen sind     B2: [{"id": 1, "situation": "Du debattierst mit einem Kollegen ob Großraumbüros die Produktivität wirklich verbessern", "mood": "skeptisch", "task": "Argumentiere deine Position mit konkreten Beispielen", "starter": "Ich stehe der Annahme skeptisch gegenüber dass Großraumbüros die Zusammenarbeit fördern. In meiner Erfahrung passiert eher das Gegenteil, weil…", "grammar": ["ich stehe der Annahme skeptisch gegenüber dass", "in meiner Erfahrung passiert eher das Gegenteil weil"], "vocabulary": "Produktivität, Ablenkung, Zusammenarbeit, Mythos, Konzentration, Unterbrechung, Design"}, {"id": 2, "situation": "Du erklärst einem Freund warum du einen gut bezahlten Job aufgegeben hast", "mood": "ehrlich und reflektiv", "task": "Geh über 'ich war unglücklich' hinaus und erkläre was dich wirklich dazu gebracht hat", "starter": "Es war kein einzelner Moment der mich dazu brachte zu kündigen — es war ein schrittweises Erkennen dass egal wie viel sie mir zahlten, ich…", "grammar": ["es war kein einzelner Moment", "egal wie viel sie mir zahlten ich"], "vocabulary": "Entscheidung, Autonomie, Zweck, Kompensation, Opfer, Wendepunkt, Schwelle"}, {"id": 3, "situation": "Du bist in einem Bewerbungsgespräch und wirst nach einem Fehler gefragt", "mood": "gefasst und vorbereitet", "task": "Verwandele das Versagen in Beweis für Selbstbewusstsein und Wachstum", "starter": "Das Versagen über das ich am liebsten spreche ist… weil es mir etwas beigebracht hat das ich jetzt täglich anwende, nämlich…", "grammar": ["das Versagen über das ich am liebsten spreche ist", "es hat mir etwas beigebracht das ich jetzt anwende"], "vocabulary": "transparent, Verantwortung, lernen, Ergebnis, erholen, demonstrieren, Kontext"}, {"id": 4, "situation": "Du besprichst mit einem Freund ob man mieten oder kaufen sollte", "mood": "analytisch", "task": "Präsentiere eine ausgewogene Sicht die beide Seiten anerkennt", "starter": "Die konventionelle Weisheit sagt dass kaufen langfristig immer besser ist aber das ignoriert wichtige Variablen wie… und die Opportunitätskosten von…", "grammar": ["die konventionelle Weisheit sagt dass aber das ignoriert", "die Opportunitätskosten von"], "vocabulary": "Hypothek, Flexibilität, Eigenkapital, Verpflichtung, Markt, Opportunitätskosten, langfristig"}, {"id": 5, "situation": "Du bist beim Abendessen und jemand behauptet etwas womit du nicht einverstanden bist", "mood": "ruhig aber direkt", "task": "Widerspreche höflich aber bestimmt", "starter": "Das ist eine interessante Perspektive aber ich würde die Annahme in Frage stellen dass… Die Belege deuten eher in die entgegengesetzte Richtung besonders wenn man…", "grammar": ["ich würde die Annahme in Frage stellen dass", "besonders wenn man berücksichtigt"], "vocabulary": "hinterfragen, Belege, Perspektive, diplomatisch, Nuance, unterscheiden, widersprechen"}, {"id": 6, "situation": "Du erklärst einem Freund eine Beziehung die endete und warum", "mood": "ehrlich", "task": "Erkläre die echte Dynamik nicht nur die Oberfläche", "starter": "Was ich verstanden habe ist dass es eigentlich nicht um… ging — das war nur der sichtbare Teil. Das tiefere Problem war dass wir grundlegend unterschiedliche…", "grammar": ["es war eigentlich nicht um — das war nur der sichtbare Teil", "grundlegend unterschiedliche"], "vocabulary": "inkompatibel, Dynamik, zugrunde liegend, Muster, ehrlich, verstehen, entwickeln, Werte"}, {"id": 7, "situation": "Du erklärst deinem Team warum ein Projekt nicht wie geplant verlief", "mood": "professionell und verantwortungsbewusst", "task": "Gib eine klare Analyse ohne Ausreden", "starter": "Ich möchte ehrlich darüber sein was schiefgelaufen ist. Es gab drei Faktoren die ich nicht ausreichend berücksichtigt habe: der erste war… der zweite… und rückblickend war das Vermeidbarste…", "grammar": ["ich möchte ehrlich darüber sein was schiefgelaufen ist", "rückblickend war das Vermeidbarste"], "vocabulary": "verantwortungsbewusst, Faktor, vermeidbar, antizipieren, ehrlich, Lektion, weitermachen"}, {"id": 8, "situation": "Du redest darüber ob Homeoffice langfristig gut für dich ist", "mood": "reflektiv", "task": "Gib eine persönliche und ausgewogene Einschätzung", "starter": "Anfangs nahm ich an dass Homeoffice ideal für mich wäre. Was ich tatsächlich herausgefunden habe ist komplizierter — ich habe… gewonnen, aber echt verloren habe ich…", "grammar": ["anfangs nahm ich an dass Homeoffice ideal wäre", "was ich tatsächlich herausgefunden habe ist komplizierter"], "vocabulary": "Annahme, Gleichgewicht, Grenze, Isolation, gewinnen, verlieren, Wohlbefinden, Homeoffice"}, {"id": 9, "situation": "Du rätst einem jüngeren Geschwisterkind ob es zur Universität gehen soll oder nicht", "mood": "nachdenklich", "task": "Gib echten Rat der über Klischees hinausgeht", "starter": "Die ehrliche Antwort ist dass es ganz darauf ankommt was du dir von der Uni erhoffst. Wenn es um… geht dann macht es absolut Sinn. Wenn es um… geht würde ich das hinterfragen.", "grammar": ["es kommt ganz darauf an was du dir von der Uni erhoffst", "das würde ich hinterfragen"], "vocabulary": "Abschluss, Wert, Alternative, Zeugnis, Netzwerk, Fähigkeit, Annahme, Wahl"}, {"id": 10, "situation": "Du besprichst mit einem Freund ob soziale Medien mehr schaden als nützen", "mood": "ausgewogen mit klarer Meinung", "task": "Beziehe Position und verteidige sie", "starter": "Ich habe viel darüber nachgedacht und bin zu der Ansicht gelangt dass der Schaden real aber ungleich verteilt ist. Am stärksten betroffen sind… während es für die meisten Erwachsenen mehr eine Frage von…", "grammar": ["bin zu der Ansicht gelangt dass der Schaden real aber ungleich verteilt ist", "während es für die meisten Erwachsenen mehr eine Frage von"], "vocabulary": "Algorithmus, kuratiert, vulnerabel, ungleich, Nutzung, Schaden, Nuance, verteilt"}, {"id": 11, "situation": "Du erklärst deinem Chef warum du eine Gehaltserhöhung verdienst", "mood": "professionell und vorbereitet", "task": "Mach einen strukturierten faktenbasierten Fall", "starter": "Ich möchte eine Gehaltsüberprüfung vorschlagen. Im letzten Jahr habe ich… übernommen und geliefert… und habe recherchiert dass mein aktuelles Gehalt unter dem Marktdurchschnitt für…", "grammar": ["ich möchte eine Gehaltsüberprüfung vorschlagen", "habe recherchiert dass mein Gehalt unter dem Marktdurchschnitt"], "vocabulary": "Marktgehalt, Benchmark, Beitrag, Umfang, verhandeln, rechtfertigen, Überprüfung, Belege"}, {"id": 12, "situation": "Du redest über eine Gewohnheit die du seit Jahren zu durchbrechen versuchst", "mood": "aufrichtig", "task": "Erkläre warum sie so hartnäckig ist und was du versucht hast", "starter": "Was diese Gewohnheit so hartnäckig macht ist nicht dass ich nicht weiß dass sie ein Problem ist. Das eigentliche Hindernis ist dass sie eine Funktion erfüllt die ich noch nicht vollständig ersetzt habe, nämlich…", "grammar": ["es ist nicht dass ich nicht weiß dass sie ein Problem ist", "sie erfüllt eine Funktion die ich noch nicht ersetzt habe"], "vocabulary": "hartnäckig, Auslöser, Funktion, ersetzen, bewusst, Zyklus, Ersatz"}, {"id": 13, "situation": "Du erklärst warum du glaubst dass das Bewerbungsverfahren nicht funktioniert", "mood": "frustriert aber konstruktiv", "task": "Beschreibe konkrete Probleme und schlage realistische Verbesserungen vor", "starter": "Was der aktuelle Prozess optimiert ist nicht der beste Kandidat — er optimiert den Kandidaten der am besten darin ist, sich zu bewerben, was eine völlig andere Fähigkeit ist als…", "grammar": ["was der Prozess optimiert ist nicht der beste Kandidat", "eine völlig andere Fähigkeit als"], "vocabulary": "Prozess, optimieren, Signal, Filter, Vorurteil, reformieren, bewerten, Fähigkeit"}, {"id": 14, "situation": "Du redest über deine Beziehung zu Geld und wie sie sich verändert hat", "mood": "ehrlich", "task": "Zeige die Entwicklung deiner Einstellung", "starter": "Als ich jünger war bedeutete Geld… Jetzt sehe ich es eher als Werkzeug denn als Ziel an sich. Was sich verändert hat war dass…", "grammar": ["als ich jünger war bedeutete Geld", "ich sehe es eher als Werkzeug denn als Ziel"], "vocabulary": "Werkzeug, Ziel, Sicherheit, Freiheit, Einstellung, genug, Werte"}, {"id": 15, "situation": "Du diskutierst ob Ambitionen eine Tugend oder eine Falle sind", "mood": "reflektiv", "task": "Präsentiere beide Seiten und sage wo du gelandet bist", "starter": "Früher sah ich Ambitionen unkompliziert positiv. Je mehr ich sie beobachte — in mir und anderen — desto mehr denke ich dass es zwei sehr unterschiedliche Versionen davon gibt…", "grammar": ["früher sah ich Ambitionen unkompliziert positiv", "desto mehr denke ich dass es zwei sehr unterschiedliche Versionen gibt"], "vocabulary": "angetrieben, besessen, Zweck, Vergleich, Kosten, gesund, destruktiv"}, {"id": 16, "situation": "Du erklärst einem Freund der ins Ausland zieht was niemand einem warnt", "mood": "ehrlich und hilfreich", "task": "Teile das Nützliche das niemand erwähnt", "starter": "Was die meisten nicht warnen ist viel interessanter als das Offensichtliche. Ich würde sagen die schwierigste Anpassung für die meisten ist nicht das Praktische sondern das…", "grammar": ["was die meisten nicht warnen ist das Praktische", "die schwierigste Anpassung ist nicht das Praktische sondern das"], "vocabulary": "anpassen, Identität, Einsamkeit, praktisch, Integration, Erwartung, Realismus"}, {"id": 17, "situation": "Du redest darüber ob es dir gelungen ist eine gesunde Work-Life-Balance zu finden", "mood": "ehrlich", "task": "Bewerte deine eigenen Gewohnheiten ehrlich", "starter": "Wenn ich wirklich ehrlich mit mir bin — und das ist schwer laut zu sagen — glaube ich dass ich ein Leben aufgebaut habe das an der Oberfläche funktioniert aber mich heimlich mehr kostet als ich zugegeben habe.", "grammar": ["wenn ich wirklich ehrlich mit mir bin — und das ist schwer laut zu sagen", "heimlich mehr kostet als ich zugegeben habe"], "vocabulary": "nachhaltig, Oberfläche, ehrlich, Kosten, zugeben, Muster, langfristig, anpassen"}, {"id": 18, "situation": "Du erklärst einem neuen Kollegen die ungeschriebenen Regeln die wirklich zählen", "mood": "ehrlich und hilfreich", "task": "Beschreibe was nicht im Handbuch steht aber entscheidend ist", "starter": "Das Handbuch sagt dir wann du ankommen sollst und wie du Ausgaben einreichst. Was es nicht sagt ist dass… und der schnellste Weg hier Glaubwürdigkeit zu verlieren ist…", "grammar": ["das Handbuch sagt dir was es nicht sagt ist dass", "der schnellste Weg Glaubwürdigkeit zu verlieren"], "vocabulary": "ungeschrieben, Handbuch, Kultur, Glaubwürdigkeit, Norm, navigieren, beobachten"}, {"id": 19, "situation": "Du besprichst ob Vertrauen sich nach einem Vertrauensbruch wieder aufbauen lässt", "mood": "nuanciert", "task": "Erkunde wann es möglich ist und wann nicht", "starter": "Wenn man einmal gesehen hat dass jemand zu einer bestimmten Sache fähig ist kann man das nicht ungesehen machen. Man kann vergeben aber vergeben und vertrauen sind nicht dasselbe.", "grammar": ["wenn man einmal gesehen hat dass jemand fähig ist", "vergeben und vertrauen sind nicht dasselbe"], "vocabulary": "Verrat, wieder aufbauen, Vergeben, Vertrauen, Muster, verfügbar, Bedingungen"}, {"id": 20, "situation": "Du erklärst warum du aufgehört hast anderen ungebetene Ratschläge zu geben", "mood": "reflektiv", "task": "Beschreibe was du gelernt hast als du es falsch gemacht hast", "starter": "Was ich bemerkt habe ist dass wenn Menschen dir ein Problem erzählen sie nicht immer wollen dass du es löst. Manchmal brauchen sie nur… und indem ich direkt zu Lösungen sprang hinderte ich sie daran…", "grammar": ["sie wollen nicht immer dass du es löst", "indem ich direkt zu Lösungen sprang hinderte ich sie daran"], "vocabulary": "ungebeten, lösen, zuhören, verarbeiten, Rat, verfrüht, Zeuge, Raum"}, {"id": 21, "situation": "Du redest über was du von einer schwierigen Arbeitsbeziehung gelernt hast", "mood": "ehrlich", "task": "Geh über 'es war eine schwierige Persönlichkeit' hinaus", "starter": "Das Nützlichste das ich je mit schwierigen Arbeitsbeziehungen gemacht habe ist zu fragen nicht was an ihnen falsch war sondern was ich dazu beigetragen habe. In diesem Fall…", "grammar": ["nicht was an ihnen falsch war sondern was ich dazu beigetragen habe", "in diesem Fall"], "vocabulary": "Dynamik, beigetragen, ehrlich, reflektieren, Muster, ergänzen, diagnostizieren"}, {"id": 22, "situation": "Du erklärst warum du Direktheit in der Kommunikation mehr schätzt als Höflichkeit", "mood": "überzeugt", "task": "Argumentiere dafür ohne die Notwendigkeit von Takt abzutun", "starter": "Es gibt eine Version von Höflichkeit die in Wirklichkeit eine Form der Vermeidung ist — man schützt sich vor dem Unbehagen des Schwiergen-Sagens während die andere Person die Kosten des Nicht-Wissens trägt.", "grammar": ["eine Version von Höflichkeit die Vermeidung ist", "die andere Person trägt die Kosten des Nicht-Wissens"], "vocabulary": "direkt, Takt, ehrlich, Kosten, Vermeidung, Feedback, klar, unbequem"}, {"id": 23, "situation": "Du diskutierst ob professioneller Erfolg mehr mit Talent, Einsatz oder Glück zusammenhängt", "mood": "ehrlich", "task": "Gib deine echte Einschätzung mit spezifischer Begründung", "starter": "Die ehrliche Antwort ist dass das Gewicht sich in verschiedenen Phasen verschiebt. Am Anfang ist es vor allem… dann fängt es mehr an drauf anzukommen ob… und was die meisten nicht laut aussprechen ist dass Glück…", "grammar": ["das Gewicht verschiebt sich in verschiedenen Phasen", "was die meisten nicht laut aussprechen ist dass Glück"], "vocabulary": "Talent, Einsatz, Glück, Phase, ehrlich, Gewicht, zugeben, Privileg"}, {"id": 24, "situation": "Du erklärst wie du Entscheidungen unter Druck triffst", "mood": "praktisch", "task": "Beschreibe deinen echten Prozess wenn die Zeit knapp und der Einsatz hoch ist", "starter": "Wenn ich unter echtem Druck stehe habe ich bemerkt dass sich meine Entscheidungsfindung auf vorhersehbare Weise verändert — ich verlasse mich stärker auf… und bin eher geneigt… Was ich gelernt habe dieser Tendenz entgegenzuwirken ist…", "grammar": ["wenn ich unter Druck stehe verändert sich meine Entscheidungsfindung", "was ich gelernt habe dieser Tendenz entgegenzuwirken"], "vocabulary": "Druck, Prozess, Tendenz, entgegenwirken, Heuristik, Standard, verlässlich, Einsatz"}, {"id": 25, "situation": "Du redest warum du glaubst dass die meisten Meetings E-Mails sein könnten", "mood": "direkt", "task": "Argumentiere für asynchrone Kommunikation mit Beispielen", "starter": "Das durchschnittliche Meeting löst das falsche Problem. Das Problem das es löst ist Koordination. Das Problem das es schafft ist… und was ich für die meisten dieser Gespräche für besser halte ist…", "grammar": ["das durchschnittliche Meeting löst das falsche Problem", "was ich für die meisten dieser Gespräche für besser halte"], "vocabulary": "asynchron, synchron, Koordination, unterbrechen, Agenda, Standard, kommunizieren"}, {"id": 26, "situation": "Du erklärst was du über das Geben und Erhalten von ehrlichem Feedback gelernt hast", "mood": "reflektiv", "task": "Beschreibe was funktioniert und was nicht", "starter": "Ich habe in meinem Leben viel Feedback bekommen und das meiste war nutzlos — nicht weil es falsch war, sondern wegen der Art wie es gegeben wurde oder dem Zeitpunkt. Was wirklich angekommen ist war Feedback das…", "grammar": ["das meiste war nutzlos nicht weil es falsch war sondern", "was wirklich angekommen ist war Feedback das"], "vocabulary": "nützlich, Lieferung, Zeitpunkt, spezifisch, ankommen, umsetzbar, Kontext, empfangen"}, {"id": 27, "situation": "Du diskutierst ob es möglich ist sich vom Job wirklich zu trennen", "mood": "aufrichtig", "task": "Teile was wirklich funktioniert und was nicht", "starter": "Ich habe das in jeder Version versucht: keine E-Mails nach 18 Uhr, wochenendfreies Handy, alles. Die ehrliche Schlussfolgerung zu der ich gelangt bin ist dass Abschalten weniger mit Regeln zu tun hat als mit…", "grammar": ["ich habe das in jeder Version versucht", "abschalten hat weniger mit Regeln zu tun als mit"], "vocabulary": "Grenze, verfügbar, Erwartung, Kultur, abschalten, echt, Erlaubnis"}, {"id": 28, "situation": "Du erklärst warum du Selbstbewusstsein für wertvoller hältst als Selbstsicherheit", "mood": "perspektivreich", "task": "Mach den Fall für das Kennen der eigenen Grenzen", "starter": "Selbstsicherheit ohne Selbstbewusstsein ist nur Lärm mit guter Verpackung. Was ich in der Praxis gefunden habe ist dass die Menschen mit denen ich am liebsten arbeite nicht diejenigen sind die am meisten Gewissheit projizieren sondern die die…", "grammar": ["ist nur Lärm mit guter Verpackung", "die am meisten Gewissheit projizieren sondern die die"], "vocabulary": "Selbstbewusstsein, Selbstsicherheit, Grenze, Gewissheit, bewusst, kalibrieren, verlässlich"}, {"id": 29, "situation": "Du diskutierst was es bedeutet auf jemanden wirklich verlassen zu können", "mood": "beobachtend", "task": "Identifiziere die subtileren Signale von Verlässlichkeit", "starter": "Verlässlichkeit zeigt sich in vielen kleinen Momenten vor den großen. Was ich tatsächlich beobachte ist ob jemand… wenn er glaubt dass niemand zuschaut, und ob…", "grammar": ["zeigt sich in vielen kleinen Momenten vor den großen", "ob jemand wenn er glaubt dass niemand zuschaut"], "vocabulary": "Signal, konsistent, Integrität, beobachten, verlässlich, Charakter, Muster"}, {"id": 30, "situation": "Du erklärst was ein gutes Meeting von einem schlechten unterscheidet", "mood": "praktisch", "task": "Diagnostiziere was wirklich den Unterschied macht", "starter": "Was die meisten Meetings ruiniert ist nicht mangelnde Vorbereitung — es ist ein unausgesprochenes Missverständnis über den Zweck. Das beste Meeting das ich je erlebt habe hatte folgendes gemein…", "grammar": ["was die meisten Meetings ruiniert ist nicht mangelnde Vorbereitung", "das beste Meeting hatte folgendes gemein"], "vocabulary": "Zweck, Agenda, Entscheidung, Kontext, Beteiligung, klar, vorbereitet, Ergebnis"}, {"id": 31, "situation": "Du redest über die Unterschiede zwischen Freundlichkeit und Nettigkeit", "mood": "perspektivreich", "task": "Mache den Unterschied mit konkreten Beispielen spürbar", "starter": "Nettigkeit geht darum die Interaktion angenehm zu machen. Freundlichkeit geht darum was wirklich gut für die Person ist. Sie überschneiden sich oft aber es gibt Momente wo sie klar auseinandergehen — zum Beispiel wenn…", "grammar": ["nettigkeit geht darum die Interaktion angenehm zu machen", "momente wo sie klar auseinandergehen zum Beispiel wenn"], "vocabulary": "freundlich, nett, angenehm, ehrlich, auseinandergehen, oberflächlich, echt, fürsorgen"}, {"id": 32, "situation": "Du erklärst warum einige Menschen nie aus Erfahrungen zu lernen scheinen", "mood": "ehrlich", "task": "Diagnostiziere das eigentliche Hindernis jenseits von 'sie sind stur'", "starter": "Was ich beobachtet habe ist dass das Hindernis meist nicht Sturheit ist — es ist eine Art Schutzerzählung. Menschen konstruieren eine Geschichte darüber warum Dinge passierten die sie davor schützt die Person zu sein die…", "grammar": ["das Hindernis ist meist nicht Sturheit — es ist eine Schutzerzählung", "die sie davor schützt die Person zu sein die"], "vocabulary": "Erzählung, schützen, Verantwortung, Geschichte, Ego, defensiv, Muster, lernen"}, {"id": 33, "situation": "Du diskutierst ob es besser ist sich stark zu spezialisieren oder Generalist zu bleiben", "mood": "reflektiv", "task": "Argumentiere aufrichtig für eine Seite und erkenne die andere an", "starter": "Ich glaube die konventionelle Weisheit verändert sich hier. Im 20. Jahrhundert war Spezialisierung die sichere Wette aber was ich jetzt sehe ist dass die Menschen die am resilientesten wirken diejenigen sind die…", "grammar": ["die konventionelle Weisheit verändert sich hier", "die die am resilientesten wirken sind diejenigen die"], "vocabulary": "Generalist, Spezialist, anpassungsfähig, Nische, vielseitig, Fähigkeit, Kontext, resilient"}, {"id": 34, "situation": "Du schließt mit einer Reflexion darüber was echte Kommunikation bedeutet", "mood": "herzlich und aufrichtig", "task": "Beende mit einer echten persönlichen Erkenntnis", "starter": "Worauf ich immer wieder zurückkomme ist dass Kommunikation nicht wirklich um Sprache geht — es geht um die Beziehung zwischen dem was du meinst und dem was die andere Person hört. Und in der Lücke dazwischen passiert fast alles Interessante.", "grammar": ["nicht wirklich um Sprache — es geht um die Beziehung", "in der Lücke dazwischen passiert fast alles Interessante"], "vocabulary": "Lücke, Bedeutung, hören, Beziehung, Sprache, Verständnis, interessant, verbinden"}, {"id": 35, "situation": "Du redest ob man lieber viel verdient und etwas hasst oder wenig und etwas Sinnvolles tut", "mood": "ehrlich", "task": "Gib deine echte Antwort nicht die die gut klingt", "starter": "Ich habe diese Frage in beide Richtungen getestet. Was ich sagen kann ist dass gutes Gehalt viel mehr zählt als Menschen zugeben wenn sie bequem sind und dass Sinn mehr zählt als Geld wenn man in einer Lage ist wo…", "grammar": ["mehr zählt als Menschen zugeben wenn sie bequem sind", "mehr zählt als Geld wenn man in einer Lage ist wo"], "vocabulary": "Sinn, Schwelle, aufrechterhalten, ehrlich, kompensieren, bequem, echt"}, {"id": 36, "situation": "Du diskutierst ob Ehrlichkeit immer der richtige Weg ist", "mood": "nuanciert", "task": "Gib Beispiele wo die Antwort nicht einfach ist", "starter": "Mein Instinkt ist dass Ehrlichkeit fast immer besser ist aber ich kann mir Situationen vorstellen wo ich diese Regel nicht anwenden würde — zum Beispiel wenn… weil die Kosten dort…", "grammar": ["mein Instinkt ist dass Ehrlichkeit fast immer besser ist", "weil die Kosten dort"], "vocabulary": "gerechtfertigt, Schaden, schützen, Absicht, Kontext, Prinzip, Konsequenz"}, {"id": 37, "situation": "Du erklärst was du gelernt hast über das Empfangen von Feedback", "mood": "selbstbewusst", "task": "Zeige das Wachstum mit einem konkreten Kontrast", "starter": "Meine erste Reaktion auf Kritik ist fast immer leicht defensiv auch wenn ich weiß dass das Feedback nützlich ist. Was ich gelernt habe ist diese Reaktion als Information zu behandeln statt als Leitfaden.", "grammar": ["fast immer leicht defensiv auch wenn ich weiß dass", "als Information behandeln statt als Leitfaden"], "vocabulary": "defensiv, Feedback, Ego, reagieren, Pause, unterscheiden, wachsen"}, {"id": 38, "situation": "Du diskutierst ob Networking-Events für dich mehr bringen als sie kosten", "mood": "aufrichtig", "task": "Geh über ich bin introvertiert hinaus", "starter": "Was mich erschöpft ist nicht neue Leute kennenlernen. Was mich erschöpft ist die spezifische Dynamik bei Networking-Events wo alle gleichzeitig etwas spielen statt einfach…", "grammar": ["nicht neue Leute kennenlernen", "die Dynamik wo alle gleichzeitig etwas spielen"], "vocabulary": "performativ, transaktional, echt, erschöpfen, Dynamik, Verbindung, authentisch"}, {"id": 39, "situation": "Du erklärst wie du deinen Energieeinsatz gezielter steuern gelernt hast", "mood": "bewusst und reflektiv", "task": "Beschreibe was sich verändert hat und welche Strategien du entwickelt hast", "starter": "Mir wurde klar dass ich meine Aufmerksamkeit und Energie ziemlich wahllos vergab. Was sich verändert hat ist dass ich mich jetzt vor jedem Engagement frage ob… und wenn die Antwort nein ist…", "grammar": ["meine Aufmerksamkeit ziemlich wahllos vergab", "ich frage mich jetzt vor jedem Engagement ob"], "vocabulary": "Energie, Aufmerksamkeit, wahllos, selektiv, Verpflichtung, Grenze, schützen"}, {"id": 40, "situation": "Du diskutierst was du über das Bitten um Hilfe gelernt hast", "mood": "verletzbar", "task": "Sprich darüber was dich früher davon abgehalten hat", "starter": "Um Hilfe zu bitten ist schwieriger als es klingt weil es erfordert eine Art Verletzbarkeit zuzugeben die die meisten von uns gelernt y": "Sinn, Schwelle, ausreichend, ehrlich, Gleichgewicht, Arbeit"}, {"id": 59, "situation": "Du diskutierst was du beobachtet hast wie Gruppen reagieren wenn Autorität in Frage gestellt wird", "mood": "beobachtend", "task": "Beschreibe die Muster die du gesehen hast", "starter": "Was interessant ist ist dass wirklich selbstsichere Menschen Herausforderungen tendieren willkommen zu heißen. Es sind die Menschen die weniger sicher sind in sich die...", "grammar": ["wirklich selbstsichere Menschen tendieren Herausforderungen willkommen zu heißen", "die weniger sicher sind die"], "vocabulary": "Autorität, sicher, Herausforderung, defensiv, Expertise, Hierarchie"}, {"id": 60, "situation": "Du erklärst was du von einer schwierigen Periode in deinem Leben gelernt hast", "mood": "ehrlich", "task": "Erzähle ehrlich über die Erfahrung", "starter": "Was mich am Laufen hielt war kein Plan — ich hatte keinen. Es war eher... und das Verständnis dass... Rückblickend kann ich jetzt sehen dass...", "grammar": ["was mich am Laufen hielt war kein Plan", "rückblickend kann ich jetzt sehen"], "vocabulary": "Ungewissheit, Anker, überleben, entstehen, Perspektive"}, {"id": 61, "situation": "Du diskutierst ob Optimismus eine Entscheidung oder eine Veranlagung ist", "mood": "neugierig", "task": "Erkunde die Frage mit Nuancen", "starter": "Ich war zu dieser Frage hin und her. Meine aktuelle Ansicht ist dass es irgendwo dazwischen liegt — es gibt Menschen für die es natürlicher kommt aber es gibt auch eine tägliche Praxis von...", "grammar": ["ich war zu dieser Frage hin und her", "es gibt auch eine tägliche Praxis von"], "vocabulary": "Temperament, Praxis, Veranlagung, Standard, kultivieren, Wahl"}, {"id": 62, "situation": "Du redest was du über das Empfangen von Kritik gelernt hast", "mood": "selbstbewusst", "task": "Zeige das Wachstum konkret", "starter": "Mein Instinkt war früher mich sofort zu verteidigen. Jetzt versuche ich die Kritik zuerst ankommen zu lassen bevor ich entscheide ob sie
