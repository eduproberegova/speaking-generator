ribución, alcance, negociar, justificar, revisar, datos"}, {"id": 12, "situation": "Hablas de un hábito que llevas años intentando cambiar", "mood": "sincero", "task": "Explica por qué persiste y qué has intentado", "starter": "Lo que hace que este hábito sea tan persistente no es que no sepa que es un problema. El verdadero obstáculo es que cumple una función que no he reemplazado completamente, que es…", "grammar": ["no es que no sepa que es un problema", "cumple una función que no he reemplazado"], "vocabulary": "persistente, detonador, función, reemplazar, consciente, ciclo, sustituto"}, {"id": 13, "situation": "Discutes si es posible mantener el equilibrio entre vida y trabajo", "mood": "honesto", "task": "Evalúa tus hábitos con honestidad real", "starter": "Si soy completamente honesto conmigo mismo — y esto es difícil de decir en voz alta — creo que he construido una vida que funciona en la superficie pero que en realidad me cuesta más de lo que he admitido.", "grammar": ["si soy completamente honesto conmigo mismo", "que en realidad me cuesta más de lo que he admitido"], "vocabulary": "sostenible, superficie, honesto, coste, admitir, patrón, largo plazo, ajustar"}, {"id": 14, "situation": "Explicas por qué crees que el proceso de selección de personal está roto", "mood": "frustrado pero constructivo", "task": "Describe problemas concretos y sugiere mejoras reales", "starter": "Lo que optimiza el proceso actual no es al mejor candidato — optimiza al candidato que mejor sabe hacer solicitudes de empleo, que es una habilidad completamente distinta de…", "grammar": ["lo que optimiza el proceso no es al mejor candidato", "una habilidad completamente distinta de"], "vocabulary": "proceso, optimizar, señal, filtro, sesgo, reformar, evaluar, habilidad"}, {"id": 15, "situation": "Hablas de cómo ha cambiado tu relación con tu propio cuerpo con los años", "mood": "honesto", "task": "Reflexiona sin adoptar ni la negatividad ni la positividad performativa", "starter": "Mi relación con mi cuerpo ha sido complicada y lo más honesto que puedo decir es que todavía está en proceso. Lo que más ha cambiado no es cómo se ve sino…", "grammar": ["mi relación con mi cuerpo ha sido complicada", "lo que más ha cambiado no es cómo se ve sino"], "vocabulary": "imagen corporal, proceso, complicado, relación, aceptar, cambiar, narrativa"}, {"id": 16, "situation": "Debatiendo si especializarse en profundidad o mantenerse generalista", "mood": "reflexivo", "task": "Argumenta genuinamente a favor de un lado reconociendo el otro", "starter": "Creo que la sabiduría convencional está cambiando sobre esto. Para la mayor parte del siglo XX la especialización era la apuesta segura, pero lo que veo ahora es que los más resilientes son…", "grammar": ["la sabiduría convencional está cambiando sobre esto", "los que parecen más resilientes son"], "vocabulary": "generalista, especialista, adaptable, nicho, versátil, habilidad, contexto, resiliente"}, {"id": 17, "situation": "Explains por qué has dejado de intentar convencer a personas que no están listas", "mood": "sabio", "task": "Describe lo que has aprendido sobre cuándo funciona la persuasión", "starter": "Lo que he encontrado es que la persuasión casi nunca tiene que ver con la calidad del argumento. La gente cambia de opinión cuando está lista, no cuando tú eres más elocuente. El detonador suele ser…", "grammar": ["la persuasión casi nunca tiene que ver con la calidad del argumento", "el detonador suele ser"], "vocabulary": "persuasión, disposición, argumento, retórica, momento, cambio, apertura"}, {"id": 18, "situation": "Hablas sobre si quejarse es útil o solo drena energía", "mood": "equilibrado", "task": "Distingue el buen desahogo del que solo refuerza la queja", "starter": "Hay un tipo de desahogo que te permite procesar algo y seguir adelante, y otro que solo refuerza la historia que ya te estás contando. La pregunta que me hago ahora es si hablar de ello me mueve… o me mantiene…", "grammar": ["hay un tipo de desahogo que procesa y otro que refuerza", "si hablar de ello me mueve o me mantiene"], "vocabulary": "desahogo, procesar, reforzar, productivo, seguir adelante, atascado, catártico, patrón"}, {"id": 19, "situation": "Explicas qué has aprendido al trabajar con personas muy diferentes a ti", "mood": "abierto", "task": "Comparte algo concreto que cambió cómo trabajas o piensas", "starter": "Lo que más cambia cuando trabajas estrechamente con personas que piensan diferente no es el resultado — son tus suposiciones. Yo solía enfocar… de una manera particular porque pensaba que era simplemente… cuando en realidad…", "grammar": ["lo que más cambia no son los resultados sino las suposiciones", "pensaba que era simplemente… cuando en realidad"], "vocabulary": "suposición, perspectiva, diverso, colaboración, enfoque, enriquecer, cuestionar, adaptar"}, {"id": 20, "situation": "Discutes si tu trabajo tiene que ser significativo o si un buen sueldo es suficiente", "mood": "honesto", "task": "Da tu posición real, no la que suena virtuosa", "starter": "He probado esta pregunta en ambas direcciones y lo que puedo decir es que el buen sueldo importa mucho más de lo que la gente admite cuando está cómoda, y el significado importa más que el dinero cuando estás en…", "grammar": ["el buen sueldo importa más de lo que la gente admite cuando está cómoda", "el significado importa más que el dinero cuando estás"], "vocabulary": "significado, umbral, sostener, honesto, compensar, cómodo, real, virtud"}, {"id": 21, "situation": "Hablas sobre qué te hace fácil confiar en alguien y qué no", "mood": "observador", "task": "Ve más allá de 'cumplen su palabra' a las señales más sutiles", "starter": "La confianza se construye en muchos momentos pequeños antes de los grandes. Las cosas que realmente observo son si alguien… cuando cree que nadie lo ve, y si…", "grammar": ["la confianza se construye en momentos pequeños antes de los grandes", "las cosas que realmente observo son si alguien"], "vocabulary": "señal, consistente, momentos pequeños, integridad, observar, fiable, carácter, patrón"}, {"id": 22, "situation": "Explicas qué diferencia a un buen jefe de uno excelente", "mood": "experimentado", "task": "Ve más allá de las cualidades superficiales", "starter": "La mayoría de los jefes saben dar feedback y dirigir reuniones. Lo que separa a los realmente buenos es algo más difícil de nombrar — algo sobre cómo te hacen sentir respecto a tu propio…", "grammar": ["la mayoría saben dar feedback y dirigir reuniones", "algo sobre cómo te hacen sentir respecto a tu propio"], "vocabulary": "confianza, desarrollar, potencial, seguro, feedback de calidad, visto, responsable, autonomía"}, {"id": 23, "situation": "Discutes qué hace que algunos equipos funcionen brillantemente y otros no", "mood": "analítico", "task": "Identifica los factores menos obvios", "starter": "El talento es necesario pero ni de lejos suficiente. Lo que he notado en los equipos de mayor rendimiento en los que he estado es que la diferencia se reduce a… y concretamente a si la gente se siente libre de…", "grammar": ["el talento es necesario pero ni de lejos suficiente", "si la gente se siente libre de"], "vocabulary": "seguridad psicológica, confianza, dinámica, comunicar, funcionar, rendir, complementar"}, {"id": 24, "situation": "Hablas sobre si las empresas tienen responsabilidad genuina con el bienestar de sus empleados", "mood": "ético", "task": "Argumenta que es lo correcto y lo inteligente a la vez", "starter": "El argumento cínico es que las empresas se preocupan por el bienestar solo porque los empleados infelices son menos productivos. Creo que es cierto pero se queda corto. Una empresa que solo cuida el bienestar de forma instrumental tiende a…", "grammar": ["el argumento cínico es cierto pero se queda corto", "una empresa que cuida el bienestar solo de forma instrumental"], "vocabulary": "bienestar, genuino, instrumental, cultura, responsabilidad, cínico, sostenible, recíproco"}, {"id": 25, "situation": "Explicas por qué crees que la autoconciencia vale más que la confianza", "mood": "perspicaz", "task": "Argumenta a favor de conocer tus límites frente a aparentar no tenerlos", "starter": "La confianza sin autoconciencia es solo ruido con buena presentación. Lo que he encontrado en la práctica es que las personas con las que más quiero trabajar no son las que proyectan más certeza sino las que…", "grammar": ["la confianza sin autoconciencia es ruido con buena presentación", "las personas con las que más quiero trabajar no son las que proyectan certeza"], "vocabulary": "autoconciencia, confianza, límite, certeza, consciente, calibrar, confiable, proyectar"}, {"id": 26, "situation": "Hablas de qué te aburre y qué dice eso sobre ti", "mood": "autoconsciencia", "task": "Sé honesto sobre lo que no soportas y lo que eso revela", "starter": "Lo que tolero muy poco es… y antes me sentía vagamente culpable por eso hasta que me di cuenta de que la intolerancia a ciertas cosas es en realidad una señal sobre lo que valoras, concretamente…", "grammar": ["antes me sentía vagamente culpable por eso hasta que me di cuenta", "es una señal sobre lo que valoras"], "vocabulary": "intolerancia, señal, valor, revelar, impaciente, sentido, atención, genuino"}, {"id": 27, "situation": "Explicas por qué ya no das consejos sin que te los pidan", "mood": "reflexivo", "task": "Describe lo que has aprendido de cuando diste consejos que no se querían", "starter": "Lo que he notado es que cuando las personas te cuentan un problema no siempre te piden que lo soluciones. A veces solo necesitan… y al saltar directamente a las soluciones les impedía…", "grammar": ["no siempre te piden que lo soluciones", "al saltar a las soluciones les impedía"], "vocabulary": "no solicitado, solucionar, escuchar, procesar, consejo, prematuro, testigo, espacio"}, {"id": 28, "situation": "Discutes qué ha cambiado en cómo afrontas el conflicto desde que eras joven", "mood": "maduro", "task": "Muestra el contraste honestamente", "starter": "Cuando era joven mi forma de manejar el conflicto era básicamente o… o… Ninguna de las cuales resolvía nada realmente. Lo que he ido desarrollando es algo más difícil pero más útil.", "grammar": ["mi forma de manejar el conflicto era o… o…", "algo más difícil pero más útil"], "vocabulary": "conflicto, evitar, escalar, maduro, afrontar, resolver, útil, evolucionar"}, {"id": 29, "situation": "Hablas de la diferencia entre ser amable y ser simpático", "mood": "perspicaz", "task": "Haz que la distinción sea concreta con ejemplos", "starter": "La simpatía se trata de hacer la interacción cómoda. La amabilidad se trata de lo que es genuinamente bueno para la persona. Coinciden mucho, pero hay momentos donde divergen claramente — por ejemplo cuando…", "grammar": ["la simpatía se trata de hacer la interacción cómoda", "hay momentos donde divergen claramente"], "vocabulary": "amable, simpático, cómodo, honesto, divergir, superficial, genuino, cuidar"}, {"id": 30, "situation": "Explicas por qué algunas personas nunca parecen aprender de la experiencia", "mood": "honesto", "task": "Diagnostica el obstáculo real más allá de 'son tercos'", "starter": "Lo que he observado es que el obstáculo no suele ser la terquedad — es una especie de protección narrativa. Las personas construyen una historia sobre por qué ocurrieron las cosas que las protege de ser la que…", "grammar": ["el obstáculo no suele ser la terquedad — es protección narrativa", "una historia que las protege de ser la que"], "vocabulary": "narrativa, proteger, responsabilidad, historia, ego, defensivo, patrón, aprender"}, {"id": 31, "situation": "Discutes con tu pareja cómo manejar el dinero de forma diferente de aquí en adelante", "mood": "directo y colaborativo", "task": "Ten la conversación real en lugar de la educada", "starter": "He querido tener esta conversación bien por un tiempo y prefiero tenerla honestamente. Lo que he notado en nuestros gastos es… y lo que creo que nos beneficiaría a los dos es…", "grammar": ["prefiero tenerla honestamente en lugar de rodeos", "lo que creo que nos beneficiaría a los dos es"], "vocabulary": "finanzas, honesto, patrón, gasto, alinear, valores, plan, juntos"}, {"id": 32, "situation": "Explicas por qué encuentras agotadores ciertos eventos de networking", "mood": "sincero", "task": "Ve más allá de 'soy introvertido' y describe la dinámica específica", "starter": "Lo que me agota no es conocer gente nueva — eso en realidad me gusta. Lo que me cansa es la dinámica específica de los eventos de networking donde todos están simultáneamente representando…", "grammar": ["lo que me agota no es conocer gente nueva", "la dinámica específica donde todos están simultáneamente representando"], "vocabulary": "performativo, transaccional, genuino, agotar, dinámica, conexión, auténtico, máscara"}, {"id": 33, "situation": "Hablas de un hábito profesional que has desarrollado y del que estás orgulloso", "mood": "orgulloso sin presumir", "task": "Describe la habilidad y lo que costó desarrollarla", "starter": "Me llevó mucho tiempo desarrollar… y lo digo no para parecer modesto sino porque entender por qué costó tanto es en realidad la parte más interesante. El principal obstáculo fue…", "grammar": ["lo digo no para parecer modesto sino porque", "el principal obstáculo fue"], "vocabulary": "desarrollar, habilidad, obstáculo, tiempo, persistir, artesanía, orgulloso, construir"}, {"id": 34, "situation": "Discutes qué hace genuinamente útil a la retroalimentación", "mood": "honesto", "task": "Analiza qué hace que funcione y qué la hace inútil", "starter": "He tenido mucho feedback en mi vida y la mayoría ha sido inútil — no porque estuviera mal, sino por cómo se entregó o el momento en que se dio. Lo que sí ha calado es el feedback que…", "grammar": ["la mayoría ha sido inútil no porque estuviera mal sino por", "el feedback que sí ha calado es el que"], "vocabulary": "útil, entrega, momento, específico, calar, accionable, contexto, recibir"}, {"id": 35, "situation": "Explicas por qué crees que algunas personas fácilmente se confunden con productividad cuando están solo ocupadas", "mood": "perspicaz", "task": "Haz la distinción concreta con ejemplos", "starter": "La ocupación y la productividad pueden verse idénticas desde fuera, pero se sienten completamente diferentes desde dentro. Lo que lo delata suele ser si el esfuerzo te mueve hacia… o simplemente te mantiene…", "grammar": ["la ocupación y la productividad se ven idénticas desde fuera", "lo que lo delata suele ser si el esfuerzo te mueve hacia"], "vocabulary": "producción, significativo, movimiento, progreso, eficiente, dirección, tarea, prioridad"}, {"id": 36, "situation": "Hablas de lo que has aprendido sobre decir que no a buenas oportunidades", "mood": "maduro", "task": "Explica por qué decir no a cosas buenas es más difícil que decir no a las malas", "starter": "Decir no a las malas oportunidades es fácil. Las difíciles son las genuinamente buenas que simplemente no son las adecuadas para este momento. La razón por la que son difíciles es que tienes que confiar en que…", "grammar": ["decir no a las malas es fácil", "tienes que confiar en que"], "vocabulary": "coste de oportunidad, momento, prioridad, confiar, escasez, abundancia, enfoque, momento adecuado"}, {"id": 37, "situation": "Explicas cómo has navegado un revés profesional significativo", "mood": "resiliente", "task": "Cuenta la historia sin dramatizar ni minimizar", "starter": "El revés cambió lo que pensaba que era mi identidad profesional. Y fue genuinamente difícil durante un tiempo — no por las consecuencias prácticas sino porque… Lo que me ayudó no fue…", "grammar": ["cambió lo que pensaba que era mi identidad profesional", "lo que me ayudó no fue"], "vocabulary": "identidad, revés, práctico, narrativa, reencuadrar, difícil, proceso, reconstruir"}, {"id": 38, "situation": "Discutes qué te gustaría que tu organización hiciera diferente para apoyar a su gente", "mood": "directo", "task": "Sé constructivo pero honesto sobre lo que falta", "starter": "Las cosas que más diferencia harían no son las caras. Lo que noto que la gente realmente necesita más es… y lo que la organización podría dejar de hacer para ayudar es…", "grammar": ["las cosas que más diferencia harían no son las caras", "lo que la organización podría dejar de hacer"], "vocabulary": "apoyo, cultura, caro, simple, dejar de, empezar, notar, personas"}, {"id": 39, "situation": "Cierras con una reflexión sobre lo que significa realmente comunicarse bien", "mood": "cálido y genuino", "task": "Termina con algo que hayas notado genuinamente en ti mismo", "starter": "A lo que siempre vuelvo es que la comunicación no se trata realmente del idioma — se trata de la relación entre lo que quieres decir y lo que la otra persona escucha. Y la brecha entre esas dos cosas es donde ocurre casi todo lo interesante.", "grammar": ["la comunicación no se trata del idioma — se trata de la relación entre lo que quieres decir y lo que escucha", "la brecha entre esas dos cosas es donde ocurre casi todo lo interesante"], "vocabulary": "brecha, significado, escuchar, relación, idioma, comprensión, interesante, conectar"}, {"id": 40, "situation": "Hablas de si la ambición es una virtud o una trampa", "mood": "reflexivo", "task": "Presenta los dos lados y di dónde has llegado", "starter": "Antes veía la ambición como algo positivo sin más, pero cuanto más la observo — en mí y en otros — más creo que hay dos versiones muy diferentes de ella…", "grammar": ["antes veía la ambición como positivo sin más", "más creo que hay dos versiones muy diferentes"], "vocabulary": "ambicioso, obsesivo, propósito, comparación, coste, saludable, destructivo"}, {"id": 41, "situation": "Discutes si tu empresa tiene una cultura tóxica", "mood": "medido", "task": "Diagnostica el problema sin convertirlo en una queja", "starter": "El desafío no es ninguna persona en concreto — es el sistema que hemos construido con el tiempo. Lo concreto que he notado es… y lo que tienen en común es que todo recompensa…", "grammar": ["el desafío no es ninguna persona — es el sistema", "lo que tienen en común es que todo recompensa"], "vocabulary": "cultura, sistémico, síntoma, norma, recompensar, patrón, tóxico, disfunción"}, {"id": 42, "situation": "Explicas qué has aprendido de trabajar con gente muy diferente a ti", "mood": "abierto", "task": "Comparte algo que cambió genuinamente cómo trabajas", "starter": "Lo que más cambia cuando trabajas estrechamente con gente que piensa diferente no es el resultado — son tus suposiciones. Yo antes enfocaba… de una manera porque pensaba que era simplemente… cuando en realidad…", "grammar": ["lo que más cambia no son los resultados sino las suposiciones", "cuando en realidad"], "vocabulary": "suposición, perspectiva, diverso, colaboración, enfoque, enriquecer, cuestionar"}, {"id": 43, "situation": "Hablas de si es posible mantener amistades del trabajo cuando eres el jefe", "mood": "experimentado", "task": "Explora la tensión real entre autoridad y conexión genuina", "starter": "La respuesta honesta es sí, pero requiere un tipo de esfuerzo que la mayoría subestima. La amistad tiene que ajustarse — no puede ser igual que antes — porque ahora uno de vosotros tiene que…", "grammar": ["sí, pero requiere un esfuerzo que la mayoría subestima", "la amistad tiene que ajustarse porque ahora"], "vocabulary": "autoridad, dinámica, ajustar, confianza, profesional, genuino, poder, amistad"}, {"id": 44, "situation": "Discutes si el modelo de trabajo de 40 horas semanales está obsoleto", "mood": "crítico", "task": "Haz un argumento específico más allá de la queja vaga", "starter": "La semana de 40 horas fue diseñada para un tipo de trabajo que la mayoría ya no hacemos. Lo que ha cambiado es que el trabajo del conocimiento no está limitado por horas sino por… y obligar a la gente a…", "grammar": ["fue diseñada para un tipo de trabajo que ya no hacemos", "no está limitado por horas sino por"], "vocabulary": "trabajo del conocimiento, productividad, presencia, flexibilidad, rendimiento, rediseñar"}, {"id": 45, "situation": "Hablas de la diferencia entre estar ocupado y ser productivo", "mood": "perspicaz", "task": "Haz la distinción concreta con ejemplos reales", "starter": "La ocupación y la productividad pueden verse idénticas desde fuera pero se sienten completamente distintas desde dentro. Lo que lo delata suele ser si el esfuerzo te mueve hacia… o simplemente…", "grammar": ["se ven idénticas desde fuera pero se sienten distintas desde dentro", "si el esfuerzo te mueve hacia"], "vocabulary": "producción, movimiento, progreso, eficiente, dirección, tarea, prioridad, significativo"}, {"id": 46, "situation": "Discutes con tu pareja o amigo si tomar un riesgo financiero importante", "mood": "honesto", "task": "Habla del miedo y el razonamiento más que de los números", "starter": "Quiero ser honesto sobre dos cosas: la primera es que esto me da más miedo de lo que he dejado ver. La segunda es que creo que no hacerlo puede darme más miedo dentro de cinco años cuando…", "grammar": ["quiero ser honesto sobre dos cosas", "creo que no hacerlo puede darme más miedo dentro de"], "vocabulary": "riesgo, miedo, coste de oportunidad, arrepentimiento, calculado, honesto, umbral, comprometerse"}, {"id": 47, "situation": "Explicas por qué crees que la gente se queda en amistades poco saludables tanto tiempo", "mood": "psicológico", "task": "Explora los mecanismos reales más allá del miedo al conflicto", "starter": "Lo que mantiene a la gente en amistades poco saludables no suele ser el miedo a la confrontación — es una combinación de… y el hecho de que la amistad solo es mala de una manera difícil de describir a alguien de fuera.", "grammar": ["no suele ser el miedo a la confrontación — es una combinación de", "solo es mala de una manera difícil de describir"], "vocabulary": "coste hundido, normalizar, invisible, articular, patrón, historia, salir, gradual"}, {"id": 48, "situation": "Hablas de lo difícil que te resulta hacer amigos de adulto", "mood": "honesto", "task": "Sé específico sobre qué ha cambiado y por qué", "starter": "Hacer amigos de niño parecía casi automático porque… De adulto las condiciones que lo creaban han desaparecido en su mayoría. Lo que te queda es una situación donde…", "grammar": ["hacer amigos de niño parecía automático porque", "las condiciones que lo creaban han desaparecido"], "vocabulary": "deliberado, contexto compartido, transición, esfuerzo, proximidad, orgánico, intencional"}, {"id": 49, "situation": "Explicas que te has vuelto más cuidadoso de a quién pides consejo", "mood": "discerniente", "task": "Distingue entre quién da consejo útil y quién no", "starter": "He empezado a prestar atención no solo a lo que dice la gente sino a si su vida refleja de verdad lo que recomienda. Los que dan el consejo con más confianza son a menudo los que…", "grammar": ["prestar atención no solo a lo que dicen sino a si su vida refleja", "los que dan consejo con más confianza son a menudo"], "vocabulary": "credibilidad, contexto, relevante, aplicar, cualificado, historial, discernir, fuente"}, {"id": 50, "situation": "Discutes si tu generación fue vendida una mentira sobre cómo sería la vida adulta", "mood": "reflexivo", "task": "Sé honesto sobre la brecha entre expectativa y realidad", "starter": "Lo que me hicieron creer — sobre todo por ósmosis más que por ninguna promesa explícita — era que si seguías los pasos en el orden correcto llegarías a… Lo que nadie mencionó fue que…", "grammar": ["por ósmosis más que por ninguna promesa explícita", "lo que nadie mencionó fue que"], "vocabulary": "expectativa, realidad, brecha, narrativa, generación, promesa, camino, desilusión"}, {"id": 51, "situation": "Hablas de cómo manejas el desacuerdo en un equipo", "mood": "profesional", "task": "Describe lo que has aprendido de hacerlo mal y luego mejor", "starter": "El enfoque que tengo ahora viene en gran parte de observar qué pasa cuando lo evitas. El coste del desacuerdo no resuelto en un equipo no es visible de inmediato — aparece más tarde como…", "grammar": ["el coste del desacuerdo no resuelto no es visible de inmediato", "aparece más tarde como"], "vocabulary": "conflicto, evitar, afrontar, coste, confianza, resolución, saludable, disfunción"}, {"id": 52, "situation": "Explicas que la confianza verdadera solo se construye en momentos pequeños", "mood": "observador", "task": "Describe las señales sutiles de que alguien es confiable", "starter": "La confiabilidad se construye en muchos momentos pequeños antes de los grandes. Las cosas que realmente observo son si alguien… cuando cree que nadie le ve, y si…", "grammar": ["la confiabilidad se construye en momentos pequeños", "si alguien cuando cree que nadie le ve"], "vocabulary": "señal, consistente, integridad, observar, fiable, carácter, patrón, momento"}, {"id": 53, "situation": "Discutes si el trabajo remoto largo plazo es sostenible para ti", "mood": "reflexivo", "task": "Haz una valoración personal equilibrada", "starter": "Al principio asumí que el teletrabajo sería ideal. Lo que he descubierto en realidad es más complicado — he ganado… pero he perdido genuinamente… y lo que más me ha costado adaptarme ha sido…", "grammar": ["asumí que sería ideal pero lo que he descubierto es más complicado", "lo que más me ha costado adaptarme ha sido"], "vocabulary": "sostenible, ganado, perdido, adaptarse, aislamiento, límite, bienestar, largo plazo"}, {"id": 54, "situation": "Hablas del papel que ha jugado la suerte en tu éxito profesional", "mood": "honesto", "task": "Sé genuinamente honesto en lugar de falsa modestia o arrogancia", "starter": "La respuesta honesta está en algún punto entre 'trabajé duro' y 'simplemente tuve suerte'. Lo que puedo decir es que algunos de mis mayores avances vinieron de circunstancias que no controlé, concretamente…", "grammar": ["la respuesta honesta está entre trabajé duro y tuve suerte", "algunos de mis mayores avances vinieron de circunstancias que no controlé"], "vocabulary": "suerte, circunstancia, privilegio, momento, esfuerzo, reconocer, humilde, atribuir"}, {"id": 55, "situation": "Explicas que la honestidad directa te parece más valiosa que la amabilidad superficial", "mood": "convencido", "task": "Argumenta a favor sin desestimar la necesidad de tacto", "starter": "Hay una versión de la amabilidad que en realidad es una forma de evitación — te proteges de la incomodidad de decir algo difícil mientras la otra persona carga con el coste de no saberlo.", "grammar": ["hay una versión de la amabilidad que es evitación", "la otra persona carga con el coste de no saberlo"], "vocabulary": "directo, tacto, honesto, coste, evitación, retroalimentación, claro, incómodo"}, {"id": 56, "situation": "Hablas de qué hace que algunos equipos rindan brillantemente y otros no", "mood": "analítico", "task": "Identifica los factores menos obvios", "starter": "El talento es necesario pero ni de lejos suficiente. Lo que he notado en los equipos de mayor rendimiento en los que he estado es que la diferencia se reduce a… y concretamente a si la gente se siente libre de…", "grammar": ["el talento es necesario pero ni de lejos suficiente", "a si la gente se siente libre de"], "vocabulary": "seguridad psicológica, confianza, dinámica, comunicar, rendir, complementar, funcionar"}, {"id": 57, "situation": "Explicas por qué ya das menos consejos sin que te los pidan", "mood": "reflexivo", "task": "Describe lo que has aprendido de cuando lo hiciste sin que se lo pidieran", "starter": "Lo que he notado es que cuando la gente te cuenta un problema no siempre te pide que lo soluciones. A veces solo necesita… y al saltar a las soluciones les impedía…", "grammar": ["no siempre te pide que lo soluciones", "al saltar a las soluciones les impedía"], "vocabulary": "no solicitado, escuchar, procesar, consejo, testigo, prematuro, espacio, solucionar"}, {"id": 58, "situation": "Hablas de la diferencia entre ser curioso y ser educado", "mood": "perspicaz", "task": "Explica por qué la curiosidad genuina es más rara de lo que parece", "starter": "La educación lleva a asentir aunque no entiendas. La curiosidad genuina lleva a hacer preguntas aunque sea incómodo. Lo que más me indica si alguien es genuinamente curioso es si…", "grammar": ["la educación lleva a asentir aunque no entiendas", "si alguien es genuinamente curioso es si"], "vocabulary": "genuino, curioso, incómodo, preguntar, asentir, educado, interesado, rareza"}, {"id": 59, "situation": "Discutes si es posible separarte completamente del trabajo en el mundo moderno", "mood": "sincero", "task": "Comparte lo que funciona de verdad y lo que no", "starter": "Lo he probado en todas sus versiones: sin email después de las 6, fines de semana sin teléfono, todo. La conclusión honesta a la que he llegado es que desconectarse no tiene que ver con las reglas sino con…", "grammar": ["lo he probado en todas sus versiones", "desconectarse no tiene que ver con las reglas sino con"], "vocabulary": "límite, disponible, expectativa, cultura, desconectar, genuino, apagar, permiso"}, {"id": 60, "situation": "Explicas cómo ha cambiado tu relación con el fracaso y la toma de riesgos", "mood": "reflexivo", "task": "Sé específico sobre cómo los fracasos anteriores influyen en tu disposición actual", "starter": "He notado un patrón en mí mismo: los fracasos que me hicieron más dispuesto a intentar cosas nuevas son los que… mientras que los que me hicieron más cauteloso fueron los que sentí…", "grammar": ["los fracasos que me hicieron más dispuesto son los que", "los que me hicieron más cauteloso fueron los que sentí"], "vocabulary": "patrón, cauteloso, dispuesto, riesgo, fracaso, vergüenza, aprendizaje, posterior"}, {"id": 61, "situation": "Hablas sobre si la gratitud es algo que practicas o que sientes espontáneamente", "mood": "personal", "task": "Comparte tu relación genuina con la gratitud — sea cual sea", "starter": "Tengo cierta ambivalencia con la forma en que se habla de la gratitud, sobre todo porque puede volverse fácilmente… Pero cuando quito la actuación hay algo real, que es…", "grammar": ["tengo cierta ambivalencia con la forma en que se habla de la gratitud", "cuando quito la actuación hay algo real"], "vocabulary": "gratitud, actuación, genuino, practicar, ambivalente, auténtico, sentir, cultivar"}, {"id": 62, "situation": "Explicas qué tipo de crítica encuentras genuinamente útil", "mood": "discerniente", "task": "Ve más allá de 'el feedback debe ser específico' a lo que funciona para ti", "starter": "He tenido mucho feedback en mi vida y la mayoría ha sido inútil — no porque estuviera mal sino por cómo se entregó o el momento. Lo que sí ha calado es el feedback que…", "grammar": ["inútil no porque estuviera mal sino por cómo se entregó", "lo que sí ha calado es el que"], "vocabulary": "útil, entrega, momento, específico, calar, accionable, contexto"}, {"id": 63, "situation": "Discutes si puedes mantener relaciones con gente de la que te has distanciado", "mood": "honesto", "task": "Explora la tensión entre lealtad y distanciamiento", "starter": "Lo que he llegado a entender es que algunas amistades son para un capítulo específico de tu vida, y mantenerlas más allá de ese capítulo requiere que ambos finjan seguir siendo las versiones de sí mismos que…", "grammar": ["algunas amistades son para un capítulo específico de tu vida", "requiere que ambos finjan seguir siendo las versiones que"], "vocabulary": "distanciamiento, capítulo, esfuerzo, mutuo, distancia, superado, nostalgia, soltar"}, {"id": 64, "situation": "Hablas de lo que has aprendido de la toma de decisiones bajo presión", "mood": "práctico", "task": "Describe tu proceso real cuando el tiempo es escaso y las apuestas son altas", "starter": "Cuando estoy bajo presión real he notado que mi forma de decidir cambia de manera predecible — me apoyo más en… y soy más propenso a… Lo que he aprendido para contrarrestar esa tendencia es…", "grammar": ["mi forma de decidir cambia de manera predecible", "lo que he aprendido para contrarrestar esa tendencia"], "vocabulary": "presión, proceso, tendencia, contrarrestar, heurística, defecto, fiable, apuestas"}, {"id": 65, "situation": "Explicas por qué crees que la mayoría de las reuniones podrían ser correos", "mood": "directo", "task": "Argumenta a favor de la comunicación asíncrona con ejemplos", "starter": "La reunión promedio está resolviendo el problema equivocado. El problema que resuelve es la coordinación. El que crea es… y lo que creo que serviría mejor a la mayoría de esas conversaciones es…", "grammar": ["está resolviendo el problema equivocado", "lo que serviría mejor a la mayoría de esas conversaciones"], "vocabulary": "asíncrono, síncrono, coordinación, interrumpir, agenda, defecto, comunicar"}, {"id": 66, "situation": "Discutes si tu generación tiene más o menos dificultades que las anteriores", "mood": "reflexivo", "task": "Evita tanto la victimización como la minimización", "starter": "Lo más honesto que puedo decir es que las dificultades son diferentes más que mayores o menores. Lo que sí ha cambiado estructuralmente es… mientras que lo que ha mejorado genuinamente es…", "grammar": ["las dificultades son diferentes más que mayores o menores", "lo que ha cambiado estructuralmente es mientras que"], "vocabulary": "generación, estructural, diferente, comparar, contexto, narrativa, privilegio, dificultad"}, {"id": 67, "situation": "Hablas de cómo gestionas la brecha entre quién crees que eres y cómo te comportas realmente", "mood": "honesto", "task": "Reconoce la brecha sin ser ni defensivo ni autocrítico", "starter": "Esto es terreno incómodo porque requiere notar que no siempre soy tan… como me gusta creer. Lo que me ha resultado útil no es intentar cerrar la brecha con fuerza de voluntad sino…", "grammar": ["requiere notar que no siempre soy tan… como me gusta creer", "no intentar cerrar la brecha con fuerza de voluntad sino"], "vocabulary": "brecha, autoimagen, comportamiento, notar, honesto, incómodo, ajustar, consistente"}, {"id": 68, "situation": "Explicas a un nuevo colega las reglas no escritas que importan de verdad", "mood": "honesto y útil", "task": "Describe lo que no está en el manual pero es crucial", "starter": "El manual te dirá a qué hora llegar y cómo presentar gastos. Lo que no te dirá es que… y que la manera más rápida de perder credibilidad aquí es…", "grammar": ["el manual te dirá pero lo que no te dirá es", "la manera más rápida de perder credibilidad aquí"], "vocabulary": "no escrito, manual, cultura, credibilidad, norma, navegar, observar, no dicho"}, {"id": 69, "situation": "Discutes qué aprendiste de una relación profesional difícil", "mood": "honesto", "task": "Ve más allá de 'fue una personalidad difícil' para diagnosticar qué pasó realmente", "starter": "He tenido algunas relaciones laborales que no funcionaron y lo más útil que he hecho con eso es preguntarme no qué fallaba en ellos sino qué aportaba yo. En este caso…", "grammar": ["no qué fallaba en ellos sino qué aportaba yo", "en este caso"], "vocabulary": "dinámica, aportaba, honesto, reflexionar, patrón, complementar, diagnosticar"}, {"id": 70, "situation": "Hablas de si es mejor tener un alto salario haciendo algo que no te gusta o uno menor haciendo algo significativo", "mood": "honesto", "task": "No des la respuesta correcta — da la tuya real", "starter": "Lo he probado en ambas direcciones y lo que puedo decir es que el buen sueldo importa mucho más de lo que la gente admite cuando está cómoda, y el significado importa más que el dinero cuando estás en…", "grammar": ["el buen sueldo importa más de lo que se admite cuando se está cómodo", "el significado importa más cuando estás en"], "vocabulary": "significado, umbral, sostener, honesto, compensar, cómodo, real, virtud"}, {"id": 71, "situation": "Discutes si es posible dar o recibir feedback honesto en la mayoría de los entornos laborales", "mood": "honesto", "task": "Diagnostica por qué el feedback de calidad es tan raro", "starter": "La cultura de feedback que tenemos suena bien en teoría — abierta, frecuente, honesta. Pero en la práctica lo que he encontrado es que la mayoría es demasiado vaga para actuar o se da de una manera que…", "grammar": ["suena bien en teoría pero en la práctica", "demasiado vaga para actuar o se da de una manera que"], "vocabulary": "retroalimentación, accionable, vago, seguridad psicológica, confianza, cultura, efectivo, específico"}, {"id": 72, "situation": "Hablas de cómo ha cambiado tu estilo de comunicación al trabajar en remoto", "mood": "observador", "task": "Sé específico sobre lo que has tenido que desarrollar conscientemente", "starter": "El mayor cambio ha sido darme cuenta de cuánta comunicación antes externalizaba a estar físicamente presente. Cuando eso desapareció tuve que volverme mucho más deliberado en… y más explícito en…", "grammar": ["cuánta comunicación externalizaba a estar físicamente presente", "tuve que volverme mucho más deliberado en"], "vocabulary": "deliberado, explícito, asíncrono, tono, presencia, escrito, compensar, remoto"}, {"id": 73, "situation": "Explicas que valoras la claridad por encima de ser agradable en la comunicación", "mood": "convencido", "task": "Argumenta a favor sin desestimar la necesidad de tacto", "starter": "Hay una versión de la amabilidad que es en realidad una forma de evitar — te proteges de la incomodidad de decir algo difícil mientras la otra persona carga con el coste de no saberlo.", "grammar": ["una versión de la amabilidad que es evitación", "la otra persona carga con el coste de no saberlo"], "vocabulary": "claro, tacto, honesto, coste, evitación, retroalimentación, directo, incómodo"}, {"id": 74, "situation": "Discutes qué hace que algunas personas parezcan fácilmente confiables", "mood": "observador", "task": "Identifica las señales más sutiles de la fiabilidad", "starter": "La fiabilidad aparece en muchos momentos pequeños antes de los grandes. Las cosas que realmente observo son si alguien… cuando cree que nadie le ve, y si…", "grammar": ["aparece en muchos momentos pequeños antes de los grandes", "las cosas que realmente observo son"], "vocabulary": "señal, consistente, integridad, observar, fiable, carácter, patrón"}, {"id": 75, "situation": "Hablas de si la perseverancia o la adaptabilidad es más valiosa en el mundo actual", "mood": "reflexivo", "task": "Argumenta uno de los lados genuinamente mientras reconoces el otro", "starter": "Antes hubiera dicho que perseverar era siempre la virtud. Lo que el mercado laboral actual me ha enseñado es que hay momentos donde perseverar en la dirección equivocada simplemente…", "grammar": ["antes hubiera dicho que perseverar era siempre la virtud", "hay momentos donde perseverar en la dirección equivocada simplemente"], "vocabulary": "perseverancia, adaptabilidad, pivotar, dirección equivocada, contexto, resiliente, virtud"}, {"id": 76, "situation": "Explicas por qué ser demasiado autocrítico puede ser tan limitante como no serlo suficiente", "mood": "equilibrado", "task": "Describe el coste de la autocrítica excesiva con ejemplos", "starter": "Hay tanta conversación sobre la falta de autoconsciencia que rara vez hablamos del otro extremo — las personas que se analizan tanto que… y que están tan ocupadas con lo que podrían estar haciendo mal que…", "grammar": ["rara vez hablamos del otro extremo", "tan ocupadas con lo que podrían estar haciendo mal que"], "vocabulary": "autocrítica, parálisis, límite, excesivo, análisis, coste, equilibrio, acción"}, {"id": 77, "situation": "Hablas de lo que has aprendido sobre cuándo insistir y cuándo soltar", "mood": "sabio", "task": "Describe la distinción con ejemplos reales de tu vida", "starter": "La pregunta no es si luchar o soltar — eso la simplifica demasiado. La pregunta es si lo que persistes en cambiar está realmente disponible para cambiar con tu esfuerzo, o si lo que parece resistencia es en realidad…", "grammar": ["la pregunta no es si luchar o soltar — eso la simplifica", "si lo que persistes en cambiar está disponible para cambiar"], "vocabulary": "insistir, soltar, disponible, esfuerzo, resistencia, discernir, energía, sabiduría"}, {"id": 78, "situation": "Discutes si el éxito profesional tiene más que ver con el talento, el esfuerzo o la suerte", "mood": "honesto", "task": "Da tu valoración real con razonamiento específico", "starter": "La respuesta honesta es que el peso cambia en distintas etapas. Al principio es sobre todo… luego empieza a importar más si… y lo que la mayoría no admitirá en voz alta es que la suerte…", "grammar": ["el peso cambia en distintas etapas", "lo que la mayoría no admitirá en voz alta es que la suerte"], "vocabulary": "talento, esfuerzo, suerte, etapa, honesto, peso, admitir, privilegio"}, {"id": 79, "situation": "Cierras con una reflexión sobre lo que significa comunicarse genuinamente bien", "mood": "cálido y genuino", "task": "Termina con algo que hayas notado de verdad sobre ti mismo en estas conversaciones", "starter": "A lo que siempre vuelvo es que comunicarse bien no se trata realmente del idioma — se trata de la relación entre lo que quieres decir y lo que la otra persona escucha. Y en esa brecha es donde ocurre casi todo lo interesante.", "grammar": ["no se trata del idioma — se trata de la relación", "en esa brecha es donde ocurre casi todo lo interesante"], "vocabulary": "brecha, significado, escuchar, relación, idioma, comprensión, conectar, interesante"}, {"id": 80, "situation": "Explicas a un amigo que se muda al extranjero lo que nadie te advirtió", "mood": "sincero y útil", "task": "Comparte lo útil que nadie menciona", "starter": "Lo que más sorprende no son los problemas prácticos — eso ya lo sabes. Lo que la mayoría no te advierte es que la parte más difícil de adaptarse es…", "grammar": ["lo que más sorprende no son los problemas prácticos", "la parte más difícil de adaptarse es"], "vocabulary": "ajustar, identidad, soledad, práctico, integración, expectativa, realismo"}, {"id": 81, "situation": "Discutes si es posible confiar en alguien que te ha fallado antes", "mood": "matizado", "task": "Explora cuándo la confianza se puede reconstruir y cuándo no", "starter": "Una vez que has visto que alguien es capaz de cierta cosa no puedes desverlo. Puedes perdonar, pero perdonar y confiar no son lo mismo. Lo que determina si puedes reconstruirla es…", "grammar": ["puedes perdonar pero perdonar y confiar no son lo mismo", "lo que determina si puedes reconstruirla es"], "vocabulary": "traición, reconstruir, perdón, confianza, patrón, disponible, condiciones"}, {"id": 82, "situation": "Hablas de lo que te enseñó trabajar para un jefe muy difícil", "mood": "reflexivo", "task": "Extrae lo aprendido sin quedarte solo en la queja", "starter": "El jefe más difícil que he tenido me enseñó algunas de las cosas más útiles sobre cómo no quiero tratar a la gente — y también, inesperadamente, sobre mi propia…", "grammar": ["me enseñó sobre cómo no quiero tratar a la gente", "y también inesperadamente sobre mi propia"], "vocabulary": "difícil, aprender, contrario, gestión, lección, inesperado, propio"}, {"id": 83, "situation": "Explicas cómo distingues entre perseverar e insistir en un error", "mood": "sabio", "task": "Da criterios concretos para distinguir los dos", "starter": "La perseverancia y el error persistente se parecen mucho desde fuera. La diferencia que yo uso es… y me pregunto si lo que está cambiando con mi esfuerzo es lo que realmente importa o si…", "grammar": ["se parecen mucho desde fuera", "me pregunto si lo que cambia con mi esfuerzo es lo que importa"], "vocabulary": "perseverar, error persistente, criterio, esfuerzo, cambio, distinguir, salir"}, {"id": 84, "situation": "Discutes si las personas cambian de verdad o solo cambian de circunstancias", "mood": "filosófico pero concreto", "task": "Da tu opinión basada en lo que has observado", "starter": "He llegado a pensar que la gente sí cambia pero casi nunca de la manera que esperas. Lo que cambia más fácilmente es… Lo que resiste más es…", "grammar": ["la gente sí cambia pero casi nunca de la manera que esperas", "lo que cambia más fácilmente es"], "vocabulary": "cambio, circunstancias, profundo, superficial, carácter, resistir, esperar"}, {"id": 85, "situation": "Hablas de si el dinero da felicidad o solo alivia la infelicidad", "mood": "honesto", "task": "Da tu respuesta real más matizada que el cliché", "starter": "El cliché dice que el dinero no da la felicidad. Lo que he encontrado es más preciso: por debajo de cierto umbral, la falta de dinero crea un sufrimiento tan constante que… Por encima de ese umbral…", "grammar": ["por debajo de cierto umbral la falta de dinero crea un sufrimiento constante", "por encima de ese umbral"], "vocabulary": "umbral, aliviar, infelicidad, cliché, suficiente, bienestar, preciso"}, {"id": 86, "situation": "Explicas por qué crees que pedir disculpas se ha vuelto vacío", "mood": "crítico", "task": "Diagnostica el problema y describe cómo sería una disculpa real", "starter": "Hemos aprendido a producir los sonidos correctos — 'lo siento, asumo toda la responsabilidad' — sin ningún contenido real. Lo que falta en esas palabras es…", "grammar": ["hemos aprendido a producir los sonidos correctos sin contenido", "lo que falta en esas palabras es"], "vocabulary": "formulaico, performativo, vacío, específico, impacto, responsabilidad, genuino"}, {"id": 87, "situation": "Hablas de qué haces con la envidia cuando aparece en ti", "mood": "valiente", "task": "Sé honesto sobre experimentarla y cómo la manejas", "starter": "Mentiría si dijera que no la siento nunca. Lo que he aprendido es que la envidia, por incómoda que sea, puede ser informativa — suele apuntar hacia algo que quiero pero no me he admitido todavía que…", "grammar": ["mentiría si dijera que no la siento nunca", "suele apuntar hacia algo que quiero pero no me he admitido"], "vocabulary": "envidia, señal, querer, admitir, información, transformar, comparación"}, {"id": 88, "situation": "Discutes si las redes sociales crean o destruyen sentido de comunidad", "mood": "equilibrado con posición", "task": "Argumenta una posición específica con ejemplos", "starter": "Mi posición es que las redes crean comunidades que antes eran imposibles — las basadas en intereses compartidos más que en geografía. El problema es que esas comunidades tienden a…", "grammar": ["crean comunidades que antes eran imposibles", "el problema es que esas comunidades tienden a"], "vocabulary": "comunidad, geografía, interés, homogéneo, burbujas, conectar, fragmentar"}, {"id": 89, "situation": "Explicas que has aprendido a proteger mejor tu energía", "mood": "consciente", "task": "Describe lo que cambió y qué decidiste", "starter": "Me di cuenta de que estaba dando mi atención y energía de manera bastante indiscriminada. Lo que cambió fue que empecé a preguntarme antes de comprometerme a algo si… y si la respuesta era no…", "grammar": ["estaba dando mi atención de manera indiscriminada", "empecé a preguntarme antes de comprometerme si"], "vocabulary": "energía, atención, indiscriminado, selectivo, compromiso, límite, proteger"}, {"id": 90, "situation": "Hablas de si el éxito en el trabajo te ha hecho más o menos feliz de lo que esperabas", "mood": "honesto", "task": "Comparte la brecha entre lo que imaginabas y lo que has encontrado", "starter": "Lo que no preví es que lograr los objetivos que tenía me dejara con una sensación de… más que de…. Y eso me hizo replantearme si lo que perseguía era realmente lo que quería o lo que creía que…", "grammar": ["no preví que lograr los objetivos me dejara con", "eso me hizo replantearme si lo que perseguía era"], "vocabulary": "brecha, expectativa, logro, vacío, satisfacción, replantear, querer, creer"}, {"id": 91, "situation": "Discutes cómo manejas la crítica de alguien cuya opinión no respetas mucho", "mood": "maduro", "task": "Describe cómo distingues feedback útil de inútil", "starter": "Lo que he aprendido es que la fuente de la crítica importa pero no de la manera que pensaba. Incluso de alguien cuyo criterio no respeto del todo puede haber algo de… si consigo separarme de…", "grammar": ["la fuente importa pero no de la manera que pensaba", "si consigo separarme de"], "vocabulary": "fuente, criterio, separar, útil, inútil, ego, discernir, aprovechar"}, {"id": 92, "situation": "Hablas de cuándo merece la pena tener una conversación difícil", "mood": "medido", "task": "Describe tu proceso para decidirlo", "starter": "La pregunta que me hago no es si decir algo — es si decirlo va a cambiar algo realmente. Si creo que la persona es capaz de escucharlo y ajustar, entonces… Si no…", "grammar": ["la pregunta no es si decir algo — es si va a cambiar algo", "si creo que la persona es capaz de escucharlo"], "vocabulary": "confrontar, resultado, capaz, merece la pena, impacto, preparar, expectativa, energía"}, {"id": 93, "situation": "Explicas qué has aprendido de cometer errores en público", "mood": "humilde", "task": "Describe el proceso de recuperación con honestidad", "starter": "Lo más interesante de equivocarse en público es la reacción de los demás. He notado que la mayoría de la gente es mucho más indulgente de lo que esperaba si… y mucho menos si…", "grammar": ["lo más interesante es la reacción de los demás", "mucho más indulgente si y mucho menos si"], "vocabulary": "error, público, recuperación, reacción, indulgente, responsabilidad, manejar"}, {"id": 94, "situation": "Hablas de qué significa ser resiliente de verdad frente a la resiliencia performativa", "mood": "reflexivo", "task": "Distingue la resiliencia real de la que se ve desde fuera", "starter": "Hay una versión de la resiliencia que es genuina — realmente procesas lo que ha pasado y sigues adelante. Y hay otra versión que en realidad es… disfrazada de fortaleza.", "grammar": ["hay una versión genuina y hay otra que es", "disfrazada de fortaleza"], "vocabulary": "resiliente, performativo, procesar, genuino, fortaleza, negación, tiempo, recurso"}, {"id": 95, "situation": "Discutes si es posible mantener la motivación sin una recompensa externa", "mood": "reflexivo", "task": "Explora la motivación intrínseca y cuándo funciona de verdad", "starter": "La motivación intrínseca es real pero no es incondicional. He notado que funciona bien cuando… pero empieza a fallar cuando pasa demasiado tiempo sin que veas…", "grammar": ["la motivación intrínseca es real pero no es incondicional", "funciona bien cuando pero empieza a fallar cuando"], "vocabulary": "intrínseco, extrínseco, recompensa, condición, autonomía, propósito, retroalimentación"}, {"id": 96, "situation": "Hablas de si la creatividad se puede enseñar o es algo con lo que se nace", "mood": "abierto", "task": "Presenta tu opinión con matices", "starter": "Solía creer que la creatividad era mayormente innata. Lo que he cambiado de opinión es que la parte que importa más en el contexto laboral no es la creatividad en bruto sino…", "grammar": ["solía creer que la creatividad era mayormente innata", "lo que he cambiado de opinión es que"], "vocabulary": "creatividad, innato, adquirir, contexto, condiciones, entorno, cultivar"}, {"id": 97, "situation": "Explicas cómo priorizas cuando todo parece urgente al mismo tiempo", "mood": "práctico", "task": "Describe tu sistema real cuando hay demasiado en el plato", "starter": "La trampa de todo siendo urgente es que en realidad nada lo es. Lo que me ha ayudado es hacer una pregunta muy específica: si solo pudiera hacer una cosa hoy que realmente importara, sería… y por qué eso y no…", "grammar": ["la trampa es que si todo es urgente nada lo es", "si solo pudiera hacer una cosa que realmente importara"], "vocabulary": "urgente, importante, priorizar, trampa, sistema, claridad, elegir, uno solo"}, {"id": 98, "situation": "Hablas de si las personas que no han sufrido pueden apoyar a las que sí", "mood": "reflexivo", "task": "Explora el papel de la experiencia propia en la empatía", "starter": "Mi instinto es que la experiencia vivida no es imprescindible pero la proximidad sí. Lo que importa más que si has pasado por ello es si puedes… sin convertirlo en algo sobre ti mismo.", "grammar": ["la experiencia vivida no es imprescindible pero la proximidad sí", "sin convertirlo en algo sobre ti mismo"], "vocabulary": "experiencia vivida, proximidad, empatía, entender, apoyo, relevante, perspectiva"}, {"id": 99, "situation": "Discutes si la forma de dar feedback en tu trabajo funciona realmente", "mood": "honesto", "task": "Analiza qué hace el feedback eficaz y qué lo hace inútil", "starter": "La cultura de feedback que tenemos suena bien en teoría. En la práctica lo que he encontrado es que la mayoría es demasiado vaga para actuar, o se da de una manera que hace que el receptor se ponga a la defensiva.", "grammar": ["suena bien en teoría pero en la práctica", "demasiado vaga para actuar o de una manera que hace que"], "vocabulary": "retroalimentación, eficaz, vago, accionable, defensivo, seguridad, confianza, cultura"}, {"id": 100, "situation": "Cierras la conversación reflexionando sobre qué significa comunicarse de verdad", "mood": "cálido y genuino", "task": "Termina con una observación genuina sobre lo que te llevas", "starter": "Lo que me quedo de estas conversaciones es que comunicarse bien no es solo dominar el idioma — es estar dispuesto a decir algo que de verdad importa. Y eso requiere algo más que gramática: requiere…", "grammar": ["no es solo dominar el idioma", "estar dispuesto a decir algo que de verdad importa"], "vocabulary": "disposición, importar, más que gramática, honesto, voz, propósito, conectar"}],
    C1: [{"id": 1, "situation": "Hablas sobre cómo las redes sociales han cambiado las relaciones humanas", "mood": "reflexivo", "task": "Analiza lo que hemos ganado y lo que hemos perdido", "starter": "Lo que más me llama la atención es que nunca antes habíamos tenido tantas conexiones y sin embargo… Creo que la razón es que…", "grammar": ["lo que más me llama la atención es que", "y sin embargo + contraste"], "vocabulary": "superficial, significativo, curado, auténtico, parasocial, desconexión, validación"}, {"id": 2, "situation": "Explicas por qué decidiste cambiar de carrera a mitad de tu vida", "mood": "honesto y reflexivo", "task": "Describe el proceso de decisión y lo que aprendiste sobre ti mismo", "starter": "No fue un momento concreto sino una intuición que fue creciendo. Lo más difícil fue soltar… y lo que descubrí sobre mí fue…", "grammar": ["no fue… sino una intuición", "lo más difícil fue + infinitivo"], "vocabulary": "identidad, redefinirse, riesgo, seguridad, propósito, valentía, satisfacción"}, {"id": 3, "situation": "Describes cómo tu relación con tus padres ha cambiado al hacerte adulto", "mood": "íntimo", "task": "Reflexiona sobre el cambio de dinámica con honestidad", "starter": "Lo que más ha cambiado es que empecé a verlos como… en lugar de simplemente como… Hay cosas que entiendo ahora que a los veinte años era incapaz de ver.", "grammar": ["lo que más ha cambiado es que", "en lugar de simplemente como"], "vocabulary": "dinámica, expectativas, perspectiva, gratitud, complejidad, adulto, rol"}, {"id": 4, "situation": "Hablas de la presión de ser productivo constantemente", "mood": "honesto", "task": "Habla de la cultura del trabajo y su efecto en ti", "starter": "Hay un ruido de fondo constante en mi cabeza que dice que si estoy descansando debería estar haciendo algo. Creo que viene de… y el resultado es…", "grammar": ["un ruido de fondo constante", "si estoy descansando debería estar"], "vocabulary": "cultura del esfuerzo, culpa, productividad, descanso, valor, rendimiento, agotamiento"}, {"id": 5, "situation": "Describes qué hace difícil la empatía de verdad", "mood": "perspicaz", "task": "Ve más allá del cliché y describe qué se interpone en el camino", "starter": "Hablamos de la empatía como si fuera solo una decisión. Pero en la práctica… Los momentos en que más me cuesta son cuando… porque entonces mi propio…", "grammar": ["como si fuera solo una decisión", "los momentos en que más me cuesta son cuando"], "vocabulary": "proyección, incomodidad, sesgo, juicio, escuchar, esfuerzo, suposición"}, {"id": 6, "situation": "Explicas por qué crees que la gente se queda en trabajos que odia", "mood": "psicológico", "task": "Explora la mezcla de miedo, comodidad e identidad", "starter": "Rara vez es solo por dinero. La gente se queda porque… y porque su sentido de quién es ha llegado a entrelazarse con… El coste real es…", "grammar": ["rara vez es solo por dinero", "su sentido de quién es ha llegado a entrelazarse con"], "vocabulary": "coste hundido, identidad, inercia, zona de confort, autoestima, atrapado, valentía"}, {"id": 7, "situation": "Hablas sobre si la honestidad es siempre la mejor opción", "mood": "matizado", "task": "Da ejemplos donde la respuesta no es sencilla", "starter": "Creo que la honestidad absoluta es una especie de privilegio. Te la puedes permitir cuando las apuestas son bajas. Pero cuando… la pregunta no es si ser honesto sino…", "grammar": ["es una especie de privilegio", "la pregunta no es si… sino"], "vocabulary": "honestidad radical, amabilidad, momento, contexto, compasión, mentira piadosa, consecuencia"}, {"id": 8, "situation": "Describes cómo el fracaso en algo que te importaba mucho te cambió", "mood": "vulnerable", "task": "Sé específico y reflexiona sobre lo que aprendiste", "starter": "Lo extraño de ese fracaso fue que no solo hirió mi orgullo sino que me hizo cuestionar… Y el proceso de reconstrucción fue…", "grammar": ["no solo… sino que me hizo", "el proceso de reconstrucción fue"], "vocabulary": "identidad, resiliencia, replantear, retroceso, perspectiva, orgullo, frágil"}, {"id": 9, "situation": "Hablas sobre la diferencia entre estar solo y sentirse solo", "mood": "introspectivo", "task": "Haz la distinción con ejemplos personales", "starter": "La soledad elegida puede ser muy nutritiva — es elegida y tiene propósito. La soledad no deseada se parece al hambre: es el malestar de querer conexión y no tenerla.", "grammar": ["puede ser muy nutritiva", "el malestar de querer conexión y no tenerla"], "vocabulary": "soledad, elegida, involuntaria, autosuficiente, necesidad, presencia, deseo"}, {"id": 10, "situation": "Explicas por qué el aburrimiento está infrautilizado", "mood": "contraintuitivo", "task": "Argumenta que el aburrimiento tiene un valor que la gente se pierde", "starter": "Hemos eliminado casi completamente el aburrimiento de nuestras vidas y creo que hemos perdido algo importante. Cuando era niño… era en esos momentos de inactividad cuando…", "grammar": ["hemos eliminado casi completamente", "era en esos momentos de inactividad cuando"], "vocabulary": "creatividad, soñar despierto, inactividad, estimulación, inquieto, espacio, atención"}, {"id": 11, "situation": "Describes cómo manejas la incertidumbre sobre el futuro", "mood": "honesto", "task": "Comparte tus estrategias personales y lo que has aceptado", "starter": "Antes invertía enorme energía intentando controlar lo que no podía. Lo que me ha ayudado es aprender a distinguir entre… lo que puedo influenciar y lo que…", "grammar": ["antes invertía enorme energía intentando", "aprender a distinguir entre lo que puedo influenciar y"], "vocabulary": "incertidumbre, control, ansiedad, tolerancia, presente, aceptación, plan, adaptar"}, {"id": 12, "situation": "Hablas sobre la diferencia entre ser apasionado y estar obsesionado", "mood": "cuidadoso", "task": "Explora dónde la pasión se vuelve problemática", "starter": "La diferencia para mí está en qué pasa cuando las cosas no van bien. La pasión sobrevive al fracaso y se ajusta. La obsesión tiende a… y empieza a desplazar…", "grammar": ["la diferencia para mí está en qué pasa cuando", "la obsesión tiende a… y empieza a desplazar"], "vocabulary": "pasión, obsesión, flexible, rígido, identidad, absorbente, equilibrio, creativo"}, {"id": 13, "situation": "Explicas qué significa para ti vivir con integridad", "mood": "personal", "task": "Da tu propia definición a través de ejemplos más que abstracciones", "starter": "La integridad para mí tiene menos que ver con grandes gestos y más con los momentos pequeños en que nadie notaría si tomo el camino fácil. La prueba suele ser…", "grammar": ["tiene menos que ver con grandes gestos", "la prueba suele ser"], "vocabulary": "coherencia, privado, público, alinear, valor, pequeño, notable, consistente"}, {"id": 14, "situation": "Hablas sobre por qué te has vuelto más protector de tu atención", "mood": "comprometido", "task": "Describe qué cambió y qué priorizas ahora", "starter": "Me di cuenta de que la atención es el único recurso genuinamente no renovable que tengo. Una vez que lo vi así, empecé a pensar de forma distinta sobre… y dejé de sentirme culpable por…", "grammar": ["la atención es el único recurso genuinamente no renovable", "empecé a pensar de forma distinta sobre"], "vocabulary": "atención, no renovable, selectivo, distracción, invertir, reclamar, calidad, guardar"}, {"id": 15, "situation": "Describes cómo ha evolucionado tu relación con el fracaso", "mood": "resiliente", "task": "Muestra la evolución con honestidad", "starter": "El fracaso solía parecerme algo definitivo — como un veredicto sobre quién soy. Ahora lo vivo más como datos. Datos no agradables, pero datos que me ayudan a entender…", "grammar": ["solía parecerme algo definitivo — como un veredicto", "ahora lo vivo más como datos"], "vocabulary": "veredicto, datos, temporal, identidad, crecimiento, unir, interpretar, aprender"}, {"id": 16, "situation": "Explicas qué has aprendido sobre pedir ayuda", "mood": "sabio", "task": "Habla sobre cuándo pedirla y cuándo no", "starter": "El error que cometía era ofrecer consejos cuando lo que la persona realmente necesitaba era… Ahora pregunto antes de asumir. Y he notado que la mayoría de las veces…", "grammar": ["el error que cometía era ofrecer cuando", "ahora pregunto antes de asumir"], "vocabulary": "no solicitado, asumir, necesitar, imponer, dirección, escuchar, querer, ofrecer"}, {"id": 17, "situation": "Hablas sobre cómo la gente habla de sus problemas", "mood": "empático", "task": "Distingue entre lo que la gente realmente necesita", "starter": "Hay personas que vienen a que las escuchen. Otras realmente quieren soluciones. El error es ofrecer la equivocada. Lo que intento hacer es primero averiguar cuál…", "grammar": ["hay personas que vienen a que las escuchen", "el error es ofrecer la equivocada"], "vocabulary": "necesidad, escuchar, resolver, distinguir, preguntar, oír, ofrecer, desajuste"}, {"id": 18, "situation": "Describes qué te hace sentir más vivo", "mood": "personal y abierto", "task": "Sé honesto y específico sobre esas experiencias", "starter": "No en el sentido inspiracional vago — sino los momentos concretos, sensoriales en que el tiempo parece… y no hay ruido de fondo en mi cabeza. Para mí suele ser cuando…", "grammar": ["no en el sentido inspiracional vago", "los momentos concretos sensoriales en que el tiempo parece"], "vocabulary": "vivo, presente, flujo, absorber, sensorial, particular, momento, ruido de fondo"}, {"id": 19, "situation": "Hablas sobre cómo el idioma que usas moldea cómo piensas", "mood": "curioso", "task": "Da ejemplos concretos de tu propia experiencia", "starter": "Me he dado cuenta de que ciertos pensamientos son más fáciles de tener en un idioma que en otro. En inglés me resulta más fácil… mientras que en mi lengua materna…", "grammar": ["me he dado cuenta de que ciertos pensamientos", "mientras que en mi lengua materna"], "vocabulary": "cognición, marco, intraducible, expresión, matiz, visión del mundo, precisión"}, {"id": 20, "situation": "Explicas qué hace que una conversación sea verdaderamente buena", "mood": "entusiasta", "task": "Ve más allá de lo obvio y describe las condiciones necesarias", "starter": "Las mejores conversaciones que he tenido siempre tienen algo en común: nadie está actuando. Las dos personas están pensando en voz alta de verdad, y…", "grammar": ["siempre tienen algo en común: nadie está actuando", "pensando en voz alta de verdad"], "vocabulary": "presencia, curiosidad, vulnerabilidad, recíproco, escuchar, tangente, sorpresa, genuino"}, {"id": 21, "situation": "Hablas de la relación entre memoria e identidad", "mood": "reflexivo", "task": "Explora cómo lo que recordamos moldea quiénes somos", "starter": "La versión de mi pasado que cargo conmigo no es objetiva. Es una historia con un narrador, y ese narrador tiene… Lo que significa que cambiar quién soy implica en parte…", "grammar": ["no es objetiva — es una historia con un narrador", "cambiar quién soy implica en parte"], "vocabulary": "selectivo, narrador, construir, editar, identidad, moldear, recordar, reencuadrar"}, {"id": 22, "situation": "Explicas por qué las disculpas importan tanto", "mood": "cálido", "task": "Ve más allá del simple 'lo siento' y explora qué hace que una sea real", "starter": "Una disculpa que no reconoce el daño concreto realmente no llega. Lo que he encontrado que más importa no son las palabras en sí sino…", "grammar": ["una disculpa que no reconoce el daño", "lo que más importa no son las palabras sino"], "vocabulary": "reconocer, impacto, genuino, vacío, reparar, entender, específico, recibir"}, {"id": 23, "situation": "Hablas sobre cómo has cambiado tu relación con tu teléfono", "mood": "honesto", "task": "Habla de qué notaste y qué cambiaste", "starter": "Empecé a prestar atención a cuándo lo cogía y descubrí que la mayoría de las veces no era porque necesitara algo — era porque… El cambio que hice fue…", "grammar": ["la mayoría de las veces no era porque necesitara algo", "el cambio que hice fue"], "vocabulary": "compulsivo, desplazar, reflejo, atención, intencional, límite, notar, reclamar"}, {"id": 24, "situation": "Describes qué significa para ti una amistad duradera", "mood": "cálido", "task": "Reflexiona sobre lo que hace que una amistad perdure", "starter": "Las amistades largas te enseñan cosas que las cortas no pueden. Te ven a través de muchas versiones distintas de ti mismo, y lo que descubres es…", "grammar": ["te enseñan cosas que las cortas no pueden", "a través de muchas versiones distintas de ti mismo"], "vocabulary": "testigo, evolucionar, aceptación, perdón, compartido, historia, reparar, continuidad"}, {"id": 25, "situation": "Explicas cómo las experiencias de la infancia moldean los miedos de adulto", "mood": "perspicaz", "task": "Conecta algo de tu pasado con un comportamiento presente", "starter": "He rastreado muchas de mis reacciones instintivas hasta momentos muy concretos de la infancia. Por ejemplo, mi tendencia a… creo que viene de cuando…", "grammar": ["he rastreado muchas de mis reacciones hasta", "mi tendencia a… creo que viene de"], "vocabulary": "formativo, patrón, detonador, rastrear, instinto, herida, narrativa, inconsciente"}, {"id": 26, "situation": "Hablas sobre por qué el desacuerdo está infravalorado", "mood": "contraintuitivo", "task": "Argumenta a favor del conflicto productivo", "starter": "Se nos da muy bien simular el acuerdo — asentir aunque pensemos lo contrario. Lo que hemos perdido es el tipo de desacuerdo que realmente hace avanzar las ideas. Eso solo ocurre cuando…", "grammar": ["simular el acuerdo — asentir aunque pensemos lo contrario", "el tipo de desacuerdo que hace avanzar las ideas"], "vocabulary": "productivo, conflicto, simular, superficie, desafiar, afinar, genuino, avanzar"}, {"id": 27, "situation": "Describes qué te resulta genuinamente restaurador — no solo relajante", "mood": "reflexivo", "task": "Distingue entre el descanso pasivo y la restauración real", "starter": "Solía confundir relajarme con restaurarme pero no es lo mismo. Ver la televisión puede apagar mi mente, pero lo que realmente me recarga es… porque implica…", "grammar": ["solía confundir… con… pero no es lo mismo", "lo que realmente me recarga es"], "vocabulary": "restaurar, recargar, pasivo, activo, creativo, naturaleza, apagar, energía"}, {"id": 28, "situation": "Hablas de lo que has aprendido sobre la paciencia con algo que tardó mucho", "mood": "personal", "task": "Sé específico y honesto sobre el proceso", "starter": "Pasé dos años trabajando en algo antes de que cuajara. En ese tiempo aprendí que la paciencia no es pasiva — es elegir activamente…", "grammar": ["aprendí que la paciencia no es pasiva", "es elegir activamente"], "vocabulary": "paciencia, activo, confiar, proceso, duda, persistir, largo plazo, resistir urgencia"}, {"id": 29, "situation": "Explicas qué has aprendido sobre la confianza al ver cómo se pierde", "mood": "reflexivo", "task": "Explora la psicología de la traición y la reparación", "starter": "Una vez que has visto que alguien es capaz de una determinada cosa, no puedes ver lo que no has visto. Puedes perdonar, pero perdonar y confiar no son lo mismo.", "grammar": ["una vez que has visto no puedes desver", "perdonar y confiar no son lo mismo"], "vocabulary": "traición, vulnerabilidad, reparar, sospecha, vigilancia, herida, condicional, reconstruir"}, {"id": 30, "situation": "Hablas de lo que significa pertenecer a una generación", "mood": "sociológico pero personal", "task": "Explora la experiencia generacional compartida con matices", "starter": "Desconfío de las etiquetas generacionales, pero hay cosas que de verdad moldearon a las personas nacidas en la misma época que yo — no de la misma manera para todos, pero sí…", "grammar": ["desconfío de las etiquetas generacionales pero hay cosas", "no de la misma manera para todos pero sí"], "vocabulary": "generacional, colectivo, formativo, zeitgeist, cohorte, compartido, moldear, matiz"}, {"id": 31, "situation": "Describes qué te enseñó sobre ti mismo alguien que ya no está en tu vida", "mood": "honesto", "task": "Habla de lo que esa relación reflejó de ti", "starter": "Lo más extraño de las relaciones cercanas es con qué claridad te reflejan. Esta persona me mostró que tengo tendencia a… lo cual no había estado dispuesto a ver antes porque…", "grammar": ["con qué claridad te reflejan", "no había estado dispuesto a ver antes porque"], "vocabulary": "espejo, patrón, revelar, proyección, disposición, proximidad, verdad, incomodo"}, {"id": 32, "situation": "Explicas por qué crees que el silencio en la conversación se ha vuelto raro", "mood": "observador", "task": "Reflexiona sobre lo que hemos perdido en una cultura de habla constante", "starter": "Pocas veces en conversaciones recientes he visto que dos personas estuvieran cómodas dejando que el silencio permaneciera. Casi siempre alguien lo llena en unos tres segundos y creo que es porque…", "grammar": ["dejando que el silencio permanezca", "creo que es porque"], "vocabulary": "silencio, llenar, tolerar, miedo, incomodidad, espacio, respirar, reflexión"}, {"id": 33, "situation": "Describes qué cualidad crees que está más infravalorada en una persona", "mood": "personal", "task": "Elige algo no obvio y argumenta a favor", "starter": "Se habla mucho de ambición e inteligencia. Pero la cualidad que encuentro más rara y valiosa en una persona es… y te cuento por qué he llegado a pensarlo.", "grammar": ["se habla mucho de… pero la cualidad que encuentro", "te cuento por qué he llegado a pensarlo"], "vocabulary": "infravalorado, raro, consistencia, cumplir, silencioso, integridad, presencia"}, {"id": 34, "situation": "Hablas sobre cómo defines el éxito ahora frente a antes", "mood": "maduro", "task": "Muestra la evolución de lo que valoras", "starter": "Cuando era más joven el éxito significaba… Ahora me doy cuenta de que eso tenía que ver sobre todo con lo que los demás podían ver. Lo que de verdad me importa ahora es…", "grammar": ["cuando era más joven el éxito significaba", "lo que de verdad me importa ahora es"], "vocabulary": "redefinir, externo, interno, validación, significado, suficiente, satisfacción, cambiar"}, {"id": 35, "situation": "Cierras el curso describiendo qué ha significado comunicarte en esta lengua", "mood": "cálido y reflexivo", "task": "Comparte lo que has entendido sobre el lenguaje y la conexión", "starter": "Lo que he llegado a creer es que hablar bien no se trata realmente de impresionar — se trata de hacer contacto. Las veces que más me he sentido conectado con alguien no fue por las palabras brillantes sino porque…", "grammar": ["no se trata realmente de impresionar", "las veces que más me he sentido conectado no fue por"], "vocabulary": "contacto, conexión, ordinario, honesto, presencia, lengua, propósito, significado"}, {"id": 36, "situation": "Hablas sobre qué encontraste genuinamente restaurador — no solo relajante", "mood": "reflexivo", "task": "Distingue entre el descanso pasivo y la restauración real", "starter": "Solía confundir relajarme con restaurarme pero no es lo mismo. Ver la tele puede apagar mi mente, pero lo que realmente me recarga es… porque implica…", "grammar": ["solía confundir… con… pero no es lo mismo", "lo que realmente me recarga es"], "vocabulary": "restaurar, recargar, pasivo, activo, creativo, naturaleza, apagar, energía"}, {"id": 37, "situation": "Explicas qué has aprendido sobre la paciencia con algo que tardó mucho", "mood": "personal", "task": "Sé específico y honesto sobre el proceso", "starter": "Pasé dos años trabajando en algo antes de que cuajara. En ese tiempo aprendí que la paciencia no es pasiva — es elegir activamente…", "grammar": ["aprendí que la paciencia no es pasiva", "es elegir activamente"], "vocabulary": "paciencia, activo, confiar, proceso, duda, persistir, largo plazo"}, {"id": 38, "situation": "Hablas sobre cómo la manera en que hablas de ti mismo moldea quién eres", "mood": "psicológico", "task": "Explora cómo la narrativa personal moldea el comportamiento", "starter": "La historia que me cuento sobre quién soy afecta lo que intento, lo que evito, y lo que creo merecer. Cuando cambié la historia de… a… empecé a tomar decisiones completamente distintas.", "grammar": ["la historia que me cuento afecta", "cuando cambié la historia de… a…"], "vocabulary": "narrativa, autoconcepto, identidad, límite, posibilidad, autor, reescribir"}, {"id": 39, "situation": "Describes cómo manejas la crítica de forma diferente ahora", "mood": "reflexivo", "task": "Muestra el crecimiento con un contraste específico", "starter": "Mi instinto solía ser defenderme inmediatamente. Ahora intento dejar que la crítica aterrice primero, antes de decidir si es… El cambio llegó cuando…", "grammar": ["mi instinto solía ser defenderme", "dejar que la crítica aterrice primero"], "vocabulary": "defensivo, retroalimentación, ego, reaccionar, pausa, discernir, crecer"}, {"id": 40, "situation": "Explicas por qué el desacuerdo productivo está infravalorado", "mood": "contraintuitivo", "task": "Argumenta a favor del conflicto que hace avanzar las ideas", "starter": "Se nos da muy bien simular el acuerdo — asentir aunque pensemos lo contrario. Lo que hemos perdido es el tipo de desacuerdo que realmente hace avanzar las ideas. Eso solo ocurre cuando…", "grammar": ["simular el acuerdo aunque pensemos lo contrario", "el tipo de desacuerdo que hace avanzar ideas"], "vocabulary": "productivo, conflicto, simular, superficie, desafiar, afinar, genuino"}, {"id": 41, "situation": "Describes qué te enseñó sobre ti mismo alguien que ya no está en tu vida", "mood": "honesto", "task": "Habla sobre lo que esa relación reflejó", "starter": "Lo más extraño de las relaciones cercanas es con qué claridad te reflejan. Esta persona me mostró que tengo tendencia a… lo cual no había estado dispuesto a ver antes porque…", "grammar": ["con qué claridad te reflejan", "no había estado dispuesto a ver antes porque"], "vocabulary": "espejo, patrón, revelar, proyección, verdad, incomodo, proximidad"}, {"id": 42, "situation": "Hablas sobre lo que significa para ti una buena conversación", "mood": "entusiasta", "task": "Describe las condiciones que la hacen posible", "starter": "Las mejores conversaciones que he tenido siempre tienen algo en común: nadie está actuando. Las dos personas están pensando en voz alta de verdad, y…", "grammar": ["siempre tienen algo en común: nadie está actuando", "pensando en voz alta de verdad"], "vocabulary": "presencia, curiosidad, vulnerabilidad, recíproco, escuchar, sorpresa, genuino"}, {"id": 43, "situation": "Explicas por qué las historias que nos contamos sobre nosotros mismos importan", "mood": "psicológico", "task": "Explora cómo la narrativa personal moldea el comportamiento", "starter": "La historia que me cuento sobre quién soy afecta qué intento, qué evito, y lo que creo que merezco. Cuando cambié la historia de… a… empecé a tomar decisiones completamente distintas.", "grammar": ["la historia que me cuento afecta qué intento", "cuando cambié la historia"], "vocabulary": "narrativa, autoconcepto, identidad, límite, posibilidad, reescribir, creer"}, {"id": 44, "situation": "Describes un momento en que alguien te malinterpretó completamente", "mood": "honesto", "task": "Narra la historia y lo que te enseñó", "starter": "Lo que me resulta interesante del malentendido es que no vino de mala fe — vino de… Lo que aquello me enseñó sobre la comunicación fue que…", "grammar": ["no vino de mala fe — vino de", "lo que aquello me enseñó fue que"], "vocabulary": "malentendido, intención, comunicar, asumir, aclarar, perspectiva, resolver"}, {"id": 45, "situation": "Hablas de cómo valoras el tiempo a solas ahora más que antes", "mood": "reflexivo", "task": "Explora cómo ha cambiado tu relación con la soledad", "starter": "Antes evitaba estar solo porque se sentía como… Ahora lo "mood": "perspicaz", "task": "Ve más allá del consejo obvio de 'deja el móvil'", "starter": "Escuchar de verdad es más difícil de lo que parece porque la mayor parte del tiempo que alguien habla, parte de mi mente ya está preparando… El momento en que me doy cuenta de que lo estoy haciendo es…", "grammar": ["la mayor parte del tiempo ya estoy preparando", "el momento en que me doy cuenta de que lo estoy haciendo"], "vocabulary": "activo, distracción, preparar, respuesta, presencia, interrumpir, absorber"}, {"id": 50, "situation": "Explicas qué has notado sobre cómo las personas describen sus propios problemas", "mood": "empático", "task": "Distingue entre lo que dicen y lo que necesitan", "starter": "Algunas personas vienen a que las escuchen. Otras realmente quieren soluciones. El error es ofrecer la equivocada. Lo que intento hacer es primero averiguar cuál…", "grammar": ["algunas personas vienen a que las escuchen, otras quieren", "el error es ofrecer la equivocada"], "vocabulary": "necesidad, escuchar, resolver, distinguir, preguntar, oír, ofrecer"}, {"id": 51, "situation": "Describes cómo has aprendido a pedir ayuda", "mood": "vulnerable", "task": "Habla de lo que solía impedírtelo y qué cambió", "starter": "Pedir ayuda es más difícil de lo que parece porque requiere admitir un tipo de vulnerabilidad que a la mayoría nos han enseñado a ocultar. La barrera no es…", "grammar": ["requiere admitir un tipo de vulnerabilidad", "la barrera no es"], "vocabulary": "vulnerabilidad, orgullo, independencia, fuerza, vergüenza, cultura, carga"}, {"id": 52, "situation": "Hablas sobre un período de tu vida cuando todo era incierto y cómo saliste adelante", "mood": "honesto", "task": "Narra la experiencia con honestidad emocional", "starter": "Lo que me mantuvo no fue un plan — no tenía ninguno. Era más bien… y el entendimiento de que… Mirando atrás ahora puedo ver que…", "grammar": ["lo que me mantuvo no fue un plan", "mirando atrás ahora puedo ver que"], "vocabulary": "incert
