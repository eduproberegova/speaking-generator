atisch zu kommunizieren", "mood": "überzeugt", "task": "Argumentiere für Direktheit ohne Takt abzutun", "starter": "Es gibt eine Version von Höflichkeit die Vermeidung ist. Man schützt sich vor Unbehagen des Schwierigen-Sagens während die andere Person die Kosten des Nicht-Wissens trägt.", "grammar": ["eine Version von Höflichkeit die Vermeidung ist", "die andere Person trägt die Kosten des Nicht-Wissens"], "vocabulary": "direkt, Takt, ehrlich, Kosten, Vermeidung, klar, unbequem"}, {"id": 74, "situation": "Du erklärst was du von jemandem gelernt hast der anders denkt als du", "mood": "offen", "task": "Teile eine konkrete Erkenntnis", "starter": "Was sich am meisten verändert wenn man eng mit jemandem zusammenarbeitet der anders denkt sind nicht die Ergebnisse — es sind die Annahmen. Ich pflegte... so anzugehen weil ich dachte es sei einfach...", "grammar": ["nicht die Ergebnisse sondern die Annahmen", "ich pflegte so anzugehen weil ich dachte"], "vocabulary": "Annahme, Perspektive, vielfältig, Zusammenarbeit, bereichern, hinterfragen"}, {"id": 75, "situation": "Du diskutierst was dich langweilt und was das über dich sagt", "mood": "selbstbewusst", "task": "Sei ehrlich über was du nicht tolerierst und was das verrät", "starter": "Was ich sehr wenig toleriere ist... und früher fühlte ich mich vage schuldig dafür bis mir klar wurde dass Intoleranz gegenüber bestimmten Dingen ein Signal über das ist was man wirklich schätzt.", "grammar": ["früher fühlte ich mich vage schuldig", "intoleranz gegenüber bestimmten Dingen ist ein Signal"], "vocabulary": "Intoleranz, Signal, Wert, verraten, ungeduldig, Sinn, Aufmerksamkeit"}, {"id": 76, "situation": "Du diskutierst wie du mit dem Spannungsverhältnis zwischen deinen Werten und deinem Verhalten umgehst", "mood": "ehrlich", "task": "Beschreibe eine echte Spannung", "starter": "Ich glaube stark an... aber ich handle nicht immer so als ob. Ich glaube diese Lücke existiert weil... und weil Verhalten schwerer zu ändern ist als Überzeugungen.", "grammar": ["ich glaube stark an aber handle nicht immer so", "verhalten ist schwerer zu ändern als Überzeugungen"], "vocabulary": "Wert, handeln, Lücke, Absicht, Gewohnheit, Reibung, konsistent"}, {"id": 77, "situation": "Du redest darüber ob du Freundschaften aus deiner Arbeitszeit auch als Chef pflegen kannst", "mood": "erfahren", "task": "Erkunde die echte Spannung", "starter": "Die ehrliche Antwort ist ja aber es erfordert eine Art Aufwand den die meisten unterschätzen. Die Freundschaft muss sich anpassen — sie kann nicht gleich sein wie vorher — weil jetzt einer von euch...", "grammar": ["ja aber es erfordert einen Aufwand den die meisten unterschätzen", "die Freundschaft muss sich anpassen weil"], "vocabulary": "Autorität, Dynamik, anpassen, Vertrauen, professionell, echt, Macht"}, {"id": 78, "situation": "Du erklärst was du gelernt hast über den Aufbau von Vertrauen in kleinen Momenten", "mood": "beobachtend", "task": "Identifiziere subtile Signale", "starter": "Verlässlichkeit zeigt sich in vielen kleinen Momenten vor den großen. Was ich wirklich beachte ist ob jemand... wenn er denkt dass niemand zuschaut und ob...", "grammar": ["zeigt sich in kleinen Momenten vor den großen", "ob jemand wenn er denkt dass niemand zuschaut"], "vocabulary": "verlässlich, Signal, konsistent, Integrität, beobachten, Charakter"}, {"id": 79, "situation": "Du diskutierst ob du in der Lage bist dich nach der Arbeit wirklich zu entspannen", "mood": "aufrichtig", "task": "Teile was wirklich funktioniert", "starter": "Ich habe alles ausprobiert: keine E-Mails nach 18 Uhr wochenendfreies Handy alles. Was ich herausgefunden habe ist dass Abschalten weniger mit Regeln zu tun hat als mit...", "grammar": ["ich habe alles ausprobiert", "abschalten hat weniger mit Regeln zu tun als mit"], "vocabulary": "Grenze, verfügbar, Erwartung, Kultur, abschalten, echt"}, {"id": 80, "situation": "Du erklärst wie du mit Neid umgehst wenn er auftaucht", "mood": "mutig", "task": "Sei ehrlich über die Erfahrung", "starter": "Ich würde lügen wenn ich sagte ich kenne Neid nie. Was ich gelernt habe ist dass er so unangenehm er auch ist informativ sein kann — er zeigt auf etwas das ich möchte aber mir noch nicht eingestanden habe...", "grammar": ["ich würde lügen wenn ich sagte ich kenne ihn nie", "zeigt auf etwas das ich möchte aber noch nicht eingestanden"], "vocabulary": "Neid, Signal, wollen, eingestehen, Information, umwandeln"}, {"id": 81, "situation": "Du diskutierst ob deine Generation mehr oder weniger Schwierigkeiten hat als frühere", "mood": "reflektiv", "task": "Vermeide sowohl Viktimisierung als auch Verharmlosung", "starter": "Das Ehrlichste was ich sagen kann ist dass die Schwierigkeiten unterschiedlich sind mehr als größer oder kleiner. Was sich strukturell geändert hat ist... während was sich echte verbessert hat ist...", "grammar": ["unterschiedlich sind mehr als größer oder kleiner", "was sich strukturell geändert hat ist während"], "vocabulary": "Generation, strukturell, unterschiedlich, vergleichen, Kontext, Privileg"}, {"id": 82, "situation": "Du redest über was du von einer schwierigen Arbeitsbeziehung gelernt hast", "mood": "ehrlich", "task": "Geh über es war eine schwierige Persönlichkeit hinaus", "starter": "Das Nützlichste das ich je mit schwierigen Arbeitsbeziehungen gemacht habe ist zu fragen nicht was an ihnen falsch war sondern was ich dazu beigetragen habe. In diesem Fall...", "grammar": ["nicht was an ihnen falsch war sondern was ich beigetragen habe", "in diesem Fall"], "vocabulary": "Dynamik, beigetragen, ehrlich, reflektieren, Muster, diagnostizieren"}, {"id": 83, "situation": "Du diskutierst was echtes Selbstbewusstsein in der Arbeit ausmacht", "mood": "perspektivreich", "task": "Mach den Unterschied konkret", "starter": "Selbstsicherheit ohne Selbstbewusstsein ist Lärm mit guter Verpackung. Was ich gefunden habe ist dass die Menschen mit denen ich am liebsten arbeite nicht die sind die die meiste Gewissheit projizieren sondern die die...", "grammar": ["lärm mit guter Verpackung", "nicht die die Gewissheit projizieren sondern die die"], "vocabulary": "Selbstbewusstsein, Selbstsicherheit, Grenze, Gewissheit, kalibrieren, verlässlich"}, {"id": 84, "situation": "Du erklärst was du über das Erhalten von Unterstützung gelernt hast wenn du kämpfst", "mood": "ehrlich", "task": "Unterscheide was wirklich hilft von dem was nicht hilft", "starter": "Das Unhilfreiche das Menschen tun wenn ich kämpfe ist Lösungen anzubieten bevor ich fertig gesprochen habe. Was wirklich hilft ist wenn jemand...", "grammar": ["das Unhilfreiche ist Lösungen anzubieten bevor", "was wirklich hilft ist wenn jemand"], "vocabulary": "Zeuge, reparieren, zuhören, Präsenz, Rat, Raum, Bedürfnis"}, {"id": 85, "situation": "Du diskutierst ob es besser ist zu geben als zu nehmen in Freundschaften", "mood": "warm", "task": "Erkunde die Balance ohne idealistisch zu werden", "starter": "Ich glaube an Großzügigkeit aber ich habe auch gelernt dass dauerhafte einseitige Großzügigkeit auf beiden Seiten Probleme schafft. Was ich jetzt tue ist...", "grammar": ["dauerhafte einseitige Großzügigkeit schafft auf beiden Seiten Probleme", "was ich jetzt tue ist"], "vocabulary": "Großzügigkeit, Balance, einseitig, Gegenseitigkeit, dauerhaft, Freundschaft"}, {"id": 86, "situation": "Du redest darüber was du wirklich brauchst um engagiert bei der Arbeit zu bleiben", "mood": "professionell", "task": "Formuliere das Bedürfnis klar", "starter": "Ich schätze was ich tue und möchte das klarstellen. Was ich rückmelden möchte ist dass ich am produktivsten bin wenn... und dass ich bemerkt habe wie meine Energie nachlässt wenn...", "grammar": ["ich schätze was ich tue und möchte das klarstellen", "ich am produktivsten bin wenn"], "vocabulary": "engagiert, Herausforderung, Energie, Beitrag, Wachstum, produktiv"}, {"id": 87, "situation": "Du erklärst warum du jetzt selektiver bei dem bist was du erklärst", "mood": "bewusst", "task": "Beschreibe was sich verändert hat", "starter": "Ich habe bemerkt dass ich früher viel Zeit damit verbrachte Dinge zu erklären die niemanden interessierten. Was mir geholfen hat ist zu fragen ob meine Erklärung tatsächlich dem anderen hilft oder ob sie...", "grammar": ["früher viel Zeit damit verbrachte zu erklären", "ob meine Erklärung tatsächlich dem anderen hilft oder ob sie"], "vocabulary": "selektiv, erklären, nützlich, Energie, Zeitverschwendung, relevant"}, {"id": 88, "situation": "Du diskutierst was ein wirklich gutes Meeting von einem schlechten unterscheidet", "mood": "praktisch", "task": "Diagnostiziere was den Unterschied macht", "starter": "Was die meisten Meetings ruiniert ist kein Mangel an Vorbereitung — es ist ein unausgesprochenes Missverständnis über den Zweck. In den besten Meetings die ich erlebt habe gab es immer...", "grammar": ["was die meisten Meetings ruiniert ist ein unausgesprochenes Missverständnis über den Zweck", "in den besten Meetings gab es immer"], "vocabulary": "Zweck, Agenda, Entscheidung, Kontext, klar, Ergebnis"}, {"id": 89, "situation": "Du redest was du in diesem Kurs gelernt hast und was du mitnehmen willst", "mood": "warm und reflektiv", "task": "Beende mit einer persönlichen Reflexion", "starter": "Was mich an diesen Gesprächen überrascht hat ist dass ich begonnen habe auf Deutsch über Dinge nachzudenken die ich früher nicht in Worten fassen konnte. Nicht nur neue Vokabeln sondern...", "grammar": ["überrascht hat ist dass ich begonnen habe nachzudenken", "nicht nur neue Vokabeln sondern"], "vocabulary": "Reflexion, Erkenntnisse, Sprache, Denken, wachsen, Verbindung"}, {"id": 90, "situation": "Du schließt den Kurs mit einer Reflexion über echte Kommunikation", "mood": "herzlich", "task": "Beende mit einer echten persönlichen Erkenntnis", "starter": "Worauf ich immer zurückkomme ist dass Kommunikation nicht wirklich über Sprache geht — es geht um die Beziehung zwischen dem was du meinst und dem was die andere Person hört. Und in der Lücke dazwischen passiert fast alles Interessante.", "grammar": ["nicht wirklich über Sprache sondern um die Beziehung", "in der Lücke dazwischen passiert fast alles Interessante"], "vocabulary": "Lücke, Bedeutung, hören, Beziehung, Sprache, Verständnis, verbinden"}, {"id": 91, "situation": "Du redest darüber was dich an deiner Arbeit wirklich motiviert", "mood": "leidenschaftlich", "task": "Geh über Geld und Status hinaus", "starter": "Wenn ich ehrlich bin ist es selten das Gehalt das mich morgens antreibt. Was mich wirklich motiviert ist... und das Gefühl dass meine Arbeit...", "grammar": ["selten das Gehalt das mich antreibt", "was mich wirklich motiviert ist"], "vocabulary": "Antrieb, Motivation, Sinn, Beitrag, Zweck"}, {"id": 92, "situation": "Du erklärst einem Freund warum du eine gut bezahlte Stelle aufgegeben hast", "mood": "ehrlich", "task": "Erkläre die echte Motivation", "starter": "Es war kein einzelner Moment der mich dazu brachte aufzuhören. Es war ein schrittweises Erkennen dass egal wie viel sie mir zahlten ich...", "grammar": ["kein einzelner Moment sondern ein schrittweises Erkennen", "egal wie viel sie mir zahlten ich"], "vocabulary": "Autonomie, Zweck, Entscheidung, Wendepunkt, Kompensation"}, {"id": 93, "situation": "Du diskutierst ob du in den letzten Jahren zu einem besseren Kommunikator geworden bist", "mood": "reflektiv", "task": "Zeige konkrete Veränderungen", "starter": "Was sich am deutlichsten verändert hat ist nicht mein Wortschatz sondern wie ich... Früher war mein Instinkt immer... jetzt versuche ich zuerst...", "grammar": ["was sich am deutlichsten verändert hat ist nicht", "früher war mein Instinkt jetzt versuche ich"], "vocabulary": "Kommunikation, Instinkt, Veränderung, entwickeln, bewusst"}, {"id": 94, "situation": "Du erklärst was du brauchst wenn du unter starkem Stress bist", "mood": "ehrlich", "task": "Beschreibe was wirklich hilft", "starter": "Wenn ich unter starkem Druck stehe merke ich dass ich... brauche. Was mir früher geholfen hat war... aber was wirklich funktioniert ist...", "grammar": ["wenn ich unter starkem Druck stehe merke ich", "was wirklich funktioniert ist"], "vocabulary": "Stressbewältigung, Bedürfnis, Strategie, erholen, funktionieren"}, {"id": 95, "situation": "Du besprichst mit einem Freund ob ihr gemeinsames Projekt noch Sinn macht", "mood": "nachdenklich", "task": "Bewerte ehrlich den Zustand des Projekts", "starter": "Ich möchte offen mit dir reden. Was mich beschäftigt ist dass wir... und dass der Aufwand den wir betreiben nicht mehr im Verhältnis zu... steht.", "grammar": ["ich möchte offen mit dir reden", "nicht mehr im Verhältnis zu steht"], "vocabulary": "Aufwand, Verhältnis, Sinn, ehrlich, Entscheidung, Projekt"}, {"id": 96, "situation": "Du erklärst wie sich deine Einstellung zur Kritik verändert hat", "mood": "selbstbewusst", "task": "Zeige die Entwicklung konkret", "starter": "Früher hat mich Kritik meistens defensiv gemacht auch wenn ich wusste dass sie berechtigt war. Was sich geändert hat ist dass ich jetzt versuche... bevor ich reagiere.", "grammar": ["früher hat mich Kritik defensiv gemacht auch wenn ich wusste", "ich versuche jetzt bevor ich reagiere"], "vocabulary": "Kritik, defensiv, Entwicklung, Reaktion, Reife"}, {"id": 97, "situation": "Du diskutierst was einen guten Kollegen ausmacht", "mood": "erfahren", "task": "Geh über oberflächliche Qualitäten hinaus", "starter": "Die Qualität die ich am meisten schätze und die am seltensten ist nicht Kompetenz — die kann man lernen. Was man schwerer lernen kann ist... und das zeigt sich besonders wenn...", "grammar": ["nicht kompetenz die kann man lernen", "zeigt sich besonders wenn"], "vocabulary": "Kollege, Qualität, schätzen, selten, zuverlässig, Vertrauen"}, {"id": 98, "situation": "Du redest über eine Entscheidung die du bereust und was du daraus gelernt hast", "mood": "ehrlich", "task": "Sei konkret ohne dich in Selbstkritik zu verlieren", "starter": "Wenn ich an diese Entscheidung denke ist das Interessante nicht die Entscheidung selbst — es ist was sie mir über mich verraten hat. Ich habe gelernt dass ich dazu neige... wenn...", "grammar": ["nicht die Entscheidung selbst es ist was sie mir verraten hat", "ich neige dazu wenn"], "vocabulary": "bereuen, lernen, Muster, Erkenntnis, Selbstbewusstsein"}, {"id": 99, "situation": "Du erklärst deinem Team warum du eine unpopuläre Entscheidung triffst", "mood": "professionell", "task": "Erkläre die Begründung klar und direkt", "starter": "Ich weiß dass diese Entscheidung nicht das ist was viele erwartet haben und ich nehme das ernst. Was mich dazu geführt hat ist... und ich stehe dafür ein weil...", "grammar": ["nicht das ist was viele erwartet haben", "ich stehe dafür ein weil"], "vocabulary": "unpopulär, begründen, erklären, Vertrauen, Verantwortung"}, {"id": 100, "situation": "Du diskutierst ob du deinen Beruf richtig gewählt hast", "mood": "nachdenklich", "task": "Reflektiere ehrlich ohne zu dramatisieren", "starter": "Das ist eine Frage die ich mir manchmal stelle und die ehrliche Antwort ist... Was ich weiß ist dass ich heute anders entscheiden würde in mancher Hinsicht aber nicht weil... sondern weil...", "grammar": ["das ist eine Frage die ich mir manchmal stelle", "ich würde heute anders entscheiden aber nicht weil sondern weil"], "vocabulary": "Beruf, Wahl, reflektieren, ehrlich, anders, bereuen"}],
    C1: [{"id": 1, "situation": "Du redest darüber, wie soziale Medien die Art verändert haben, wie Menschen Beziehungen eingehen", "mood": "nachdenklich", "task": "Analysiere sowohl die Gewinne als auch die Verluste in der menschlichen Verbindung", "starter": "Was mich am meisten auffällt ist, dass wir jetzt mehr Verbindungen haben als je zuvor und trotzdem… Ich glaube, der Grund liegt darin, dass…", "grammar": ["was mich am meisten auffällt ist, dass", "und trotzdem + Kontrast"], "vocabulary": "oberflächlich, bedeutsam, kuratiert, authentisch, parasozial, Entfremdung, Bestätigung"}, {"id": 2, "situation": "Du erklärst warum du entschieden hast, deinen Beruf zu wechseln", "mood": "ehrlich und selbstbewusst", "task": "Beschreibe den Entscheidungsprozess und was du über dich gelernt hast", "starter": "Es war kein einzelner Moment, sondern ein schrittweises Bewusstwerden, dass… Das Schwierigste war loszulassen… und was ich über mich herausgefunden habe ist…", "grammar": ["es war kein einzelner Moment, sondern ein schrittweises", "das Schwierigste war + zu + Infinitiv"], "vocabulary": "Identität, neu definieren, Risiko, Sicherheit, Zweck, Mut, Erfüllung"}, {"id": 3, "situation": "Du beschreibst wie sich deine Beziehung zu deinen Eltern als Erwachsener verändert hat", "mood": "vertraut", "task": "Reflektiere ehrlich über die sich verändernde Dynamik", "starter": "Was sich am meisten verändert hat ist, dass ich begann sie als… zu sehen, anstatt nur als… Es gibt Dinge, die ich jetzt verstehe, die ich mit zwanzig nicht hätte sehen können.", "grammar": ["was sich am meisten verändert hat ist, dass", "anstatt nur als"], "vocabulary": "Dynamik, Erwartungen, Perspektive, Dankbarkeit, Komplexität, erwachsen, Rolle"}, {"id": 4, "situation": "Du sprichst über den Druck, ständig produktiv zu sein", "mood": "ehrlich", "task": "Sprich über Hustle-Kultur und ihre Auswirkung auf dich", "starter": "Im Hintergrund läuft ständig dieses Rauschen in meinem Kopf: Wenn ich mich ausruhe, sollte ich eigentlich etwas tun. Ich glaube, es kommt von… und das Ergebnis ist…", "grammar": ["im Hintergrund läuft ständig dieses Rauschen", "wenn ich mich ausruhe, sollte ich"], "vocabulary": "Hustle-Kultur, Schuldgefühle, Produktivität, Ausruhen, Wert, Leistung, Erschöpfung"}, {"id": 5, "situation": "Du beschreibst warum Empathie schwieriger ist, als sie klingt", "mood": "aufschlussreich", "task": "Geh über den Klischee hinaus und beschreibe was sich in den Weg stellt", "starter": "Wir reden über Empathie, als wäre sie nur eine Entscheidung. Aber in der Praxis… Die Momente, in denen es mir am schwersten fällt, sind wenn… weil dann mein eigenes…", "grammar": ["als wäre sie nur eine Entscheidung", "die Momente in denen es mir am schwersten fällt"], "vocabulary": "Projektion, Unbehagen, Vorurteil, Urteil, zuhören, Anstrengung, Annahme"}, {"id": 6, "situation": "Du erklärst warum Menschen in Jobs bleiben, die sie hassen", "mood": "psychologisch", "task": "Erkunde die Mischung aus Angst, Komfort und Identität", "starter": "Es liegt selten nur am Geld. Die Menschen bleiben, weil… und weil ihr Sinn für die eigene Identität sich mit… verflochten hat. Der eigentliche Preis ist…", "grammar": ["es liegt selten nur am Geld", "ihr Sinn für die eigene Identität hat sich verflochten mit"], "vocabulary": "versunkene Kosten, Identität, Trägheit, Komfortzone, Selbstwert, gefangen, Mut"}, {"id": 7, "situation": "Du sprichst darüber ob Ehrlichkeit immer die richtige Wahl ist", "mood": "nuanciert", "task": "Gib Beispiele wo die Antwort nicht einfach ist", "starter": "Ich glaube, absolute Ehrlichkeit ist eine Art Privileg — man kann sie sich leisten, wenn der Einsatz gering ist. Aber wenn… dann ist die Frage nicht ob man ehrlich sein soll, sondern…", "grammar": ["eine Art Privileg", "die Frage ist nicht ob… sondern"], "vocabulary": "radikale Ehrlichkeit, Freundlichkeit, Zeitpunkt, Kontext, Mitgefühl, Notlüge, Konsequenz"}, {"id": 8, "situation": "Du beschreibst wie das Scheitern an etwas das dir wichtig war, dich verändert hat", "mood": "verletzbar", "task": "Sei spezifisch und reflektiere darüber was du gelernt hast", "starter": "Das Seltsame an diesem Scheitern war, dass es nicht nur meinen Stolz verletzte, sondern mich dazu brachte zu hinterfragen… Und der Prozess des Wiederaufbaus danach war…", "grammar": ["es verletzte nicht nur… sondern brachte mich dazu", "der Prozess des Wiederaufbaus danach war"], "vocabulary": "Identität, Resilienz, überdenken, Rückschlag, Perspektive, Stolz, zerbrechlich"}, {"id": 9, "situation": "Du sprichst über den Unterschied zwischen Alleinsein und Einsamkeit", "mood": "introspektiv", "task": "Mache den Unterschied mit persönlichen Beispielen deutlich", "starter": "Einsamkeit, die man wählt, kann sehr nährend sein — sie ist gewählt und zweckorientiert. Einsamkeit fühlt sich wie Hunger an: Es ist das Unbehagen, Verbindung zu wollen und sie nicht zu haben.", "grammar": ["kann sehr nährend sein — sie ist gewählt", "das Unbehagen, Verbindung zu wollen und sie nicht zu haben"], "vocabulary": "Einsamkeit, gewählt, unfreiwillig, Selbstgenügsamkeit, Bedürfnis, Präsenz"}, {"id": 10, "situation": "Du erklärst warum Langeweile unterschätzt wird", "mood": "kontraintuitiv", "task": "Argumentiere dass Langeweile einen Wert hat, den die meisten verpassen", "starter": "Wir haben Langeweile fast vollständig aus unserem Leben verbannt und ich glaube wir haben etwas Wichtiges verloren. Als ich Kind war… waren genau in diesen untätigen Momenten…", "grammar": ["wir haben Langeweile fast vollständig verbannt", "waren genau in diesen untätigen Momenten"], "vocabulary": "Kreativität, Tagträumen, Untätigkeit, Stimulation, unruhig, Raum, Aufmerksamkeit"}, {"id": 11, "situation": "Du beschreibst wie du mit Ungewissheit über die Zukunft umgehst", "mood": "ehrlich", "task": "Teile deine persönlichen Strategien und was du akzeptiert hast", "starter": "Früher investierte ich enorme Energie darin, zu kontrollieren, was ich nicht kontrollieren konnte. Was mir geholfen hat ist zu lernen, zwischen… zu unterscheiden, was ich beeinflussen kann und was…", "grammar": ["früher investierte ich enorme Energie darin", "zu lernen zwischen zu unterscheiden, was ich beeinflussen kann"], "vocabulary": "Ungewissheit, Kontrolle, Angst, Toleranz, Gegenwart, Akzeptanz, Plan, anpassen"}, {"id": 12, "situation": "Du redest über den Unterschied zwischen Leidenschaft und Obsession", "mood": "bedächtig", "task": "Erkunde wo Leidenschaft problematisch wird", "starter": "Der Unterschied liegt für mich darin, was passiert wenn es nicht gut läuft. Leidenschaft überlebt das Scheitern und passt sich an. Obsession tendiert dazu… und beginnt zu verdrängen…", "grammar": ["der Unterschied liegt für mich darin, was passiert wenn", "Obsession tendiert dazu… und beginnt zu verdrängen"], "vocabulary": "Leidenschaft, Obsession, flexibel, starr, Identität, alles-konsumierend, Gleichgewicht"}, {"id": 13, "situation": "Du erklärst was es für dich bedeutet, mit Integrität zu leben", "mood": "persönlich", "task": "Gib deine eigene Definition durch Beispiele statt Abstraktion", "starter": "Integrität hat für mich weniger mit großen Gesten zu tun als mit den kleinen Momenten, in denen niemand merken würde, wenn ich den einfacheren Weg nehme. Die Prüfung ist meist…", "grammar": ["hat weniger mit großen Gesten zu tun als mit", "die Prüfung ist meist"], "vocabulary": "Konsequenz, privat, öffentlich, ausrichten, Wert, klein, bemerken, konsistent"}, {"id": 14, "situation": "Du sprichst über den Druck ständig erreichbar zu sein", "mood": "bewusst", "task": "Beschreibe was sich verändert hat und was du jetzt priorisierst", "starter": "Mir wurde klar, dass Aufmerksamkeit die einzige wirklich nicht erneuerbare Ressource ist die ich habe. Als ich es so sah, begann ich anders über… nachzudenken und hörte auf, mich schuldig zu fühlen für…", "grammar": ["die einzige wirklich nicht erneuerbare Ressource", "begann ich anders über… nachzudenken"], "vocabulary": "Aufmerksamkeit, nicht erneuerbar, selektiv, Ablenkung, investieren, zurückgewinnen, Qualität"}, {"id": 15, "situation": "Du beschreibst wie sich deine Beziehung zum Scheitern verändert hat", "mood": "widerstandsfähig", "task": "Zeige die Entwicklung ehrlich", "starter": "Scheitern fühlte sich früher für mich endgültig an — wie ein Urteil darüber, wer ich bin. Jetzt erlebe ich es eher wie Daten. Keine angenehmen Daten, aber Daten die mir helfen zu verstehen…", "grammar": ["fühlte sich früher endgültig an — wie ein Urteil", "jetzt erlebe ich es eher wie Daten"], "vocabulary": "Urteil, Daten, vorübergehend, Identität, Wachstum, anhängen, interpretieren, lernen"}, {"id": 16, "situation": "Du erklärst was du über das Einholen von Rat gelernt hast", "mood": "weise", "task": "Sprich darüber wann man ihn gibt und wann nicht", "starter": "Der Fehler, den ich früher machte, war Ratschläge zu geben, wenn die Person eigentlich brauchte… Jetzt frage ich zuerst bevor ich annehme. Und ich habe bemerkt, dass die meisten Male…", "grammar": ["der Fehler, den ich früher machte, war", "jetzt frage ich zuerst bevor ich annehme"], "vocabulary": "ungebeten, annehmen, brauchen, aufzwingen, zuhören, wollen, anbieten"}, {"id": 17, "situation": "Du redest wie Menschen über ihre Probleme reden", "mood": "einfühlsam", "task": "Unterscheide zwischen dem was Menschen wirklich brauchen", "starter": "Manche kommen zu dir, um gehört zu werden. Andere wollen wirklich Lösungen. Der Fehler ist, das Falsche anzubieten. Was ich versuche zuerst herauszufinden ist welche…", "grammar": ["manche kommen um gehört zu werden", "der Fehler ist, das Falsche anzubieten"], "vocabulary": "Bedürfnis, zuhören, lösen, unterscheiden, fragen, hören, anbieten, Fehlabstimmung"}, {"id": 18, "situation": "Du beschreibst was dich wirklich lebendig fühlen lässt", "mood": "persönlich und offen", "task": "Sei ehrlich und spezifisch über die Erfahrungen", "starter": "Nicht im vagen, inspirierenden Sinne — ich meine die konkreten, sensorischen Momente, in denen die Zeit zu scheinen… und kein Hintergrundrauschen in meinem Kopf ist. Für mich ist das normalerweise wenn…", "grammar": ["nicht im vagen inspirierenden Sinne", "die konkreten sensorischen Momente in denen die Zeit"], "vocabulary": "lebendig, präsent, Fluss, aufnehmen, sensorisch, besonders, Moment"}, {"id": 19, "situation": "Du erklärst wie die Sprache die du verwendest, dein Denken beeinflusst", "mood": "neugierig", "task": "Gib konkrete Beispiele aus deiner eigenen Erfahrung", "starter": "Mir ist aufgefallen, dass manche Gedanken in einer Sprache leichter zu haben sind als in einer anderen. Auf Englisch fällt es mir leichter… während in meiner Muttersprache…", "grammar": ["manche Gedanken in einer Sprache leichter zu haben sind", "während in meiner Muttersprache"], "vocabulary": "Kognition, Rahmen, unübersetzbar, Ausdruck, Nuance, Weltbild, Präzision"}, {"id": 20, "situation": "Du beschreibst was eine wirklich gute Unterhaltung ausmacht", "mood": "enthusiastisch", "task": "Geh über das Offensichtliche hinaus und beschreibe die nötigen Bedingungen", "starter": "Die besten Gespräche die ich geführt habe, haben immer etwas gemeinsam: Niemand spielt eine Rolle. Beide Personen denken wirklich laut nach, und…", "grammar": ["haben immer etwas gemeinsam: Niemand spielt eine Rolle", "wirklich laut nachdenken"], "vocabulary": "Präsenz, Neugier, Verletzbarkeit, gegenseitig, zuhören, Abschweifung, Überraschung"}, {"id": 21, "situation": "Du redest über die Beziehung zwischen Erinnerung und Identität", "mood": "nachdenklich", "task": "Erkunde wie das, woran wir uns erinnern, unser Selbstbild prägt", "starter": "Die Version meiner Vergangenheit die ich mit mir trage, ist nicht objektiv. Es ist eine Geschichte mit einem Erzähler, und dieser Erzähler hat… Was das bedeutet ist, dass sich meine Identität zu ändern teilweise erfordert…", "grammar": ["die Version meiner Vergangenheit ist nicht objektiv — es ist eine Geschichte", "meine Identität zu ändern erfordert teilweise"], "vocabulary": "selektiv, Erzähler, konstruieren, bearbeiten, Identität, formen, erinnern"}, {"id": 22, "situation": "Du erklärst warum Entschuldigungen so wichtig sind", "mood": "herzlich", "task": "Geh über das einfache 'Entschuldigung' hinaus und erkunde was eine Entschuldigung echt macht", "starter": "Eine Entschuldigung die den konkreten Schaden nicht anerkennt, kommt nicht wirklich an. Was ich gefunden habe, das am meisten zählt, sind nicht die Worte selbst sondern…", "grammar": ["eine Entschuldigung die nicht anerkennt", "was am meisten zählt sind nicht die Worte sondern"], "vocabulary": "anerkennen, Auswirkung, aufrichtig, hohl, reparieren, verstehen, spezifisch, empfangen"}, {"id": 23, "situation": "Du sprichst wie du jetzt mit deinem Handy umgehst anders als früher", "mood": "ehrlich", "task": "Sprich darüber was du bemerkt hast und was du geändert hast", "starter": "Ich fing an, darauf zu achten, wann ich es in die Hand nahm, und stellte fest, dass es meistens nicht war weil ich etwas brauchte — es war weil… Die Änderung, die ich vornahm war…", "grammar": ["meistens war es nicht weil ich etwas brauchte", "die Änderung, die ich vornahm war"], "vocabulary": "zwanghaft, scrollen, Reflex, Aufmerksamkeit, absichtlich, Grenze, bemerken"}, {"id": 24, "situation": "Du beschreibst was eine dauerhafte Freundschaft ausmacht", "mood": "herzlich", "task": "Reflektiere darüber was eine Freundschaft dauerhaft macht", "starter": "Lange Freundschaften lehren dich Dinge, die kurze nicht können. Du siehst einander durch viele verschiedene Versionen eurer selbst, und was du dabei entdeckst ist…", "grammar": ["lange Freundschaften lehren Dinge die kurze nicht können", "durch viele verschiedene Versionen eurer selbst"], "vocabulary": "Zeuge, entwickeln, Akzeptanz, Vergebung, geteilt, Geschichte, reparieren, Kontinuität"}, {"id": 25, "situation": "Du erklärst was du über das Einfordern von Grenzen gelernt hast", "mood": "nachdenklich", "task": "Erzähle von einer Zeit als du es falsch gemacht hast", "starter": "Lange Zeit dachte ich, zu allem Ja zu sagen sei eine Form der Großzügigkeit. Was ich schließlich verstand war, dass es eher… war und aus dem Glauben kam, dass…", "grammar": ["dachte ich, zu allem Ja zu sagen sei eine Form von", "es kam aus dem Glauben dass"], "vocabulary": "Groll, Gefälligkeit, Angst, Großzügigkeit, Selbstrespekt, Muster, erkennen"}, {"id": 26, "situation": "Du sprichst über die Lücke zwischen deinen Werten und deinen Handlungen", "mood": "ehrlich", "task": "Beschreibe eine echte Spannung mit der du lebst", "starter": "Ich glaube stark an… aber ich handle nicht immer so als ob ich es tue. Ich glaube, diese Lücke existiert weil… und weil Verhalten schwerer zu ändern ist als Überzeugungen.", "grammar": ["ich glaube stark an… aber ich handle nicht immer so", "Verhalten ist schwerer zu ändern als Überzeugungen"], "vocabulary": "Wert, handeln, Lücke, Absicht, Gewohnheit, Heuchelei, Reibung, konsistent"}, {"id": 27, "situation": "Du beschreibst einen Moment als jemandes Freundlichkeit deinen Tag komplett veränderte", "mood": "herzlich", "task": "Erzähle die Geschichte und reflektiere was sie dir gezeigt hat", "starter": "Es war so eine kleine Sache — sie haben wahrscheinlich nicht mal darüber nachgedacht. Aber die Wirkung die es auf mich hatte war unverhältnismäßig groß, weil ich zu dem Zeitpunkt…", "grammar": ["es war so eine kleine Sache", "die Wirkung war unverhältnismäßig groß weil"], "vocabulary": "Freundlichkeit, Wellen, bemerken, Fremder, verhältnismäßig, Auswirkung, erinnern"}, {"id": 28, "situation": "Du erklärst was du dir über Beziehungen in deinen Zwanzigern gewünscht hättest zu wissen", "mood": "reif", "task": "Teile spezifische Erkenntnisse die du mit dem Alter gewonnen hast", "starter": "Ich glaube, ich verbrachte viele meiner Zwanziger damit, unvereinbare Menschen durch schiere Anstrengung kompatibel zu machen. Was ich jetzt weiß ist, dass die Arbeit in einer Beziehung sich anfühlen sollte wie…", "grammar": ["unvereinbare Menschen durch schiere Anstrengung kompatibel zu machen", "die Arbeit in einer Beziehung sollte sich anfühlen wie"], "vocabulary": "kompatibel, Anstrengung, Verträglichkeit, Energie, früh, Muster"}, {"id": 29, "situation": "Du beschreibst eine Gewohnheit die du aufgebaut hast und die dein Leben verändert hat", "mood": "praktisch und ehrlich", "task": "Sei spezifisch was es ist und warum es funktioniert", "starter": "Das Besondere an dieser Gewohnheit ist, dass sie fast trivial klein erschien als ich anfing. Aber im Laufe der Zeit habe ich bemerkt, dass…", "grammar": ["sie erschien fast trivial klein als ich anfing", "im Laufe der Zeit habe ich bemerkt, dass"], "vocabulary": "zusammengesetzt, konsistent, klein, Ritual, Identität, Auslöser, Belohnung, inkrementell"}, {"id": 30, "situation": "Du beschreibst einen Wert den du hast, den die meisten Menschen in deinem Umfeld nicht teilen", "mood": "mutig", "task": "Sprich darüber wie es ist, eine Minderheitsmeinung zu vertreten", "starter": "Es kann sich isolierend anfühlen, etwas zu schätzen, das die Menschen in deiner unmittelbaren Welt nicht ernst nehmen. Die Erfahrung handelt weniger von Konflikt und mehr von…", "grammar": ["es kann sich isolierend anfühlen", "weniger von Konflikt und mehr von"], "vocabulary": "Minderheit, Wert, isolierend, sichtbar, kompromittieren, artikulieren, selten"}, {"id": 31, "situation": "Du redest über das was du über Geduld gelernt hast durch etwas das lange gedauert hat", "mood": "persönlich", "task": "Sei spezifisch und ehrlich über den Prozess", "starter": "Ich arbeitete zwei Jahre an etwas bevor es zusammenfand. In dieser Zeit lernte ich, dass Geduld nicht passiv ist — sie ist das aktive Wählen von…", "grammar": ["lernte ich, dass Geduld nicht passiv ist", "es ist das aktive Wählen von"], "vocabulary": "Geduld, aktiv, vertrauen, Prozess, Zweifel, beharren, langfristig"}, {"id": 32, "situation": "Du erklärst was wirkliche Unterstützung für dich bedeutet wenn du zu kämpfen hast", "mood": "ehrlich", "task": "Unterscheide was wirklich hilft von dem was nicht hilft", "starter": "Das Unberatene, das die Leute tun wenn ich kämpfe, ist Lösungen anzubieten bevor ich fertig gesprochen habe. Was wirklich hilft ist wenn jemand…", "grammar": ["das Unberatene ist Lösungen anzubieten bevor", "was wirklich hilft ist wenn jemand"], "vocabulary": "Zeuge, reparieren, zuhören, Präsenz, Rat, Raum, Bedürfnis, ungefragt"}, {"id": 33, "situation": "Du beschreibst was es bedeutet präsent in einer Beziehung zu sein", "mood": "nachdenklich", "task": "Geh über 'Leg dein Handy weg' zu der tieferen Qualität", "starter": "Körperliche Präsenz ist der einfache Teil. Die schwierigere Art ist emotional präsent zu sein — wirklich verfügbar anstatt… Ich bemerke den Unterschied am meisten wenn…", "grammar": ["körperliche Präsenz ist der einfache Teil", "wirklich verfügbar anstatt"], "vocabulary": "verfügbar, abgelenkt, einstimmen, halb-präsent, woanders, bemerken, Qualität"}, {"id": 34, "situation": "Du erklärst wie du das Gefühl missverstanden zu werden handhabst", "mood": "ehrlich", "task": "Erkunde sowohl den Schmerz als auch die Reaktion darauf", "starter": "Das Gefühl missverstanden zu werden ist besonders spezifisch — es ist nicht nur Frustration, es ist eine Art Einsamkeit. Was ich gelernt habe ist… von… zu trennen und mich zu fragen ob…", "grammar": ["es ist nicht nur Frustration — es ist eine Art Einsamkeit", "trennen und mich zu fragen ob"], "vocabulary": "missverstanden, trennen, klar, Reaktion, isolieren, kommunizieren, prüfen"}, {"id": 35, "situation": "Du schließt den Kurs indem du beschreibst was Kommunikation für dich bedeutet", "mood": "herzlich und nachdenklich", "task": "Teile was du über Sprache und Verbindung verstanden hast", "starter": "Was ich zu glauben begonnen habe ist, dass gut sprechen nicht wirklich darum geht, Leute zu beeindrucken — es geht darum, Kontakt herzustellen. Die Momente, in denen ich mich am meisten mit jemandem verbunden gefühlt habe, waren nie wegen kluger Worte, sondern wegen…", "grammar": ["gut sprechen geht nicht wirklich darum zu beeindrucken", "die Momente in denen ich mich am meisten verbunden fühlte"], "vocabulary": "Kontakt, Verbindung, gewöhnlich, ehrlich, Präsenz, Sprache, Zweck, Bedeutung"}, {"id": 36, "situation": "Du beschreibst wie du mit Kritik jetzt anders umgehst als früher", "mood": "selbstbewusst", "task": "Zeige das Wachstum mit einem konkreten Kontrast", "starter": "Mein Instinkt war früher, mich sofort zu verteidigen. Jetzt versuche ich die Kritik zuerst ankommen zu lassen, bevor ich entscheide ob sie… Die Veränderung kam als…", "grammar": ["mein Instinkt war früher mich sofort zu verteidigen", "die Kritik ankommen lassen bevor ich entscheide"], "vocabulary": "defensiv, Feedback, Ego, reagieren, Pause, unterscheiden, wachsen"}, {"id": 37, "situation": "Du sprichst über eine Gewohnheit die du aufgebaut hast", "mood": "praktisch und ehrlich", "task": "Sei spezifisch was es ist und warum es funktioniert", "starter": "Das Besondere an dieser Gewohnheit ist dass sie fast trivial klein erschien als ich anfing. Aber im Laufe der Zeit habe ich bemerkt dass…", "grammar": ["sie erschien fast trivial klein als ich anfing", "im Laufe der Zeit habe ich bemerkt dass"], "vocabulary": "zusammengesetzt, konsistent, klein, Ritual, Identität, Auslöser, Belohnung"}, {"id": 38, "situation": "Du beschreibst was du dir über Beziehungen in deinen Zwanzigern gewünscht hättest zu wissen", "mood": "reif", "task": "Teile spezifische Erkenntnisse die du mit dem Alter gewonnen hast", "starter": "Ich glaube ich verbrachte viele meiner Zwanziger damit, unvereinbare Menschen durch schiere Anstrengung kompatibel zu machen. Was ich jetzt weiß ist…", "grammar": ["unvereinbare Menschen kompatibel zu machen", "was ich jetzt weiß ist"], "vocabulary": "kompatibel, Anstrengung, Verträglichkeit, Energie, Muster, früh"}, {"id": 39, "situation": "Du redest über Einsamkeit und wie du deine Beziehung dazu verändert hast", "mood": "reflektiv", "task": "Erkunde wie sich deine Beziehung zur Einsamkeit verändert hat", "starter": "Früher mied ich das Alleinsein weil es sich anfühlte wie… Jetzt suche ich es bewusst, weil ich entdeckt habe dass es die Zeit ist, in der ich am besten kann… Der Unterschied liegt in…", "grammar": ["früher mied ich das Alleinsein weil", "jetzt suche ich es bewusst weil"], "vocabulary": "Einsamkeit, bewusst, aufladen, Reflexion, laut, Raum, Absicht"}, {"id": 40, "situation": "Du erklärst was du über Grenzen setzen gelernt hast", "mood": "nachdenklich", "task": "Erzähle von einer Zeit als du es falsch gemacht hast", "starter": "Lange Zeit dachte ich, zu allem Ja zu sagen sei eine Form der Großzügigkeit. Was ich schließlich verstand war, dass es eher… war und aus dem Glauben kam dass…", "grammar": ["zu allem Ja zu sagen sei eine Form der Großzügigkeit", "es kam aus dem Glauben dass"], "vocabulary": "Groll, Gefälligkeit, Angst, Großzügigkeit, Selbstrespekt, Muster, erkennen"}, {"id": 41, "situation": "Du beschreibst eine Periode in deinem Leben als alles ungewiss war", "mood": "ehrlich", "task": "Erzähle die Erfahrung mit emotionaler Ehrlichkeit", "starter": "Was mich am Laufen hielt war kein Plan — ich hatte keinen. Es war eher… und das Verständnis dass… Rückblickend kann ich jetzt sehen dass…", "grammar": ["was mich am Laufen hielt war kein Plan", "rückblickend kann ich jetzt sehen dass"], "vocabulary": "Ungewissheit, Anker, von Tag zu Tag, überleben, entstehen, Perspektive"}, {"id": 42, "situation": "Du sprichst über die Lücke zwischen deinen Werten und deinen Handlungen", "mood": "ehrlich", "task": "Beschreibe eine echte Spannung mit der du lebst", "starter": "Ich glaube stark an… aber ich handle nicht immer so als ob ich es tue. Ich glaube diese Lücke existiert weil… und weil Verhalten schwerer zu ändern ist als Überzeugungen.", "grammar": ["ich glaube stark an… aber handle nicht immer so", "Verhalten ist schwerer zu ändern als Überzeugungen"], "vocabulary": "Wert, handeln, Lücke, Absicht, Gewohnheit, Reibung, konsistent"}, {"id": 43, "situation": "Du beschreibst wie du mit Neid ehrlich umgehst", "mood": "mutig", "task": "Gib zu dass du es kennst und beschreibe wie du damit umgehst", "starter": "Ich würde lügen wenn ich sagte dass ich ihn nie gefühlt habe. Was ich gelernt habe ist dass Neid, so unangenehm er auch ist, informativ sein kann — er zeigt oft auf etwas das ich möchte, aber mir noch nicht eingestanden habe dass…", "grammar": ["ich würde lügen wenn ich sagte", "er zeigt oft auf etwas das ich möchte aber noch nicht eingestanden habe"], "vocabulary": "Neid, Signal, wollen, eingestehen, Information, umwandeln, Vergleich"}, {"id": 44, "situation": "Du erklärst was du beobachtet hast über den Unterschied zwischen Vertrauen und Arroganz", "mood": "beobachtend", "task": "Ziehe die Grenze mit konkreten Beispielen", "starter": "Wirklich selbstsichere Menschen tendieren dazu, neugierig auf das zu sein, was sie nicht wissen. Arroganz verkleidet sich oft als Selbstsicherheit, aber das Verräterische ist meist wenn jemand…", "grammar": ["wirklich selbstsichere Menschen tendieren dazu neugierig zu sein", "das Verräterische ist meist wenn jemand"], "vocabulary": "genuinę, neugierig, sicher, Arroganz, defensiv, Wissen, Signal, Grenze"}, {"id": 45, "situation": "Du beschreibst einen Wert den du hast, den die meisten in deinem Umfeld nicht teilen", "mood": "mutig", "task": "Sprich darüber wie es sich anfühlt, eine Minderheitsmeinung zu vertreten", "starter": "Es kann sich isolierend anfühlen, etwas zu schätzen, das die Menschen in deiner unmittelbaren Welt nicht ernst nehmen. Die Erfahrung handelt weniger von Konflikt und mehr von…", "grammar": ["es kann sich isolierend anfühlen", "weniger von Konflikt und mehr von"], "vocabulary": "Minderheit, Wert, isolierend, sichtbar, kompromittieren, artikulieren, selten"}, {"id": 46, "situation": "Du redest darüber ob der Optimismus eine Wahl oder ein Persönlichkeitsmerkmal ist", "mood": "neugierig", "task": "Erkunde die Debatte mit Nuancen", "starter": "Ich bin hin und her gegangen zu diesem Thema. Meine aktuelle Ansicht ist dass es irgendwo dazwischen liegt — es gibt Menschen für die es natürlicher kommt, aber es gibt auch eine tägliche Praxis von…", "grammar": ["ich bin hin und her gegangen zu diesem Thema", "es gibt auch eine tägliche Praxis von"], "vocabulary": "Temperament, Praxis, umformulieren, Veranlagung, Standard, kultivieren, Wahl"}, {"id": 47, "situation": "Du erklärst was du über das Bitten um Hilfe gelernt hast", "mood": "verletzbar", "task": "Sprich darüber was dich früher davon abgehalten hat und was sich geändert hat", "starter": "Um Hilfe zu bitten ist schwieriger als es klingt, weil es erfordert, eine Art Verletzbarkeit zuzugeben, die die meisten von uns gelernt haben zu verbergen. Die Barriere ist nicht…", "grammar": ["es erfordert eine Art Verletzbarkeit zuzugeben", "die Barriere ist nicht"], "vocabulary": "Verletzbarkeit, Stolz, Unabhängigkeit, Stärke, Scham, Kultur, Last"}, {"id": 48, "situation": "Du sprichst über das Paradox der Ruhe und Produktivität", "mood": "nachdenklich", "task": "Erkläre warum echte Ruhe selten ist", "starter": "Wir haben gelernt, Ausruhen mit Faulheit gleichzusetzen. Was ich entdeckt habe ist dass die Art von Ruhe, die wirklich wiederherstellt, aktiv ist — sie erfordert…", "grammar": ["wir haben gelernt Ausruhen mit Faulheit gleichzusetzen", "die Art von Ruhe die wirklich wiederherstellt ist aktiv"], "vocabulary": "wiederherstellen, aufladen, passiv, aktiv, Schuld, Faulheit, erschöpft"}, {"id": 49, "situation": "Du beschreibst wie du Entscheidungen triffst wenn die Antwort nicht klar ist", "mood": "nachdenklich", "task": "Beschreibe deinen echten Prozess für das Navigieren von Mehrdeutigkeit", "starter": "Wenn es keine offensichtlich richtige Antwort gibt, habe ich gelernt auf eine andere Art von Signal zu achten. Nicht genau Logik, sondern eher… Was ich versuche ist…", "grammar": ["wenn es keine offensichtlich richtige Antwort gibt", "nicht genau Logik sondern eher"], "vocabulary": "Mehrdeutigkeit, Intuition, Signal, tolerieren, Unsicherheit, ausrichten"}, {"id": 50, "situation": "Du erklärst was du beobachtet hast wie Stress sich körperlich in dir zeigt", "mood": "selbstbewusst", "task": "Beschreibe die körperlichen Stresssignale und was du dagegen getan hast", "starter": "Ich ignorierte früher was mein Körper mir sagte bis die Signale unmöglich zu ignorieren waren. Was ich gelernt habe ist dass Stress sich bei mir zuerst zeigt als…", "grammar": ["ich ignorierte früher was mein Körper mir sagte", "Stress zeigt sich bei mir zuerst als"], "vocabulary": "somatisch, Signal, angespannt, bemerken, atmen, körperlich, Bewusstsein"}, {"id": 51, "situation": "Du sprichst darüber warum Uneinigkeit unterschätzt wird", "mood": "kontraintuitiv", "task": "Argumentiere für die Bedeutung von produktivem Konflikt", "starter": "Wir sind sehr gut darin geworden, Zustimmung zu simulieren — zu nicken obwohl wir anders denken. Was wir verloren haben ist die Art von Uneinigkeit, die Ideen wirklich voranbringt. Das passiert nur wenn…", "grammar": ["Zustimmung zu simulieren — zu nicken obwohl wir anders denken", "die Art von Uneinigkeit die Ideen voranbringt"], "vocabulary": "produktiv, Konflikt, simulieren, Oberfläche, herausfordern, verfeinern, genuinę"}, {"id": 52, "situation": "Du beschreibst was für dich echte Unterstützung bedeutet wenn du kämpfst", "mood": "ehrlich", "task": "Unterscheide was wirklich hilft von dem was nicht hilft", "starter": "Das Unhilfreiche das die Leute tun wenn ich kämpfe ist Lösungen anbieten bevor ich fertig gesprochen habe. Was wirklich hilft ist wenn jemand…", "grammar": ["das Unhilfreiche ist Lösungen anzubieten bevor ich fertig gesprochen habe", "was wirklich hilft ist wenn jemand"], "vocabulary": "Zeuge, reparieren, zuhören, Präsenz, Rat, Raum, Bedürfnis"}, {"id": 53, "situation": "Du beschreibst den Moment als du merktest dass du jemanden komplett falsch eingeschätzt hast", "mood": "bescheiden", "task": "Erzähle die Geschichte und was sie dich gelehrt hat", "starter": "Ich hatte eine sehr klare Meinung über sie gebildet, basierend auf fast nichts — nur auf dem ersten Eindruck. Als ich sie schließlich wirklich kennenlernte, merkte ich dass…", "grammar": ["ich hatte eine klare Meinung gebildet basierend auf fast nichts", "als ich sie schließlich wirklich kennenlernte merkte ich"], "vocabulary": "Annahme, Urteil, erster Eindruck, Vorurteil, Komplexität, überdenken, Bescheidenheit"}, {"id": 54, "situation": "Du erklärst was du über das Zuhören gelernt hast", "mood": "aufschlussreich", "task": "Geh über das offensichtliche 'Leg dein Handy weg' hinaus", "starter": "Echtes Zuhören ist schwieriger als es aussieht, weil die meiste Zeit wenn jemand spricht, ein Teil meines Geistes bereits… Der Moment in dem ich mich dabei ertappe ist…", "grammar": ["die meiste Zeit wenn jemand spricht bereite ich bereits vor", "der Moment in dem ich mich dabei ertappe ist"], "vocabulary": "aktiv, Ablenkung, vorbereiten, Antwort, Präsenz, unterbrechen, aufnehmen"}, {"id": 55, "situation": "Du sprichst über eine Freundschaft die dir etwas über dich selbst gezeigt hat", "mood": "reflektiv", "task": "Sprich über das was die Beziehung widerspiegelte", "starter": "Das Seltsamste an engen Beziehungen ist wie klar sie dich spiegeln. Diese Person zeigte mir dass ich die Tendenz habe zu… was ich vorher nicht bereit war zu sehen weil…", "grammar": ["das Seltsamste an engen Beziehungen ist wie klar", "ich war nicht bereit zu sehen weil"], "vocabulary": "Spiegel, Muster, enthüllen, Projektion, Bereitschaft, Nähe, Wahrheit"}, {"id": 56, "situation": "Du beschreibst was eine echte Entschuldigung beinhaltet", "mood": "nachdenklich", "task": "Erkunde was eine Entschuldigung von einem bloßen 'Entschuldigung' unterscheidet", "starter": "Eine Entschuldigung die den konkreten Schaden nicht anerkennt, kommt nicht wirklich an. Was ich gefunden habe dass am meisten zählt sind nicht die Worte selbst sondern…", "grammar": ["eine Entschuldigung die den Schaden nicht anerkennt kommt nicht an", "was am meisten zählt sind nicht die Worte sondern"], "vocabulary": "anerkennen, Auswirkung, aufrichtig, hohl, reparieren, verstehen, spezifisch"}, {"id": 57, "situation": "Du erzählst von einem Moment als jemandes Freundlichkeit deinen Tag komplett veränderte", "mood": "herzlich", "task": "Erzähle die Geschichte und reflektiere was sie dir gezeigt hat", "starter": "Es war so eine kleine Sache — sie haben wahrscheinlich nicht mal darüber nachgedacht. Aber die Wirkung auf mich war unverhältnismäßig groß, weil ich zu dem Zeitpunkt…", "grammar": ["es war so eine kleine Sache", "die Wirkung auf mich war unverhältnismäßig groß weil"], "vocabulary": "Freundlichkeit, Wellen, bemerken, Fremder, Auswirkung, erinnern, Verbindung"}, {"id": 58, "situation": "Du beschreibst was noch in dir reift und woran du noch arbeitest", "mood": "bescheiden", "task": "Sei ehrlich — nicht performativ bescheiden", "starter": "Mir ist bewusst dass ich noch… mehr tue als mir lieb ist. Und ich weiß dass es daher kommt… Der Unterschied zwischen jetzt und vor fünf Jahren ist nicht dass es weg ist, sondern dass…", "grammar": ["mir ist bewusst dass ich noch… mehr tue", "der Unterschied ist nicht dass es weg ist sondern dass"], "vocabulary": "Wachstum, Muster, Selbstbewusstsein, noch, Arbeit in Fortschritt, bemerken"}, {"id": 59, "situation": "Du beschreibst deine Definition von einem guten Leben", "mood": "persönlich", "task": "Geh über Klischees hinaus und sei konkret", "starter": "Ein gut gelebtes Leben bedeutet für mich nicht… obwohl ich lange dachte dass es das täte. Was sich verändert hat ist…", "grammar": ["bedeutet für mich nicht… obwohl ich lange dachte", "was sich verändert hat ist"], "vocabulary": "Sinn, Wert, genug, authentisch, Beziehungen, Erfahrungen, Wachstum"}, {"id": 60, "situation": "Du beschreibst was du über die Geduld gelernt hast", "mood": "persönlich", "task": "Sei spezifisch und ehrlich über den Prozess", "starter": "Ich arbeitete zwei Jahre an etwas bevor es zusammenkam. In dieser Zeit lernte ich dass Geduld nicht passiv ist — sie ist das aktive Wählen von…", "grammar": ["lernte ich dass Geduld nicht passiv ist", "es ist das aktive Wählen von"], "vocabulary": "Geduld, aktiv, vertrauen, Prozess, Zweifel, beharren, langfristig"}, {"id": 61, "situation": "Du schließt den Kurs indem du beschreibst was das Sprechen in dieser Sprache für dich bedeutet hat", "mood": "herzlich und reflektiv", "task": "Teile was du über Sprache und Verbindung verstanden hast", "starter": "Was ich zu glauben begonnen habe ist dass gut sprechen nicht wirklich darum geht, Leute zu beeindrucken — es geht darum, Kontakt herzustellen. Die Momente in denen ich mich am meisten mit jemandem verbunden gefühlt habe, waren nie wegen kluger Worte, sondern wegen…", "grammar": ["gut sprechen geht nicht darum zu beeindrucken — es geht darum Kontakt herzustellen", "die Momente in denen ich mich am meisten verbunden fühlte"], "vocabulary": "Kontakt, Verbindung, gewöhnlich, ehrlich, Präsenz, Sprache, Zweck, Bedeutung"}, {"id": 62, "situation": "Du sprichst darüber warum du Qualität über Quantität in Beziehungen schätzt", "mood": "reflektiv", "task": "Erkunde was sich in deiner Sichtweise auf Beziehungen verändert hat", "starter": "Im Laufe der Jahre bin ich von wollen viele Leute zu kennen zu bevorzugen übergegangen… Was ich entdeckt habe ist dass die Qualität der Verbindungen nicht davon abhängt, wie lange du jemanden kennst, sondern von…", "grammar": ["im Laufe der Jahre bin ich von… übergegangen zu", "nicht davon abhängt wie lange du kennst sondern von"], "vocabulary": "Qualität, Quantität, Tiefe, oberflächlich, Zeit, Vertrauen, Geschichte"}, {"id": 63, "situation": "Du beschreibst wie du Schweigen bewusst in einem Gespräch nutzt", "mood": "selbstsicher", "task": "Beschreibe wie du gelernt hast, Stille absichtlich einzusetzen", "starter": "Die meisten Menschen beeilen sich, die Stille zu füllen weil sie sich wie ein Scheitern anfühlt. Aber ich habe gelernt dass in einem schwierigen Gespräch eine Pause mehr bewirken kann als jedes Wort, weil…", "grammar": ["die meisten beeilen sich die Stille zu füllen", "eine Pause kann mehr bewirken als jedes Wort weil"], "vocabulary": "absichtlich, Unbehagen, Gewicht, Pause, Präsenz, Reflexion, Erwartung"}, {"id": 64, "situation": "Du erklärst wie sich deine Meinung zu etwas geändert hat an das du fest geglaubt hast", "mood": "bescheiden", "task": "Erzähle den Prozess des Meinungswechsels", "starter": "Was meine Perspektive änderte war kein Argument — es war eine Beziehung. Jemanden kennenzulernen der… ließ mich sehen dass meine frühere Position auf… basierte.", "grammar": ["was meine Perspektive änderte war kein Argument — es war", "ließ mich sehen dass meine frühere Position auf basierte"], "vocabulary": "ändern, aktualisieren, Perspektive, Exposition, frühere Überzeugung, entwickeln"}, {"id": 65, "situation": "Du beschreibst wie du dich mit der Angst vor dem Scheitern umgehst", "mood": "ehrlich", "task": "Teile wie du damit in der Praxis umgehst", "starter": "Was ich bemerkt habe ist dass die Angst vor dem Scheitern nie ganz verschwindet — sie ändert nur ihre Form. Was sich ändert ist wie du dich zu ihr verhältst. Wenn sie auftaucht, tue ich jetzt…", "grammar": ["die Angst vor dem Scheitern ändert nur ihre Form", "was sich ändert ist wie du dich zu ihr verhältst"], "vocabulary": "Angst, Scheitern, verwalten, Projekt, Beziehung, Praxis, Klarheit"}, {"id": 66, "situation": "Du beschreibst wie deine Beziehung zum Geld sich verändert hat", "mood": "ehrlich", "task": "Zeige die Entwicklung deiner Einstellung zum Geld", "starter": "Als ich jünger war bedeutete Geld… Jetzt sehe ich es eher als Werkzeug denn als Ziel an sich. Was sich verändert hat war dass…", "grammar": ["als ich jünger war bedeutete Geld", "ich sehe es eher als Werkzeug denn als Ziel"], "vocabulary": "Werkzeug, Ziel, Sicherheit, Freiheit, Einstellung, genug, Werte"}, {"id": 67, "situation": "Du erzählst von einem Gespräch das dich verändert hat", "mood": "narrativ", "task": "Erzähle die Geschichte mit emotionalem Detail", "starter": "Es war kein langes Gespräch und auch nicht in einem besonders wichtigen Moment. Aber was diese Person sagte kam genau in dem Moment an, in dem ich es hören musste, und…", "grammar": ["es kam genau in dem Moment an in dem ich es hören musste", "was diese Person sagte"], "vocabulary": "Timing, Auswirkung, beiläufig, transformierend, Worte, Moment, hören"}, {"id": 68, "situation": "Du erklärst was du über das Empfangen von Komplimenten gelernt hast", "mood": "Selbstbewusstsein", "task": "Reflektiere warum es so schwer ist, Anerkennung anzunehmen", "starter": "Ich merkte irgendwann dass wenn jemand mir ein Kompliment machte, meine automatische Antwort war… anstatt einfach… Und ich begann mich zu fragen woher diese Unbehaglichkeit kam.", "grammar": ["meine automatische Antwort war… anstatt einfach", "ich begann mich zu fragen woher diese Unbehaglichkeit kam"], "vocabulary": "Anerkennung, Unbehagen, empfangen, Dankbarkeit, Verdienst, ablenken"}, {"id": 69, "situation": "Du sprichst über das Unterscheiden zwischen dringend und wichtig", "mood": "praktisch", "task": "Gib konkrete Beispiele wie du diese Unterscheidung anwendest", "starter": "Ich verbrachte viel Zeit damit sehr reaktiv zu sein — auf das zu reagieren was dringend erschien anstatt auf das was… Was mir geholfen hat war zu erkennen dass dringend und wichtig verschiedene Kategorien sind.", "grammar": ["auf das zu reagieren was dringend erschien anstatt", "dringend und wichtig sind verschiedene Kategorien"], "vocabulary": "dringend, wichtig, reaktiv, proaktiv, Priorität, Klarheit, Fokus"}, {"id": 70, "situation": "Du beschreibst wie du gelernt hast Erwartungen in Beziehungen zu managen", "mood": "reflektiv", "task": "Sprich über was funktioniert und was nicht", "starter": "Was mir in Beziehungen die meisten Probleme bereitet hat sind nicht die offenen Meinungsverschiedenheiten sondern die unausgesprochenen Erwartungen. Was ich gelernt habe ist dass die einzige Lösung ist…", "grammar": ["nicht die offenen Meinungsverschiedenheiten sondern die unausgesprochenen Erwartungen", "die einzige Lösung ist"], "vocabulary": "Erwartung, unausgesprochen, kommunizieren, Enttäuschung, Vereinbarung, Klarheit, annehmen"}, {"id": 71, "situation": "Du erklärst was du unter einem gut gelebten Leben verstehst", "mood": "persönlich", "task": "Geh über Klischees hinaus und sei konkret", "starter": "Ein gut gelebtes Leben bedeutet für mich nicht… obwohl ich lange Zeit dachte dass es das täte. Was sich verändert hat ist…", "grammar": ["bedeutet für mich nicht… obwohl ich lange dachte", "was sich verändert hat ist"], "vocabulary": "Sinn, Wert, genug, authentisch, Beziehungen, Erfahrungen, Wachstum"}, {"id": 72, "situation": "Du beschreibst wie du mit langfristigen Verpflichtungen umgehst wenn es schwierig wird", "mood": "reif", "task": "Reflektiere über das was du beim Durchhalten lernst", "starter": "Das Aufschlussreichste über langfristige Verpflichtungen ist nicht der Anfang — es ist was passiert wenn der anfängliche Enthusiasmus vorbei ist und du aktiv wählen musst ob du weitermachst weil…", "grammar": ["nicht der Anfang — es ist was passiert wenn", "du aktiv wählen musst ob du weitermachst weil"], "vocabulary": "Verpflichtung, langfristig, Enthusiasmus, Durchhalten, Wahl, Grund, Disziplin"}, {"id": 73, "situation": "Du sprichst über das Gefühl zwischen zwei Kulturen zu gehören", "mood": "persönlich", "task": "Reflektiere über die Komplexität kultureller Identität", "starter": "Es gibt eine seltsame Freiheit darin, zwischen zwei Kulturen zu sein — du siehst jede von außen. Aber der Preis ist dass du dich manchmal nicht ganz zu… zugehörig fühlst.", "grammar": ["es gibt eine seltsame Freiheit darin zwischen", "der Preis ist dass du dich manchmal nicht ganz zugehörig fühlst"], "vocabulary": "Zugehörigkeit, hybrid, dritte Kultur, Außenseiter, Innenseiter, Code-Wechsel, Identität"}, {"id": 74, "situation": "Du beschreibst was du über das Empfangen von Unterstützung gelernt hast", "mood": "verletzbar", "task": "Sprich darüber was es dir früher schwer machte und was sich geändert hat", "starter": "Unterstützung anzunehmen ist schwieriger als es klingt, weil es eine Art Verletzbarkeit erfordert, die die meisten von uns gelernt haben zu verbergen. Die Barriere ist nicht…", "grammar": ["es erfordert eine Art Verletzbarkeit", "die Barriere ist nicht"], "vocabulary": "Verletzbarkeit, Stolz, Unabhängigkeit, Stärke, Scham, Kultur, Last, gegenseitig"}, {"id": 75, "situation": "Du erklärst warum du produktive Langeweile aktiv schützt", "mood": "reflektiv", "task": "Erkläre warum Langeweile einen Wert hat den die meisten verpassen", "starter": "Wir haben Langeweile fast vollständig aus unserem Leben verbannt und ich glaube wir haben etwas Wichtiges verloren. Für mich kommen die kreativsten Momente oft nach…", "grammar": ["wir haben Langeweile fast vollständig verbannt", "die kreativsten Momente kommen oft nach"], "vocabulary": "Langeweile, Kreativität, Untätigkeit, Raum, schützen, aktiv, Wert"}, {"id": 76, "situation": "Du beschreibst was du über Beziehungen auf lange Sicht gelernt hast", "mood": "weise", "task": "Reflektiere was du im Laufe der Zeit über Beziehungen verstanden hast", "starter": "Lange Beziehungen lehren dich Dinge, die kurze nicht können. Du siehst einander durch viele verschiedene Versionen und was du dabei entdeckst ist dass…", "grammar": ["lange Beziehungen lehren Dinge die kurze nicht können", "du siehst einander durch viele verschiedene Versionen"], "vocabulary": "Zeuge, entwickeln, Akzeptanz, Vergebung, geteilt, Geschichte, reparieren"}, {"id": 77, "situation": "Du erklärst wie eine lange Freundschaft dich verändert hat", "mood": "herzlich", "task": "Reflektiere über das was eine Freundschaf // ── AUTH ──────────────────────────────────────────────
const HASH = "e6c624a7b0d8a6319a447d275ca028a004eeef4691747ee3fe8aa887dcc94407";
async function sha256(msg){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
document.getElementById('pw-btn').onclick = tryUnlock;
document.getElementById('pw-input').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock()});
async function tryUnlock(){
  const pw=document.getElementById('pw-input').value;
  const h=await sha256(pw);
  if(h===HASH){
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='block';
    showEmpty();
  } else {
    document.getElementById('lock-err').textContent='Incorrect password. Try again.';
    document.getElementById('pw-input').value='';
  }
}

// ── STATE ──────────────────────────────────────────────
let lang='en', level='A1', history=[], shown=new Set();
const langLabels={'en':'English 🇬🇧','es':'Español 🇪🇸','de':'Deutsch 🇩🇪'};

// ── TOGGLES ──────────────────────────────────────────
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{
  lang=b.dataset.lang;
  document.querySelectorAll('[data-lang]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); shown=new Set(); updateCounter();
});
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{
  level=b.dataset.level;
  document.querySelectorAll('[data-level]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); shown=new Set(); updateCounter();
});

// ── DRAW ──────────────────────────────────────────────
document.getElementById('draw-btn').onclick=draw;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.getElementById('app').style.display!=='none'){e.preventDefault();draw();}});

function draw(){
  const pool=SITUATIONS[lang][level];
  const remaining=pool.filter(s=>!shown.has(s.id));
  const src=remaining.length?remaining:pool;
  if(!remaining.length)shown=new Set();
  const item=src[Math.floor(Math.random()*src.length)];
  shown.add(item.id);
  showCard(item);
  addHistory(item);
  updateCounter();
}

function showCard(item){
  document.getElementById('empty-state').style.display='none';
  const card=document.getElementById('card');
  card.style.display='block';
  card.style.animation='none'; void card.offsetWidth; card.style.animation='slideIn .35s ease';
  document.getElementById('c-lang').textContent=langLabels[lang];
  document.getElementById('c-level').textContent=level;
  document.getElementById('c-mood').textContent=item.mood;
  document.getElementById('c-id').textContent='#'+item.id;
  document.getElementById('c-situation').textContent=item.situation;
  document.getElementById('c-task').textContent='Task: '+item.task;
  document.getElementById('c-starter').textContent='"'+item.starter+'"';
  document.getElementById('c-grammar').innerHTML=item.grammar.map(g=>`<div class="grammar-item">${g}</div>`).join('');
  document.getElementById('c-vocab').textContent=item.vocabulary;
}

function showEmpty(){
  document.getElementById('empty-state').style.display='block';
  document.getElementById('card').style.display='none';
}

function addHistory(item){
  history.unshift(item);
  if(history.length>5)history.pop();
  const strip=document.getElementById('hist-strip');
  document.getElementById('hist-wrap').style.display='block';
  strip.innerHTML=history.map((h,i)=>`<div class="hist-item" onclick="showCard(history[${i}])" title="${h.situation}">${h.situation.substring(0,40)}…</div>`).join('');
}

function updateCounter(){
  const total=SITUATIONS[lang][level].length;
  const done=shown.size;
  document.getElementById('counter-badge').textContent=done+' / '+total;
}
